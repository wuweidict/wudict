# The documentation site: build pages/ and publish it to GitHub Pages.
#
# Deployment is the modern one - an artifact uploaded by this workflow and
# handed to the Pages runtime over OIDC.
name: docs

on:
  push:
    branches: [master]
    # The site is rebuilt for its own sources, and for the API document it
    # publishes - not for every Go change.
    paths:
      - 'pages/**'
      - 'internal/server/web/openapi.yaml'
      - 'redocly.yaml'
      - 'tools/inline-api-docs.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Read the repo; mint the OIDC token deploy-pages exchanges for the write.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight: a half-published
# site is worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pages/requirements.txt

      # not stricly necessary, 24 is already ootb in the runner
      # - uses: actions/setup-node@v7
      #   with:
      #     node-version: '22'

      - name: Install the site generator
        run: pip install -r pages/requirements.txt

      # Input validation, which is the publisher's own business: the document
      # must be a valid OpenAPI 3.1 file before it is rendered and served.
      #
      # Whether it still agrees with the Go source is a different property, and
      # it belongs to the source, not to the publisher: `make api-test` asserts
      # it in test.yml, on every push. This workflow builds and deploys a site.
      # It does not test the product.
      - name: Validate the API document
        run: make api-lint

      # Renders the explorer into pages/docs/api/, then builds with --strict:
      # any broken link or anchor fails the job.
      - name: Build the site
        run: make docs

      - name: Add Google Site Verification file
        run: |
          echo "google-site-verification: googlec4893d05b6cdeee8.html" > pages/site/googlec4893d05b6cdeee8.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages/site

  deploy:
    needs: build
    runs-on: ubuntu-slim
    environment:
      name: github-pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
