name: Build+Release (cgo)

# Performance-optimized builds using the cgo mattn/go-sqlite3 driver
# (-tags sqlite_fts5, CGO_ENABLED=1). Unlike build-release.yml (pure-Go
# modernc cross-compiled from one ubuntu box), each target is built on its
# OWN native runner because cgo cannot cross the host arch/OS. Produces
# workflow artifacts only — it does not create a GitHub Release, so it never
# collides with the purego release assets.
#
# C toolchains are preinstalled on all these GitHub-hosted images
# (actions/runner-images): Ubuntu → gcc, macOS → Xcode/clang, Windows → gcc.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version stamp for the binaries (e.g. v0.1); blank = use latest tag"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    # windows/arm64 (experimental cgo path) may fail without sinking the run.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux (native gcc) ────────────────────────────────
          - { runner: ubuntu-24.04, goos: linux, goarch: amd64 }
          - { runner: ubuntu-24.04-arm, goos: linux, goarch: arm64 }
          # ── macOS (Apple-Silicon runner; amd64 via arch flag) ─
          - { runner: macos-14, goos: darwin, goarch: arm64 }
          - {
              runner: macos-14,
              goos: darwin,
              goarch: amd64,
              cc: "clang -arch x86_64",
            }
          # ── Windows (amd64 native mingw gcc; arm64 via clang) ─
          - { runner: windows-2022, goos: windows, goarch: amd64, ext: ".exe" }
          # - { runner: windows-11-arm,   goos: windows, goarch: arm64, ext: ".exe", cc: "clang", experimental: true }

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }} # empty ⇒ Go's default compiler for the host
        run: |
          BINARY="wudict-${{ matrix.goos }}-${{ matrix.goarch }}-cgo${{ matrix.ext }}"
          VERSION="${{ inputs.tag }}"
          [ -z "$VERSION" ] && VERSION="$(git describe --abbrev=0 2>/dev/null || echo dev)"
          go build -trimpath -tags sqlite_fts5 \
            -ldflags="-s -w -X github.com/wuweidict/wudict/internal/cli.Version=${VERSION}" \
            -o "${BINARY}" .

      - name: Warn on experimental build failure
        if: failure() && matrix.experimental
        shell: bash
        run: echo "::warning title=Experimental target failed::${{ matrix.goos }}/${{ matrix.goarch }} (cgo) failed to build — continuing. Use the purego build-release.yml binary for this target."

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: wudict-${{ matrix.goos }}-${{ matrix.goarch }}-cgo
          path: wudict-${{ matrix.goos }}-${{ matrix.goarch }}-cgo${{ matrix.ext }}

  # The double-clickable macOS app (D75). One UNIVERSAL bundle rather than one
  # per chip: the point of an .app is that nobody has to know what a chip is.
  # Version and name come from the binary itself (`wudict --version`), so this
  # job stamps nothing and cannot drift from the build job above.
  macos-app:
    name: macOS .app (universal)
    needs: build
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download the darwin binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: wudict-darwin-*-cgo
          merge-multiple: true

      - name: Fuse the slices and build the bundle
        shell: bash
        run: |
          set -eu
          slices=$(ls artifacts/wudict-darwin-*-cgo 2>/dev/null || true)
          if [ -z "$slices" ]; then
            echo "::warning title=No .app::no darwin binaries were produced — skipping the bundle"
            exit 0
          fi
          # lipo -create accepts a single input, so a half-failed matrix still
          # yields a usable (thin) app instead of no app at all.
          lipo -create -output wudict $slices
          chmod +x wudict
          lipo -info wudict
          APP_BIN="$PWD/wudict" BUILD_DIR="$PWD/dist" sh tools/make-app.sh
          # ditto, not zip: it is the only archiver Apple guarantees keeps the
          # bundle's symlinks, xattrs and code signature intact.
          ditto -c -k --keepParent "$(cat dist/.app-path)" wudict-macos-app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wudict-macos-app
          path: wudict-macos-app.zip
          if-no-files-found: warn

  # The Windows installer (D76). Per-user, no admin prompt, and ONE wudict.exe:
  # the binary decides at runtime whether a person or a shell started it, so
  # there is no second GUI-subsystem artifact to build or to choose between.
  windows-installer:
    name: Windows installer
    needs: build
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download the windows binary
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: wudict-windows-*-cgo
          merge-multiple: true

      - name: Ensure Inno Setup 6
        shell: bash
        run: |
          set -eu
          # Preinstalled on the windows-2022 image, but pinning the run to that
          # promise would make an image change a release outage.
          if [ -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] || command -v iscc >/dev/null 2>&1; then
            echo "Inno Setup already present"
          else
            choco install innosetup -y --no-progress
          fi

      - name: Compile the installer
        shell: bash
        run: |
          set -eu
          exe=$(ls artifacts/wudict-windows-amd64-cgo.exe 2>/dev/null || true)
          if [ -z "$exe" ]; then
            echo "::warning title=No installer::the windows/amd64 build did not produce a binary — skipping"
            exit 0
          fi
          cp "$exe" wudict.exe
          WIN_EXE="$PWD/wudict.exe" BUILD_DIR="$PWD/dist" sh tools/make-installer.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wudict-windows-installer
          path: dist/wudict-setup-*.exe
          if-no-files-found: warn

  release:
    needs: [build, macos-app, windows-installer]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history + tags so git describe works
          persist-credentials: true

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          [ -z "$TAG" ] && TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$TAG" ]; then
            echo "::error::No tag input and no existing git tag to fall back on." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} exists — replacing native assets."
            gh release upload "${TAG}" artifacts/* --clobber
          else
            echo "Creating release ${TAG}."
            gh release create "${TAG}" artifacts/* \
              --title "${{ github.event.repository.name }} ${TAG}" \
              --generate-notes
          fi
