# Android APK (D52, D53): cross-compile the cgo android/arm64 server (mattn
# FTS5 + built-in speex) into the APK's jniLibs, then let Gradle package it.
# The NDK version is pinned here; the Makefile auto-detects it locally.
#
# Secrets required for a signed release build.
#   ANDROID_KEYSTORE_BASE64    base64 of the upload keystore
#   ANDROID_KEYSTORE_PASSWORD  store password
#   KEY_ALIAS                  key alias inside the store
#   KEY_PASSWORD               key password

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the release (e.g., v0.1) or use latest tag if empty"
        required: false
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false
      draft:
        description: "Create the release as a draft (nothing is downloadable until it is published)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe names builds between releases

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default is `tools platform-tools`, and `tools` - the
          # old SDK Tools package - was retired from Google's repository, so
          # the default now fails outright with "Failed to find package
          # 'tools'". Nothing here ever needed it: the step below installs
          # exactly what the build uses, by name and version.
          packages: ""

      - name: Install platform, build-tools and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Compute version
        id: ver
        run: |
          VERSION="${{ inputs.tag }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(git describe --tags --always --abbrev=0 2>/dev/null || echo dev)"
          fi

          # An existing tag is built AT the tag, not at the branch head: the
          # F-Droid recipe names the tag's commit, and its reproducible build
          # must match the APK published here. The workflow file itself still
          # comes from the dispatched branch, so CI fixes apply to old tags.
          if git rev-parse -q --verify "refs/tags/$VERSION^{commit}" >/dev/null; then
            git checkout -q --detach "refs/tags/$VERSION"
            echo "::notice::building tag $VERSION at $(git rev-parse --short HEAD)"
          fi

          # versionCode follows from the tag (tools/release.sh, D183), the
          # same number `make release` writes into app/build.gradle. A RELEASE
          # tag must find its version there - F-Droid reads that file at the
          # tag - so a release is cut with `make release VERSION=...` and this
          # dispatch only builds it. A pre-release (alpha, beta, rc) may be
          # tagged right here: F-Droid skips those, and the code is passed.
          NAME=$(sed -n 's/^ *versionName "\([^"]*\)"$/\1/p' android/app/build.gradle)
          if CODE=$(sh tools/release.sh --code "$VERSION" 2>/dev/null); then
            case $VERSION in
            *-*) [ "v$NAME" = "$VERSION" ] || echo "::notice::pre-release $VERSION: versionCode $CODE from the tag (app/build.gradle says $NAME)" ;;
            *) if [ "v$NAME" != "$VERSION" ]; then
                 echo "::error::release $VERSION, but android/app/build.gradle says versionName $NAME: cut it with make release VERSION=$VERSION, push, then run this workflow"
                 exit 1
               fi ;;
            esac
          else
            CODE=$(sed -n 's/^ *versionCode \([0-9][0-9]*\)$/\1/p' android/app/build.gradle)
            echo "::notice::$VERSION is not a release tag: versionCode $CODE from app/build.gradle"
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=$VERSION" >> "$GITHUB_ENV"
          echo "building $VERSION (versionCode = $CODE)"

      - name: Build the Go server as libwudict.so (cgo - FTS5 + speex)
        # VERSION=$TAG: the checkout is the branch head, where the tag being
        # released may not exist yet (the step below creates it), so the
        # Makefile's own `git describe` would name the previous tag.
        #
        # Built in Debian trixie with the same apt line as the F-Droid recipe
        # (metadata/com.legbehindneck.wudict.yml, `sudo:`), so the Go that
        # builds the signed APK is the Go F-Droid's reproducible build uses.
        # setup-go's toolchain would differ from Debian's by version or patch.
        run: |
          docker run --rm -e TAG -v "$PWD:/src" -v "$ANDROID_NDK_HOME:/ndk:ro" -w /src debian:trixie sh -euc '
            echo "deb http://deb.debian.org/debian trixie-backports main" > /etc/apt/sources.list.d/backports.list
            apt-get update -qq
            # ca-certificates: the bare image has none, so module downloads
            # fail TLS. The F-Droid build VM has them; they change no byte built.
            apt-get install -y -qq ca-certificates >/dev/null
            apt-get install -y -qq -t trixie-backports make golang-go >/dev/null
            go version
            GOTOOLCHAIN=local make android-go VERSION="$TAG" ANDROID_NDK=/ndk
            chown -R '"$(id -u):$(id -g)"' android/app/src/main/jniLibs'

      - name: Configure signing
        id: signing
        run: |
          if [ -z "$KS_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::signing secrets incomplete - building a debug APK"
            exit 0
          fi
          KS="$RUNNER_TEMP/wudict.keystore"
          echo "$KS_B64" | base64 -d > "$KS"

          # Prove the store opens and the alias exists BEFORE Gradle runs.
          # These are the two things people get wrong, and Gradle reports both
          # as an opaque failure at the very end of a five-minute build.
          keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

          # KEYSTORE must be a PATH - build.gradle does file(System.getenv("KEYSTORE")).
          echo "KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Assemble
        run: |
          cd android
          # Only the FOSS flavour is published here (D62). The Play bundle is
          # built locally with `make aab-play` and signed with Play's UPLOAD
          # key, which is not this workflow's keystore.
          # The Play APK is still assembled, unsigned, so the
          # permission assertion below has something to inspect.
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            TASK=assembleFossRelease
          else
            TASK=assembleFossDebug
          fi
          # versionName is overridden with the release TAG; without it the
          # build would stamp `git describe --dirty`, which is right for a
          # working tree and wrong for a release. Without the leading "v":
          # F-Droid builds the same tag from app/build.gradle's "3.7.9", and
          # its reproducible-build check compares the manifests byte for byte.
          VERSION_NAME="${{ steps.ver.outputs.version }}"
          ./gradlew --no-daemon "$TASK" assemblePlayDebug \
            -PversionName="${VERSION_NAME#v}" \
            -PversionCode="${{ steps.ver.outputs.code }}"

      - name: Assert the flavour split held
        # The Play APK must declare no storage permission and the FOSS one
        # must declare All-files access.
        run: sh tools/verify-apk.sh

      - name: Locate the APK
        run: |
          # No renaming here any more. app/build.gradle names the APK
          # (androidComponents.onVariants) and the Makefile exports the path,
          # so the published asset, `make apk-foss-release` and dist/ all carry
          # ONE name: wudict-android-arm64-foss-<version>.apk. The old copy step
          # invented a second name (wudict-android-arm64.apk) that said nothing
          # about the flavour and existed nowhere else in the project.
          # VERSION=$TAG: the name ends in the version Gradle was given above
          # (-PversionName), and the Makefile's own default is git describe.
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            APK="$(make -s print-APK_FOSS VERSION="$TAG")"
          else
            APK="$(make -s print-APK_FOSS_DEBUG VERSION="$TAG")"
          fi
          if [ ! -f "$APK" ]; then
            echo "expected $APK - Gradle produced:"
            find android/app/build/outputs/apk -name '*.apk' -print
            exit 1
          fi
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "publishing $(basename "$APK")"

      # - name: Upload artifact
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: ${{ env.APK }}
      #     path: ${{ env.APK }}

      - name: Create git tag if missing
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        run: |
          # --exit-code with the full ref, not `| grep -q "$TAG"`: an unanchored
          # grep for "v0.1" matches an existing "v0.10" and silently skips
          # creating the tag that was actually asked for.
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "Tag ${TAG} already exists - skipping."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
            echo "Tag ${TAG} pushed."
          fi

      - name: Create or update GitHub release
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        # The two dispatch checkboxes. They apply when the release is CREATED;
        # on one that already exists they are only ever ADDED, never cleared.
        # Three workflows publish into the same tag, so the second to arrive
        # must not un-draft what the first staged, and a re-upload of assets
        # onto an older release must not strip its pre-release marker.
        run: |
          FLAGS=()
          [ "${{ inputs.prerelease }}" = "true" ] && FLAGS+=(--prerelease)
          [ "${{ inputs.draft }}" = "true" ] && FLAGS+=(--draft)
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} exists - replacing assets."
            gh release upload "${TAG}" "$APK" --clobber
            # An `if`, not a trailing `&&`: this is the last command in the
            # branch, so a false test would become the step's exit status.
            if [ ${#FLAGS[@]} -gt 0 ]; then
              gh release edit "${TAG}" "${FLAGS[@]}"
            fi
          else
            echo "Creating release ${TAG}."
            gh release create "${TAG}" "$APK" \
              --title "${{ github.event.repository.name }} ${TAG}" \
              --generate-notes "${FLAGS[@]}"
          fi
