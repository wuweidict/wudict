# Android APK (D52, D53): cross-compile the cgo android/arm64 server (mattn
# FTS5 + built-in speex) into the APK's jniLibs, then let Gradle package it.
# The NDK version is pinned here; the Makefile auto-detects it locally.
#
# Signing is done by GRADLE, not by this workflow. android/app/build.gradle
# declares a release signingConfig that reads KEYSTORE / STORE_PASSWORD /
# KEY_ALIAS / KEY_PASSWORD from the environment, so all this file does is
# decode the keystore to a real file and export those four. Doing it in both
# places is what breaks it: AGP already zipaligns and applies the v1/v2/v3
# schemes, and its output is wudict-foss-release.apk (archivesName plus the
# flavour, D62) — never app-release-unsigned.apk.
#
# Secrets required for a signed release build. Miss any one and the workflow
# falls back to a debug APK rather than failing five minutes into Gradle:
#   ANDROID_KEYSTORE_BASE64    base64 of the upload keystore
#   ANDROID_KEYSTORE_PASSWORD  store password
#   KEY_ALIAS                  key alias inside the store
#   KEY_PASSWORD               key password

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the release (e.g., v0.1)"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: APK (android-arm64, cgo)
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    # Scoped to this job: the release job below never needs the keystore, and
    # a secret in workflow-level env is exported into every job that runs.
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # versionName and versionCode both come from git history

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform, build-tools and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.15729638"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.15729638" >> "$GITHUB_ENV"

      - name: Build the Go server as libwudict.so (cgo — FTS5 + speex)
        run: make android-go

      - name: Compute version
        id: ver
        run: |
          # `if`, not `[ … ] && …`: run steps are `bash -e`, so the test
          # failing BECAUSE a tag was supplied would abort the whole step —
          # the workflow would break on exactly the runs that pass a tag.
          VERSION="${{ inputs.tag }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(git describe --tags --always 2>/dev/null || echo dev)"
          fi

          # versionCode is the commit count, NOT github.run_number. run_number
          # is a property of the CI, not of the software: it resets when the
          # workflow file is renamed, it differs between two builds of the same
          # tag, and re-running an OLD tag produces a HIGHER code than a newer
          # release — so version order and release order drift apart, and
          # Android refuses the "downgrade" that results. The commit count is
          # monotonic along the branch, identical for two builds of the same
          # commit, and needs no CI to reproduce.
          CODE="$(git rev-list --count HEAD)"
          [ "$CODE" -gt 0 ] || CODE=1

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "building $VERSION (versionCode $CODE)"

      - name: Configure signing
        id: signing
        run: |
          # All four or none. A partial set used to reach Gradle and fail there
          # with a null keyAlias, minutes into the build and nowhere near the
          # cause.
          if [ -z "$KS_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::signing secrets incomplete — building a debug APK"
            exit 0
          fi
          KS="$RUNNER_TEMP/wudict.keystore"
          echo "$KS_B64" | base64 -d > "$KS"

          # Prove the store opens and the alias exists BEFORE Gradle runs.
          # These are the two things people get wrong, and Gradle reports both
          # as an opaque failure at the very end of a five-minute build.
          keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

          # KEYSTORE must be a PATH — build.gradle does file(System.getenv("KEYSTORE")).
          # Handing it the base64 blob names a file 3 KB long that cannot exist.
          echo "KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Assemble
        run: |
          cd android
          # Only the FOSS flavour is published here (D62). The Play bundle is
          # built locally with `make aab-play` and signed with Play's UPLOAD
          # key, which is not this workflow's keystore — producing it here
          # would only invite someone to upload an APK signed with the wrong
          # certificate. The Play APK is still assembled, unsigned, so the
          # permission assertion below has something to inspect.
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            TASK=assembleFossRelease
          else
            TASK=assembleFossDebug
          fi
          ./gradlew --no-daemon "$TASK" assemblePlayDebug \
            -PversionName="${{ steps.ver.outputs.version }}" \
            -PversionCode="${{ steps.ver.outputs.code }}"

      - name: Assert the flavour split held
        # The Play APK must declare no storage permission and the FOSS one
        # must still declare All-files access. A manifest-merger change that
        # quietly unified them is the failure this exists to catch.
        run: sh tools/verify-apk.sh

      - name: Collect and verify the APK
        run: |
          # Named to the house pattern — wudict-<os>-<arch>, as in
          # wudict-linux-arm64-purego and wudict-darwin-arm64-cgo. No version:
          # NO release asset in this repo carries one, because the tag already
          # does. No -v8a: the other assets say plain arm64. No flavour: the
          # desktop workflows state cgo/purego because both land in the same
          # release and must be told apart, and only the cgo APK is published.
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            SRC=android/app/build/outputs/apk/foss/release/wudict-foss-release.apk
            OUT="wudict-android-arm64.apk"
          else
            # A debug APK is signed too — with the SDK's debug key. It is not
            # "unsigned"; it is signed by a certificate nobody should trust.
            SRC=android/app/build/outputs/apk/foss/debug/wudict-foss-debug.apk
            OUT="wudict-android-arm64-debug.apk"
          fi
          if [ ! -f "$SRC" ]; then
            echo "expected $SRC — Gradle produced:"
            find android/app/build/outputs/apk -name '*.apk' -print
            exit 1
          fi
          cp "$SRC" "$OUT"

          # Verify what we are about to publish, rather than trusting that the
          # signingConfig was applied: a release build with no signingConfig
          # silently produces an UNSIGNED apk that installs nowhere.
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$OUT"
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}

  release:
    needs: build
    if: ${{ inputs.tag != '' && needs.build.outputs.signed == 'true' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          pattern: wudict-*
          merge-multiple: true

      - name: Create git tag if missing
        run: |
          # --exit-code with the full ref, not `| grep -q "$TAG"`: an unanchored
          # grep for "v0.1" matches an existing "v0.10" and silently skips
          # creating the tag that was actually asked for.
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "Tag ${TAG} already exists — skipping."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
            echo "Tag ${TAG} pushed."
          fi

      - name: Create or update GitHub release
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} exists — replacing assets."
            gh release upload "${TAG}" wudict-*.apk --clobber
          else
            echo "Creating release ${TAG}."
            gh release create "${TAG}" wudict-*.apk \
              --title "${{ github.event.repository.name }} ${TAG}" \
              --generate-notes
          fi
