# Android APK (D52, D53): cross-compile the cgo android/arm64 server (mattn
# FTS5 + built-in speex) into the APK's jniLibs, then let Gradle package it.
# The NDK version is pinned here; the Makefile auto-detects it locally.
#
# Signing: when the repo secrets ANDROID_KEYSTORE_BASE64 (base64 of the
# upload keystore) and ANDROID_KEYSTORE_PASSWORD (one password for store and
# key) are set, the release APK is zipaligned + signed and — with a tag —
# attached to the GitHub release. Without secrets a debug APK is produced,
# so the workflow is always runnable.

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the release (e.g., v0.1)"
        required: false

permissions:
  contents: write

env:
  KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

jobs:
  build:
    name: APK (android-arm64, cgo)
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # versionName comes from git describe

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform, build-tools and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.15729638"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.15729638" >> "$GITHUB_ENV"

      - name: Build the Go server as libwudict.so (cgo — FTS5 + speex)
        run: make android-go

      - name: Compute version
        id: ver
        run: |
          VERSION="${{ inputs.tag }}"
          [ -z "$VERSION" ] && VERSION="$(git describe --tags --always 2>/dev/null || echo dev)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Detect signing configuration
        id: signing
        run: echo "enabled=$([ -n "$KS_B64" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Assemble (release when signing secrets exist, else debug)
        run: |
          cd android
          if [ -n "$KS_B64" ]; then
            ./gradlew assembleRelease -PversionName="${{ steps.ver.outputs.version }}" -PversionCode="${{ github.run_number }}"
          else
            echo "no signing secrets configured — building debug APK"
            ./gradlew assembleDebug -PversionName="${{ steps.ver.outputs.version }}" -PversionCode="${{ github.run_number }}"
          fi

      - name: Sign the release APK
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/wudict.keystore"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK_IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          APK_OUT="wudict-${{ steps.ver.outputs.version }}-android-arm64-v8a.apk"
          "$BT/zipalign" -p -f 4 "$APK_IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/wudict.keystore" --ks-pass env:KS_PASS \
            --out "$APK_OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$APK_OUT"
          echo "APK=$APK_OUT" >> "$GITHUB_ENV"

      - name: Rename the unsigned debug APK
        if: env.KS_B64 == ''
        run: |
          APK_OUT="wudict-${{ steps.ver.outputs.version }}-debug-android-arm64-v8a.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_OUT"
          echo "APK=$APK_OUT" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}

  release:
    needs: build
    if: ${{ inputs.tag != '' && needs.build.outputs.signed == 'true' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          pattern: wudict-*
          merge-multiple: true

      - name: Create git tag if missing
        run: |
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists — skipping."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
            echo "Tag ${TAG} pushed."
          fi

      - name: Create or update GitHub release
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} exists — replacing assets."
            gh release upload "${TAG}" wudict-*.apk --clobber
          else
            echo "Creating release ${TAG}."
            gh release create "${TAG}" wudict-*.apk \
              --title "${{ github.event.repository.name }} ${TAG}" \
              --generate-notes
          fi
