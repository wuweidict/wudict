<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The wudict mark. Four copies of this file must stay byte-identical in spirit:
       pages/docs/assets/{logo,favicon}.svg, android's ic_launcher_foreground.xml,
       and the browser extension's tools/make-icons.mjs.
       Three rules hold the geometry, and they are not decorative:
       (1) the ink bbox is centred — x[3,29] y[6,27], margins 3/3/6/5, the extra
           unit at the top offsetting a bottom-heavy lens;
       (2) the text lines are 13 and 8 units, the Fibonacci pair 0.4% from phi and,
           unlike phi itself, expressible on a pixel grid;
       (3) horizontal strokes are even-width on odd centres, so at 16px their edges
           land on integer pixels (y/2 +/- w/4 must be whole). Change a y and the
           16px icon goes soft. -->
  <rect width="32" height="32" rx="7" fill="#4c6680"/>
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M4 7h13M4 13h8" stroke-width="2"/>
    <circle cx="20" cy="18" r="5" stroke-width="2"/>
    <path d="M24 22 27.5 25.5" stroke-width="3"/>
  </g>
</svg>
