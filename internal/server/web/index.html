/* The widening a search deferred for the list (doSearch), handed to its re-run
   by loadDicts and to nothing else: a query typed in between drops it. */
let staleWidened=null;
function setPhase(p){
  if(phase===p)return;
  const wasBoot=phase==="boot";
  phase=p;
  const busy=p==="boot";
  for(const id of["q","mode","dict"])$(id).disabled=busy;
  $("frm").setAttribute("aria-busy",busy?"true":"false");
  if(busy){startBootScreen();return}
  stopBootScreen();
  /* A disabled input cannot hold focus (autofocus no-ops), so hand it back
     the moment it can take it — the user should be able to just type.

     Every device, deliberately, and NOT gated on a pointer the way the
     mid-session focus below is. Focusing an element does not summon a soft
     keyboard on its own: mobile browsers and Android WebView place the caret
     and stop there, because raising the IME wants a user gesture. So this
     costs a touch user nothing, and it is the signal a host shell can read to
     decide the keyboard question for itself — which is a platform concern and
     stays out of this file (D54).

     Two conditions, and they carry the whole rule. `activeElement===body`
     means the user has not already gone somewhere else during the load, and
     an empty field means there is nothing on screen to read: a deep link that
     arrived carrying ?q= has its answer coming and must not be retyped. */
  if(wasBoot&&document.activeElement===document.body&&!$("q").value)$("q").focus();

/* Waiting messages. Cook Ding (庖丁解牛) — the cook whose blade never dulls
   because he cuts with the grain — is the canonical wúwéi parable, so the
   kitchen is this app's own metaphor rather than borrowed whimsy. Fixed
   order, so repeat launches feel the same, and nothing here promises
   imminence: the honest progress signal is the "N of M ready" counter beside
   it. The spinner is deliberately indeterminate — per-dictionary cost varies
   by orders of magnitude (cold MDX ~180 ms, cold SLOB ~1 s), so a progress
   bar would be guessing while the counter cannot. */
const BOOT_MSGS=["Warming up the wok…","Stir-frying the dictionaries…",
  "Chopping headwords, with the grain…","Letting the definitions marinate…",
  "Tasting for seasoning…"];
let bootTimer=null,bootIdx=0;
function paintBoot(){
  $("out").innerHTML=`<div class="empty boot"><span class="spin big"></span><p>${BOOT_MSGS[bootIdx]}</p></div>`;
}
function startBootScreen(){
  if(bootTimer)return;
  bootIdx=0;paintBoot();

}
function stopBootScreen(){
  if(bootTimer){clearInterval(bootTimer);bootTimer=null}
  if($("out").querySelector(".boot"))$("out").innerHTML="";
}
/* the honest progress line: a count, never a percentage */
function readyCount(){
  return dictTotal?`Loading dictionaries — ${dicts.length} of ${dictTotal} ready…`

}
function bootFailed(msg){
  setPhase("failed");
  clearStatus("load");
  $("out").innerHTML=`<div class="empty"><p>⚠ Could not load your dictionaries.</p>`+
    `<p>${esc(msg||"unknown error")}</p>`+
    `<p><button type="button" class="btn" id="retryBtn">Try again</button></p></div>`;

$("out").addEventListener("click",e=>{if(e.target.id==="retryBtn")loadDicts()});

/* Two asymmetric corrections, because opening and closing fail differently.
   Scrolling every opened section to the top would be wrong: the summary you
   clicked does not move when a section expands, so your eye's anchor is
   already perfect, and opening a SECOND dictionary is nearly always an act of
   comparison — yanking the page would take the one you were reading off screen
   and turn comparison into replacement. It would also fire once per dictionary
   under expand-all (D35).

   OPEN needs help only when the section sits so low that its content unfolds
   entirely below the fold: you asked to see something and saw nothing.
   CLOSE needs help not to vanish — D37's sticky header means a section can
   be collapsed from 3000px inside it, after which the
   document shrinks, the browser clamps the scroll position, and you land
   somewhere arbitrary. Returning to the row you just closed is not taking
   control away, it is honouring the place you were still standing in.

   Both corrections scroll UP, which brings the auto-hidden bar back, so they
   aim at --barh (via scroll-margin-top) rather than the momentarily-zero
   --stick. */
const lessMotion=matchMedia("(prefers-reduced-motion: reduce)");
$("out").addEventListener("click",e=>{
  const sum=e.target.closest("details.dict:not(.noindex)>summary");
  if(!sum)return; // the no-index group is not an answer: opening it decides nothing
  // these live inside the summary, run their own handlers and preventDefault
  // the toggle — but not before this listener, which is nearer the target
  if(e.target.closest(".more,.upgrade,.mnav,.fbtn"))return;
  const det=sum.parentElement,opening=!det.open; // the toggle lands after us
  // The walk follows attention: it belongs to the section being read, and one
  // section at a time is also why nothing is counted for the other 154.
  if(opening){fillSection(det);if(markedAnswer)navAttach(det)}else if(det===navDet)navDetach();
  openedIdx=-1; // the user decided; no arrival may take the slot back (D73)
  clearTimeout(barrier);barrier=null; // nor may the deadline, mid-hold (D142)
  requestAnimationFrame(()=>{  // measure the section at its new height
    const top=det.getBoundingClientRect().top;
    const need=opening?top>innerHeight*0.5:top<$("bar").offsetHeight;
    if(need){
      det.scrollIntoView({block:"start",behavior:lessMotion.matches?"auto":"smooth"});
    }
  });
});

/* Rebuilding the dropdown and the panel is O(all dictionaries) — renderPanel
   throws its whole list away and rebuilds it — so streamed rows coalesce into
   one repaint instead of ~100 of them. */
/* The groups the picker offers above the names, assembled from the per-row
   memberships the server derived (internal/facet). The client holds no
   taxonomy at all: a row says which group it is in, what to head that group
   with and what to call it, and this only counts and orders.

   One suppression: a group holding EVERY dictionary is "All dictionaries"
   under another name, so it is dropped, and a facet left with no groups goes
   with it. A group of one is kept - "the one Oxford I have" is a choice the
   user may have written into groups.ini on purpose (D162).

   The counts are over every member, disabled or not, for the same reason
   "All dictionaries" does not say "97 of 105": the groups are facts about
   the collection, and the off switch is applied when the search is run, not
   when the menu is drawn. */
function facetGroups(){
  if(!dictsSettled)return []; // mid-stream counts would be wrong, then change
  const byF=new Map(),total=dicts.length;
  for(const d of dicts)for(const g of d.groups||[]){
    let f=byF.get(g.f);
    if(!f){f={id:g.f,label:g.fl,fo:g.fo,vals:new Map()};byF.set(g.f,f)}
    const v=f.vals.get(g.v);
    if(v)v.n++;else f.vals.set(g.v,{id:g.v,label:g.vl,n:1});
  }
  return [...byF.values()].sort((a,b)=>a.fo-b.fo)
    .map(f=>({id:f.id,label:f.label,
      values:[...f.vals.values()].filter(v=>v.n<total)
        .sort((a,b)=>b.n-a.n||collate(a.label,b.label))}))
    .filter(f=>f.values.length);
}
let refreshTimer=null;
function refreshDictUI(now){
  clearTimeout(refreshTimer);
  if(!now){refreshTimer=setTimeout(()=>refreshDictUI(true),120);return}
  dicts.sort((a,b)=>collate(dictLabel(a),dictLabel(b)));
  // The live value first, then the remembered one. They say the same thing
  // until a rebuild has just dropped the option that held it — a rescan
  // replaces the whole list row by row, and a group is only counted once the
  // last row is in — and then only the remembered one still names the choice.
  const sel=$("dict"),saved=localStorage.getItem("wudict_dict");
  const prev=sel.value&&sel.value!=="all"?sel.value:(saved||sel.value||"all");
  const pend=sel.selectedOptions[0]?.dataset.pending?sel.selectedOptions[0]:null; // selectDict
  sel.innerHTML='<option value="all">All dictionaries</option>';

     top of the menu where a reach is shortest, then the groups, then every

  const ord=orderedDicts(),np=ord.findIndex(d=>!pinned.has(d.id)),
    pins=np<0?ord:ord.slice(0,np),rest=np<0?[]:ord.slice(np);
  const addDicts=(host,list)=>{
    for(const d of list){

  if(pins.length)addDicts(sel.appendChild(Object.assign(document.createElement("optgroup"),{label:"Pinned"})),pins);

     selectable, which is exactly the required behaviour for a section label,
     and every row under it is an ordinary <option> the native picker already
     knows how to search, key through and announce. A custom listbox would
     have had to re-implement all of that to gain a collapse this list is too
     short to need. */
  const all=facetGroups();
  renderGroupSeg(all);
  // A hidden section keeps only the group in force, if it is one of its own.
  const groups=all.map(f=>groupsOff.has(f.id)?{...f,values:f.values.filter(v=>"g:"+f.id+":"+v.id===prev)}:f)
    .filter(f=>f.values.length);
  for(const f of groups){
    const og=document.createElement("optgroup");
    og.label=f.label;
    for(const v of f.values){
      const o=document.createElement("option");
      o.value="g:"+f.id+":"+v.id;
      o.textContent=`${v.label} (${v.n})`;
      // The chip has room for the name, not for the tally: it says which
      // scope is in force, and the count is a property of the menu.
      o.dataset.label=v.label;

    }
    sel.appendChild(og);

  // something above it to be distinguished from: the groups are scrolled PAST
  // once, the names are scrolled THROUGH looking for one.
  if(rest.length)addDicts(groups.length||pins.length
    ?sel.appendChild(Object.assign(document.createElement("optgroup"),{label:"Dictionaries"}))
    :sel,rest);
  if([...sel.options].some(o=>o.value===prev))sel.value=prev;
  // a link's dictionary whose row is still on its way keeps its placeholder;
  // once the list is complete, a row that never came is not there to choose
  else if(pend&&!dictsSettled){sel.appendChild(pend);sel.value=prev}
  syncChips(); // the option list just changed under the chip
  renderPanel();
}

/* groups.ini lines or items the server skipped - an invalid regex, a line with
   no "=" - mark the way to the editor, on the drawer and on its link. */
function groupsTrouble(n){
  const what=n?`groups.ini: ${n===1?"1 problem":n+" problems"} - open Edit groups…`:"";
  $("groupsWarn").hidden=!n;$("groupsWarn").title=what;
  const a=$("groupsLink");
  a.classList.toggle("warn",!!n);
  a.title=n?what:"Choose the groups the dictionary picker offers";
  a.lastChild.textContent=n?`Edit groups… (${n})`:"Edit groups…";
}

/* The last complete /api/dicts answer and its validator (the `end` frame's
   etag), so a load draws the list at once and only asks whether it changed.
   Per browser and disposable: the server owns the list, a 304 vouches for
   this copy, and anything unreadable here is simply no copy. An answer the
   server offered no validator for (a row with an error or a running job) is
   not kept. */
const DICTS_KEY="wudict_dicts";
function readDictCache(){
  try{
    const c=JSON.parse(localStorage.getItem(DICTS_KEY));
    return c&&c.v===1&&c.etag&&Array.isArray(c.rows)&&c.rows.length?c:null;
  }catch(e){return null}
}
function writeDictCache(etag,rows,gp){
  try{
    if(etag)localStorage.setItem(DICTS_KEY,JSON.stringify({v:1,etag,gp,rows}));
    else localStorage.removeItem(DICTS_KEY);
  }catch(e){
    // a full store must not leave the previous copy to be vouched for
    try{localStorage.removeItem(DICTS_KEY)}catch(_){}
  }
}
/* What a search over the list depends on: which dictionaries, which modes
   each can answer, and which groups each is in. A revalidation that changes
   only sizes or paths leaves an answer on screen as true as it was. */
const listShape=()=>dicts.map(d=>d.id+":"+JSON.stringify(d.caps)+":"+JSON.stringify(d.groups||[])).sort().join();

/* Consumes the /api/dicts NDJSON stream, so search unblocks on the FIRST
   dictionary rather than the last one. Never throws: a failure here must
   still leave the user with a usable page.

   changes until the whole answer is in, then everything at once, and a 304
   changes nothing at all. opts.silent loads under an answer the page gave
   before the list (bootEarly), where a loading line would describe nothing
   the reader is waiting for.

   answer), false when it could not be had. */
async function loadDicts(rescan,opts={}){
  // A rescan happens in an app that already works — it must not black the UI
  // out. Only the first load (or a retry after a failure) blocks.
  const blocking=phase==="boot"||phase==="failed";
  const quiet=!!opts.etag;
  // A first load has no groups to show until the last row has resolved. A
  // RESCAN keeps the ones it has: the list on screen is already the previous
  // one being replaced row by row, and blanking the groups under it would
  // drop a group the user currently has selected.
  if(blocking)dictsSettled=false;
  if(blocking){setPhase("boot");startBootScreen();dictTotal=0;setStatus(esc(readyCount()),"load")}
  else if(!quiet&&!opts.silent)setStatus('<span class="spin"></span>Loading dictionaries…',"load");
  const rows=[];
  let published=false,sawBegin=false,tag="",gp=0;
  // "begin" costs the server no opens at all, so its absence means the server
  // is not answering — never leave the form inert waiting on a hang. Under an
  // early answer (silent) the answer stays: only the list is reported missing.
  const failed=msg=>{
    if(blocking)bootFailed(msg);
    else if(opts.silent){setPhase("failed");syncPanelHeader();setStatus("⚠ Could not load your dictionaries: "+esc(msg),"dicts")}
    else setStatus("⚠ "+esc(msg));
  };
  const watchdog=blocking||opts.silent?setTimeout(()=>{if(!sawBegin)failed("the server is not responding")},20000):null;
  try{
    const fresh=await fetchStream(rescan?"/api/rescan":"/api/dicts",msg=>{
      if(msg.t==="begin"){
        sawBegin=true;gp=msg.groupsProblems||0;
        groupsTrouble(gp);
        if(quiet)return;
        dictTotal=msg.total||0;
        if(blocking)setStatus(esc(readyCount()),"load");
      }else if(msg.t==="dict"&&msg.dict){
        rows.push(msg.dict);
        if(quiet)return;
        if(!published){
          // swap the old list out only now: a rescan keeps showing the
          // previous dictionaries until replacements start arriving
          published=true;dicts=rows;
          // a slow stream beat the watchdog: take its notice down, not an answer
          if(phase==="failed"&&$("retryBtn"))$("out").innerHTML="";
          setPhase("partial");
        }
        if(blocking)setStatus(esc(readyCount()),"load");
        refreshDictUI();
      }else if(msg.t==="end")tag=msg.etag||"";
    },null,opts.etag);
    if(!fresh)return true; // 304: the list on screen is the list
  }catch(err){
    failed(err.message);
    return false;
  }finally{
    clearTimeout(watchdog);
  }
  const shape=quiet&&listShape();
  dicts=rows;dictTotal=rows.length;
  writeDictCache(tag,rows,gp);
  // normalize the saved preference order to the current dictionary set
  // (newly-added dicts take their A→Z place, removed ones drop). ONLY on the
  // complete set — doing it mid-stream would drop the ids that had not
  // arrived yet, and convert an order it cannot see whole.
  convertOrder();
  setOrder(orderedIds());savePrefs(true);
  dictsSettled=true; // every row is in; the groups can be counted
  refreshDictUI(true);
  setPhase("ready");
  clearStatus("load");clearStatus("dicts");
  // a search run against a half-loaded list is now answerable in full
  if(staleSearch&&lastQuery){staleSearch=false;widenedFrom=staleWidened;doSearch()}
  // and one run against the kept list, if the list it searched has changed
  else if(quiet&&lastFromList&&lastQuery&&listShape()!==shape)doSearch();
  return true;
}
/* Changing the order (D166 Am. 1). The pin says WHETHER a dictionary leads
   the list and adds it after the other pinned ones, so pinning never changes
   which dictionary answers first; to-top makes one first, pinning it if it
   is not; ▲ ▼ and the drag move one among the pinned. Each result is one
   action, so where a new pin lands is not a setting. Nothing moves an
   unpinned dictionary: its place is its title's. Each change redraws the
   picker with the panel, because the two list one order. */
function orderChanged(){savePrefs();refreshDictUI(true)}
function pinDict(id,on){
  const ids=orderedIds().filter(x=>x!==id);
  if(on)ids.splice(ids.filter(x=>pinned.has(x)).length,0,id);
  on?pinned.add(id):pinned.delete(id);
  setOrder(ids);orderChanged();
}
function topDict(id){
  pinned.add(id);
  setOrder([id,...orderedIds().filter(x=>x!==id)]);orderChanged();
}
// One step within the pinned dictionaries, never across the A–Z line.
function moveDict(id,step){
  const ids=orderedIds(),i=ids.indexOf(id),j=i+step;
  if(i<0||j<0||!pinned.has(id)||!pinned.has(ids[j]))return;
  [ids[i],ids[j]]=[ids[j],ids[i]];
  setOrder(ids);orderChanged();

/* Unpinning every dictionary this page can see. One on a drive that is away

   every save does (prefs.go, merge). */
function unpinAll(){
  for(const d of dicts)pinned.delete(d.id);

}
function pinnedShown(){return dicts.filter(d=>pinned.has(d.id))}
function toggleDict(id){
  disabled.has(id)?disabled.delete(id):disabled.add(id);
  savePrefs();renderPanel();
}
/* Master switch: mixed → all, all → none, none → all (the Finder/Gmail
   convention — from a mixed state the useful move is always "select all").
   It only ever changes which dictionaries "All dictionaries" searches; it
   never touches a dictionary or its files. */

  for(const d of scopeDicts())on?disabled.delete(d.id):disabled.add(d.id);

/* A–Z unpins everything, so it is offered while something is pinned, and not

function syncAZ(){
  const off=!pinnedShown().length||!!findWords().length;

}

     on cancel reads what it cancels. */
  box.innerHTML=`<span id="azText">`+(p.length===1?`<b>Unpin ${esc(dictLabel(p[0]))}?</b> The list becomes A–Z.`
    :`<b>Unpin all ${p.length}?</b> The list becomes A–Z. The order of the pinned dictionaries is lost.`)+
    `</span><br><button type="button" class="azgo" aria-describedby="azText">${p.length===1?"Unpin":"Unpin all"}</button>`+
    `<button type="button" class="rmno" aria-label="Cancel" aria-describedby="azText">↩ cancel</button>`;

$("azBtn").addEventListener("click",()=>askAZ($("azAsk").hidden));
$("azAsk").addEventListener("click",e=>{
  // the button that was pressed is gone with the pins: focus goes to the field
  if(e.target.closest(".azgo")){askAZ(false);unpinAll();if(!TAPS)$("panelFind").focus();return}

function syncPanelHeader(){
  syncAZ();
  const scope=scopeDicts(),filtered=scope!==dicts,
    total=scope.length,on=scope.filter(d=>!disabled.has(d.id)).length;
  const box=$("enAll");
  box.checked=total>0&&on===total;
  box.indeterminate=on>0&&on<total;
  box.disabled=total===0;
  const shown=filtered?" shown":"",
    label=on===total?`All dictionaries${shown} are searched`:
    on===0?`No dictionaries${shown} are searched`:`${on} of ${total} dictionaries${shown} are searched`;
  // an empty list before the stream finishes is "not here yet", not "none" —
  // the panel must not contradict the boot screen (D30)

      (filtered?"None shown":phase==="failed"?"Could not load":dictsSettled?"No dictionaries":"Still loading…"):

/* The Rebuild line (server/reindex.go): one line, shown only while some
   dictionary is outdated or a rebuild is running. Nothing here starts on its
   own - an upgrade that changes indexing only makes the line appear. The job
   lives on the server, so the page just follows it: a reload or an Android
   rotation mid-rebuild picks it up again from the poll. */
let reindexSt=null,reindexTimer=0,reindexStopping=false;
function renderReindex(){
  const box=$("reindexLine"),st=reindexSt;
  if(st&&st.running){
    const at=Math.min(st.done+1,st.total),
      pct=st.currentTotal?` ${Math.min(100,Math.floor(st.currentDone/st.currentTotal*100))}%`:"";
    box.innerHTML=`<p><span class="spin"></span>Rebuilding ${at} of ${st.total}`+
      (st.current?` · ${esc(st.current)}${pct}`:"")+"</p>"+
      (reindexStopping?"<p class=\"cost\">Stopping after this dictionary…</p>":
        '<p><button type="button" class="btn" id="reindexStop">Stop</button></p>');
    box.hidden=false;return;
  }
  const n=dicts.filter(d=>d.outdated).length,failed=st&&st.failed||[];
  if(!n&&!failed.length){box.hidden=true;box.innerHTML="";return}
  box.innerHTML=(n?`<p>${n} ${n===1?"dictionary has":"dictionaries have"} outdated indexes `+
      '<button type="button" class="btn" id="reindexGo">Rebuild</button></p>':"")+
    (failed.length?'<p class="cost">Could not rebuild: '+failed.map(esc).join("; ")+"</p>":"");
  box.hidden=false;
}
function pollReindex(){
  clearTimeout(reindexTimer);
  reindexTimer=setTimeout(async()=>{
    let st=null;
    try{const r=await fetch("/api/reindex");if(r.ok)st=await r.json()}catch(_){}
    if(!st){pollReindex();return} // a missed poll is not the end of the job
    reindexSt=st;
    if(st.running){renderReindex();pollReindex();return}
    reindexStopping=false;
    const ok=st.done-(st.failed||[]).length;
    setStatus((st.failed&&st.failed.length?"":"✓ ")+`rebuilt ${ok} of ${st.total} `+
      (st.total===1?"dictionary":"dictionaries")+(st.canceled?" — stopped":""));
    await loadDicts();
    renderReindex();

}
$("reindexLine").addEventListener("click",async e=>{
  if(e.target.id==="reindexStop"){
    reindexStopping=true;renderReindex();
    fetch("/api/reindex",{method:"DELETE"}).catch(()=>{});
    return;
  }
  if(e.target.id!=="reindexGo")return;
  e.target.disabled=true;
  try{
    const r=await fetch("/api/reindex",{method:"POST"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    reindexSt=await r.json();reindexStopping=false;
  }catch(err){e.target.disabled=false;setStatus("Could not start the rebuild — "+esc(err.message));return}
  if(reindexSt.running){renderReindex();pollReindex()}
  else loadDicts(); // nothing was outdated any more: the list was behind
});
fetch("/api/reindex").then(r=>r.ok?r.json():null).then(st=>{
  if(st&&st.running){reindexSt=st;renderReindex();pollReindex()}
}).catch(()=>{});
// clicking an indeterminate checkbox sets checked=true, so "mixed → all"
// needs no special case.
$("enAll").addEventListener("change",e=>setAllEnabled(e.target.checked));
/* The narrow-viewport chips. They render the two <select>s and nothing more:

   consulted before reading a value — only called after one changes.

   Every chip keeps its mode's word: the words the mode dropdown, the
   per-dictionary switch and the result summaries all use, so a chip never
   names a mode differently from the rest of the page. */
/* The user-facing name of each index switch (docs/STYLE.md), shared by the
   switch tooltips, the in-results offer and its collected line. */
const FEAT_NAME={contains:"contains index",fts:"full-text index",media:"media pack"};
const MODE_SHORT={prefix:"prefix",exact:"exact",contains:"contains",fts:"full-text"};
function syncChips(){
  const m=$("mode"),d=$("dict");
  $("modeChip").textContent=MODE_SHORT[m.value]||m.value;
  $("modeChip").classList.toggle("dflt",m.value==="prefix");
  // No option selected is the default too, not a nameless scope: a saved id
  // is written to .value before /api/dicts has put that option in the list,
  // and assigning an id the <select> does not have yet leaves value "".
  const opt=d.selectedOptions[0],all=!opt||d.value==="all";
  // dataset.label is set on the group rows, whose text carries a count the
  // chip has no room for; a dictionary row has no dataset and reads as before.
  $("dictLbl").textContent=all?"":(opt.dataset.label||opt.text);
  $("dictChip").classList.toggle("dflt",all);
}
/* Picking a dictionary is already a statement that it is about to be searched,
   so its index is demanded on the selection itself and not on the first query
   (D92, /api/demand). Only when there is nothing to re-run: a search of one
   dictionary carries the same demand server-side, so doSearch() would make this
   request redundant. Fire-and-forget - the ingest outlives the response, and
   the chip catches up on the next loadDicts(). */
$("dict").onchange=e=>{const v=e.target.value;localStorage.setItem("wudict_dict",v);syncChips();
  if($("q").value.trim())doSearch();
  // One dictionary only. A group would demand an index for every member at
  // once, which is the unbounded auto-index fan-out (docs.local/PERF.md M1)
  // — the single most expensive thing this app can be made to do — triggered
  // by one tap on a menu, before the user has typed anything at all.
  else if(v&&v!=="all"&&!v.startsWith("g:"))fetch("/api/demand?dict="+encodeURIComponent(v),{method:"POST"}).catch(()=>{})};
/* Mode re-runs the search on change, symmetric with #dict: the narrow bar has
   no submit button, so a mode that waited for the next submit would appear to
   do nothing at all. */
$("mode").onchange=()=>{modePref=$("mode").value;savePrefs();syncChips();if($("q").value.trim())doSearch()};
syncChips(); // the markup ships empty chips; JS stays the single authority

/* provenance: the collapsed line says where the dictionary came from (its
   foreign source + a media companion count); expanding reveals the library
   folder that holds the prepared databases and the full media source paths.
   A dictionary with no source left shows its library folder directly. The
   folder is what a user copies, zips or hands over — so it, not the .db file
   inside it, is the path we show first. Paths are click-to-copy (reusing the
   .path handler). */
function mediaKind(list){
  const f=list[0].toLowerCase();
  if(f.endsWith(".mdd"))return "mdd";
  if(f.endsWith(".zip"))return "zip";
  return "res";
}
/* The traits this dictionary was filed under, derived exactly as the picker's
   sections are (internal/facet, from the row already in hand) — nothing is
   fetched for them and nothing is stored, so a better rule tomorrow refiles
   every card on the next load with nothing to undo. They live inside About
   because that is the card's register for what the dictionary IS, below the
   switches for what is done to it.

   Each one is also a way in: pressing a trait searches every dictionary that
   shares it, which is the picker's grouping reached from the dictionary in hand
   instead of from a menu — and it is how a reader finds out the grouping exists
   at all. A trait the picker does not offer (its group holds every
   dictionary, so selecting it would select the whole list) is rendered as
   plain text: still true, but it leads nowhere "All dictionaries" does not
   already go, and a control that does nothing is worse than no control. */
function traits(d){
  const gs=(d.groups||[]).slice().sort((a,b)=>a.fo-b.fo||a.vl.localeCompare(b.vl));
  if(!gs.length)return "";
  const opts=new Set([...$("dict").options].map(o=>o.value));
  const body=gs.map(g=>{
    const sel="g:"+g.f+":"+g.v;
    const face=`<span class="tk">${esc(g.fl)}</span>${esc(g.vl)}`;
    return opts.has(sel)
      ? `<button class="trait" data-g="${escAttr(sel)}" title="Search every dictionary under &quot;${escAttr(g.vl)}&quot;">${face}</button>`
      : `<span class="trait" title="${escAttr(g.fl)}: ${escAttr(g.vl)}">${face}</span>`;
  }).join("");
  return `<div class="traits">${body}</div>`;
}

function provenance(d){
  /* A row is a PATH with optional annotations around it — not a sentence.
     The row carries the path itself in data-full, so copying reads a value
     instead of reconstructing one from the text on screen, which would put
     the annotations on the clipboard along with the path. */
  const label=(p,o)=>{
    o=o||{};
    return `<div class="prow${o.cls?" "+o.cls:""}">`+
      (o.pre?`<span class="pfx">${esc(o.pre)}</span> `:"")+
      `<span class="path" data-full="${escAttr(p)}" title="Click to copy">${pathHTML(p)}</span>`+
      (o.post?` <span class="pfx">${esc(o.post)}</span>`:"")+
      `</div>`;
  };
  /* A row that names no path at all, so it carries no "Click to copy" and no
     .path affordance: there is nothing to copy. */
  const note=t=>`<div class="prow">${esc(t)}</div>`;
  const base=p=>String(p).split(/[\\/]/).pop()||String(p); // also handles Windows paths
  let head,rows=[],full="";
  if(d.source){
    const ms=d.mediaSrc||[],n=ms.length;
    // Collapsed, the file NAME is what identifies the dictionary; a 60-character
    // absolute path is noise repeated on every card. The full path is one click
    // away in the body (and in the tooltip), which is also the only place it is
    // copiable — the summary itself is the toggle.
    full=d.source;
    // No format prefix here: the meta line above already says "mdx", and the
    // file name that follows ends in ".mdx" — the label restated, two words
    // later, what the thing it labels already says. The prepared branch below
    // keeps its prefix because "prepared" is a state, not a format.
    head=`${esc(base(d.source))}`+
      (n?` <span class="companions">+ ${n} ${mediaKind(ms)}</span>`:"");
    rows.push(label(d.source));
    if(d.folder)rows.push(label(d.folder,{pre:"db:",post:"("+(d.mediaDB?"text.db + media.db + info.txt":"text.db + info.txt")+")"}));
    else if(d.textDB)rows.push(label(d.textDB,{pre:"db:",post:d.mediaDB?"+ media.db":""}));
    for(const m of ms)rows.push(label(m,{cls:"sub"}));
  }else{
    full=d.folder||d.textDB||d.path||"";
    head=`<span class="fmt">library</span>: ${esc(base(full))}`;
    if(full)rows.push(label(full)); // same rule: the full path lives in the body
    if(d.folder)rows.push(note("contains: text.db"+(d.mediaDB?" + media.db":"")+" + info.txt"));
    else if(d.mediaDB)rows.push(label(d.mediaDB,{pre:"media:"}));
  }
  /* Removal lives HERE, at the foot of the file list, and nowhere else.
     Two reasons, and the second is the real one:

     - Alarm has a cost. Danger colouring earns its keep on a control the user
       has chosen to look at; on every card at rest it is a panel that shouts
       at someone who came to switch on full-text search. One disclosure click
       separates the calm list from the loud thing.
     - It is semantically the same object. This summary names exactly what
       Remove deletes — the dictionary file, its companions, the prepared
       folder — so the section title IS the answer to "what would this take?",
       and the buttons below simply choose how much of the list to act on.

     canDelete is the server's answer to "may THIS caller delete?" — yes from
     the machine running wudict, and from a remote browser only when
     ALLOW_REMOTE_DELETE is on. Never a platform test done here: the page does
     not know what it is running on, and must not guess. */
  const canDel=!!(cfgInfo&&cfgInfo.canDelete);
  if(canDel)rows.push(`<div class="rmwrap">${rmTrigger()}</div>`);
  // The flat one-line form has nowhere to put a control, so a card that can be
  // deleted always gets the disclosure - even when the body holds nothing else.
  if(!rows.length)return `<div class="prov1" title="${escAttr(full)}">${head}</div>`;
  return `<details class="prov"><summary title="${escAttr(full)}">${head}</summary>`+
    `<div class="provbody">${rows.join("")}</div></details>`;
}

/* The trigger, in one place: rendered into the file list, and restored there
   when a confirmation is cancelled. */
function rmTrigger(){
  return `<span class="rm" title="Delete this dictionary and its files — permanently, with no undo">🗑 Remove…</span>`;
}
function renderPanel(){
  const el=$("panelList");
  /* Every card is replaced, so the scroll offset has to be carried over by
     hand. Measured on a phone: an ingest that ran for nine minutes ends in a
     loadDicts(), and without this the panel snaps back to the top - throwing
     the reader away from the one dictionary they were watching, at the exact
     moment they were waiting to see it finish. */
  const scroller=el.closest(".panel-scroll"), top=scroller?scroller.scrollTop:0;
  el.innerHTML="";
  const ord=orderedDicts(),np=ord.filter(d=>pinned.has(d.id)).length;
  for(const [i,d] of ord.entries()){
    const off=disabled.has(d.id),pin=pinned.has(d.id);
    // the A–Z line, between the pinned and the rest when there are both
    if(i===np&&np>0)el.appendChild(Object.assign(document.createElement("div"),{className:"pdiv",textContent:"A–Z"}));
    const div=document.createElement("div");div.className="pd"+(off?" off":"");div.dataset.id=d.id;
    div.dataset.find=findKey(d);
    /* Only what varies AND can be changed. exact and prefix are true for every
       dictionary and cost nothing, so showing them was decoration; contains,
       full-text and media each cost real disk, so each is a switch.
       Switching is offered only while the SOURCE is on disk — that is what
       makes it reversible, and why none of this needs a confirmation. */
    const canToggle=!!d.source;
    const feats=[
      ["contains","contains",d.caps?.Contains,0],
      ["fts","full-text",d.caps?.FTS,0],
      ["media","media",!!d.mediaDB,d.mediaSize||0],
    ];
    /* The index itself, first in the run of chips. Two states, because the
       dictionary only has two: "🚀 index" while there is none — it is searched
       the slow way through its own format until there is — and the size once
       there is one. A size rather than a tick: a number is what the reader can
       act on (the word "indexed" stays in the meta line). The done state is
       .locked, so the
       click handler leaves it alone: it is a fact, not a switch. Removing an
       index is Remove… → "index only", which asks first, as deleting should.
       No chip at all when the source is gone — a prepared-only dictionary
       cannot be rebuilt, and dbSize covers it anyway. */
    const indexed=(d.dbSize||0)>0;
    /* What it would cost, on the ABSENT state only. A 2.9 M-entry dictionary
       is a gigabyte of disk and minutes of a phone's battery, and the chip
       that starts that says so first; O9 is the decision that the size be
       shown before it is spent, not after.

       The estimate is calibrated on the user's own corpus, exactly as
       ftsAddedBytes is, and for the same reason: bytes-per-entry runs from 107
       to 94 k across real dictionaries, so no hard-coded multiplier is honest.
       With nothing to calibrate against it says nothing rather than inventing
       a number.

       It must never be mistaken for the real figure sitting in the .on.locked
       chip next to it, which is a measurement of a file on disk. Hence "est.",
       hence "~", hence plain .feat styling - the estimate is an argument for
       clicking, the size is a fact about what a click already produced. */
    const est=indexed?0:baseIndexBytes(d);
    let caps=indexed
      ? `<span class="feat on locked" title="Indexed: ${mb(d.dbSize)} on disk">${mb(d.dbSize)}</span>`
      : canToggle
        ? `<span class="feat" data-feat="base" title="Not indexed: searched through its own format, slower and with more memory. Click to index${est?` (about ${mb(est)}, estimated from your indexed dictionaries)`:""}.">🚀 index${est?` · est. ~${mb(est)}`:""}</span>`
        : "";
    for(const[key,label,on,bytes]of feats){
      if(key==="media"&&!on&&!d.hasMedia)continue; // nothing to pack
      const size=on&&bytes?" "+mb(bytes):"";
      /* A stale index still works — it was built with older text-folding
         rules, so it can only miss words whose folding changed. So it is
         marked, not disabled, and the click rebuilds instead of removing. */
      const stale=key==="contains"&&on&&d.containsStale;
      const what=FEAT_NAME[key];
      const tip=!canToggle?"Locked: the dictionary files are gone, and this is the only copy":
        stale?`Outdated ${what}: click to rebuild`:
        (on?"Remove the ":"Add the ")+what;
      caps+=`<span class="feat${on?" on":""}${stale?" stale":""}${canToggle?"":" locked"}"`+
        ` data-feat="${key}" data-on="${on?1:0}"${stale?' data-stale="1"':""}`+
        ` title="${tip}">${label}${size}${stale?" ⟳":""}</span>`;
    }
    // the contains index is built automatically on first use, so the only
    // manual action offered is full-text (which also covers contains).
    // "pack media" is offered only when the dictionary actually has packable
    // media, a source to pack it from, and it isn't already packed.
    let acts="";
    if(d.error)acts=`<span class="err">${esc(d.error)}</span>`;
    /* Offered whether or not the index exists yet: browsing IS the index, so
       following this link on an unprepared dictionary is the request to build
       it, and the browse page asks for it and opens the list when it is ready.
       This is the card for one dictionary, so unlike the row above it carries
       the id. */
    else acts=`<a class="browse" href="/browse?dict=${encodeURIComponent(d.id)}" title="Read this dictionary A–Z, page by page"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2.4 3.4a1.2 1.2 0 0 1 1.2-1.2h6.2a1.2 1.2 0 0 1 1.2 1.2v9.2a1.2 1.2 0 0 1-1.2 1.2H3.6a1.2 1.2 0 0 1-1.2-1.2z"/><path d="M11 5h2.6"/><path d="M11 8h2.6"/><path d="M11 11h2.6"/></svg>Browse</a>`;
    /* To-top and the pin are on every card: to-top means first in the list
       wherever it is pressed, and the pin is the one way in or out of the
       pinned list. Both are monochrome SVG, as every icon here is: an emoji
       arrow would be a colour blob on one platform and flat on another.
       ▲ ▼ and the handle exist only where there is a place to choose, among
       the pinned. An outline pin, filled once pinned: a pin predicts the move
       up that a star or a heart would not. */
    div.innerHTML=`<div class="hd">
        ${pin?`<span class="grip" draggable="true" title="Drag to reorder">⠿</span>`:""}
        <b tabindex="0" role="button" title="Search only this dictionary">${esc(dictLabel(d))}</b>
        <span class="ord">
          <button type="button" data-mv="top" title="${pin?"Move to the top":"Pin and move to the top"}" aria-label="Move to the top"${i===0?" disabled":""}><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3.5 2.5h9"/><path d="M8 14V6"/><path d="M4.8 9.2 8 6l3.2 3.2"/></svg></button>
          ${pin?`<button type="button" data-mv="up" title="Move up" aria-label="Move up"${i===0?" disabled":""}>▲</button>
          <button type="button" data-mv="down" title="Move down" aria-label="Move down"${i===np-1?" disabled":""}>▼</button>`:""}
          <button type="button" class="pin" aria-pressed="${pin}" title="${pin?"Unpin":"Pin after the other pinned dictionaries"}" aria-label="Pin ${escAttr(dictLabel(d))}"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path class="head" d="M6 2h4l-.6 4.2L12 8.5v1H4v-1l2.6-2.3z"/><path d="M8 9.5v4.8"/></svg></button>
        </span>
        <input type="checkbox" class="en" ${off?"":"checked"} title="${off?"Disabled — excluded from All dictionaries":"Enabled"}">
      </div>
      <div class="meta">${esc(d.format||"?")}${d.entries?" · "+d.entries.toLocaleString()+" entries":""}${d.dbSize?" · indexed":""}</div>
      <div>${caps}</div><div class="acts">${acts}</div>
      ${provenance(d)}
      <details class="about"><summary>About this dictionary</summary>${traits(d)}<div class="aboutbody">…</div></details>`;
    el.appendChild(div);
  }
  findDicts(); // also syncs the master switch, which follows the filter
  if(scroller)scroller.scrollTop=top;
  // A change to a dictionary's indexes is the server's job, not this page's
  // (jobs.go): one started before a reload or by another tab is in its row,
  // and following it puts the progress back on its card.
  for(const d of dicts){
    const chip=d.job&&!following.has(d.id)&&el.querySelector(`.pd[data-id="${CSS.escape(d.id)}"] .feat`);
    if(chip)runIngest(d.id,{},chip);
  }
}

/* drag-to-reorder via the gripper (chevrons cover keyboard/precise moves).
   The handle is on pinned cards only, and only a pinned card takes the drop:
   the A–Z part has no place to drop into (D166). */
let dragId=null;
function clearDrop(){document.querySelectorAll(".pd.drop-before,.pd.drop-after").forEach(p=>p.classList.remove("drop-before","drop-after"))}
$("panelList").addEventListener("dragstart",e=>{
  const pd=e.target.closest(".pd");if(!pd||!e.target.classList.contains("grip"))return;
  dragId=pd.dataset.id;pd.classList.add("dragging");e.dataTransfer.effectAllowed="move";
});
$("panelList").addEventListener("dragend",()=>{
  document.querySelectorAll(".pd.dragging").forEach(p=>p.classList.remove("dragging"));clearDrop();dragId=null;
});
$("panelList").addEventListener("dragover",e=>{
  if(!dragId)return;
  const pd=e.target.closest(".pd");
  if(!pd||!pinned.has(pd.dataset.id)){clearDrop();return}
  e.preventDefault();if(pd.dataset.id===dragId)return;
  const r=pd.getBoundingClientRect(),after=e.clientY>r.top+r.height/2;
  clearDrop();pd.classList.add(after?"drop-after":"drop-before");
});
$("panelList").addEventListener("drop",e=>{
  if(!dragId)return;e.preventDefault();
  const pd=e.target.closest(".pd");
  if(!pd||pd.dataset.id===dragId||!pinned.has(pd.dataset.id)||!pinned.has(dragId)){clearDrop();return}
  const r=pd.getBoundingClientRect(),after=e.clientY>r.top+r.height/2;
  const ids=orderedIds(),from=ids.indexOf(dragId);ids.splice(from,1);
  let to=ids.indexOf(pd.dataset.id);if(after)to++;
  ids.splice(to,0,dragId);setOrder(ids);clearDrop();dragId=null;orderChanged();
});
/* Finding a dictionary in the panel. Every word typed must occur, case and
   accents ignored, in the title or in one of the dictionary's groups, and the
   list keeps its own order. Cards are hidden, never rebuilt: a keystroke is
   one pass over the rows, and a card's open details and running progress
   survive it. The master switch acts on the cards shown, so it is
   synced on every pass. */
function findFold(s){return s.normalize("NFD").replace(/\p{M}/gu,"").toLowerCase()}
function findKey(d){return findFold([dictLabel(d),...(d.groups||[]).map(g=>g.vl)].join("\n"))}
function findWords(){return findFold($("panelFind").value).split(/\s+/).filter(Boolean)}
// `dicts` itself when nothing is typed, so callers can test for a filter by identity
function scopeDicts(){
  const words=findWords();if(!words.length)return dicts;
  return dicts.filter(d=>{const k=findKey(d);return words.every(w=>k.includes(w))});
}
function findDicts(){
  const el=$("panelList"),words=findWords();
  let shown=0,line=null,above=false,below=false;
  for(const n of el.querySelectorAll(".pd,.pdiv")){
    if(n.classList.contains("pdiv")){line=n;continue}
    const hit=words.every(w=>n.dataset.find.includes(w));
    n.hidden=!hit;
    if(hit){shown++;if(line)below=true;else above=true}
  }
  // the A–Z line parts what is shown, so it needs a card on either side
  if(line)line.hidden=!(above&&below);
  el.classList.toggle("filtered",words.length>0);
  let none=el.querySelector(".nofind");
  if(words.length&&!shown){
    if(!none)el.appendChild(none=Object.assign(document.createElement("p"),{className:"nofind"}));
    none.textContent="No dictionary matches";
  }else if(none)none.remove();
  syncPanelHeader();
}
$("panelFind").addEventListener("input",findDicts);
$("panelFind").addEventListener("keydown",e=>{
  // Esc empties the field first and closes the panel only from an empty one
  if(e.key==="Escape"&&e.target.value){e.preventDefault();e.stopPropagation();e.target.value="";findDicts()}
  // nothing to submit: Enter puts the phone keyboard away so the list shows
  else if(e.key==="Enter"){e.preventDefault();e.target.blur()}
});

/* The panel is a full-height overlay OVER the results, and every switch in it
   — enable/disable, the master switch, drag-reorder — changes what an "All
   dictionaries" search answers with and in what order. Re-running per click
   would fire one streaming search per toggle (up to `dicts.length` of them
   during an "enable all" sweep), each aborting the last through searchSeq,
   while the user sees none of it behind the overlay. So the query is re-issued
   once, on close, and only if the enabled set or its order actually moved —
   opening the panel to read an About card or check a path must not throw away
   a finished answer, its scroll offset and its open <details>. Same rule the
   bulk-FTS, ingest and mid-stream-load paths already follow: when the
   searchable corpus changes under a live query, re-issue the query. */
let panelSnap=null;
function panelState(){return enabledOrderedIds().join("\u0000")}
function showPanel(){panelSnap=panelState();
  // Asked here, not at load: the Android shell installs its speech engine
  // after the page has loaded (D148).
  $("speakBtn").hidden=!speakCan();
  // before the lock: once the root stops scrolling the bar is gone to measure
  document.documentElement.style.setProperty("--wd-sbw",
    Math.max(0,innerWidth-document.documentElement.clientWidth)+"px");
  $("panel").classList.add("show");loadFolders();
  // A touch keyboard would cover half the list it is meant to narrow, so on
  // a touch screen the field waits for a tap.
  if(!TAPS)$("panelFind").focus()}
function hidePanel(){
  if(!$("panel").classList.contains("show"))return;
  $("panel").classList.remove("show");
  askAZ(false);
  // every opening starts from the whole list
  if($("panelFind").value){$("panelFind").value="";findDicts()}
  const was=panelSnap;panelSnap=null;
  /* Only an "All dictionaries" answer is built from the enabled set. A view
     scoped to one dictionary — by the selector, or one-shot by an entry:// link
     (lastScope) — reads that dictionary whether or not it is enabled, so the
     panel cannot have changed it; and re-running here would carry no scopeOnce
     and silently widen a cross-reference view back to "all". */
  const sc=$("dict").value;
  if(!lastQuery||was===null||lastScope||!(sc==="all"||sc.startsWith("g:")))return;
  // an empty enabled set is a real answer here, not a no-op: doSearch renders
  // "all dictionaries are disabled" rather than a zero-hit "not found"
  if(was!==panelState())doSearch();
}
$("panelBtn").onclick=showPanel;
$("closePanel").onclick=hidePanel;
$("panel").onclick=e=>{if(e.target.id==="panel")hidePanel()};
$("rescanBtn").onclick=()=>{loadDicts(true).then(loadFolders).then(checkOrphans)};

/* Folders & configuration ------------------------------------------------ */
let cfgInfo=null;

/* Every path in this panel would open with the same /Users/<name>/ — eleven
   characters of nothing, repeated on each row, holding the pixels the eye
   lands on first while the part that tells the rows APART (mdict, aard,
   slob_Apple) is pushed right.
   The server sends {prefix,label} pairs (longest first) and this applies them
   without knowing what they mean: on a desktop that is the home directory as
   `~`, on Android the volume names the Files app uses. A label the page
   invented would be a lie on some platform — `~` on Android names a directory
   with no shell that nobody can open (D63 amendment).
   Display only: the clipboard and /api/reveal keep the absolute path. */
function shortPath(p){
  const al=cfgInfo&&cfgInfo.pathAliases;   // set before any row is built
  if(!al||!p)return p;
  for(const a of al){
    const pre=a[0],label=a[1];
    if(!pre)continue;
    if(p===pre)return label;
    const sep=pre.includes("\\")?"\\":"/";
    if(p.startsWith(pre+sep))return label+sep+p.slice(pre.length+sep.length);
  }
  return p;
}
/* Break opportunities after separators only. word-break:break-all split
   "Language" into "Languag"+"e"; a path broken after "/" keeps every segment

   letter by letter. <wbr> contributes nothing to textContent, so it can never

/* Bulk full-text (D31). It names what the user gets, not our mechanism -

   configuration drawer as quiet text and prices itself before it can fire:
   prominence tracks value, not cost. The good discovery path is elsewhere: a
   full-text search that meets a dictionary lacking the index offers to add
   just that one, in context and motivated. */
function ftsCandidates(){
  // a dictionary whose source file is gone cannot be re-indexed at all — the
  // prepared data is the only copy (same rule the per-card chips enforce, and
  // which "index all" ignored: it queued dictionaries guaranteed to fail)
  return dicts.filter(d=>!d.error&&!d.caps?.FTS&&d.source);

/* Size estimate calibrated on the user's OWN corpus: bytes-per-entry observed
   across the dictionaries that already have full text. Article length varies
   far too much between dictionaries for a hard-coded multiplier to be honest,
   and when there is nothing to calibrate against this says nothing rather
   than inventing a number — the exact figures below carry the warning fine. */
function ftsAddedBytes(todo){
  let bytes=0,entries=0;
  for(const d of dicts)if(d.caps?.FTS&&d.dbSize&&d.entries){bytes+=d.dbSize;entries+=d.entries}
  const want=todo.reduce((n,d)=>n+(d.entries||0),0);
  if(!entries||!want)return 0;
  const grown=want*(bytes/entries),have=todo.reduce((n,d)=>n+(d.dbSize||0),0);
  return grown>have?grown-have:0;
}
/* The same calibration as ftsAddedBytes, for the index that has not been built
   yet: bytes per entry across the dictionaries that DO have one, restricted to
   headword-only indexes because that is what building this one produces (a
   full-text index is several times larger and would overstate it wildly).

   silence. */

  if(!d.entries)return 0;

     drawn, and renderPanel calls this once per unprepared card — so computing
     it inside the function made one panel render O(cards x dictionaries).
     Memoised on the identity of the `dicts` array, which /api/dicts replaces
     wholesale on every refresh, so a new list recalculates and a redraw of the
     same list does not. */
  if(baseRateFor!==dicts){
    let bytes=0,entries=0;
    for(const o of dicts)if(o.dbSize&&o.entries&&!o.caps?.FTS){bytes+=o.dbSize;entries+=o.entries}
    baseRate=entries?bytes/entries:0;baseRateFor=dicts;

/* ── removing a dictionary (D63, amended) ────────────────────────────────
   Three clicks, no modal: open the file list, Remove…, then the choice. The
   list is the disclosure the control hides behind, and it is not a speed bump
   bolted on — it is the inventory of exactly what would go, so the user reads
   the consequence on the way to the button rather than in a dialog after it.
   The confirmation then replaces the trigger in place, so the dictionary being
   deleted is the one under the paths on screen and nothing is named twice.
   Each choice states what it deletes and what that costs — no "are you sure?",
   which asks the user to re-read a question they already answered rather than
   telling them anything.

   Delete-everything is the default because preparation is automatic: deleting
   only the index of a dictionary whose file is still in a scanned folder
   frees the space until the next search rebuilds it. "Index only" is offered
   anyway (it is the honest way to reclaim a full-text index), and it says so
   afterwards, from the server's own report.

   Vocabulary: these are "the dictionary files", never "the originals". On the
   Play flavour the file this deletes is itself a COPY the importer made, and
   the import dialog uses "originals" for the user's own files on shared
   storage — one word for two different files, in one app, would make the
   import's keep/delete question unanswerable. */
function askRemoval(pd){

  // file list it is about, already open, with the paths it would delete listed
  // directly above it.

  if(d.builtin){
    wrap.innerHTML=`<span class="rmq">Remove <b>${esc(dictLabel(d))}</b>`+
      ` — Setup can bring it back any time`+
      `<br><span class="rmgo" data-rm="all">remove</span><span class="rmno">↩ cancel</span></span>`;
    return;
  }
  const idx=(d.dbSize||0)+(d.mediaSize||0);
  const prepared=idx>0||!!d.mediaDB;
  // "dictionary files only" is a genuine option exactly once: the dictionary is
  // prepared AND its media is packed, so the prepared copy can stand alone.
  // The server enforces this too (D24 §4) — this only avoids offering what
  // would be refused.
  const canDropSource=!!d.source&&prepared&&(!!d.mediaDB||!d.hasMedia);
  let btns=`<span class="rmgo" data-rm="all">💥 delete${d.source?" everything":""}</span>`;
  if(d.source&&prepared)btns+=`<span class="rmgo" data-rm="index">index only${idx?" · "+mb(idx):""}</span>`;
  if(canDropSource)btns+=`<span class="rmgo" data-rm="source">dictionary files only</span>`;

  // colour — the buttons below it say WHAT goes, not how bad it is.
  wrap.innerHTML=`<span class="rmq"><span class="rmwarn">😱 No undo. No Trash. Gone.</span>`+
    `Delete <b>${esc(dictLabel(d))}</b>`+
    (d.source?` — the prepared index${idx?" ("+mb(idx)+")":""} <b>AND</b> the dictionary files`
             :` — ⚠️ this is the only copy, there are no dictionary files to rebuild it from`)+
    `<br>${btns}<span class="rmno">↩ cancel</span></span>`;
}

async function runRemove(id,kind,node){
  node.dataset.busy="1";node.classList.add("busy");
  const d=dicts.find(x=>x.id===id)||{path:""},name=dictLabel(d);
  node.textContent="deleting…";
  setStatus('<span class="spin"></span>'+esc(name)+" — deleting…");
  const q="/api/library?dict="+encodeURIComponent(id)+
    "&prepared="+(kind==="source"?0:1)+"&source="+(kind==="index"?0:1);
  let rep;
  try{
    const r=await fetch(q,{method:"DELETE"});
    rep=await r.json();
    if(!r.ok)throw new Error((rep&&rep.error)||("HTTP "+r.status));
  }catch(err){
    node.classList.remove("busy");delete node.dataset.busy;
    node.textContent="failed";
    setStatus("⚠ "+esc(name)+" — "+esc(err.message||String(err)));
    return;
  }
  setStatus("💀 "+esc(name)+" — deleted, "+mb(rep.freed||0)+" freed"+
    (rep.note?" · "+esc(rep.note):""));
  // The server has already rescanned; this refetches the list it now reports,
  // and redraws the panel (and the folder section's counts) from it.
  await loadDicts();
  if($("folderBody").childNodes.length)loadFolders();
  if(lastQuery)doSearch();
}
$("panelList").addEventListener("change",e=>{
  if(e.target.classList.contains("en"))toggleDict(e.target.closest(".pd").dataset.id);
});
/* the "enable full-text search" link - in a result summary when the search
   named one dictionary, in the grouped no-index list when it named many */
document.addEventListener("click",e=>{
  const up=e.target.closest(".upgrade");
  if(!up)return;
  e.preventDefault(); // don't toggle the <details>
  runIngest(up.dataset.id,{[up.dataset.feat||"fts"]:1},up);
});

function runIngest(id,opts,label){
  if(label.dataset.busy||following.has(id))return Promise.resolve(); // ignore repeat clicks
  label.dataset.busy="1";
  following.add(id);
  const name=dictLabel(dicts.find(d=>d.id===id)||{path:""});
  /* Two lengths of the same message: the chip is one of four in a row inside
     a 420px panel, so "indexing… 2,395,000/2,965,310" wraps the row onto a
     second line and reflows the card at every update - measured on a phone,
     four times a second, for nine minutes. The chip gets a percentage, which
     never changes width; the status line, which has the room, keeps the
     counts. */
  const show=(t,long)=>{
    label.textContent=t;
    setStatus('<span class="spin"></span>'+(opts.statusPrefix||"")+esc(name)+" — "+esc(long||t));
  };
  const removing=Object.values(opts).some(v=>v===0);
  show(removing?"removing…":"indexing…");
  label.classList.remove("act");label.classList.add("busy");
  label.style.textDecoration="none";label.style.cursor="default";
  // A feature left out keeps its state; the index chip sends none, which
  // prepares an unprepared dictionary at the cheapest level (handleIngest).
  const params=Object.entries(opts)
    .filter(([k])=>k==="contains"||k==="fts"||k==="media")
    .map(([k,v])=>"&"+k+"="+(v?1:0)).join("");
  return new Promise(resolve=>{
    const es=new EventSource("/api/ingest?dict="+id+params);
    es.addEventListener("progress",ev=>{
      const p=JSON.parse(ev.data);
      const counts=p.done.toLocaleString()+(p.total?"/"+p.total.toLocaleString():"");
      /* The steps after the counted work - two CREATE INDEXes, the commit,
         ANALYZE - are one opaque SQLite call each and can report nothing; on a
         redirect-heavy dictionary they are ~15% of the wall time. Naming that
         "finishing…" beats a percentage parked at 100. */
      const pct=p.total?Math.min(100,Math.floor(p.done/p.total*100)):-1;
      show(verb+"… "+(pct<0?p.done.toLocaleString():pct>=100?"finishing…":pct+"%"),
        verb+"… "+counts);
    });
    es.addEventListener("done",async()=>{
      es.close();following.delete(id);
      setStatus("✓ "+esc(name)+(removing?" — removed":" — ready"));
      if(!opts.quiet){await loadDicts();if(lastQuery)doSearch()}
      resolve(true);
    });
    /* Two unrelated events share the name "error": EventSource's own
       transport error, which carries no data, and the server's `event: error`
       (server.go emit("error", …)), which carries {"error":"…"} and is the
       only thing that can say WHY - a full disk nine minutes into a prepare
       reads as a bare "failed" otherwise. The chip stays short either way;
       the reason goes to the status line, which has the room. */
    es.addEventListener("error",ev=>{es.close();following.delete(id);
      let why="";
      try{if(ev&&ev.data){const d=JSON.parse(ev.data);if(d&&d.error)why=String(d.error)}}catch(_){}
      show("failed",why?"failed — "+why:"failed");
      label.classList.add("err");resolve(false)});
  });
}

/* Article HTML arrives with resource refs already rewritten to the
   root-absolute /res/{dict}/… form by the server (RewriteEntryHTML,
   unit-tested in Go), so the click handlers below use those hrefs as-is.
   resURL is only the fallback for refs the server-side attribute regex
   cannot see (e.g. unquoted attributes in malformed dictionary HTML); it
   emits the same absolute form, so it never double-prefixes. Absolute
   (not relative) because articles also render inside srcdoc iframes whose
   base URL differs — /res/ resolves to the same origin URL everywhere. */
function resURL(dictID,ref){
  ref=ref.replace(/^sound:\/\//i,"").replace(/^file:\/\//i,"").replace(/^\.?\//,"");
  return "/res/"+dictID+"/"+ref;
}

/* shadow-root base style: sane defaults inside the sandbox; media flip
   back when the host carries data-dark (Dark-Reader approach) */
/* The role stylesheet for articles wudict writes itself (Go: internal/artmark).
   Substituted once by the server and used by BOTH article surfaces below —
   a shadow root and a sandboxed iframe cannot share a sheet object, but they
   can share these bytes, and a role that renders differently in the two would
   be a bug nobody would think to look for. */
const ARTCSS=`{{ARTCSS}}`;

const shadowBase=`<style>
:host{all:initial;display:block;font-family:${"-apple-system,Helvetica,Arial,sans-serif"};
  font-size:var(--wd-fs,15px);line-height:1.618;color:var(--wd-article-fg,#1a1a1a);word-break:break-word}
img,video,svg{max-width:100%;height:auto}
a{color:#5b7a99;cursor:pointer}
table{max-width:100%;border-collapse:collapse}
:host([data-dark]) :is(img,picture,video,svg,canvas,iframe,embed,object,[data-noinvert]){
  filter:invert(1) hue-rotate(180deg)}
${ARTCSS}
:host([data-brief]) .wu-sec{display:none}

/* ── @font-face hoisting ─────────────────────────────────────────────────
   A shadow root scopes ordinary rules, which is exactly why articles render
   in one. @font-face is the exception: a font family is matched against the
   DOCUMENT's font set, so a face declared inside a shadow tree is fetched,
   parsed — and then never selectable. AHD5 declares 'Minion New' (base64 TTF
   in ahd5.css) and every IPA glyph fell back to the default serif, which is
   what "Rendered font: Times New Roman" in devtools means.

   There is no scoped form of @font-face in CSS: a face is document-global or
   it does not exist. So we lift the FACES, and only the faces, up to the
   document and leave every other rule scoped where it belongs.

   We read them back out of CSSOM rather than re-parsing the CSS, because the
   browser has already parsed the sheet in order to render the article —
   ahd5.css is 2.9 MB, and parsing it a second time in JS to learn something
   the engine already knows would be pure waste.

   The iframe path needs none of this: an iframe is a real document, so faces
   declared in it work natively. */
const fontSheetsSeen=new Set();   // by absolute href — skip re-walking a linked sheet
const fontFacesSeen=new Set();    // by rule text — two dictionaries may ship one font
let fontSink=null;

/* Families the chrome itself resolves against. @font-face has no scope to
   hide behind, so a dictionary that redefined one of these would restyle the
   whole app around it. Dropping a dictionary's "Arial" costs nothing: the
   system face takes over, which is what it wanted anyway. */
const uiFamilies=new Set(["-apple-system","system-ui","blinkmacsystemfont","helvetica",
  "helvetica neue","arial","sans-serif","serif","monospace","ui-monospace","menlo","consolas"]);

function faceFamily(rule){
  const f=(rule.style&&rule.style.getPropertyValue("font-family"))||"";
  return f.trim().replace(/^["']|["']$/g,"").toLowerCase();
}
/* Walks a sheet for @font-face, descending through @import (.styleSheet) and
   the grouping rules — @media, @supports, @layer (.cssRules). Reading
   .cssRules of a cross-origin sheet throws; a dictionary that links a CDN
   font is simply skipped rather than breaking the render. */
function collectFaces(sheet,out){
  let rules=null;
  try{rules=sheet.cssRules}catch(_){return}
  if(!rules)return;
  for(const r of rules){
    if(window.CSSFontFaceRule&&r instanceof CSSFontFaceRule){
      if(uiFamilies.has(faceFamily(r)))continue;
      if(fontFacesSeen.has(r.cssText))continue;
      fontFacesSeen.add(r.cssText);
      out.push(r.cssText);
    }else if(r.styleSheet)collectFaces(r.styleSheet,out);
    else if(r.cssRules)collectFaces(r,out);
  }
}
function hoistFaces(sheet){
  if(!sheet)return;
  const out=[];
  collectFaces(sheet,out);
  if(!out.length)return;
  if(!fontSink){
    fontSink=document.createElement("style");
    fontSink.id="wudict-fonts";
    document.head.appendChild(fontSink);
  }
  fontSink.appendChild(document.createTextNode(out.join("\n")));
}
/* A <link> in a shadow root loads asynchronously — .sheet is null until it
   has, so hoist on load as well as immediately (a warm sheet is already
   parsed by the time we look). Inline <style> is parsed synchronously and
   walked every render; that walk is strictly cheaper than the innerHTML
   parse we just paid for the same bytes, so it needs no sheet-level cache. */
function hoistShadowFonts(root){
  for(const el of root.querySelectorAll("style,link[rel~='stylesheet' i]")){
    if(!el.href){hoistFaces(el.sheet);continue}
    if(fontSheetsSeen.has(el.href))continue;
    fontSheetsSeen.add(el.href);
    if(el.sheet)hoistFaces(el.sheet);
    else el.addEventListener("load",()=>hoistFaces(el.sheet),{once:true});
  }
}

function renderArticle(dd,body,dictID,frag){
  // Script-bearing articles (custom tooltips, MathJax, …) need a real
  // document scope: shadow roots neither execute <script> nor let
  // scripts see their content. Render those in a sandboxed iframe.
  if(/<script[\s>]/i.test(body))return renderFrame(dd,body,dictID,frag);
  // <dd> cannot host a shadow root; use an inner <div> as the sandbox
  const host=document.createElement("div");
  host.className="article";host.dataset.dict=dictID;
  const root=host.attachShadow({mode:"open"});
  root.innerHTML=shadowBase+body;
  // After innerHTML, and last in the cascade: adopted sheets order after the
  // root's own, so the user's rules win ties against the dictionary's.
  if(userSheet)root.adoptedStyleSheets=[userSheet];
  if(themeIsDark()){
    host.toggleAttribute("data-dark",true);
    if(!document.documentElement.hasAttribute("data-theme"))host.classList.add("autodark");
  }
  dd.appendChild(host);
  // After connecting: a <link> in a disconnected tree does not begin loading.
  hoistShadowFonts(root);
  return root;
}

let frameSeq=0;
function renderFrame(dd,body,dictID,frag){
  const fid="f"+(++frameSeq);
  const ifr=document.createElement("iframe");
  ifr.className="article frame";ifr.dataset.dict=dictID;ifr.dataset.fid=fid;
  ifr.setAttribute("sandbox","allow-scripts allow-same-origin allow-popups");
  ifr.style.height="90px";

}
function frameDoc(content,fid,dark,dictID,frag){
  return '<!DOCTYPE html><html class="'+(dark?'dark':'')+'"'+(dark?' data-dark':'')+'><head><meta charset="utf-8">'+
    /* Baked in, because a custom property cannot cross into another
       document; changes AFTER creation arrive by postMessage instead. */
    '<style>html{font-family:-apple-system,Helvetica,Arial,sans-serif;font-size:'+articleFS+'px;line-height:1.618;color:var(--wd-article-fg,#1a1a1a);background:var(--wd-article-bg,#fff);overflow-y:hidden}'+
    'body{margin:8px}img,video,svg{max-width:100%;height:auto}'+
    'html.dark{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.92)}'+
    'html.dark :is(img,picture,video,svg,canvas,iframe,embed,object,[data-noinvert]){filter:invert(1) hue-rotate(180deg)}'+
    ARTCSS+
    '</style><script src="/assets/pick.js?v={{PICKJS}}"><\/script><script src="/assets/frame.js?v={{FRAMEJS}}" data-fid="'+fid+'" data-dict="'+(dictID||"")+
    '" data-speak="'+(speakOn?1:0)+'" data-frag="'+esc(frag||"").replace(/"/g,"&quot;")+'"><\/script></head><body>'+content+
    /* A stylesheet written for a full page sizes html and body from the
       VIEWPORT — LDOCE's ldoce.css opens with `html, body{height:100%}`. Here the
       viewport is a frame we sized from what the frame measured, so every
       measurement it can take is its own last answer handed back, and the article
       grows by its margins on every pass until the parent's 60000px clamp. The
       article is not wrong; it is simply not the document it was written for.
       This goes AFTER the content, not in <head>, because the article's own
       <link> is inside the body and would otherwise win on order at equal
       specificity; `:root, :root > body` outranks an `html body{...!important}`
       too. Nothing else is neutralised — an article may still make body a scroll
       container or paint it; only self-referential SIZING is refused.
       frame.js carries the matching backstop (D72). */
    '<style>:root,:root>body{height:auto!important;min-height:0!important;max-height:none!important}</style>'+
    /* The user's own article stylesheet, last of all: after the backstop, and
       after the dictionary's <link>s, which live in the body. The element is
       always emitted even when empty — frame.js addresses it by id to carry
       every later edit, and an element that sometimes does not exist is a
       branch on both sides of the bridge for no gain. */
    '<style id="wd-user">'+styleSafe(frameCSS())+'</style>'+
    '</body></html>';
}
/* bridge messages from article iframes */
const jsErrSeen=new Set();   // one console line per (dictionary, message) per session
addEventListener("message",e=>{
  const d=e.data||{};
  if(d.t==="h"&&d.fid){
    const f=document.querySelector('iframe[data-fid="'+CSS.escape(d.fid)+'"]');
    // A frame settles on its true height after insertion. In latch mode that
    // is the open section itself, which grows downward from its own top and
    // pushes only what is already below it. Under expand-all a frame above can
    // still move the reading position; there is no latch there and so no
    // section we are entitled to call the focused one (D73/M4).
    if(f)f.style.height=Math.min(Math.max((+d.h||0)+6,48),60000)+"px";
    // A frame that just reported its height has parsed: its marks exist now.
    // Coalesced, because this message arrives once per frame and again on
    // every reflow inside it.
    if(f&&navDet&&navDet.contains(f)){clearTimeout(navTimer);navTimer=setTimeout(navRefresh,200)}
  }else if(d.t==="ref"&&d.w){
    // d.xdict is set when the author pointed at ANOTHER dictionary by name.
    searchFor(d.w,{scope:d.xdict?dictIDByName(d.xdict):d.dict,frag:d.frag});
  }else if(d.t==="pick"&&d.w){
    lookupSelection(d.w);                      // user's selection: tidied, global
  }else if(d.t==="open"&&d.url){
    /* An external link from a sandboxed article. The frame cannot open it
       itself without inheriting its own sandbox into the new tab (no
       allow-forms, so the destination's own search would be dead), and it must
       not navigate itself — that replaces the article with a website.
       The scheme test is NOT decoration. Opening a URL from here runs it in
       the TOP page's context, so a `javascript:` URL posted by a dictionary's
       own script would execute with our origin and our access to the article
       cache and the prefs API. An article can already open popups (the sandbox
       grants allow-popups), so nothing here widens what a dictionary can do —
       but this message must never become the one way it gains more.
       /res/ is admitted alongside http(s) because a DSL attachment — a PDF, a
       video container no browser plays — is served from OUR origin, and the
       article cannot usefully display it in place. It is a path-absolute
       reference with a fixed first segment, so it can only ever name this
       app's resource route: no scheme to smuggle, and "//host" cannot match. */
    if(/^https?:\/\//i.test(d.url)||/^\/res\//.test(d.url))

  }else if(d.t==="key"&&typeof d.k==="string"){
    /* A keystroke that landed inside a sandboxed article (see frame.js). Once
       the user clicks into an article — to select a word, to follow a link —
       every key is delivered to THAT document and this page's shortcuts are
       dead, "/" included; there is no keyboard route back to the search box.
       The event itself cannot cross the boundary, so the character travels as
       data and is inserted here. This is the one place in this file that
       synthesizes input, which is why the `input` event has to be dispatched
       by hand for the debounced search to see it. */
    /* The two arrows are not typing: they walk the matches, the same as the
       chevrons and F3. They come through this channel because a click into an
       article moves focus into another document, where the app's own keydown
       listener can no longer hear anything. */
    if(d.k==="ArrowRight"||d.k==="ArrowLeft"){
      if(navWalkable())navGo(d.k==="ArrowRight"?1:-1);
      return;
    }
    if(d.k==="full"){fullKey();return} // Ctrl+* pressed inside a frame

    const qi=$("q");
    if(qi.disabled)return;
    if(d.k==="/"){qi.focus();qi.select();return}
    if(d.k.length!==1)return;
    qi.focus();
    qi.value+=d.k;
    qi.dispatchEvent(new Event("input",{bubbles:true}));
  }else if(d.t==="jserr"&&d.fid){
    /* A dictionary's own script threw. That is not fatal to us and must not
       interrupt reading - but a dead article and a working one look identical,
       and "clicking does nothing" is otherwise the entire diagnostic surface.
       Say it once, where the dictionary is named, and mark its row. */
    const key=(d.dict||"")+"\n"+(d.msg||"");
    if(!jsErrSeen.has(key)){
      jsErrSeen.add(key);
      console.warn(`wudict: ${dictName(d.dict)} script error: ${d.msg}`+
        (d.src?` (${d.src}:${d.line}:${d.col})`:""));
    }
    const f=document.querySelector('iframe[data-fid="'+CSS.escape(d.fid)+'"]');
    const sum=f&&f.closest("details.dict")?.querySelector(":scope>summary");
    if(sum&&!sum.querySelector(".jserr")){
      const s=document.createElement("span");
      s.className="jserr";s.textContent="\u26a0";
      s.title="This dictionary's own script failed: "+(d.msg||"script error");
      sum.appendChild(s);
    }
  }else if(d.t==="sel"&&d.fid){
    // A selection inside a sandboxed article (frame.js): read aloud (D148).
    if(!speakOn)return;
    const f=document.querySelector('iframe[data-fid="'+CSS.escape(d.fid)+'"]');
    if(!f||e.source!==f.contentWindow)return;
    const go=()=>window.wuSpeak.frame(f,String(d.s||""),d.r,d.p);
    if(window.wuSpeak)go();
    else if(d.s&&speakCan())speakWake().then(go,err=>console.warn("wudict:",err.message));
  }else if(d.t==="anchor"&&d.fid){
    // an in-article jump inside a sandboxed iframe. The iframe is sized to its
    // content and never scrolls itself, so the position it reports is relative
    // to its own top and the PAGE is what has to move.
    const f=document.querySelector('iframe[data-fid="'+CSS.escape(d.fid)+'"]');
    if(f)revealAt(f.getBoundingClientRect().top+(+d.y||0),f.closest("details.dict"));
  }
});

/* status with fade + minimum display time: new messages replace the
   current one immediately, but clearing waits until the message has been
   readable for STATUS_MIN ms */
const STATUS_MIN=1200;
let statusTs=0,statusTimer=null,statusPending,statusOwner=null;
/* `owner` lets a long-running writer retract its own message without
   clobbering whatever spoke after it, so a stale warning cannot sit there
   unretracted. */
function setStatus(html,owner){
  statusPending=html;
  statusOwner=html?(owner??""):null;
  clearTimeout(statusTimer);
  const el=$("status");
  const apply=()=>{
    // the text goes in the inner .txt; .show drives the row from 0fr to 1fr
    if(statusPending){$("statusMsg").innerHTML=statusPending;el.classList.add("show");statusTs=Date.now()}
    else{el.classList.remove("show");statusTs=0}
  };
  // every displayed message stays readable for STATUS_MIN; bursts of
  // updates coalesce to the latest one
  const left=STATUS_MIN-(Date.now()-statusTs);
  if(el.classList.contains("show")&&left>0){statusTimer=setTimeout(apply,left);return}
  apply();
}
function clearStatus(owner){if(statusOwner===owner)setStatus("")}

/* Search progress: the field's own leading glyph, not a line of text.
   Most searches settle in 200–600ms, and a spinner shown at t=0 for 180ms is
   a FLASH — perceptually worse than no indicator, because it reads as a
   glitch rather than as work. BUSY_DELAY (φ⁻³ s, one rung of --t-*) holds it
   back until a search is slow enough to be worth explaining.

   There is deliberately NO minimum-display timer. The 382ms opacity
   transition already is one: a spinner cancelled part-way through its fade-in
   reverses from wherever it reached, so it can never strobe — it can only
   leave a ghost. Guaranteeing that in CSS rather than in a timer removes any
   "wait for it to disappear" contract; the indicator is free to
   go the instant the results are there, because it never arrived hard enough
   to owe the user a departure. */
const BUSY_DELAY=236;
let busyTimer=null,busyWanted=false;
function setBusy(on){
  busyWanted=on;
  clearTimeout(busyTimer);
  const box=$("qbox");
  if(!on){box.classList.remove("busy");return}
  if(box.classList.contains("busy"))return; // already spinning: leave it alone
  busyTimer=setTimeout(()=>{if(busyWanted)box.classList.add("busy")},BUSY_DELAY);
}

/* read a newline-delimited JSON response, invoking onMsg per record as it
   arrives — this is what lets each dictionary render the instant it is
   ready instead of waiting for the whole fan-out (progressive results).
   `etag` makes it a revalidation: false back means 304, the answer the caller
   already holds still stands. A conditional header set by the page turns the
   browser's own cache off for the request (Fetch), so the 304 reaches us. */
async function fetchStream(url,onMsg,signal,etag){
  const init={};
  if(signal)init.signal=signal;
  if(etag){init.headers={"If-None-Match":etag};init.cache="no-store"}
  const resp=await fetch(url,init);
  if(etag&&resp.status===304)return false;
  if(!resp.ok){let e;try{e=(await resp.json()).error}catch(_){}throw Object.assign(new Error(e||resp.statusText),{status:resp.status})}
  const reader=resp.body.getReader(),dec=new TextDecoder();let buf="";
  for(;;){
    const{value,done}=await reader.read();
    if(done)break;
    buf+=dec.decode(value,{stream:true});
    let nl;
    while((nl=buf.indexOf("\n"))>=0){
      const line=buf.slice(0,nl).trim();buf=buf.slice(nl+1);
      if(line)onMsg(JSON.parse(line));
    }
  }
  buf=buf.trim();if(buf)onMsg(JSON.parse(buf));
  return true;
}
/* The names the search answers carried, for a dictionary the list has not
   delivered yet: a link is answered before the list is in (bootEarly). */
const hitNames=new Map();
function dictName(id){
  const d=dicts.find(x=>x.id===id);
  return d?dictLabel(d):hitNames.get(id)||id;
}
/* Says what was searched and offers the way out, placed under the results

document.addEventListener("click",e=>{

  const dictID=dd?.dataset.dict;
  const href=a.getAttribute("href")||"";
  // one parse, one dispatch — the kind is read, never re-derived
  const ref=parseRef(href);
  if(ref){
    e.preventDefault();
    if(ref.kind==="sub"){toggleSub(a,ref.word,dictID);return}
    if(ref.kind==="lookup"){
      // data-dict is a CROSS-dictionary link ([ref dict="..."]): it resolves to
      // that dictionary, and to an unscoped search when the name is not
      // installed - never back to the dictionary the link was written in.
      const xd=a.dataset?.dict;
      searchFor(ref.word,{scope:xd?dictIDByName(xd):dictID,frag:ref.frag});return}

  }else if(a.classList.contains("wu-file")){

    e.preventDefault();window.open(href,"_blank","noopener,noreferrer");
  }else if(/^https?:\/\//i.test(href)&&dd){

    e.preventDefault();window.open(href,"_blank","noopener,noreferrer");
  }else if(href.startsWith("#")&&dd){

    // In a shadow root, document fragment navigation does not see shadow ids,
    // so the browser would only dirty the page URL with a hash matching
    // nothing. In a srcdoc iframe the document URL is about:srcdoc while the
    // base URL is inherited from this page, so the browser resolves the
    // fragment against the WRONG one and navigates cross-document — frame.js
    // handles it there for that reason (D51).
    e.preventDefault();jumpInArticle(a,dd,decodeRef(href.slice(1)));

   click; nothing touches the search box, the URL or history. */
async function toggleSub(link,word,dictID){
  if(link._sub){link._sub.remove();link._sub=null;return}
  const box=document.createElement("div");
  box.className="wu-sub";box.textContent="…";
  link.parentNode.insertBefore(box,link.nextSibling);
  link._sub=box;
  try{
    const r=await fetch("/api/search?mode=exact&n=1&dict="+encodeURIComponent(dictID||"")+
      "&q="+encodeURIComponent(word));
    let html=null;
    for(const line of (await r.text()).split("\n")){
      if(!line.trim())continue;
      let m;try{m=JSON.parse(line)}catch(_){continue}
      if(m.t==="hit"&&m.results?.length)html=m.results[0].Body;
    }
    if(html===null){box.textContent="(not in this dictionary)";return}
    box.innerHTML=`<span class="wu-sub-close" title="Close">✕</span>`+html.replace(/<link\b[^>]*>/gi,"");

    fullInit(link.getRootNode().host?.closest("details.dict")); // it may bring a zone the section lacked
  }catch(_){box.textContent="(could not load)"}
}

document.addEventListener("dblclick",e=>{

  const root=path.find(el=>el instanceof ShadowRoot);
  let sel="";
  try{sel=(root&&root.getSelection?root.getSelection():document.getSelection()).toString().trim()}catch(_){ }
