<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gonow-dict</title>
<script src="/assets/mark.min.js"></script>
<style>
/* ── design tokens ─────────────────────────────────────────────────── */
:root{
  --fi:1.618;                     /* φ */
  --sp-1:.382em; --sp-2:.618em; --sp-3:1em; --sp-4:1.618em; --sp-5:2.618em;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --bg:#fbfaf8; --bg-card:#ffffff; --bg-bar:rgba(251,250,248,.92);
  --fg:#2b2a28; --fg-soft:#6d6a64; --fg-faint:#a5a19a;
  --accent:#e08600; --accent-soft:#fff3e0;
  --link:#5b7a99; --link-hover:#3f5e7d;
  --line:#e8e4dd; --line-soft:#f1eee8;
  --hl:#fff0b3; --hl-fg:#5c4a00;
  --focus:#7aa7d1;
  --shadow:0 1px 3px rgba(60,50,30,.07),0 4px 14px rgba(60,50,30,.05);
}
html[data-theme="dark"]{
  --bg:#191a1c; --bg-card:#212327; --bg-bar:rgba(25,26,28,.92);
  --fg:#d8d5d0; --fg-soft:#96938d; --fg-faint:#5f5c57;
  --accent:#e69a33; --accent-soft:#3a2d18;
  --link:#8fb0cc; --link-hover:#b3cde3;
  --line:#33363b; --line-soft:#2a2c30;
  --hl:#4a3f10; --hl-fg:#ffe38a;
  --focus:#5b86ad;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
@media (prefers-color-scheme: dark){
  html:not([data-theme]){
    --bg:#191a1c; --bg-card:#212327; --bg-bar:rgba(25,26,28,.92);
    --fg:#d8d5d0; --fg-soft:#96938d; --fg-faint:#5f5c57;
    --accent:#e69a33; --accent-soft:#3a2d18;
    --link:#8fb0cc; --link-hover:#b3cde3;
    --line:#33363b; --line-soft:#2a2c30;
    --hl:#4a3f10; --hl-fg:#ffe38a;
    --focus:#5b86ad;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
}

/* ── chrome ────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;padding-top:4.236em;background:var(--bg);color:var(--fg);
  font-family:var(--font);line-height:var(--fi)}
.container{margin:0 auto;width:90%;max-width:680px;padding:0 var(--sp-2) var(--sp-5)}

.bar{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--bg-bar);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:var(--sp-1) var(--sp-2);
  transition:transform .28s ease}
.bar.hidden{transform:translateY(-100%)}
.bar form{display:flex;align-items:center;gap:var(--sp-1);flex-wrap:wrap;
  justify-content:center;max-width:680px;margin:0 auto}
.brand{font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.02em;
  margin-right:var(--sp-1);user-select:none;white-space:nowrap}
.brand small{color:var(--fg-faint);font-weight:400}
input[type=search]{flex:1;min-width:130px;max-width:300px;font-size:16px;
  color:var(--fg);background:var(--bg-card);border:1px solid var(--line);
  border-radius:8px;padding:.35em .7em;outline:none;appearance:none}
input[type=search]:focus{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
select{font-size:13px;color:var(--fg-soft);background:var(--bg-card);
  border:1px solid var(--line);border-radius:8px;padding:.3em .4em;max-width:180px}
.btn{font-size:15px;background:var(--bg-card);color:var(--fg-soft);
  border:1px solid var(--line);border-radius:8px;padding:.3em .55em;cursor:pointer;line-height:1.2}
.btn:hover{color:var(--fg);border-color:var(--fg-faint)}
.btn:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

/* ── results ───────────────────────────────────────────────────────── */
#status{color:var(--fg-soft);font-size:13px;padding:var(--sp-2) 0;min-height:1.4em}
#status .spin{display:inline-block;width:1em;height:1em;border:2px solid var(--line);
  border-top-color:var(--accent);border-radius:50%;vertical-align:-.15em;
  animation:spin .7s linear infinite;margin-right:.4em}
@keyframes spin{to{transform:rotate(360deg)}}
details.dict{margin-top:var(--sp-2);background:var(--bg-card);border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
details.dict>summary{cursor:pointer;padding:var(--sp-1) var(--sp-2);font-weight:600;
  color:var(--fg-soft);list-style:none;display:flex;align-items:center;gap:var(--sp-1)}
details.dict>summary::-webkit-details-marker{display:none}
details.dict>summary::before{content:"›";color:var(--fg-faint);
  transition:transform .18s ease;font-weight:400}
details.dict[open]>summary::before{transform:rotate(90deg)}
details.dict[open]>summary{border-bottom:1px solid var(--line-soft)}
summary .count{margin-left:auto;font-weight:400;color:var(--fg-faint);font-size:12px}
summary .upgrade{font-weight:400;font-size:12px;color:var(--link);cursor:pointer;
  text-decoration:underline;text-underline-offset:2px;margin-left:auto}
dl{margin:0;padding:var(--sp-1) var(--sp-2) var(--sp-2)}
dt{font-size:1.272em;font-weight:700;color:var(--accent);word-break:break-word;
  margin-top:var(--sp-2)}
dt:first-child{margin-top:var(--sp-1)}
dd{margin:var(--sp-1) 0 0 0}

/* article sandbox host: dictionary CSS lives inside the shadow root and
   cannot touch the chrome; in dark mode the whole article is inverted
   Dark-Reader style (media flipped back inside the shadow root) */
.article{display:block;border-radius:8px;overflow-x:auto;background:#fff;color:#1a1a1a;
  padding:var(--sp-1) var(--sp-2)}
html[data-theme="dark"] .article,
html:not([data-theme]) .article.autodark{
  filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.92)}

.empty{padding-top:var(--sp-5);text-align:center;color:var(--fg-faint)}
.empty svg path{fill:var(--line)}

/* ── dictionaries panel ────────────────────────────────────────────── */
#panel{position:fixed;inset:0;z-index:200;display:none;background:color-mix(in srgb,var(--fg) 24%,transparent)}
#panel.show{display:block}
.panel-card{position:absolute;top:0;right:0;bottom:0;width:min(420px,92vw);
  background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow);
  padding:var(--sp-3);overflow-y:auto}
.panel-card h2{margin:0 0 var(--sp-2);font-size:16px;color:var(--fg);
  display:flex;align-items:center}
.panel-card h2 .btn{margin-left:auto}
.pd{border:1px solid var(--line);border-radius:8px;background:var(--bg-card);
  padding:var(--sp-1) var(--sp-2);margin-bottom:var(--sp-1);font-size:13px}
.pd b{display:block;color:var(--fg);font-size:14px;word-break:break-word}
.pd .meta{color:var(--fg-faint);font-size:11.5px;margin:.15em 0 .3em}
.pd .tag{display:inline-block;border:1px solid var(--line);border-radius:5px;
  padding:0 .4em;font-size:10.5px;color:var(--fg-soft);margin-right:.25em}
.pd .tag.on{color:var(--accent);border-color:var(--accent)}
.pd .act{color:var(--link);cursor:pointer;text-decoration:underline;
  text-underline-offset:2px;font-size:12px;margin-right:var(--sp-2)}
.pd .path{color:var(--fg-faint);font-size:10.5px;word-break:break-all;cursor:pointer}
.pd .err{color:#c0564f}

/* ── responsive ────────────────────────────────────────────────────── */
@media (max-width:600px){
  body{padding-top:5.6em}
  .container{width:auto;padding:0 var(--sp-2) var(--sp-4)}
  .brand{display:none}
  input[type=search]{font-size:16px;min-width:100px}
  select{max-width:130px}
}
</style>
</head>
<body>
<header class="bar" id="bar">
<form id="frm" role="search">
<span class="brand">gonow<small>·dict</small></span>
<input type="search" id="q" placeholder="Search…" autocomplete="off" autofocus aria-label="Search term">
<select id="mode" aria-label="Search mode">
<option value="prefix">prefix</option>
<option value="exact">exact</option>
<option value="fuzzy">fuzzy</option>
<option value="fts">full-text</option>
</select>
<select id="dict" aria-label="Dictionary"><option value="all">All dictionaries</option></select>
<button type="submit" class="btn" title="Search" aria-label="Search">🔍</button>
<button type="button" class="btn" id="themeBtn" title="Theme" aria-label="Toggle theme">◐</button>
<button type="button" class="btn" id="panelBtn" title="Dictionaries" aria-label="Manage dictionaries">☰</button>
</form>
</header>

<main class="container">
<div id="status" role="status" aria-live="polite"></div>
<div id="out"></div>
</main>

<div id="panel" role="dialog" aria-label="Dictionaries">
<div class="panel-card">
<h2>Dictionaries <button class="btn" id="rescanBtn" title="Rescan folder">⟳ rescan</button>
<button class="btn" id="closePanel" aria-label="Close">✕</button></h2>
<div id="panelList"></div>
</div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
let dicts=[],lastQuery=null,searchSeq=0;

/* ── theme: auto → light → dark, persisted ─────────────────────────── */
const THEMES=["auto","light","dark"];
function applyTheme(t){
  if(t==="auto")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
  $("themeBtn").textContent=t==="auto"?"◐":(t==="light"?"☀":"☾");
  $("themeBtn").title="Theme: "+t;
  syncAutoDark();
}
function themeIsDark(){
  const t=localStorage.getItem("gonow_theme")||"auto";
  if(t==="dark")return true;
  if(t==="light")return false;
  return matchMedia("(prefers-color-scheme: dark)").matches;
}
/* hosts get .autodark so the invert rule also applies in auto mode */
function syncAutoDark(){
  const dark=themeIsDark();
  document.querySelectorAll(".article").forEach(el=>{
    el.classList.toggle("autodark",dark&&!document.documentElement.hasAttribute("data-theme"));
    if(el.shadowRoot)el.shadowRoot.host.toggleAttribute("data-dark",dark);
  });
}
$("themeBtn").onclick=()=>{
  const cur=localStorage.getItem("gonow_theme")||"auto";
  const next=THEMES[(THEMES.indexOf(cur)+1)%THEMES.length];
  localStorage.setItem("gonow_theme",next);applyTheme(next);
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",syncAutoDark);
applyTheme(localStorage.getItem("gonow_theme")||"auto");

/* ── dictionaries ──────────────────────────────────────────────────── */
async function loadDicts(rescan){
  dicts=await (await fetch(rescan?"/api/rescan":"/api/dicts")).json();
  const sel=$("dict"),prev=sel.value||localStorage.getItem("gonow_dict")||"all";
  sel.innerHTML='<option value="all">All dictionaries</option>';
  for(const d of dicts){
    const o=document.createElement("option");
    o.value=d.id;o.textContent=d.name||d.path.split("/").pop();
    sel.appendChild(o);
  }
  if([...sel.options].some(o=>o.value===prev))sel.value=prev;
  renderPanel();
}
$("dict").onchange=e=>{localStorage.setItem("gonow_dict",e.target.value);if($("q").value.trim())doSearch()};

function renderPanel(){
  const el=$("panelList");el.innerHTML="";
  for(const d of dicts){
    const div=document.createElement("div");div.className="pd";div.dataset.id=d.id;
    let caps="";
    for(const[k,on]of[["exact",d.caps?.Exact],["prefix",d.caps?.Prefix],["fuzzy",d.caps?.Fuzzy],["full-text",d.caps?.FTS]])
      caps+=`<span class="tag${on?" on":""}">${k}</span>`;
    let acts="";
    if(d.error){acts=`<span class="err">${esc(d.error)}</span>`}
    else if(!d.caps?.FTS)acts=`<span class="act" data-act="ingest">Enable fuzzy &amp; full-text search</span>`+
      `<span class="act" data-act="ingest-full">…and pack media</span>`;
    else acts=`<span class="act" data-act="ingest-full">Pack media into .media.db</span>`;
    div.innerHTML=`<b>${esc(d.name||d.path.split("/").pop())}</b>
      <div class="meta">${esc(d.format||"?")} · ${d.entries?d.entries.toLocaleString()+" entries":""}</div>
      <div>${caps}</div><div class="acts">${acts}</div>
      ${d.dbPath?`<div class="path" title="Click to copy">db: ${esc(d.dbPath)}</div>`:""}`;
    el.appendChild(div);
  }
}
$("panelBtn").onclick=()=>$("panel").classList.add("show");
$("closePanel").onclick=()=>$("panel").classList.remove("show");
$("panel").onclick=e=>{if(e.target.id==="panel")$("panel").classList.remove("show")};
$("rescanBtn").onclick=()=>loadDicts(true);
$("panelList").addEventListener("click",e=>{
  const path=e.target.closest(".path");
  if(path){navigator.clipboard?.writeText(path.textContent.replace(/^db: /,""));path.style.color="var(--accent)";return}
  const act=e.target.closest(".act");if(!act)return;
  runIngest(act.closest(".pd").dataset.id,act.dataset.act==="ingest-full",act);
});
function runIngest(id,full,label){
  label.textContent="preparing…";label.classList.remove("act");
  const es=new EventSource("/api/ingest?dict="+id+(full?"&full=1":""));
  es.addEventListener("progress",ev=>{
    const p=JSON.parse(ev.data);
    label.textContent="preparing… "+p.done.toLocaleString()+(p.total?"/"+p.total.toLocaleString():"");
  });
  es.addEventListener("done",async()=>{es.close();await loadDicts();if(lastQuery)doSearch()});
  es.addEventListener("error",ev=>{es.close();label.textContent="failed";label.classList.add("err")});
}

/* ── search ────────────────────────────────────────────────────────── */
const noResultsSVG=`<svg width="90" height="90" viewBox="0 0 1000 1000" aria-hidden="true"><path d="M979.7,929.8L782.3,732.4c-1.3-1.3-2.9-1.8-4.2-2.8c65-76.2,104.4-174.8,104.4-282.8c0-240.9-195.3-436.3-436.3-436.3S10,205.9,10,446.8c0,38.5,5.5,75.6,14.8,111.1C36.1,540.7,65.4,500,83,492.4c-1.9-15-3.1-30.1-3.1-45.6c0-202.4,164.1-366.5,366.5-366.5c202.4,0,366.5,164.1,366.5,366.5c0,159-101.5,294.1-243.1,344.8c-6.7,28.7-17.6,56.1-32.5,81.6c72.6-15.5,138.6-48.8,193-95.5c1,1.3,1.6,2.9,2.8,4.2l197.4,197.3c13.6,13.7,35.7,13.7,49.3,0C993.4,965.6,993.4,943.5,979.7,929.8L979.7,929.8z"/></svg>`;

function resURL(dictID,ref){
  ref=ref.replace(/^sound:\/\//i,"").replace(/^file:\/\//i,"").replace(/^\.?\//,"");
  return "/res/"+dictID+"/"+ref;
}
/* rewrite relative / sound:// / server-absolute refs to /res/{dict}/… */
function fixRes(html,dictID){
  return html
    .replace(/(src|href|data|poster)=("|')(?:sound:\/\/|file:\/\/)([^"']+)\2/gi,
      (m,a,q,ref)=>a+"="+q+resURL(dictID,ref)+q)
    .replace(/(src|href|data|poster)=("|')\/(?!\/)([^"']+)\2/g,
      (m,a,q,ref)=>a+"="+q+resURL(dictID,ref)+q)
    .replace(/(src|href|data|poster)=("|')(?![a-zA-Z][\w+.-]*:|\/|#|\?)([^"']+)\2/g,
      (m,a,q,ref)=>a+"="+q+resURL(dictID,ref)+q);
}

/* shadow-root base style: sane defaults inside the sandbox; media flip
   back when the host carries data-dark (Dark-Reader approach) */
const shadowBase=`<style>
:host{all:initial;display:block;font-family:${"-apple-system,Helvetica,Arial,sans-serif"};
  font-size:15px;line-height:1.618;color:#1a1a1a;word-break:break-word}
img,video,svg{max-width:100%;height:auto}
a{color:#5b7a99;cursor:pointer}
table{max-width:100%;border-collapse:collapse}
mark{background:#fff0b3;color:#5c4a00;border-radius:2px;padding:0 .1em}
:host([data-dark]) :is(img,picture,video,svg,canvas,iframe,embed,object,[data-noinvert]){
  filter:invert(1) hue-rotate(180deg)}
</style>`;

function renderArticle(dd,body,dictID){
  // <dd> cannot host a shadow root; use an inner <div> as the sandbox
  const host=document.createElement("div");
  host.className="article";host.dataset.dict=dictID;
  const root=host.attachShadow({mode:"open"});
  root.innerHTML=shadowBase+fixRes(body,dictID);
  if(themeIsDark()){
    host.toggleAttribute("data-dark",true);
    if(!document.documentElement.hasAttribute("data-theme"))host.classList.add("autodark");
  }
  dd.appendChild(host);
  return root;
}

function setStatus(html){$("status").innerHTML=html}

async function doSearch(ev){
  if(ev)ev.preventDefault();
  const q=$("q").value.trim();
  if(!q)return;
  const mode=$("mode").value,dictSel=$("dict").value,seq=++searchSeq;
  lastQuery=q;
  setStatus('<span class="spin"></span>Searching…');
  let hits;
  try{
    const resp=await fetch("/api/search?q="+encodeURIComponent(q)+"&mode="+mode+"&dict="+dictSel+"&n=20");
    hits=await resp.json();
    if(!resp.ok)throw new Error(hits.error||resp.statusText);
  }catch(err){
    if(seq===searchSeq)setStatus("⚠ "+esc(err.message));
    return;
  }
  if(seq!==searchSeq)return; // a newer search superseded this one
  setStatus("");
  const out=$("out");out.innerHTML="";
  let first=true,shadowRoots=[];
  for(const h of hits){
    if(h.error){
      out.insertAdjacentHTML("beforeend",
        `<details class="dict"><summary>${esc(h.name||h.dict)}<span class="count">⚠ ${esc(h.error)}</span></summary></details>`);
      continue;
    }
    if(h.skipped){
      if(mode==="fuzzy"||mode==="fts"){
        const det=document.createElement("details");det.className="dict";
        det.innerHTML=`<summary>${esc(h.name)}<span class="upgrade" data-id="${h.dict}">enable fuzzy &amp; full-text search</span></summary>`;
        out.appendChild(det);
      }
      continue;
    }
    if(!h.results?.length)continue;
    const det=document.createElement("details");det.className="dict";
    if(first){det.open=true;first=false}
    det.innerHTML=`<summary>${esc(h.name)}<span class="count">${h.results.length} result${h.results.length===1?"":"s"}</span></summary>`;
    const dl=document.createElement("dl");
    for(const r of h.results){
      const dt=document.createElement("dt");dt.textContent=r.Headword;
      const dd=document.createElement("dd");dd.dataset.dict=h.dict;
      shadowRoots.push(renderArticle(dd,r.Body,h.dict));
      dl.appendChild(dt);dl.appendChild(dd);
    }
    det.appendChild(dl);out.appendChild(det);
  }
  if(!out.children.length){
    out.innerHTML=`<div class="empty">${noResultsSVG}<p>No results for “${esc(q)}”</p></div>`;
    return;
  }
  if((mode==="fuzzy"||mode==="fts")&&window.Mark){
    const rx=new RegExp(q.trim().split(/\s+/).map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"),"gi");
    for(const root of shadowRoots){
      try{new Mark(root).markRegExp(rx)}catch(e){}
    }
  }
}
$("frm").addEventListener("submit",doSearch);

/* live search: debounce while typing */
let debounce=null;
$("q").addEventListener("input",()=>{
  clearTimeout(debounce);
  const v=$("q").value.trim();
  if(v.length<2)return;
  debounce=setTimeout(doSearch,300);
});

/* keyboard: "/" focuses search */
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==$("q")){e.preventDefault();$("q").focus();$("q").select()}
  if(e.key==="Escape")$("panel").classList.remove("show");
});

/* clicks inside shadow roots arrive via composedPath */
function lookupWord(w){
  $("q").value=w.trim().split(/[;.,:{}()\[\]\s]/)[0].replace(/\d+$/,"");
  if($("mode").value==="fts")$("mode").value="prefix";
  doSearch();
}
document.addEventListener("click",e=>{
  const path=e.composedPath();
  const a=path.find(el=>el.tagName==="A");
  if(!a)return;
  const dd=path.find(el=>el.classList?.contains("article"));
  const dictID=dd?.dataset.dict;
  const href=a.getAttribute("href")||"";
  if(/^(bword|entry):\/\//i.test(href)||/^[dx]:/i.test(href)){
    e.preventDefault();lookupWord(decodeURIComponent(href.replace(/^(bword|entry):\/\//i,"").replace(/^[dx]:/i,"")));
  }else if(/\.(mp3|ogg|wav|spx|m4a)(\?|#|$)/i.test(href)){
    e.preventDefault();new Audio(href.startsWith("/res/")||/^https?:/i.test(href)?href:resURL(dictID,href)).play();
  }else if(a.querySelector("img")&&href.startsWith("/res/")){
    e.preventDefault();new Audio(href).play();
  }else if(href&&!/^([a-z][\w+.-]*:|\/|#)/i.test(href)){
    e.preventDefault();lookupWord(decodeURIComponent(href)); // bare-word link (slob)
  }
});
document.addEventListener("dblclick",e=>{
  const path=e.composedPath();
  if(!path.some(el=>el.classList?.contains("article")))return;
  const root=path.find(el=>el instanceof ShadowRoot);
  let sel="";
  try{sel=(root&&root.getSelection?root.getSelection():document.getSelection()).toString().trim()}catch(_){ }
  if(sel)lookupWord(sel);
});

/* audio inside <object type="audio/…"> (DSL) → click to play */
document.addEventListener("click",e=>{
  const o=e.composedPath().find(el=>el.tagName==="OBJECT"&&/^audio\//.test(el.getAttribute("type")||""));
  if(o){e.preventDefault();new Audio(o.getAttribute("data")).play()}
});

/* auto-hide bar on scroll down */
let prevScroll=window.pageYOffset;
addEventListener("scroll",()=>{
  const cur=window.pageYOffset;
  $("bar").classList.toggle("hidden",cur>80&&cur>prevScroll);
  prevScroll=cur;
});

/* shareable links: ?q=…&mode=…&dict=… (kept in sync on search) */
function applyURL(){
  const p=new URLSearchParams(location.search);
  if(p.get("theme")){localStorage.setItem("gonow_theme",p.get("theme"));applyTheme(p.get("theme"))}
  if(p.get("mode"))$("mode").value=p.get("mode");
  if(p.get("dict"))$("dict").value=p.get("dict");
  if(p.get("q")){$("q").value=p.get("q");doSearch()}
}
const _doSearch=doSearch;
doSearch=function(ev){
  const r=_doSearch(ev);
  const q=$("q").value.trim();
  if(q){
    const p=new URLSearchParams({q,mode:$("mode").value,dict:$("dict").value});
    history.replaceState(null,"","?"+p.toString());
  }
  return r;
};
$("frm").removeEventListener("submit",_doSearch);
$("frm").addEventListener("submit",e=>doSearch(e));

loadDicts().then(applyURL);
</script>
