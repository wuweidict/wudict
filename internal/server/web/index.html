/* ── removing a dictionary (D63) ─────────────────────────────────────────
   Two clicks, no modal: the card turns into its own confirmation, so the
   dictionary being deleted is the one the user is looking at and nothing is
   named twice. Each choice states what it deletes and what that costs — no
   "are you sure?", which asks the user to re-read a question they already
   answered rather than telling them anything.

   Delete-everything is the default because preparation is automatic: deleting
   only the index of a dictionary whose file is still in a scanned folder
   frees the space until the next search rebuilds it. "Index only" is offered
   anyway (it is the honest way to reclaim a full-text index), and it says so
   afterwards, from the server's own report.

   Vocabulary: these are "the dictionary files", never "the originals". On the
   Play flavour the file this deletes is itself a COPY the importer made, and
   the import dialog uses "originals" for the user's own files on shared
   storage — one word for two different files, in one app, is the confusion
   that made the import's keep/delete question unanswerable. */
function askRemoval(pd){
  const d=dicts.find(x=>x.id===pd.dataset.id);if(!d)return;
  const acts=pd.querySelector(".acts");if(!acts)return;
  const idx=(d.dbSize||0)+(d.mediaSize||0);
  const prepared=idx>0||!!d.mediaDB;
  // "dictionary files only" is a genuine option exactly once: the dictionary is
  // prepared AND its media is packed, so the prepared copy can stand alone.
  // The server enforces this too (D24 §4) — this only avoids offering what
  // would be refused.
  const canDropSource=!!d.source&&prepared&&(!!d.mediaDB||!d.hasMedia);
  let btns=`<span class="rmgo" data-rm="all">delete${d.source?" everything":""}</span>`;
  if(d.source&&prepared)btns+=`<span class="rmgo" data-rm="index">index only${idx?" · "+mb(idx):""}</span>`;
  if(canDropSource)btns+=`<span class="rmgo" data-rm="source">dictionary files only</span>`;
  acts.innerHTML=`<span class="rmq">Delete <b>${esc(dictLabel(d))}</b>`+
    (d.source?` — the prepared index${idx?" ("+mb(idx)+")":""} and the dictionary files`
             :` — this is the only copy, there are no dictionary files to rebuild it from`)+
    `<br>${btns}<span class="rmno">cancel</span></span>`;
}

async function runRemove(id,kind,node){
  node.dataset.busy="1";node.classList.add("busy");
  const d=dicts.find(x=>x.id===id)||{path:""},name=dictLabel(d);
  node.textContent="deleting…";
  setStatus('<span class="spin"></span>'+esc(name)+" — deleting…");
  const q="/api/library?dict="+encodeURIComponent(id)+
    "&prepared="+(kind==="source"?0:1)+"&source="+(kind==="index"?0:1);
  let rep;
  try{
    const r=await fetch(q,{method:"DELETE"});
    rep=await r.json();
    if(!r.ok)throw new Error((rep&&rep.error)||("HTTP "+r.status));
  }catch(err){
    node.classList.remove("busy");delete node.dataset.busy;
    node.textContent="failed";
    setStatus("⚠ "+esc(name)+" — "+esc(err.message||String(err)));
    return;
  }
  setStatus("✓ "+esc(name)+" — deleted, "+mb(rep.freed||0)+" freed"+
    (rep.note?" · "+esc(rep.note):""));
  // The server has already rescanned; this refetches the list it now reports,
  // and redraws the panel (and the folder section's counts) from it.
  await loadDicts();
  if($("folderBody").childNodes.length)loadFolders();

}

function runIngest(id,opts,label){
  if(label.dataset.busy)return Promise.resolve(); // ignore repeat clicks
  label.dataset.busy="1";
  const name=dictLabel(dicts.find(d=>d.id===id)||{path:""});
  const show=t=>{
    label.textContent=t;
    setStatus('<span class="spin"></span>'+(opts.statusPrefix||"")+esc(name)+" — "+esc(t));
  };
  const removing=Object.values(opts).some(v=>v===0);
  show(removing?"removing…":"preparing…");
  label.classList.remove("act");label.classList.add("busy");
  label.style.textDecoration="none";label.style.cursor="default";
  const params=Object.entries(opts)
    .filter(([k])=>k==="contains"||k==="fts"||k==="media")
    .map(([k,v])=>"&"+k+"="+(v?1:0)).join("");
  return new Promise(resolve=>{
    const es=new EventSource("/api/ingest?dict="+id+params);
    es.addEventListener("progress",ev=>{
      const p=JSON.parse(ev.data);
      show("preparing… "+p.done.toLocaleString()+(p.total?"/"+p.total.toLocaleString():""));
    });
    es.addEventListener("done",async()=>{
      es.close();
      setStatus("✓ "+esc(name)+(removing?" — removed":" — ready"));
      if(!opts.quiet){await loadDicts();if(lastQuery)doSearch()}
      resolve(true);
    });
    es.addEventListener("error",()=>{es.close();show("failed");label.classList.add("err");resolve(false)});
  });
}

const noResultsSVG=`<svg width="90" height="90" viewBox="0 0 1000 1000" aria-hidden="true"><path d="M979.7,929.8L782.3,732.4c-1.3-1.3-2.9-1.8-4.2-2.8c65-76.2,104.4-174.8,104.4-282.8c0-240.9-195.3-436.3-436.3-436.3S10,205.9,10,446.8c0,38.5,5.5,75.6,14.8,111.1C36.1,540.7,65.4,500,83,492.4c-1.9-15-3.1-30.1-3.1-45.6c0-202.4,164.1-366.5,366.5-366.5c202.4,0,366.5,164.1,366.5,366.5c0,159-101.5,294.1-243.1,344.8c-6.7,28.7-17.6,56.1-32.5,81.6c72.6-15.5,138.6-48.8,193-95.5c1,1.3,1.6,2.9,2.8,4.2l197.4,197.3c13.6,13.7,35.7,13.7,49.3,0C993.4,965.6,993.4,943.5,979.7,929.8L979.7,929.8z"/></svg>`;

/* Article HTML arrives with resource refs already rewritten to the
   root-absolute /res/{dict}/… form by the server (RewriteEntryHTML,
   unit-tested in Go), so the click handlers below use those hrefs as-is.
   resURL is only the fallback for refs the server-side attribute regex
   cannot see (e.g. unquoted attributes in malformed dictionary HTML); it
   emits the same absolute form, so it never double-prefixes. Absolute
   (not relative) because articles also render inside srcdoc iframes whose
   base URL differs — /res/ resolves to the same origin URL everywhere. */
function resURL(dictID,ref){
  ref=ref.replace(/^sound:\/\//i,"").replace(/^file:\/\//i,"").replace(/^\.?\//,"");
  return "/res/"+dictID+"/"+ref;
}

/* shadow-root base style: sane defaults inside the sandbox; media flip
   back when the host carries data-dark (Dark-Reader approach) */
const shadowBase=`<style>
:host{all:initial;display:block;font-family:${"-apple-system,Helvetica,Arial,sans-serif"};
  font-size:15px;line-height:1.618;color:#1a1a1a;word-break:break-word}
img,video,svg{max-width:100%;height:auto}
a{color:#5b7a99;cursor:pointer}
table{max-width:100%;border-collapse:collapse}
mark{background:#fff0b3;color:#5c4a00;border-radius:2px;padding:0 .1em}
:host([data-dark]) :is(img,picture,video,svg,canvas,iframe,embed,object,[data-noinvert]){
  filter:invert(1) hue-rotate(180deg)}
</style>`;

/* ── @font-face hoisting ─────────────────────────────────────────────────
   A shadow root scopes ordinary rules, which is exactly why articles render
   in one. @font-face is the exception: a font family is matched against the
   DOCUMENT's font set, so a face declared inside a shadow tree is fetched,
   parsed — and then never selectable. AHD5 declares 'Minion New' (base64 TTF
   in ahd5.css) and every IPA glyph fell back to the default serif, which is
   what "Rendered font: Times New Roman" in devtools means.

   There is no scoped form of @font-face in CSS: a face is document-global or
   it does not exist. So we lift the FACES, and only the faces, up to the
   document and leave every other rule scoped where it belongs.

   We read them back out of CSSOM rather than re-parsing the CSS, because the
   browser has already parsed the sheet in order to render the article —
   ahd5.css is 2.9 MB, and parsing it a second time in JS to learn something
   the engine already knows would be pure waste.

   The iframe path needs none of this: an iframe is a real document, so faces
   declared in it work natively. */
const fontSheetsSeen=new Set();   // by absolute href — skip re-walking a linked sheet
const fontFacesSeen=new Set();    // by rule text — two dictionaries may ship one font

/* Families the chrome itself resolves against. @font-face has no scope to
   hide behind, so a dictionary that redefined one of these would restyle the
   whole app around it. Dropping a dictionary's "Arial" costs nothing: the
   system face takes over, which is what it wanted anyway. */

  "helvetica neue","arial","sans-serif","serif","monospace","ui-monospace","menlo","consolas"]);

function faceFamily(rule){
  const f=(rule.style&&rule.style.getPropertyValue("font-family"))||"";
  return f.trim().replace(/^["']|["']$/g,"").toLowerCase();

/* Walks a sheet for @font-face, descending through @import (.styleSheet) and
   the grouping rules — @media, @supports, @layer (.cssRules). Reading
   .cssRules of a cross-origin sheet throws; a dictionary that links a CDN
   font is simply skipped rather than breaking the render. */
function collectFaces(sheet,out){
  let rules=null;
  try{rules=sheet.cssRules}catch(_){return}
  if(!rules)return;
  for(const r of rules){
    if(window.CSSFontFaceRule&&r instanceof CSSFontFaceRule){
      if(uiFamilies.has(faceFamily(r)))continue;
      if(fontFacesSeen.has(r.cssText))continue;
      fontFacesSeen.add(r.cssText);
      out.push(r.cssText);
    }else if(r.styleSheet)collectFaces(r.styleSheet,out);
    else if(r.cssRules)collectFaces(r,out);

function hoistFaces(sheet){
  if(!sheet)return;
  const out=[];
  collectFaces(sheet,out);
  if(!out.length)return;
  if(!fontSink){
    fontSink=document.createElement("style");
    fontSink.id="wudict-fonts";
    document.head.appendChild(fontSink);
  }
  fontSink.appendChild(document.createTextNode(out.join("\n")));
}
/* A <link> in a shadow root loads asynchronously — .sheet is null until it
   has, so hoist on load as well as immediately (a warm sheet is already
   parsed by the time we look). Inline <style> is parsed synchronously and
   walked every render; that walk is strictly cheaper than the innerHTML
   parse we just paid for the same bytes, so it needs no sheet-level cache. */
function hoistShadowFonts(root){
  for(const el of root.querySelectorAll("style,link[rel~='stylesheet' i]")){
    if(!el.href){hoistFaces(el.sheet);continue}
    if(fontSheetsSeen.has(el.href))continue;
    fontSheetsSeen.add(el.href);
    if(el.sheet)hoistFaces(el.sheet);
    else el.addEventListener("load",()=>hoistFaces(el.sheet),{once:true});
  }

function renderArticle(dd,body,dictID,frag){
  // Script-bearing articles (custom tooltips, MathJax, …) need a real
  // document scope: shadow roots neither execute <script> nor let
  // scripts see their content. Render those in a sandboxed iframe.
  if(/<script[\s>]/i.test(body))return renderFrame(dd,body,dictID,frag);
  // <dd> cannot host a shadow root; use an inner <div> as the sandbox
  const host=document.createElement("div");
  host.className="article";host.dataset.dict=dictID;
  const root=host.attachShadow({mode:"open"});
  root.innerHTML=shadowBase+body;
  if(themeIsDark()){
    host.toggleAttribute("data-dark",true);
    if(!document.documentElement.hasAttribute("data-theme"))host.classList.add("autodark");
  }
  dd.appendChild(host);
  // After connecting: a <link> in a disconnected tree does not begin loading.
  hoistShadowFonts(root);
  return root;
}

let frameSeq=0;
function renderFrame(dd,body,dictID,frag){
  const fid="f"+(++frameSeq);
  const ifr=document.createElement("iframe");
  ifr.className="article frame";ifr.dataset.dict=dictID;ifr.dataset.fid=fid;
  ifr.setAttribute("sandbox","allow-scripts allow-same-origin allow-popups");
  ifr.style.height="90px";
  ifr.srcdoc=frameDoc(body,fid,themeIsDark(),dictID,frag);
  dd.appendChild(ifr);
  return null; // no shadow root: mark.js highlighting not applicable

    'html.dark{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.92)}'+

       This goes AFTER the content, not in <head>, because the article's own

       frame.js carries the matching backstop (D72). */
    '<style>:root,:root>body{height:auto!important;min-height:0!important;max-height:none!important}</style>'+

/* bridge messages from article iframes */
const jsErrSeen=new Set();   // one console line per (dictionary, message) per session
addEventListener("message",e=>{
  const d=e.data||{};
  if(d.t==="h"&&d.fid){
    const f=document.querySelector('iframe[data-fid="'+CSS.escape(d.fid)+'"]');
    // A frame settles on its true height after insertion. In latch mode that
    // is the open section itself, which grows downward from its own top and
    // pushes only what is already below it. Under expand-all a frame above can
    // still move the reading position; there is no latch there and so no
    // section we are entitled to call the focused one (D73/M4).
    if(f)f.style.height=Math.min(Math.max((+d.h||0)+6,48),60000)+"px";

  }else if(d.t==="pick"&&d.w){

  }else if(d.t==="open"&&d.url){

       The scheme test is NOT decoration. Opening a URL from here runs it in
       the TOP page's context, so a `javascript:` URL posted by a dictionary's
       own script would execute with our origin and our access to the article
       cache and the prefs API. An article can already open popups (the sandbox
       grants allow-popups), so nothing here widens what a dictionary can do —

       Say it once, where the dictionary is named, and mark its row. */
    const key=(d.dict||"")+"\n"+(d.msg||"");
    if(!jsErrSeen.has(key)){

        (d.src?` (${d.src}:${d.line}:${d.col})`:""));
    }

    }

    // an in-article jump inside a sandboxed iframe. The iframe is sized to its
    // content and never scrolls itself, so the position it reports is relative
    // to its own top and the PAGE is what has to move.
    const f=document.querySelector('iframe[data-fid="'+CSS.escape(d.fid)+'"]');
    if(f)revealAt(f.getBoundingClientRect().top+(+d.y||0),f.closest("details.dict"));
  }
});

/* status with fade + minimum display time: new messages replace the
   current one immediately, but clearing waits until the message has been
   readable for STATUS_MIN ms */
const STATUS_MIN=1200;
let statusTs=0,statusTimer=null,statusPending,statusOwner=null;
/* `owner` lets a long-running writer retract its own message without
   clobbering whatever spoke after it — the dictionary loader used to key that
   on `lastQuery`, which is why a stale warning could sit there unretracted. */
function setStatus(html,owner){
  statusPending=html;
  statusOwner=html?(owner??""):null;
  clearTimeout(statusTimer);
  const el=$("status");
  const apply=()=>{
    // the text goes in the inner .txt; .show drives the row from 0fr to 1fr
    if(statusPending){$("statusMsg").innerHTML=statusPending;el.classList.add("show");statusTs=Date.now()}
    else{el.classList.remove("show");statusTs=0}
  };
  // every displayed message stays readable for STATUS_MIN; bursts of
  // updates coalesce to the latest one
  const left=STATUS_MIN-(Date.now()-statusTs);
  if(el.classList.contains("show")&&left>0){statusTimer=setTimeout(apply,left);return}
  apply();
}
function clearStatus(owner){if(statusOwner===owner)setStatus("")}

/* Search progress: the field's own leading glyph, not a line of text.
   Most searches settle in 200–600ms, and a spinner shown at t=0 for 180ms is
   a FLASH — perceptually worse than no indicator, because it reads as a
   glitch rather than as work. BUSY_DELAY (φ⁻³ s, one rung of --t-*) holds it
   back until a search is slow enough to be worth explaining.

   There is deliberately NO minimum-display timer any more. The 382ms opacity
   transition already is one: a spinner cancelled part-way through its fade-in
   reverses from wherever it reached, so it can never strobe — it can only
   leave a ghost. Guaranteeing that in CSS rather than in a timer is what
   removes the "wait for it to disappear" contract; the indicator is free to
   go the instant the results are there, because it never arrived hard enough
   to owe the user a departure. */
const BUSY_DELAY=236;
let busyTimer=null,busyWanted=false;
function setBusy(on){
  busyWanted=on;
  clearTimeout(busyTimer);
  const box=$("qbox");
  if(!on){box.classList.remove("busy");return}
  if(box.classList.contains("busy"))return; // already spinning: leave it alone
  busyTimer=setTimeout(()=>{if(busyWanted)box.classList.add("busy")},BUSY_DELAY);
}

/* read a newline-delimited JSON response, invoking onMsg per record as it
   arrives — this is what lets each dictionary render the instant it is
   ready instead of waiting for the whole fan-out (progressive results). */
async function fetchStream(url,onMsg,signal){
  const resp=await fetch(url,signal?{signal}:undefined);
  if(!resp.ok){let e;try{e=(await resp.json()).error}catch(_){}throw new Error(e||resp.statusText)}
  const reader=resp.body.getReader(),dec=new TextDecoder();let buf="";
  for(;;){
    const{value,done}=await reader.read();
    if(done)break;
    buf+=dec.decode(value,{stream:true});
    let nl;
    while((nl=buf.indexOf("\n"))>=0){
      const line=buf.slice(0,nl).trim();buf=buf.slice(nl+1);
      if(line)onMsg(JSON.parse(line));
    }
  }
  buf=buf.trim();if(buf)onMsg(JSON.parse(buf));
}
function dictName(id){
  const d=dicts.find(x=>x.id===id);
  return d?dictLabel(d):id;
}
/* Says what was searched and offers the way out, placed under the results
   rather than in the status line: the scope is a property of what is on
   screen, so it should live and die with it instead of fading on a timer. */
function scopeNote(id){
  const div=document.createElement("div");
  div.className="scopenote";
  div.innerHTML=`Followed a link inside <b>${esc(dictName(id))}</b> — only this dictionary was searched. `+
    `<span class="widen">Search all dictionaries</span>`;
  return div;
}
/* Said once, after the automatic widening, so the user learns what the link
   claimed and what actually happened — silently searching everything would
   look identical to the link having been global all along. */
function widenNote(id,q){
  const div=document.createElement("div");
  div.className="scopenote";
  div.innerHTML=`“${esc(q)}” is not in <b>${esc(dictName(id))}</b>, `+
    `where the link came from — all dictionaries were searched instead.`;
  return div;
}
$("out").addEventListener("click",e=>{
  if(!e.target.classList.contains("widen"))return;
  navRecord="push"; // widening is a state worth having a Back button for
  doSearch();       // no scopeOnce set: the search runs at the selector's scope
});
function highlight(roots,mode,q){
  if(!((mode==="contains"||mode==="fts")&&window.Mark))return;
  const rx=new RegExp(q.trim().split(/\s+/).map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"),"gi");
  for(const root of roots){if(root)try{new Mark(root).markRegExp(rx)}catch(e){}}

/* The name to put on a section, preferring what the dictionary list already
   knows. A hit whose open never happened — deferred, or a failed open — carries
   no metadata, so the server falls back to the file name and the section reads
   "Dorland 32th.mdx" while its neighbours read properly. /api/dicts already has
   the real name from a cheap header probe; nothing has to be opened to use it. */
function hitName(h){
  const d=dicts.find(x=>x.id===h.dict);
  return (d&&dictLabel(d))||h.name||h.dict;
}
/* Whether this device is touched or pointed at, which is the difference
   between "tap" and "click" and nothing else. Read once: it does not change
   under a running page in any way worth re-rendering for. */
const TAPS=matchMedia("(pointer:coarse)").matches;

/* A deferred dictionary (server: streamMsg.Deferred) was not searched because
   this query was already carrying as much newly-opened dictionary as its
   memory budget allows — a phone-only default, and only ever while the
   dictionary is still unprepared. It is NOT an error and must not look like
   one: nothing is broken, nothing is misconfigured, and there is exactly one
   thing to do about it, which is to open the section. That opening re-queries
   this dictionary alone, which the server does not cap, and which also puts it
   in line to be prepared — so the same tap answers the question now and stops
   it being asked again. */
function loadDeferred(det,box,h,mode,q){
  if(det.dataset.loading)return;
  det.dataset.loading="1";
  const cnt=det.querySelector(".count");
  if(cnt)cnt.innerHTML='<span class="spin"></span>searching…';
  let shown=false;
  fetchStream("/api/search?q="+encodeURIComponent(q)+"&mode="+mode+"&dict="+encodeURIComponent(h.dict)+"&n=25",msg=>{
    // The user has moved on: a new search replaced every box, so this one is
    // detached and writing into it would paint nothing at a cost.
    if(msg.t!=="hit"||!box.isConnected)return;
    shown=renderSlot(box,msg,mode,q,25).shown;
    const nd=box.querySelector("details.dict");
    if(nd)nd.open=true; // it was open when they asked; it stays open
  },searchAC&&searchAC.signal).then(()=>{
    if(shown||!box.isConnected)return;
    // Answered, and the answer is "not in this one". Saying so is the whole
    // point — a section that vanished under the finger it was tapped with
    // would read as a bug.
    box.innerHTML=`<details class="dict" open><summary>${esc(hitName(h))}`+
      `<span class="count">no results</span></summary></details>`;
  }).catch(err=>{
    if(!box.isConnected)return; // superseded and already off screen
    // Re-arm either way: the section stays tappable and a second try is one
    // more tap. An abort is not a failure — the search that owned this card was
    // replaced — so it restores the offer rather than accusing the dictionary.
    delete det.dataset.loading;
    det.open=false;
    if(!cnt)return;
    const aborted=err.name==="AbortError";
    cnt.classList.toggle("hint",aborted); // an error is not an offer: drop the link colour

/* render one dictionary's results into its ordered slot box; returns
   {shown,results}. shown = something visible (results/error/upgrade);
   results = actual entries (drives auto-open + empty-state). */
/* ── Arrivals never land above what the user is reading (D73) ───────────
   The slots are already in the user's dictionary order before any result
   exists — the server sends the list on `begin` and every hit carries its
   index — so nothing here ever REORDERS by rank. What used to move was the
   open section and the reading position, which is a different problem wearing
   the same clothes.

   `openedIdx` is the latch. It lives at module scope, not inside doSearch,
   because a click on a summary has to be able to take it: -1 is "the user
   decided", and no arrival may argue. It is re-armed to null on `begin`.

   `promote` is the whole shift fix, and it is a layout decision rather than a
   scroll correction. When a dictionary takes the open slot, every slot above
   it that is STILL EMPTY moves below it. Empty boxes have no content and no
   height, so this is provably zero visual change — not smoothed, not animated,
   zero, at any scroll offset and in every browser — and from that instant no
   later arrival can insert above the section being read. The pile-up cannot
   happen because there is nowhere above to pile.

   The winner is by definition the first slot to render, so at the moment of
   promotion it is already what the eye sees at the top; this only makes the
   DOM agree. Boxes above it that already said something (deferred, error,
   skipped) are left exactly where they are — that content is on screen, it
   cannot grow, and moving it would be the real motion we are avoiding.

   The accepted cost: a higher-preference dictionary that answers later is
   displayed below the winner. Preference order is preserved among all the
   others. This is the Spotlight "Top Hit" / omnibox default-match shape — the
   item you are acting on is pinned, the ranked list follows.

   Superseded: an earlier version cancelled the shift with a compensating
   scrollBy. It could not help the commonest case (at scrollY 0 there is
   nothing to scroll back to, yet that is exactly where a freshly opened
   definition is read), and programmatic scrolling breaks workflows that are
   none of our business. Reordering nothing-sized boxes costs nothing and needs
   no browser to cooperate. Under expand-all there is no latch and so no
   winner: nothing is promoted, and Chromium's native scroll anchoring is left
   to do what it already does. */
let openedIdx=null;
function promote(boxes,i){
  let ref=boxes[i];
  for(let k=0;k<i;k++){
    const b=boxes[k];
    if(b.firstChild)continue; // already visible: leave it above, untouched
    ref.after(b);ref=b;       // in order, so preference survives among them
  }
}
function renderSlot(box,h,mode,q,perDict){
  box.innerHTML="";
  if(h.deferred){
    const det=document.createElement("details");
    det.className="dict";
    det.dataset.deferred=h.dict; // also what excludes it from expand-all
    det.innerHTML=`<summary>${esc(hitName(h))}`+
      `<span class="count hint">${TAPS?"tap":"click"} to search</span></summary>`;
    // `toggle` does not bubble, so this is bound to the element rather than
    // delegated on #out. It is not `once`: a failed load re-arms itself.
    det.addEventListener("toggle",()=>{if(det.open)loadDeferred(det,box,h,mode,q)});
    box.appendChild(det);
    // shown, but NOT results: a deferred dictionary has said nothing about the
    // word yet, so it must not suppress the empty state or satisfy the
    // link-scope widening — and it must never be the section auto-opened,
    // which would fetch it without anyone asking.
    return{shown:true};
  }
  if(h.error){
    box.innerHTML=`<details class="dict"><summary>${esc(hitName(h))}<span class="count">⚠ ${esc(h.error)}</span></summary></details>`;
    return{shown:true};
  }
  if(h.skipped){
    // Both heavier indexes are opt-in, so a skipped dictionary is not a dead
    // end: offer to add the one this search needed, right where it was missed.
    const feat=mode==="fts"?"fts":mode==="contains"?"contains":"";
    if(feat){
      const what=feat==="fts"?"full-text search":"substring search";
      box.innerHTML=`<details class="dict"><summary>${esc(h.name)}`+
        `<span class="upgrade" data-id="${h.dict}" data-feat="${feat}">enable ${what} for this dictionary</span></summary></details>`;
      return{shown:true};
    }
    return{};
  }
  if(!h.results?.length)return{};
  const det=document.createElement("details");det.className="dict";
  const more=h.results.length>=perDict?`<span class="more" data-id="${h.dict}">more…</span>`:"";
  det.innerHTML=`<summary>${esc(h.name)}<span class="count">${h.results.length}${more?"+":""} result${h.results.length===1?"":"s"}</span>${more}</summary>`;
  const dl=document.createElement("dl"),roots=[];
  for(const r of h.results){
    const dt=document.createElement("dt");dt.textContent=r.Headword;
    const dd=document.createElement("dd");dd.dataset.dict=h.dict;
    roots.push(renderArticle(dd,r.Body,h.dict,
      anchorOnce&&anchorOnce.dict===h.dict&&r===h.results[0]?anchorOnce.frag:""));
    dl.appendChild(dt);dl.appendChild(dd);
  }
  det.open=expandAll;
  det.appendChild(dl);box.appendChild(det);
  highlight(roots,mode,q);
  // A `bword://Word#frag` link: now that the article is in the document, put
  // the fragment on screen. Shadow-DOM articles can be measured immediately
  // (next frame, once laid out); iframe ones jump themselves — frameDoc has
  // already been handed the fragment below.
  if(anchorOnce&&anchorOnce.dict===h.dict){
    const frag=anchorOnce.frag;anchorOnce=null;
    if(roots[0])requestAnimationFrame(()=>{
      const el=anchorTarget(roots[0],frag);
      if(el){det.open=true;revealAt(el.getBoundingClientRect().top,det)}

  return{shown:true,results:true};
}

async function doSearch(ev){
  if(ev)ev.preventDefault();
  const q=$("q").value.trim();
  if(!q)return;
  // consumed before the first await, so the history wrapper below can still
  // read which scope was used
  const scope=scopeOnce;scopeOnce=null;lastScope=scope;
  const widened=widenedFrom;widenedFrom=null; // set by the fallback below
  const mode=$("mode").value,dictSel=scope||$("dict").value,seq=++searchSeq;
  // abort the previous in-flight search so the server stops streaming
  // results nobody will render (superseded typing / mode change).
  if(searchAC)searchAC.abort();
  searchAC=new AbortController();
  const signal=searchAC.signal;
  lastQuery=q;
  // No "Searching…" text: the spinner alone says it, and saying it twice
  // cost a permanently reserved line above the results.
  setBusy(true);
  // "All" queries the enabled dictionaries in preference order (fewer
  // results each); a specific pick queries just that one (more results).
  let dictParam,perDict;
  if(dictSel==="all"){
    const ids=enabledOrderedIds();
    if(!ids.length){
      // "You disabled them all" is only knowable once the list is complete:
      // mid-stream, the dictionaries that arrived may all be disabled while
      // dozens still on their way are not. So the accusation waits for a
      // settled, non-empty list, and until then this reads as what it is —
      // still loading — and re-runs itself when the rest lands (D30).
      const settled=(phase==="ready"||phase==="failed")&&dicts.length>0;
      setBusy(false); // nothing was ever sent; both branches below are statements
      setStatus(settled
        ?"⚠ All dictionaries are disabled — enable some in the ☰ panel"
        :'<span class="spin"></span>'+esc(readyCount()));
      if(!settled)staleSearch=true;
      return;
    }
    dictParam=ids.join(",");perDict=5;
  }else{dictParam=dictSel;perDict=25}
  const out=$("out");
  /* Never blank between two answers (D73/M2). Clearing on `begin` made every
     keystroke-pause a full → empty → full flash: two motions where one will
     do, and an empty results area reads as a failure followed by a recovery.

     So the new generation's boxes are appended BELOW the previous answer —
     they are empty divs, so nothing moves and nothing is visible — and the old
     content is dropped only once there is something to replace it with.

     Appended rather than built in a DocumentFragment and swapped in: a shadow
     root's inline <style> has a null `.sheet` until it is connected to a
     document, so rendering an article off-document would silently drop every
     inline @font-face it declares (hoistShadowFonts). The box a slot renders
     into is attached for its whole life here, exactly as before. */
  let boxes=[],anyShown=false,anyResults=false,stale=null;
  const swap=()=>{if(stale){for(const n of stale)n.remove();stale=null}};
  try{
    await fetchStream("/api/search?q="+encodeURIComponent(q)+"&mode="+mode+"&dict="+encodeURIComponent(dictParam)+"&n="+perDict,msg=>{
      if(seq!==searchSeq)return; // superseded by a newer search
      if(msg.t==="begin"){
        stale=[...out.childNodes];
        boxes=(msg.slots||[]).map(()=>{const b=document.createElement("div");out.appendChild(b);return b});
        openedIdx=null; // re-arm the latch: a new generation, a new decision
        setStatus("");
      }else if(msg.t==="hit"){
        const box=boxes[msg.i];if(!box)return;
        const res=renderSlot(box,msg,mode,q,perDict);
        if(res.shown)swap();
        if(res.shown)anyShown=true;
        if(res.results)anyResults=true;
        /* The latch (D73/M3). The FIRST dictionary to answer takes the open
           slot and keeps it; a higher-preference one that finishes later fills
           its own position, above, and stays shut.

           This used to promote on `msg.i<openedIdx`, closing the section being
           read — a definition would appear, be read into, and vanish under the
           reader because a slower dictionary was ranked higher. Ranking is a
           property of the query; a reading in progress is a commitment, and it
           outranks it. The visible cost, accepted deliberately: the open
           section is often NOT the top one.

           No grace window before committing. It would buy top-position
           fidelity for ~200ms on top of the 300ms input debounce, and 500ms to
           first definition is past the point where the UI stops feeling
           immediate. Every dictionary here is local; the miss is rare and
           costs one click.

           `res.results`, not `res.shown`: deferred, errored and skipped
           sections have said nothing about the word and must never be the one
           that opens — auto-opening a deferred one would fetch it unasked. */
        if(!expandAll&&res.results&&openedIdx===null){
          const det=box.querySelector("details.dict");
          if(det){det.open=true;openedIdx=msg.i;promote(boxes,msg.i)}
        }
      }else if(msg.t==="end"){
        // A cross-reference that its own dictionary cannot answer is not a
        // dead end — widen once, and say that is what happened. The re-run
        // carries no scope, so it cannot recurse.
        // !anyShown, not !anyResults: a dictionary that reported an error, or
        // that lacks the index this mode needs, has not said "no such word" —
        // widening would throw away its "enable substring search" offer.
        if(scope&&!anyShown){
          anchorOnce=null;   // the fragment addressed an article we did not find
          widenedFrom=scope; // reported on the next search's end, not here:
          navRecord="replace";// the re-run's own "Searching…" would overwrite it
          doSearch();         // and the URL must lose its now-false `from`
          return;                 // NOT swapped: the old answer holds the
        }                         // screen until the re-run has something
        swap();                   // nothing came, or everything did: commit
        // (the empty-state innerHTML below also clears the boxes — they are empty)
        if(!anyShown)out.innerHTML=`<div class="empty">${noResultsSVG}<p>No results for “${esc(q)}”</p></div>`;
        if(scope&&anyShown)out.appendChild(scopeNote(scope));
        else if(widened)out.appendChild(widenNote(widened,q));
        // Searched a list that is still filling up: say so rather than let an
        // incomplete answer look complete, and re-run when the rest lands.
        if(phase==="partial"){
          staleSearch=true;
          setStatus(`searched ${dicts.length} of ${dictTotal||dicts.length} dictionaries — still loading…`);
        }
      }
    },signal);
  }catch(err){if(err.name==="AbortError")return;if(seq===searchSeq)setStatus("⚠ "+esc(err.message))}
  finally{
    // Only the newest search may stop the glyph. An aborted one has already
    // been superseded by a search that is still running, and clearing here
    // would blink the spinner off in the middle of the work that replaced it.
    if(seq===searchSeq)setBusy(false);

}

/* "more…": re-query a single dictionary at a higher limit, in place */
document.addEventListener("click",e=>{
  const more=e.target.closest("summary .more");
  if(!more)return;
  e.preventDefault();
  const det=more.closest("details.dict"),box=det.parentElement,id=more.dataset.id,mode=$("mode").value;
  more.textContent="…";
  fetchStream("/api/search?q="+encodeURIComponent(lastQuery)+"&mode="+mode+"&dict="+id+"&n=100",msg=>{
    if(msg.t==="hit"){renderSlot(box,msg,mode,lastQuery,1e9);const nd=box.querySelector("details.dict");if(nd)nd.open=true}
  }).catch(()=>{more.textContent="more…"});

  clearTimeout(debounce);
  const v=$("q").value.trim();
  if(v.length<2)return;
  debounce=setTimeout(doSearch,300);

/* keyboard: "/" focuses search */

  if(e.key==="/"&&document.activeElement!==$("q")){e.preventDefault();$("q").focus();$("q").select()}
  if(e.key==="Escape")$("panel").classList.remove("show");

/* clicks inside shadow roots arrive via composedPath */
/* ── Starting a search from something other than the search box ───────
   TWO callers, opposite requirements, and conflating them was a real bug:

   searchFor()       takes a term that is ALREADY EXACT — an author's link
                     target, a restored URL. It is used verbatim.
   lookupSelection() takes PROSE the user picked out of an article, which may
                     carry a trailing comma, a footnote digit, or a whole
                     clause, and must be tidied into something lookup-shaped.

   These used to be one function carrying lookupSelection's tidying, so
   `bword://Artificial Intelligence Notes#note-1` was cut at the first space
   and searched for "Artificial". A cleaner that is right for one caller is
   silent corruption for the other; the fix is two functions, not a smarter
   regex. */
function searchFor(term,opts){
  const t=String(term||"").trim();
  if(!t)return;
  $("q").value=t;                       // verbatim: no trimming, ever
  if($("mode").value==="fts")$("mode").value="prefix";
  const scope=opts?.scope||null,frag=opts?.frag||"";
  scopeOnce=scope;
  // the fragment addresses a place in the SCOPED article; renderSlot matches
  // on the dictionary id, so without a scope there is nothing to match
  anchorOnce=frag&&scope?{dict:scope,frag}:null;
  navRecord=opts?.record||"push"; // following a reference IS navigation
  doSearch();
}
/* Prose the user selected: first run before punctuation or space, minus a
   trailing footnote digit. Global by design — picking a word asks what it
   MEANS; following a link asks where the author pointed (D40). */
function lookupSelection(text){
  const w=String(text||"").trim().split(/[;.,:{}()\[\]\s]/)[0].replace(/\d+$/,"");
  if(w)searchFor(w);
}
/* One reused <audio>, kept referenced so the browser can't garbage-collect
   it mid-load. .spx audio is transcoded server-side (speexdec), so the first
   response can lag enough that an unreferenced `new Audio(url)` would be
   collected before it plays. Playback decodes by Content-Type, not the URL
   extension, so a .spx URL served as audio/wav plays fine. */
let audioEl=null;
function playAudio(url){
  if(!url)return;
  if(!audioEl)audioEl=new Audio();
  audioEl.src=url;
  const p=audioEl.play();
  if(p&&p.catch)p.catch(err=>{console.warn("audio play failed:",url,err);setStatus("⚠ could not play audio")});
}
/* ── Dictionary references ────────────────────────────────────────────
   `bword://Artificial Intelligence Notes#note-1` IS NOT A URL, and must never
   be handed to one. The `//` promises an authority component, and an authority
   may not contain spaces — while headwords contain spaces, apostrophes,
   ampersands and question marks all day long. `new URL()` (or anything that
   normalises an authority) mangles them silently. So this parses by string
   position and nothing else. It is also why the server rewrites `bword://@…`
   to the slash-less `bword:@…` before it ever reaches us: "@" is the userinfo
   delimiter, and URL normalisation eats everything before it (rewrite.go).

   Accepted forms, all equivalent:
     bword://word   bword:word   entry://word   entry:word   d:word   x:word
   The slash-less spelling is what GoldenDict also accepts and several MDX
   dictionaries emit.

   Parsed ONCE, here, into a structured reference. Everything downstream reads
   its fields; nothing re-parses an href and nothing re-cleans a term. The
   previous shape — two half-parsers (`wordFromHref`, `fragFromHref`) plus
   callers re-deriving the KIND from the shape of the word (null? empty?
   leading "@"?) — is what let a term escape into the wrong cleaner.

   kind:
     "lookup"  a headword, optionally with a #fragment inside the target
     "anchor"  no headword: a #fragment in the article being read — the
               article's own table of contents, not a cross-reference
     "sub"     "@name", an article's own expandable section stored as a
               headword (MDict convention, D26) — inlined, never searched
   null when the href is not a reference at all. */
const REF_SCHEME=/^(?:(?:bword|entry):(?:\/\/)?|[dx]:)/i;
function decodeRef(s){try{return decodeURIComponent(s)}catch(_){return s}}
function parseRef(href){
  const m=REF_SCHEME.exec(href||"");
  if(!m)return null;
  // split BEFORE decoding, at the first literal "#": a "#" that is part of a
  // headword has to arrive percent-encoded, and decoding first would promote
  // it to a delimiter
  let rest=href.slice(m[0].length),frag="";
  const h=rest.indexOf("#");
  if(h>=0){frag=rest.slice(h+1);rest=rest.slice(0,h)}
  const word=decodeRef(rest).trim();
  frag=decodeRef(frag);
  if(word.charAt(0)==="@"&&word.length>1)return{kind:"sub",word,frag};
  return{kind:word?"lookup":"anchor",word,frag};
}
function anchorTarget(root,frag){
  if(!frag||!root)return null;
  if(root.getElementById){
    const el=root.getElementById(frag);
    if(el)return el;
  }
  for(const a of root.querySelectorAll("a[name]"))if(a.getAttribute("name")===frag)return a;
  return null;
}
/* Scroll so a point at `viewportTop` clears the fixed bar AND its section's
   sticky header (D37), which scrollIntoView cannot know about. Shared by the
   shadow-DOM articles and the iframe ones, which report a position instead. */
function revealAt(viewportTop,det){
  const head=det?.querySelector(":scope>summary")?.offsetHeight||0;
  scrollTo({top:Math.max(0,viewportTop+scrollY-$("bar").offsetHeight-head-8),
    behavior:lessMotion.matches?"auto":"smooth"});
}
document.addEventListener("click",e=>{
  const path=e.composedPath();
  const a=path.find(el=>el.tagName==="A");
  if(!a)return;
  const dd=path.find(el=>el.classList?.contains("article"));
  const dictID=dd?.dataset.dict;
  const href=a.getAttribute("href")||"";
  // one parse, one dispatch — the kind is read, never re-derived
  const ref=parseRef(href);
  if(ref){
    e.preventDefault();
    if(ref.kind==="sub"){toggleSub(a,ref.word,dictID);return}
    if(ref.kind==="lookup"){searchFor(ref.word,{scope:dictID,frag:ref.frag});return}
    jumpInArticle(a,dd,ref.frag); // "anchor"
  }else if(/\.(mp3|ogg|wav|spx|m4a)(\?|#|$)/i.test(href)){
    e.preventDefault();playAudio(href.startsWith("/res/")||/^https?:/i.test(href)?href:resURL(dictID,href));
  }else if(a.querySelector("img")&&href.startsWith("/res/")){
    e.preventDefault();playAudio(href);
  }else if(/^https?:\/\//i.test(href)&&dd){
    // An external link OUT of an article — Cambridge points at
    // dictionary.cambridge.org three times in one entry. Following it in place
    // costs the user their search; in the iframe renderer the same click does
    // visibly worse, since that sandbox has no allow-top-navigation and the
    // website loads inside the small box where the article was. One cause, two
    // shapes of damage, so one answer in both renderers: a new tab.
    // Scoped to links inside an article (`dd`) — the panel's own links are
    // ordinary navigation and stay that way.
    e.preventDefault();window.open(href,"_blank","noopener,noreferrer");
  }else if(href.startsWith("#")&&dd){
    // A PLAIN in-page anchor. NEITHER renderer can leave this to the browser.
    // In a shadow root, document fragment navigation does not see shadow ids,
    // so the browser would only dirty the page URL with a hash matching
    // nothing. In a srcdoc iframe the document URL is about:srcdoc while the
    // base URL is inherited from this page, so the browser resolves the
    // fragment against the WRONG one and navigates cross-document — frame.js
    // handles it there for that reason (D51). The comment that used to sit
    // here claimed iframes handled it natively; they never did.
    e.preventDefault();jumpInArticle(a,dd,decodeRef(href.slice(1)));
  }else if(href&&!/^([a-z][\w+.-]*:|\/|#|res\/|assets\/)/i.test(href)){
    // bare-word link (slob): also an author's reference, so also scoped
    e.preventDefault();searchFor(decodeRef(href),{scope:dictID});
  }
});
/* A fragment naming a place in the article being read. `a.getRootNode()` lands
   on the shadow root when the link lives inside one; `dd` is the article host,
   which is in the light DOM and can find the section to offset against. */
function jumpInArticle(a,dd,frag){
  const el=anchorTarget(a.getRootNode(),frag);
  if(el)revealAt(el.getBoundingClientRect().top,dd?.closest("details.dict"));
}
/* Sub-entry inlining for shadow-DOM (script-free) articles — the iframe path
   does the same in frame.js. Inserted next to the link, toggled off by a second
   click; nothing touches the search box, the URL or history. */
async function toggleSub(link,word,dictID){
  if(link._sub){link._sub.remove();link._sub=null;return}
  const box=document.createElement("div");
  box.className="wudict-sub";box.textContent="…";
  link.parentNode.insertBefore(box,link.nextSibling);
  link._sub=box;
  try{
    const r=await fetch("/api/search?mode=exact&n=1&dict="+encodeURIComponent(dictID||"")+
      "&q="+encodeURIComponent(word));
    let html=null;
    for(const line of (await r.text()).split("\n")){
      if(!line.trim())continue;
      let m;try{m=JSON.parse(line)}catch(_){continue}
      if(m.t==="hit"&&m.results?.length)html=m.results[0].Body;
    }
    if(html===null){box.textContent="(not in this dictionary)";return}
    box.innerHTML=`<span class="wudict-sub-close" title="Close">✕</span>`+html.replace(/<link\b[^>]*>/gi,"");
    box.querySelector(".wudict-sub-close").addEventListener("click",()=>toggleSub(link,word,dictID));
  }catch(_){box.textContent="(could not load)"}
}

document.addEventListener("dblclick",e=>{
  const path=e.composedPath();
  if(!path.some(el=>el.classList?.contains("article")))return;
  const root=path.find(el=>el instanceof ShadowRoot);
  let sel="";
  try{sel=(root&&root.getSelection?root.getSelection():document.getSelection()).toString().trim()}catch(_){ }
  if(sel)lookupSelection(sel);
});

/* audio inside <object type="audio/…"> → click to play. DSL emits a link now
   (D81); this is what dictionaries prepared before that change still store,
   and how GoldenDict-era sources spell pronunciation. */
document.addEventListener("click",e=>{
  const o=e.composedPath().find(el=>el.tagName==="OBJECT"&&/^audio\//.test(el.getAttribute("type")||""));
  if(o){e.preventDefault();playAudio(o.getAttribute("data"))}
});

/* auto-hide bar on scroll down */
/* The bar's real height, published as --barh so sticky section headers rest
   just below it — and, below 600px, so body's own padding-top follows it too
   rather than repeating a magic number that has to be re-guessed whenever the
   bar changes. Measured rather than hard-coded: a guessed offset would either
   hide a header under the bar or float it below a visible gap. This runs
   synchronously at the end of the body, so the 3.1em fallback in :root never
   reaches a paint. */
function measureBar(){
  document.documentElement.style.setProperty("--barh",$("bar").offsetHeight+"px");
}
measureBar();
// ResizeObserver rather than a resize listener: the bar also changes height
// when the dictionary <select> grows with the loaded names and wraps the row,
// which fires no resize event at all.
new ResizeObserver(measureBar).observe($("bar"));
let prevScroll=window.pageYOffset;
addEventListener("scroll",()=>{
  const cur=window.pageYOffset;
  const hide=cur>80&&cur>prevScroll;
  $("bar").classList.toggle("hidden",hide);
  document.body.classList.toggle("barhidden",hide);
  prevScroll=cur;
});

/* Shareable links AND working browser navigation: ?q=…&mode=…&dict=…
   Typing and navigating must record history differently. `doSearch` runs on a
   300 ms debounce while you type, so pushing there would put "c", "ca", "cas",
   "casa" on the stack and Back would walk letter by letter — which is why this
   used replaceState for everything. Now:
     typing            → replaceState (one entry for a session of typing)
     following a link  → pushState    (one entry per entry visited)
     Back/Forward      → restore from the URL, recording nothing */
let navRecord="replace"; // how the NEXT doSearch should record itself
/* One-shot state consumed by the next doSearch, same idiom as navRecord.

   scopeOnce is the dictionary a cross-reference came FROM. A `bword://` link
   inside an article is the dictionary talking to itself — the author wrote it
   pointing at their own entry — so searching all 105 dictionaries for it is
   both wasteful and wrong: it buries the intended article among namesakes from
   dictionaries that were never consulted. Scoped, not sticky: it never touches
   the #dict selector, which is the user's standing preference for the words
   THEY type, and it is spent by the search that reads it.

   anchorOnce is the #fragment such a link carried, revealed once the target
   article is on screen. */
let scopeOnce=null,anchorOnce=null,lastScope=null,widenedFrom=null;
function applyURL(){
  const p=new URLSearchParams(location.search);
  if(p.get("theme")){localStorage.setItem("wudict_theme",p.get("theme"));applyTheme(p.get("theme"))}
  if(p.get("mode"))$("mode").value=p.get("mode");
  if(p.get("dict"))$("dict").value=p.get("dict");
  syncChips();
  if(p.get("q")){$("q").value=p.get("q");scopeOnce=p.get("from")||null;doSearch()}
}
const _doSearch=doSearch;
doSearch=function(ev){
  const record=navRecord;
  navRecord="replace"; // one-shot: only the action that asked for it pushes
  const r=_doSearch(ev);
  const q=$("q").value.trim();
  if(q&&record!=="none"){
    const params={q,mode:$("mode").value,dict:$("dict").value};
    // `from` is the one-shot cross-reference scope; `dict` stays the user's
    // own selector, so restoring a link-followed view never rewrites it
    if(lastScope)params.from=lastScope;
    const url="?"+new URLSearchParams(params).toString();
    // clicking the same word twice must not stack identical entries
    if(record==="push"&&url!==location.search)history.pushState(null,"",url);
    else history.replaceState(null,"",url);
  }
  return r;
};

/* Back/Forward: put the state the URL describes back on screen. Nothing is
   recorded — the browser already moved the cursor within the stack. */
window.addEventListener("popstate",()=>{
  const p=new URLSearchParams(location.search);
  if(p.get("mode"))$("mode").value=p.get("mode");
  if(p.get("dict"))$("dict").value=p.get("dict");
  syncChips();
  const q=p.get("q")||"";
  $("q").value=q;
  if(!q){ // back to the empty start: leave nothing stale on screen
    if(searchAC)searchAC.abort();
    $("out").innerHTML="";
    lastQuery="";
    setStatus("");
    return;
  }
  navRecord="none";
  scopeOnce=p.get("from")||null; // a link-followed view was scoped; restore that
  doSearch();
});
$("frm").removeEventListener("submit",_doSearch);
$("frm").addEventListener("submit",e=>doSearch(e));

// settings first: they decide the panel's order and the search set, and the
// fetch is a local file read — a millisecond, not a stall worth splitting the
// boot screen over. The config comes alongside rather than after, because the
// cards need its home prefix to render paths as ~/… on the FIRST draw; run
// concurrently it costs no extra latency, and it cannot reject.
Promise.all([loadPrefs(),loadConfig()]).then(loadDicts).then(applyURL);
</script>
