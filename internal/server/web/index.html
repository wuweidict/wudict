<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wudict</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<style>
/* ── design tokens ─────────────────────────────────────────────────── */
:root{
  --fi:1.618;                     /* φ */
  --sp-1:.382em; --sp-2:.618em; --sp-3:1em; --sp-4:1.618em; --sp-5:2.618em;
  /* The same φ progression in the time domain. Geometric rather than linear
     for a reason that is not decorative: perceived duration grows roughly
     logarithmically, so equal RATIOS read as equal steps while equal
     DIFFERENCES do not — which is why f-stops, musical intervals and decibels
     are all geometric too. One ladder, so a duration is chosen by picking a
     rung rather than by taste. */
  --t-1:.236s; --t-2:.382s; --t-3:.618s; --t-4:1s; --t-5:1.618s; --t-6:2.618s;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --bg:#fbfaf8; --bg-card:#ffffff; --bg-bar:rgba(251,250,248,.92);
  --fg:#2b2a28; --fg-soft:#6d6a64; --fg-faint:#a5a19a;
  --accent:#e08600; --accent-soft:#fff3e0;
  --link:#5b7a99; --link-hover:#3f5e7d;
  /* Deleting is the only irreversible thing this app does, so it gets a colour
     of its own rather than borrowing the error red - and it is a token,
     because it has to survive the theme swap below like everything else. */
  --danger:#c0564f; --danger-soft:#fdeceb; --danger-line:#e2aca7;
  --safe:#3f7a52; --safe-soft:#e9f5ec; --safe-line:#b3d6bd;
  --line:#e8e4dd; --line-soft:#f1eee8;
  --hl:#fff0b3; --hl-fg:#5c4a00;
  --focus:#7aa7d1;
  --shadow:0 1px 3px rgba(60,50,30,.07),0 4px 14px rgba(60,50,30,.05);
  /* --barh is the real bar height, measured at runtime (this value is only the
     pre-script fallback). --stick is where a stuck section header comes to
     rest; it collapses to 0 when the bar slides away, which is why the two are
     separate: a scroll correction always ends with the bar back on screen, so
     it must aim at --barh, never at a --stick that is momentarily 0. */
  --barh:3.1em;
  --stick:var(--barh);
  /* The article surface, as two values rather than two literals in four
     places. Custom properties are the only thing that crosses `all:initial`
     into a shadow root, so overriding these once in the user's own app.css
     recolours every article as well as the page. Iframes cannot inherit
     them; frameCSS() carries the resolved pair across that boundary. */
  --wd-article-bg:#fff;
  --wd-article-fg:#1a1a1a;
}
html[data-theme="dark"]{
  --bg:#191a1c; --bg-card:#212327; --bg-bar:rgba(25,26,28,.92);
  --fg:#d8d5d0; --fg-soft:#96938d; --fg-faint:#5f5c57;
  --accent:#e69a33; --accent-soft:#3a2d18;
  --link:#8fb0cc; --link-hover:#b3cde3;
  --danger:#e8776f; --danger-soft:#3a1d1a; --danger-line:#7a3b36;
  --safe:#79c08f; --safe-soft:#1b2f22; --safe-line:#3d6349;
  --line:#33363b; --line-soft:#2a2c30;
  --hl:#4a3f10; --hl-fg:#ffe38a;
  --focus:#5b86ad;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
@media (prefers-color-scheme: dark){
  html:not([data-theme]){
    --bg:#191a1c; --bg-card:#212327; --bg-bar:rgba(25,26,28,.92);
    --fg:#d8d5d0; --fg-soft:#96938d; --fg-faint:#5f5c57;
    --accent:#e69a33; --accent-soft:#3a2d18;
    --link:#8fb0cc; --link-hover:#b3cde3;
    --danger:#e8776f; --danger-soft:#3a1d1a; --danger-line:#7a3b36;
    --safe:#79c08f; --safe-soft:#1b2f22; --safe-line:#3d6349;
    --line:#33363b; --line-soft:#2a2c30;
    --hl:#4a3f10; --hl-fg:#ffe38a;
    --focus:#5b86ad;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
}

/* ── chrome ────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
html{color-scheme:light dark}
/* --wd-inset-top / --wd-inset-bottom are set by a host that puts the page
   under the system's own chrome - the Android shell's edge-to-edge mode. They
   are unset everywhere else, and every rule that reads them falls back to 0px,
   so a plain browser sees exactly the layout it always did. Only top and
   bottom: a side inset never reaches the page, because the host keeps landscape
   cutouts off it. */
body{margin:0;padding-top:calc(4.236em + var(--wd-inset-top,0px));
  background:var(--bg);color:var(--fg);
  font-family:var(--font);line-height:var(--fi)}
/* ── the content column ─────────────────────────────────────────────
   One geometry, worn by the toolbar and the results alike, so their edges
   cannot drift apart: the cards sit φ⁻¹em inside the 800px box (their own
   gutter), and the toolbar takes the same gutter, so the bar is never wider
   than the content it heads. */
.col{width:92%;max-width:800px;margin:0 auto;
  padding-left:var(--sp-2);padding-right:var(--sp-2);
  transition:max-width .25s ease} /* on .col so the bar eases with the cards */
body.wide .col{max-width:min(1280px,96vw)}
.container{padding-bottom:calc(var(--sp-5) + var(--wd-inset-bottom,0px))}

.bar{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--bg-bar);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  /* no horizontal padding: the bar is full-bleed and the gutter belongs to
     .col, which the form wears. Two insets would inset the form twice. */
  border-bottom:1px solid var(--line);padding:var(--sp-1) 0;
  /* The bar wears the top inset rather than the page doing it: its blurred
     background then fills the strip behind a camera cutout and the form sits
     clear below it. And since .bar.hidden translates the element - padding and
     all - scrolling the bar away really does hand that strip back to the
     article, with no second rule to keep in step. */
  padding-top:calc(var(--sp-1) + var(--wd-inset-top,0px));
  transition:transform .28s ease}
.bar.hidden{transform:translateY(-100%)}
/* When the bar slides away, the stuck header takes the space it vacated
   instead of leaving a hole. Same .28s as the bar, so the two read as one
   piece of chrome moving rather than two things reacting to each other. */
body.barhidden{--stick:0px}
/* geometry comes from .col; this rule only arranges what is inside it */
.bar form{display:flex;align-items:center;gap:var(--sp-1);flex-wrap:wrap;
  justify-content:center}
/* The seam between "what am I searching" and "how am I viewing it". Pushing
   the view toggles to the right edge anchors both ends of the bar to the
   content column, so slack is absorbed in the middle instead of shoving the
   ends outward — a sixth button then costs nothing. Inert at 800px, where the
   controls already fill the row; it does its work in wide mode and any time a
   control is removed. Move this class if the button order ever changes. */
.bar form .tools{margin-left:auto}
.brand{font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.02em;
  margin-right:var(--sp-1);user-select:none;white-space:nowrap}
/* Wordmark: "WuWei" carries the accent, "Dict" recedes to normal weight — one
   colour, one weight step, no second font. */
.brand small{font-size:1em;color:var(--fg-soft);font-weight:400}
/* The geometry lives on .qbox so the glyph can be positioned against the
   field; the input only fills it. */
.qbox{position:relative;display:flex;flex:1;min-width:130px;max-width:300px}
input[type=search]{width:100%;min-width:0;font-size:16px;
  color:var(--fg);background:var(--bg-card);border:1px solid var(--line);
  border-radius:8px;padding:.35em .7em .35em 2em;outline:none;appearance:none}
input[type=search]:focus{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
/* ⌕ and spinner share ONE 14px box and crossfade, so going busy is a change
   of identity in an occupied box rather than an element arriving — the least
   intrusive transition available, and the only one that costs no layout.
   At rest the ⌕ also gives the field an identity, which matters most on
   narrow screens where the wordmark is hidden. */
.qled{position:absolute;left:.62em;top:50%;margin-top:-7px;width:14px;height:14px;
  color:var(--fg-faint);pointer-events:none}
.qled>*{position:absolute;inset:0;width:14px;height:14px;margin:0;
  transition:opacity var(--t-2) ease}
/* Peripheral by construction, in all four dimensions that make a spinner shout.
   SIZE: inset 2px inside the ⌕'s box — 10px, φ⁻¹ of the glyph, with the stroke
   thinned to match. COLOUR: currentColor, i.e. the SAME --fg-faint the ⌕ is
   already drawn in, and no visible ring behind the arc — so the morph changes
   nothing but geometry, and the accent stays reserved for headwords rather
   than being spent on a non-event. SPEED: see below. */
/* Explicit box, and margin:0 restated at THIS specificity. The shared .spin
   below carries margin-right:.4em for its inline uses, and it is declared
   later with the same specificity as .qled>*, so its margin wins there. With
   an explicit width that is harmless - over-constrained absolute positioning
   simply drops `right` - but with width:auto the solver SPENDS the margin:
   14 − 2 − 2 − 6.4 = 3.6px, a box too small to see. Never size an
   absolutely positioned box from insets alone when a shared class may put a
   margin on it.
   The arc is --fg-soft rather than the ⌕'s --fg-faint on purpose: a 1.5px
   stroke carries far less ink than the glyph's, so matching its LUMINANCE
   would not match its presence. One step up is what makes the two read as
   equally quiet. */
.qled .spin{top:2px;left:2px;right:auto;bottom:auto;width:10px;height:10px;
  margin:0;border-width:1.5px;border-color:transparent;
  border-top-color:var(--fg-soft);animation-duration:var(--t-6);opacity:0}
.qbox.busy .mag{opacity:0}
.qbox.busy .spin{opacity:1}
/* φ² seconds per revolution is 360°/φ² = 137.5° per second — the GOLDEN ANGLE
   per second, the divergence angle phyllotaxis advances a sunflower's seeds
   by. It is also 3.7× slower than the .7s the shared .spin uses elsewhere,
   which takes it out of the few-hertz band where a repeating motion reliably
   captures attention and into the register of a clock hand: unmistakably
   moving, demanding nothing. A fast spinner makes a promise — "wait for me to
   stop"; this one only reports. */
@media (prefers-reduced-motion:reduce){.qled .spin{animation:none}}
select{font-size:13px;color:var(--fg-soft);background:var(--bg-card);
  border:1px solid var(--line);border-radius:8px;padding:.3em .4em;max-width:180px}
/* The pill is INERT above 600px: display:contents leaves the field and the two
   selects as direct flex children of the form, which is the layout the bar has
   always had, and the chips are simply not rendered. The whole mobile
   treatment lives in the one media query at the end of this stylesheet — there
   is no second layout to keep in step, only a second set of rules for the same
   markup. */
/* .seg is scoped to the bar here and below: the panel's option rows use the
   same class for their labelled button groups, and the bar's phone rules
   (flex:none above all) made "Group by" refuse to shrink — one long row with
   a sideways scroll on narrow screens, a tidy wrap on wide ones. */
.pill,.bar .seg{display:contents}
.chip{display:none}
.btn{font-size:15px;background:var(--bg-card);color:var(--fg-soft);
  border:1px solid var(--line);border-radius:8px;padding:.3em .55em;cursor:pointer;line-height:1.2}
.btn:hover{color:var(--fg);border-color:var(--fg-faint)}
.btn:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

/* ── results ───────────────────────────────────────────────────────── */
/* Costs nothing until it has something to say: a line that is empty for
   almost the whole session must not reserve height above the first result.
   line-height is φ, so 13px × 1.618 = 21.03px sizes the open state by itself.
   grid-template-rows 0fr→1fr animates real height with no measurement and no
   magic number — and the padding sits INSIDE .txt, within the clipped row,
   so the closed state is 0px and not 0px-plus-padding. Progress does not come
   through here: "Searching…" is the field's own glyph, so this opens only for
   statements worth reading. */
#status{display:grid;grid-template-rows:0fr;color:var(--fg-soft);font-size:13px;
  opacity:0;transition:grid-template-rows .28s ease,opacity .3s ease}
#status>.msg{overflow:hidden;min-height:0}
#status .txt{padding:var(--sp-2) 0}
#status.show{grid-template-rows:1fr;opacity:1}
/* one spinner, two homes: inline in #status, and large in the startup
   panel below (.empty) while the dictionary list is still arriving */
.spin{display:inline-block;width:1em;height:1em;border:2px solid var(--line);
  border-top-color:var(--accent);border-radius:50%;vertical-align:-.15em;
  animation:spin .7s linear infinite;margin-right:.4em}
.spin.big{display:block;width:30px;height:30px;border-width:3px;
  margin:0 auto var(--sp-2)}
@keyframes spin{to{transform:rotate(360deg)}}
/* overflow:CLIP, not hidden. Both clip to the border-radius identically, but
   `hidden` establishes a scroll container — which would silently defeat the
   sticky summary below, since a sticky element sticks to its nearest scrollport
   and this one would never scroll. `clip` creates no scrollport, so the summary
   sticks to the viewport while staying bounded by its own section. */
details.dict{margin-top:var(--sp-2);background:var(--bg-card);border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--shadow);overflow:clip;
  /* so scrollIntoView lands the section below the bar instead of under it,
     with no arithmetic and no re-derivation when the bar rewraps */
  scroll-margin-top:var(--barh)}
/* The section header stays put while you read inside it, so "which dictionary
   am I looking at" never has to be remembered — or scrolled back for. It is
   also the collapse control, which now stays within reach of a long article.
   The horizontal padding is in rem, not em, so shrinking the type below moves
   only the header's height and never the name's left edge. */
details.dict>summary{position:sticky;top:var(--stick);z-index:2;
  background:var(--bg-card);
  cursor:pointer;padding:var(--sp-1) .62rem;font-weight:600;
  color:var(--fg-soft);list-style:none;display:flex;align-items:center;gap:var(--sp-1);
  transition:font-size .16s ease,line-height .16s ease,padding .16s ease,top .28s ease}
/* Two jobs, two sizes. CLOSED, the header is a row in a list you scan across a
   hundred dictionaries — it wants presence. OPEN, you are reading the section
   and it has become a context label you consult occasionally — it wants to get
   out of the way. `[open]` is a free CSS state, so this needs no sentinel, no
   observer and no scroll handler, and the resize happens on a click the user
   made rather than as a surprise in their peripheral vision. ~39px → ~25px. */
details.dict[open]>summary{font-size:.8125rem;line-height:1.25;
  padding-top:.25rem;padding-bottom:.25rem}
details.dict[open]>summary .count{font-size:11px}
details.dict>summary::-webkit-details-marker{display:none}
details.dict>summary::before{content:"›";color:var(--fg-faint);
  transition:transform .18s ease;font-weight:400}
details.dict[open]>summary::before{transform:rotate(90deg)}
details.dict[open]>summary{border-bottom:1px solid var(--line-soft)}
/* Expand-all can put a hundred dictionaries' articles on screen at once.
   Articles are built eagerly either way (renderSlot appends them all; the
   accordion only hides them), so the cost of opening is layout and paint —
   which this hands back by skipping both for sections nobody has scrolled to.
   The size hint keeps the scrollbar from jumping as they are rendered. */
details.dict[open]>dl{content-visibility:auto;contain-intrinsic-size:0 400px}
summary .count{margin-left:auto;font-weight:400;color:var(--fg-faint);font-size:12px}
/* The relaxation note (renderSlot, h.rung). A full-text search asks for the
   words as a phrase first; when no article had them adjacent the server answers
   a weaker question, and saying so is not an explanation of the machinery but
   the difference between "this phrase is not in the dictionary" and "here it
   is" (D102). Accent-coloured because it qualifies the result it precedes. */
summary .rung{color:var(--accent)}
/* Walking the matches of the section you are reading (markNav). It lives in
   the sticky header because that is the only surface still on screen halfway
   down a 27000px article, and because it moves through exactly what the count
   beside it is counting. The chevrons carry a ~36px touch target on a 25px row
   via padding plus a matching negative margin, so the finger gets its target
   and the header keeps its height; ‹ › rather than words because the row also
   holds a dictionary name that is allowed to wrap and this must never be what
   pushes it to a second line. */
summary .mnav{display:flex;align-items:center;gap:1px;margin-left:auto;font-weight:400}
summary .mnav~.count{margin-left:var(--sp-1)} /* two auto margins would split the row */
summary .mnav[hidden]{display:none} /* display:flex above outranks the attribute */
summary .mbtn{cursor:pointer;color:var(--fg-soft);font-size:16px;line-height:1;
  padding:9px 7px;margin:-9px 0;border-radius:5px;user-select:none;
  -webkit-tap-highlight-color:transparent}
summary .mbtn:hover{color:var(--fg);background:var(--bg)}
summary .mbtn:active{color:var(--accent)}
summary .mpos{font-size:11px;color:var(--fg-faint);min-width:2.8em;text-align:center;
  font-variant-numeric:tabular-nums}
/* Brief and full view (fullSet): the toggle for Lingvo's secondary zone, DSL
   [*], which the article carries as wu-sec. It sits LAST in the row because
   that is the one place nothing else moves it - the match walker comes and
   goes, the count changes width - and the one a right thumb reaches without
   looking. The glyph is the article in miniature: two sense lines and an
   indented example between them, dotted while it is hidden, solid while it is
   shown. Same touch-target trick as the chevrons, grown on a touch screen to
   the 44px a fingertip needs. */
summary .fbtn{flex:0 0 auto;display:inline-flex;cursor:pointer;color:var(--fg-soft);
  padding:9px 7px;margin:-9px -4px -9px 0;border-radius:5px;user-select:none;
  -webkit-tap-highlight-color:transparent}
summary .fbtn svg{width:16px;height:16px;display:block}
summary .fbtn:hover{color:var(--fg);background:var(--bg)}
summary .fbtn[aria-pressed="true"]{color:var(--accent)}
summary .fbtn[aria-pressed="true"] .brief,summary .fbtn[aria-pressed="false"] .full{display:none}
@media (pointer:coarse){summary .fbtn{padding:14px 12px;margin:-14px -8px -14px 0}}
/* a dictionary's own script threw; the article is intact but inert */
summary .jserr{margin-left:6px;font-weight:400;color:var(--accent);font-size:12px;cursor:help}
/* A deferred dictionary's hint (renderSlot, h.deferred). Link-coloured because
   it is an offer rather than a status, not underlined because the target is the
   whole summary and not these two words, and never wrapped: it sits opposite a
   dictionary name that already wraps, and a two-line hint beside a three-line
   name is a broken layout. */
summary .count.hint{color:var(--link);white-space:nowrap}
summary .more{font-weight:400;font-size:12px;color:var(--link);cursor:pointer;
  text-decoration:underline;text-underline-offset:2px;margin-left:var(--sp-2)}
summary .upgrade{font-weight:400;font-size:12px;color:var(--link);cursor:pointer;
  text-decoration:underline;text-underline-offset:2px;margin-left:auto}
/* The dictionaries this mode could not search, as one line instead of one
   section each (renderSlot, h.skipped). The offer inside is per dictionary
   because that is the unit the user acts on; the count outside is what they
   need to read. */
details.noindex>summary{font-weight:400;color:var(--fg-faint)}
.noidx{padding:var(--sp-1) .62rem var(--sp-2)}
.noidx>div{display:flex;align-items:baseline;gap:var(--sp-1);font-size:12px;
  color:var(--fg-soft);padding:.15rem 0}
.noidx .upgrade{font-size:12px;color:var(--link);cursor:pointer;
  text-decoration:underline;text-underline-offset:2px;margin-left:auto;white-space:nowrap}
dl{margin:0;padding:var(--sp-1) var(--sp-2) var(--sp-2)}
dt{font-size:1.272em;font-weight:700;color:var(--accent);word-break:break-word;
  margin-top:var(--sp-2)}
dt:first-child{margin-top:var(--sp-1)}
dd{margin:var(--sp-1) 0 0 0}

/* article sandbox host: dictionary CSS lives inside the shadow root and
   cannot touch the chrome; in dark mode the whole article is inverted
   Dark-Reader style (media flipped back inside the shadow root) */
.article{display:block;border-radius:8px;
  background:var(--wd-article-bg,#fff);color:var(--wd-article-fg,#1a1a1a);
  padding:var(--sp-1) var(--sp-2);overflow-x:auto;overflow-y:hidden}
html[data-theme="dark"] .article:not(iframe),
html:not([data-theme]) .article.autodark:not(iframe){
  filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.92)}
iframe.article{width:100%;border:0;display:block;background:var(--wd-article-bg,#fff);border-radius:8px;
  padding:0;overflow:hidden}

/* Under the results, not in the status line: the scope describes what is on
   screen, so it must live and die with it rather than fade on a timer. */
.scopenote{margin-top:var(--sp-2);padding:var(--sp-1) .62rem;font-size:12px;
  color:var(--fg-faint);text-align:center}
.scopenote .widen{color:var(--link);cursor:pointer;text-decoration:underline;
  text-underline-offset:2px}
.scopenote .widen:hover{color:var(--link-hover)}
/* Same voice as .scopenote, but above the results: it says what was actually
   searched for, and that has to be read BEFORE the articles it explains. */
.morphnote{margin-top:0;margin-bottom:var(--sp-1)}
.empty{padding-top:var(--sp-5);text-align:center;color:var(--fg-faint)}
/* The one line above the wudict howto while it is all there is (welcome). */
#welcome{margin:.6em 0;padding:.55em .8em;border:1px solid var(--line);border-radius:6px;
  background:var(--accent-soft);color:var(--fg)}
#welcome a{color:var(--link);font-weight:600}
.empty svg path{fill:var(--line)}
/* the search bar is inert until at least one dictionary is usable */
input:disabled,select:disabled{opacity:.55;cursor:not-allowed}

/* ── custom styles editor ────────────────────────────────────────────
   A docked sheet, not a modal, and with no backdrop: the whole point is to
   watch an article reflow while you type. The panel that would otherwise
   host this is min(420px,92vw) — on a phone it covers precisely the thing
   being tuned. The page below stays live and keeps its scroll position; the
   matching padding on <body> keeps the last result reachable above it. */
html{--styler-h:min(45vh,420px)}
#styler{position:fixed;left:0;right:0;bottom:0;z-index:210;display:none;
  height:var(--styler-h);flex-direction:column;
  background:var(--bg);border-top:1px solid var(--line);box-shadow:var(--shadow);
  padding:var(--sp-2) var(--sp-3);
  padding-bottom:calc(var(--sp-2) + var(--wd-inset-bottom,0px))}
#styler.show{display:flex}
body.styling{padding-bottom:var(--styler-h)}
/* One row, at every width. nowrap is load-bearing and not a preference:
   flex decides WRAPPING from an item's hypothetical size and only then
   shrinks what is on the line, so a <select> sized by its longest option
   jumps to a second row before it is ever asked to give width back, leaving
   ✕ alone under Save. With nowrap the menu is asked first,
   and it is the only item that can answer: basis 0 means it takes free space
   rather than claiming its content width, and the cap keeps it from sprawling
   on a desktop. */
#styler .row{display:flex;align-items:center;gap:.4em;flex-wrap:nowrap}
#styler .grow{flex:1 1 auto;min-width:0}
/* ...and nowrap alone only converts a second row into an overflow: the row
   still needs somewhere for the excess to GO, in a stated order. Shrink weight
   is the shrink factor times the BASE size, so a flex-basis of 0 absorbs
   nothing however large its factor, and the line would run off the screen -
   taking with it the item at its end, the one that closes the sheet.
   So: ✕ and its neighbours stay rigid, because a button labelled "S..." is
   not a button; the menu gives up its width first, from a real basis, down to
   a floor you can still see and tap; only then do the tabs ellipsize. Flex
   shrinks every eligible item AT ONCE and in proportion, so "only then" has
   to be bought: at an equal factor the tabs would give up their last
   half-pixel to a menu with 50px still to give, and half a pixel is a whole
   "Arti...".
   A hundredth of a factor puts that share below the pixel grid, and once the
   menu freezes at its floor the tabs are the only items left unfrozen and
   take the whole remainder however small their factor is.
   The width this has to survive is not ours to choose - Android scales WebView
   text by the system font-size setting, so the same phone hands this row a
   third less room for a reader who asked for large text. */
#styler .btn{flex:0 0 auto}
#styler .tab{flex:0 .01 auto;min-width:0;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
#stylerPreset{flex:5 20 9em;min-width:2.6em;max-width:14em}
/* Two tabs over one textarea: the split is the whole teaching device, so the
   selected one is stated in colour AND in aria-selected, not by position. */
#styler .tab{font:inherit;font-size:12px;line-height:1.2;padding:.34em .7em;
  color:var(--fg-soft);background:var(--bg-card);border:1px solid var(--line);
  border-radius:8px;cursor:pointer}
#styler .tab:hover{color:var(--fg);border-color:var(--fg-faint)}
#styler .tab[aria-selected="true"]{color:var(--fg);border-color:var(--accent);
  background:var(--accent-soft)}
/* One glyph, two questions. Faint: this box holds something - readable while
   looking at the other tab, without which "do I have custom styles?" can only
   be answered by clicking both. Accent: and it is not saved yet, which is why
   it also shows on a box someone has just emptied. The colour is never the
   only carrier: the tab's title says it in words. */
#styler .tab[data-has="1"]::after{content:"•";margin-left:.35em;color:var(--fg-faint)}
#styler .tab[data-dirty="1"]::after{content:"•";margin-left:.35em;color:var(--accent)}
#styler .tab:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
#styler .btn{font-size:13px}
#stylerCSS{flex:1 1 auto;min-height:0;width:100%;margin-top:.5em;resize:none;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12.5px;line-height:1.5;tab-size:2;padding:.5em .6em;
  color:var(--fg);background:var(--bg-card);
  border:1px solid var(--line);border-radius:8px}
#stylerCSS:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
/* One line, never two: it is a location and a footnote, and it must not
   steal height from the editor on a phone. */
/* Two lines at most, and it may wrap: it carries the way back out of a bad
   rule, and an instruction truncated to an ellipsis is not an instruction. */
#stylerNote{margin-top:.4em;font-size:11px;line-height:1.4;color:var(--fg-faint);
  max-height:2.8em;overflow:hidden}
#stylerNote .p{cursor:pointer}
#stylerNote .p:hover{color:var(--fg-soft)}
/* The files pane occupies exactly the textarea's box, so switching tabs does
   not resize the sheet under the reader's thumb. */
#stylerFiles{flex:1 1 auto;min-height:0;width:100%;margin-top:.5em;overflow:auto;
  background:var(--bg-card);border:1px solid var(--line);border-radius:8px}
#stylerFiles .empty{padding:1.2em .8em;text-align:center;color:var(--fg-faint);
  font-size:12px;line-height:1.5}
#stylerFiles .f{display:flex;align-items:center;gap:.6em;padding:.4em .6em;
  border-bottom:1px solid var(--line)}
#stylerFiles .f:last-child{border-bottom:0}
/* A fixed box whatever the image's shape: a column of thumbnails that each
   set their own height is a list nobody can scan. */
#stylerFiles .th{flex:0 0 auto;width:2.4em;height:2.4em;border-radius:5px;
  object-fit:cover;background:var(--bg);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-size:9px;letter-spacing:.02em;color:var(--fg-faint);overflow:hidden}
#stylerFiles .n{flex:1 1 auto;min-width:0;cursor:pointer}
#stylerFiles .n b{display:block;font-weight:500;font-size:12.5px;color:var(--fg);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stylerFiles .n s{display:block;text-decoration:none;font-size:11px;color:var(--fg-faint)}
#stylerFiles .n:hover b{color:var(--accent)}
#stylerFiles .btn{flex:0 0 auto;font-size:12px;padding:.25em .55em}

/* ── dictionaries panel ────────────────────────────────────────────── */
#panel{position:fixed;inset:0;z-index:200;display:none;background:color-mix(in srgb,var(--fg) 24%,transparent)}
#panel.show{display:block}
/* A modal owns the wheel. Open, the page behind it is inert — its links are
   under a scrim, a click there closes the panel — so it must not keep its
   scrollbar: two parallel bars, and a wheel over the scrim moving a page
   nobody can read. One visible thing to scroll, one scrollbar. Locked
   on the root, not body: the root is the viewport's scroller. The scroll
   offset survives untouched — overflow:hidden keeps scrollTop, it only refuses
   input.
   Removing a classic scrollbar widens the viewport, and everything laid out
   against it would slide sideways by the bar's width. So the width the bar
   took (--wd-sbw, measured by showPanel just before the lock) is handed back
   as padding to the two boxes sized by the viewport: body for the flow, .bar
   for the fixed toolbar. Not scrollbar-gutter:stable — that holds the strip
   open as dead space beside the drawer, and on every page too short to scroll.
   The scrim, being inset:0, covers the strip the bar occupied. With
   overlay scrollbars (macOS default, Android, iOS) the measure is 0 and
   nothing moves. The styler is deliberately not here: it is a docked sheet
   whose purpose is scrolling the article it restyles. */
html:has(#panel.show){overflow:hidden}
html:has(#panel.show) body,
html:has(#panel.show) .bar{padding-right:var(--wd-sbw,0px)}
.panel-card{position:absolute;top:0;right:0;bottom:0;width:min(420px,92vw);
  background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow);
  padding:0 var(--sp-3);
  /* position:fixed;inset:0 under it, so this card is the one element that
     spans both insets by itself — but only the TOP inset is here. The card
     does not scroll (.panel-scroll does), and a bottom pad on a box that does
     not scroll would hold the gap open above the nav bar instead of letting the
     last card slide out from under it. */
  padding-top:var(--wd-inset-top,0px);
  display:flex;flex-direction:column;overflow:hidden}
/* One scroll container inside a fixed head, rather than a sticky head inside a
   scrolling card (D143). That is what frees top:0 of the scroller for the
   master switch below: two rows that must stay put, done by ordinary layout —
   no measured offset, no second stacking context, nothing to keep in sync.
   min-height:0 is not optional: a flex child's default min-height:auto refuses
   to shrink below its content, and the card would grow instead of scrolling. */
/* contain: reaching either end of the list stops there — no rubber-band
   handoff to the (locked) page, no pull-to-refresh on touch. */
.panel-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding-bottom:calc(var(--sp-3) + var(--wd-inset-bottom,0px))}
.panel-card h2{margin:0 0 var(--sp-2);font-size:16px;color:var(--fg);
  display:flex;align-items:center}
.panel-card h2 .headacts{display:flex;gap:var(--sp-1)}
/* The one item in the head row that may give: at 320px the title, the text
   size and ◐ ✕ do not all fit, and the controls are the part that must stay
   whole. */
.panel-card h2 .ttl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* the theme button only exists here on narrow screens, where the bar has no
   room for it; see the responsive block */
#panelTheme{display:none}
/* Identity, the text size, the close button and the dictionary filter, and
   nothing else (D143 Am. 1). With 55 dictionaries the ✕ must not be somewhere
   up the page, so this row never scrolls. Nothing that spends disk or starts
   work on the server belongs in it: top-right is the most-clicked real estate
   in the panel (D31). The filter only hides cards in this page. */
.panel-head{flex:none;background:var(--bg);padding:var(--sp-3) 0 0}
/* Finding one dictionary among a hundred. In the row that never scrolls, so
   the field stays where it was typed into while the list under it shrinks.
   Same field as the search box: the global input[type=search] rule, its ⌕ in
   the left padding, and the native ✕ at the trailing edge. */
.pfrow{display:flex;gap:var(--sp-1);margin:0 0 var(--sp-2)}
.pfind{position:relative;display:flex;flex:1;min-width:0}
.pfind svg{position:absolute;left:.62em;top:50%;margin-top:-7px;width:14px;height:14px;
  color:var(--fg-faint);pointer-events:none}
/* The head row's own button shape (.fs), at the field's full height. */
#azBtn{flex:none;font:inherit;font-size:12px;padding:0 .7em;cursor:pointer;
  color:var(--fg-soft);background:var(--bg-card);border:1px solid var(--line);border-radius:8px;
  transition:color var(--t-1),border-color var(--t-1)}
#azBtn:hover,#azBtn[aria-expanded=true]{color:var(--fg);border-color:var(--accent)}
#azBtn:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
/* Unpinning everything loses an order the user made, and asks first - in
   place, under the button, the way Remove… asks on its card. Amber and not
   the removal's hazard stripes: the order can be made again, the files that
   Remove… deletes cannot, and a warning that looks like that one for less
   would teach readers to stop reading it. */
.azq{font-size:12px;color:var(--fg-soft);line-height:1.6;margin:0 0 var(--sp-2);
  border:1px solid var(--accent);border-radius:8px;padding:.5em .6em;background:var(--accent-soft)}
.azq b{color:var(--fg)}
.azgo{display:inline-block;font:inherit;font-size:10.5px;font-weight:600;cursor:pointer;
  border:1px solid var(--accent);border-radius:99px;padding:.1em .6em;margin:.35em .3em .1em 0;
  color:#1f1a12;background:var(--accent)}
.azgo:hover{filter:brightness(1.08)}
/* ▲ ▼ and the drag handle place a card against neighbours in the WHOLE list,
   which a filtered list does not show, so they leave. To-top and the pin keep
   meaning the same thing. */
#panelList.filtered .ord [data-mv=up],#panelList.filtered .ord [data-mv=down],
#panelList.filtered .grip{display:none}
/* Between the pinned dictionaries and the rest, which are always A–Z (D166).
   Shown only when both sides of it are. */
#panelList .pdiv{display:flex;align-items:center;gap:var(--sp-2);margin:var(--sp-2) 0;
  color:var(--fg-faint);font-size:11px;letter-spacing:.05em}
#panelList .pdiv::before,#panelList .pdiv::after{content:"";flex:1;border-top:1px solid var(--line)}
#panelList .pdiv[hidden]{display:none}
#panelList .nofind{margin:var(--sp-2);color:var(--fg-faint);font-size:12px}
/* The master switch sits in the same right-hand column as the per-card ones,
   so the column reads as one control surface instead of a stray toggle
   (right padding = card padding + its 1px border). It sits DIRECTLY above
   the first card with nothing of another domain in between (D143): alignment
   across an interruption is a far weaker cue than adjacency. Sticky at the
   top of the scroller, so adjacency and persistence stop competing — the cards
   pass underneath the control that scopes them, which is why the background
   must be opaque. */
.allrow{position:sticky;top:0;z-index:1;background:var(--bg);
  display:flex;align-items:center;gap:.35em;
  padding:var(--sp-1) calc(var(--sp-2) + 1px) var(--sp-1) var(--sp-2);
  border-bottom:1px solid var(--line);margin-bottom:var(--sp-1)}
.allrow label{flex:1;color:var(--fg-soft);font-size:12px;cursor:pointer;user-select:none}
.en:indeterminate{background:var(--accent)}
.en:indeterminate::after{transform:translateX(7px);width:14px;border-radius:3px}
.pd{border:1px solid var(--line);border-radius:8px;background:var(--bg-card);
  padding:var(--sp-1) var(--sp-2);margin-bottom:var(--sp-1);font-size:13px}
.pd.dragging{opacity:.45}
.pd.drop-before{box-shadow:0 -2px 0 var(--accent)}
.pd.drop-after{box-shadow:0 2px 0 var(--accent)}
.pd.off{opacity:.5}
.pd .hd{display:flex;align-items:center;gap:.35em}
.pd .grip{cursor:grab;color:var(--fg-faint);user-select:none;font-size:14px;
  line-height:1;letter-spacing:-.15em;padding-right:.15em}
.pd .grip:active{cursor:grabbing}
/* The title is a control (see the panel's click handler), so it has to look
   like one on the way to being pressed rather than only after. flex:1 serves
   the layout and doubles as a generous target. */
.pd b{color:var(--fg);font-size:14px;word-break:break-word;flex:1;cursor:pointer}
.pd b:hover{color:var(--link);text-decoration:underline;text-underline-offset:2px}
.pd b:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
.pd .ord{display:flex;gap:.1em;margin-left:auto}
.pd .ord button{background:none;border:0;color:var(--fg-faint);cursor:pointer;
  font-size:12px;line-height:1;padding:.15em .2em;border-radius:4px}
.pd .ord button:hover{color:var(--fg);background:var(--line-soft)}
.pd .ord button:disabled{opacity:.3;cursor:default;background:none}
.pd .ord svg{width:14px;height:14px;display:block}
.pd .ord .pin path{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
.pd .ord .pin[aria-pressed=true]{color:var(--accent)}
.pd .ord .pin[aria-pressed=true] .head{fill:currentColor}
/* HTML drag and drop does not start from a touch, so on a touch screen the
   handle would be a promise nothing keeps; ▲ ▼ order the pinned there. The
   move buttons grow to a thumb's size without growing the row: the padding
   is the target, the negative margin gives the height back. */
@media (pointer:coarse){
  .pd .grip{display:none}
  .pd .ord button{min-width:34px;padding:11px 6px;margin:-11px 0}
}
.en{appearance:none;width:32px;height:18px;border-radius:9px;background:var(--line);
  position:relative;cursor:pointer;flex:none;transition:background .15s}
.en:checked{background:var(--accent)}
.en::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;
  border-radius:50%;background:#fff;transition:transform .15s}
.en:checked::after{transform:translateX(14px)}
/* partial: knob centred on a half-tinted track — readable as "some", never
   mistaken for the full-accent "all" */
.en:indeterminate{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.en:indeterminate::after{transform:translateX(7px)}
.en:disabled{opacity:.4;cursor:default}
.en:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pd .meta{color:var(--fg-faint);font-size:11.5px;margin:.15em 0 .3em}
.pd .feat{display:inline-block;border:1px solid var(--line);border-radius:99px;
  padding:.05em .55em;margin:.15em .25em .15em 0;font-size:10.5px;color:var(--fg-faint);
  cursor:pointer;user-select:none;transition:color .12s,border-color .12s,background .12s}
.pd .feat:hover{border-color:var(--accent);color:var(--accent)}
.pd .feat.on{border-color:var(--accent);color:#fff;background:var(--accent)}
.pd .feat.on:hover{opacity:.82}
.pd .feat.locked{cursor:default;opacity:.5}
.pd .feat.locked:hover{border-color:var(--line);color:var(--fg-faint)}
.pd .feat.on.locked:hover{border-color:var(--accent);color:#fff;opacity:.5}
.pd .feat.busy{border-style:dashed;cursor:default}
/* stale: still on, still working, but rebuildable — a dotted edge reads as
   "provisional" without the alarm of an error colour */
.pd .feat.on.stale{border-style:dotted;border-color:var(--fg-faint)}
.pd .tag{display:inline-block;border:1px solid var(--line);border-radius:5px;
  padding:0 .4em;font-size:10.5px;color:var(--fg-soft);margin-right:.25em}
.pd .tag.on{color:var(--accent);border-color:var(--accent)}
.act{color:var(--link);cursor:pointer;text-decoration:underline;
  text-underline-offset:2px;font-size:12px;margin-right:var(--sp-2)}
/* Removal (D63, amended). It lives inside the collapsed file list (.provbody),
   which is why it is allowed to be this loud: a card at rest shows none of it,
   and by the time any of it is on screen the user has opened the section that
   lists exactly what would be deleted. Danger colour on the trigger, a
   hazard-striped panel for the confirmation, and the irreversible choice is
   the only filled button on the card. Loud is not the same as easy: the
   choices still name what they delete, and cancel is still the quiet one. */
/* A rule of its own above the control: the paths end, the danger begins. */
.pd .rmwrap{margin-top:.45em;padding-top:.4em;border-top:1px dashed var(--line)}
.pd .rm{display:inline-block;color:var(--danger);cursor:pointer;font-size:11px;
  font-weight:600;letter-spacing:.02em;border:1px solid var(--danger-line);
  border-radius:99px;padding:.1em .6em;background:var(--danger-soft);
  user-select:none;transition:background var(--t-1),color var(--t-1)}
.pd .rm:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
/* The confirmation is a hazard panel, not a sentence: diagonal stripes in the
   danger colour at low alpha, so it reads as cordoned-off area at a glance and
   still passes contrast for the text on top of it. */
.pd .rmq{display:block;font-size:11.5px;color:var(--fg-soft);line-height:1.7;
  border:1px solid var(--danger);border-radius:8px;padding:.5em .6em;
  margin-top:.2em;background:var(--danger-soft);
  background-image:repeating-linear-gradient(-45deg,
    color-mix(in srgb,var(--danger) 9%,transparent) 0 6px,
    transparent 6px 14px)}
.pd .rmq b{color:var(--fg)}
.pd .rmq .rmwarn{display:block;color:var(--danger);font-weight:700;
  font-size:12px;letter-spacing:.01em;margin-bottom:.15em}
.pd .rmgo{display:inline-block;border:1px solid var(--danger);border-radius:99px;
  padding:.1em .6em;margin:.35em .3em .1em 0;font-size:10.5px;font-weight:600;
  color:var(--danger);background:var(--bg-card);cursor:pointer;user-select:none}
.pd .rmgo:hover{background:var(--danger);color:#fff}
/* The irreversible one is filled in, and breathes. Everything else on this
   card is a thin outline, so a solid block of danger colour is unmistakably
   not one of them. */
.pd .rmgo[data-rm="all"]{background:var(--danger);color:#fff;
  box-shadow:0 0 0 0 color-mix(in srgb,var(--danger) 60%,transparent);
  animation:rmpulse var(--t-6) ease-out infinite}
.pd .rmgo[data-rm="all"]:hover{background:var(--danger);
  filter:brightness(1.08);animation:none}
@keyframes rmpulse{
  0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--danger) 55%,transparent)}
  70%{box-shadow:0 0 0 .45em transparent}
  100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.pd .rmgo[data-rm="all"]{animation:none}}
.pd .rmgo.busy{border-style:dashed;cursor:default;background:none;
  color:var(--fg-faint);animation:none;box-shadow:none;filter:none}
/* Cancel is a button too, and green — the one way out of a panel that is
   otherwise entirely red. It is a peer of the others in shape and size, but
   outlined where the irreversible one is filled and pulsing: equal standing,
   not equal pull. Green also carries the meaning by itself, which matters on a
   phone where the labels are small and the thumb is fast. */
.rmno{display:inline-block;border:1px solid var(--safe-line);border-radius:99px;
  padding:.1em .6em;margin:.35em .3em .1em .15em;font-family:inherit;font-size:10.5px;font-weight:600;
  color:var(--safe);background:var(--safe-soft);cursor:pointer;user-select:none;
  transition:background var(--t-1),color var(--t-1)}
.rmno:hover{background:var(--safe);border-color:var(--safe);color:#fff}
/* The answers of a confirmation, which a thumb must not miss: about 30px tall
   instead of 20 (measured on a 411px-wide phone). After every rule it sizes,
   which would otherwise win at the same specificity. */
@media (pointer:coarse){.azgo,.rmno,.pd .rmgo{padding:.55em 1em}}
/* A provenance row is a PATH plus optional annotations, held as separate
   elements rather than composed into one sentence — the path carries what it
   copies in data-full, so nothing downstream has to take a display string
   apart again to find it (see D49). */
.pd .prow{font-size:10.5px;color:var(--fg-faint);overflow-wrap:break-word}
.pd .prow.sub{opacity:.8}
.pd .pfx{color:var(--fg-soft)}
.pd .path{color:var(--fg-faint);cursor:pointer}
.pd .err{color:#c0564f}
/* Not a .feat: those chips are switches that spend disk, and this one only
   opens a page. Same muted register as the provenance rows under it. */
.pd .acts a.browse{display:inline-flex;align-items:center;gap:.35em;margin-top:.3em;
  font-size:11.5px;color:var(--fg-faint);text-decoration:none}
.pd .acts a.browse:hover{color:var(--accent)}
.pd .acts a.browse svg{width:13px;height:13px;flex:none}
/* Folders & configuration: a quiet disclosure under the dictionary cards.
   It answers "where is it looking?", "where did my prepared data go?" and
   "which config file is in effect?" — otherwise only visible on the terminal
   at startup, which someone who opened the app in a browser never sees. */
/* Settings live one line under the master switch, not at the foot of a
   55-card list where nobody scrolls. The cog carries the meaning (show, don't
   tell) while title/aria-label keep the name for tooltips and screen readers;
   the counts double as the panel's scope, so the line earns its place even
   when it is never clicked. An inline SVG rather than ⚙️: emoji renders as a
   colour blob on one platform and flat on another, sits on its own baseline,
   and cannot inherit currentColor. */
#folders{margin:0 var(--sp-2) var(--sp-1);padding-bottom:var(--sp-1);
  border-bottom:1px solid var(--line)}
#folders>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:.5em;
  color:var(--fg-faint);font-size:12px;padding:.15em 0;border-radius:6px}
#folders>summary::-webkit-details-marker{display:none}
#folders>summary:hover,#folders[open]>summary{color:var(--fg-soft)}
#folders>summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#folders .cog{width:14px;height:14px;flex:none;transition:transform .2s}
#folders>summary:hover .cog{transform:rotate(30deg)}
#folders[open] .cog{transform:rotate(60deg)}
/* Truncates rather than wrapping: this line must stay ONE line at 320px, and
   the count is the half that can afford to lose its tail. */
/* groups.ini has lines the app skipped (D162): shown on the drawer, which is
   always on screen, because the cost - a group that quietly matches nothing -
   is otherwise invisible until someone opens the editor. */
#folders .gwarn{flex:none;color:var(--danger);font-size:13px}
#groupsLink.warn{color:var(--danger);border-color:var(--danger-line)}
#folders .fsum{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;color:var(--fg-faint)}
/* ── article text size ──────────────────────────────────────────────
   In the panel's head row, pushed right, and held 40px - more than a button's
   width - clear of the ◐/✕ cluster, so a press meant for the size cannot land
   on the close button. No "Font size" label: "17px" already says what the
   number is. The buttons are dimmed at the bounds, never disabled; clamping
   in applyFS is what holds the range, .lim only says so. */
/* The font is set on the group and the buttons inherit it (font:inherit): it
   sits inside the h2, whose bold and 16px are the title's, not the control's. */
.panel-head .fs{margin-left:auto;margin-right:40px;flex:none;display:flex;align-items:center;gap:2px;
  font-weight:400;font-size:12px;font-variant-numeric:tabular-nums}
.panel-head .fs button{font:inherit;line-height:1;margin:0;padding:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--fg-soft);background:var(--bg-card);border:1px solid var(--line);
  border-radius:8px;transition:color .12s,border-color .12s,opacity .12s}
.panel-head .fs button:hover{color:var(--fg);border-color:var(--fg-faint)}
.panel-head .fs button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.panel-head .fsbtn{width:28px;height:28px}
.panel-head .fsbtn.lim{opacity:.3}
/* min-width holds "32px" - the widest value - so the two buttons never move
   as the number changes; tabular-nums (on .fs) holds the digits still within it. */
.panel-head .fsval{height:28px;min-width:40px;padding:0 3px}
#folders .grp{margin:.5em 0 .2em;color:var(--fg-faint);font-size:11px;
  text-transform:uppercase;letter-spacing:.05em}
/* One row = a path (long, variable) beside its facts (short, fixed). If ONLY
   the path could shrink it would always lose and break mid-word, so the path
   refuses to go under 24ch and the facts travel as ONE unit, so
   when the row runs out of room that unit drops to a line of its own and the
   path takes the full width. One line when it fits, two when it must — no
   media query, and no doubled height on rows that never needed it. */
#folders .frow{display:flex;flex-wrap:wrap;align-items:baseline;
  column-gap:.6em;padding:.15em 0}
#folders .frow .p{flex:1 1 auto;min-width:min(24ch,100%);overflow-wrap:break-word;
  color:var(--fg-soft);font-size:11.5px;cursor:pointer}
#folders .frow .meta{margin-left:auto;display:flex;align-items:baseline;gap:.9em;
  white-space:nowrap}
#folders .frow .n{color:var(--fg-faint);font-size:11px}
#folders .frow .n.bad{color:#c0564f}
#folders .rv{color:var(--fg-faint);font-size:11px;cursor:pointer}
#folders .rv:hover{color:var(--link);text-decoration:underline}
#folders .frow:hover .rv{color:var(--fg-soft)}
/* Not peers, and not drawn as peers. These three are frequent controls and
   wear a bounded hit region: on the web an affordance is a BOUNDARY, not a
   pictograph beside a word — a border is what says "aim here", which an emoji
   never says. Quietest possible bounding
   in this system: --line (the faintest rule) over --bg-card, which on --bg is
   barely a tint, so the edge does all the work and no colour is spent — and
   colour is load-bearing here (--accent means "on"), so a row of saturated
   glyphs would spend the one pre-attentive channel the design reserves.
   font-family:inherit is not optional: #rescanBtn is a real <button>, and a
   button that does not ask for it renders in the UA stack, not var(--font). */
.facts{display:flex;flex-wrap:wrap;gap:.45em;align-items:center;margin-top:.7em}
/* The reading row: the first thing under the cog, apart from the setup row
   below it by a little more than a row's own gap. Its left edge is #folders'
   own inline margin. */
.facts.reading{margin:.7em 0 .9em}
.facts .act[hidden]{display:none}
.facts .act{display:inline-flex;align-items:center;gap:.4em;
  font-family:inherit;font-size:11.5px;line-height:1.2;padding:.28em .6em;margin:0;
  color:var(--fg-soft);background:var(--bg-card);
  border:1px solid var(--line);border-radius:8px;
  text-decoration:none;cursor:pointer;transition:color .12s,border-color .12s}
.facts .act:hover{color:var(--fg);border-color:var(--fg-faint);text-decoration:none}
.facts .act:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
/* Two exclusive strategies, so they are drawn as ONE control: a shared edge,
   square inner corners, and the accent on whichever half is in force. Buttons
   and not radio inputs for the same reason the row above gives — this row is
   made of buttons, and one native control among them would read as a different
   kind of thing. The span is a different element type from the buttons, so
   :first/:last-of-type below address the two halves and never the label. */
.facts .seg{display:inline-flex;align-items:center;gap:.4em}
.facts .seg>span:not(.chips){font-size:11.5px;line-height:1.2;color:var(--fg-faint)}
.facts .seg .act{position:relative;border-radius:0}
.facts .seg .act:first-of-type{border-radius:8px 0 0 8px}
.facts .seg .act:last-of-type{border-radius:0 8px 8px 0;margin-left:-1px}
/* Raised over its neighbour so the edge they share is the accent one; the
   :hover pairing keeps the pressed half from losing the accent under a pointer
   that is on its way to the other half. */
.facts .seg .act[aria-pressed="true"],
.facts .seg .act[aria-pressed="true"]:hover{color:var(--accent);border-color:var(--accent);z-index:1}
/* Independent switches, not halves of one choice: each keeps its own corners
   and edge. After the rules above, which it must override at equal weight. */
.facts .seg.multi{flex-wrap:wrap}
.facts .seg.multi .act{border-radius:8px;margin-left:0}
/* Two layouts and nothing between them: the switches travel as ONE box, so
   when the row is too narrow for label and box together the whole box drops
   under the label instead of shedding its last button onto a ragged second
   line. Decided by the content itself, not a breakpoint, so it holds for any
   number of sections, any label length and any text size. Wrapping inside
   the box is the last resort, reached only when the box alone is wider than
   the panel. gap:inherit keeps the spacing identical in both layouts. */
.facts .seg.multi .chips{display:inline-flex;flex-wrap:wrap;gap:inherit}
/* A box, empty or ticked: the mark of a switch that is one of several and
   independent of the others — the pairs above, where one excludes the other,
   carry none. The box is drawn in both states, so the label never moves on
   toggle; only the tick comes and goes. Accent with the rest of the pressed
   button, and kept there under the pointer. */
.facts .seg.multi .act[aria-pressed="true"] svg{color:var(--accent)}
.facts .seg.multi .act[aria-pressed="false"] .tick{display:none}
.facts .seg[hidden]{display:none}
/* As wide as the choice it shows, not its longest option: "3" in a box sized
   for "1, first to show a result" reads as an empty field. Where the browser
   does not size a select to its content, the longest option sets the width. */
.facts .seg select{font:inherit;font-size:11.5px;line-height:1.2;padding:.25em .4em;max-width:none;field-sizing:content}
/* One step fainter than the label, so the glyph reads as a mark on the control
   rather than as a second word. Both idioms below (fill and stroke) resolve
   through currentColor, so this one declaration colours all three — and they
   follow the theme, which is exactly what emoji could not do. */
.facts .act svg{width:14px;height:14px;flex:none;color:var(--fg-faint)}
.facts .act:hover svg{color:var(--fg-soft)}
/* Read aloud off: the same speaker, silent. Only the waves go; the svg keeps
   its fixed 14px box (flex:none above), and the cone stays where it was
   inside it, so neither the glyph nor the label shifts on toggle. */
#speakBtn[aria-pressed="false"] .wave{display:none}
/* It belongs with the other things you came to this drawer to DO, so it wears
   the row's chrome — but it still reveals a choice rather than performing one,
   and it keeps the ▸/▾ every other disclosure in this app uses (#folders,
   .prov, .pd .about) to say so. Chrome answers "aim here", the marker answers
   "and then you will be asked": the two are not the same promise, and this
   control needs both. The marker is driven by aria-expanded, which
   openFtsAll/closeFtsAll already maintain, so there is no second source of
   truth to drift from #ftsAllBox.hidden. The accent while open is the tie
   between the trigger and the panel it opened, since the panel is not
   adjacent to it once the row wraps. */
.facts .act.disc::before{content:"▸";color:var(--fg-faint);font-size:9px;
  display:inline-block;width:.8em;flex:none;text-align:center}
.facts .act.disc[aria-expanded="true"]::before{content:"▾";color:var(--accent)}
.facts .act.disc[aria-expanded="true"]{color:var(--accent);border-color:var(--accent)}
/* An action that spends disk and CPU states its price where it is triggered,
   in the same breath as the trigger — not in a tooltip, and not after the
   fact (D31). It is now cordoned off the way a removal confirmation is
   (.pd .rmq): same construction, same diagonal stripes, deliberately NOT the
   same colour. Danger is reserved for what cannot be undone; this spends disk
   and time and can be undone one dictionary at a time, which is what the panel
   says in words — so it borrows the accent, the colour this design already
   uses for "on". Loud enough to find after the row wraps, never loud enough to
   read as a warning. */
.bulkbox{margin-top:.6em;padding:.6em .7em;border:1px solid var(--accent);
  border-radius:8px;background:var(--accent-soft);
  background-image:repeating-linear-gradient(-45deg,
    color-mix(in srgb,var(--accent) 8%,transparent) 0 6px,
    transparent 6px 14px);
  font-size:11.5px;color:var(--fg-soft);line-height:1.5}
.bulkbox p{margin:0 0 .5em}
.bulkbox p:last-child{margin-bottom:0}
.bulkbox .cost{color:var(--fg-faint)}
.bulkbox .btn{font-size:11.5px;padding:.25em .6em;margin-right:.4em}
#folders .warn{color:#c0564f;font-size:11.5px;margin:.3em 0}
/* The orphan review (D156) is a bulkbox like the full-text one: a situation to
   decide on, not an alarm. Only the delete button wears the danger colour,
   and only while it would delete something - "Keep all" is not dangerous.
   The list scrolls on its own so a long one cannot push the buttons away. */
.orphbox ul{list-style:none;margin:.3em 0 .5em;padding:0;max-height:16em;overflow:auto}
.orphbox li label,.orphbox .oall{display:flex;gap:.5em;align-items:flex-start;padding:.2em 0;cursor:pointer}
.orphbox .oall{display:inline-flex;align-items:center}
.orphbox input{margin:.2em 0 0;flex:none}
.orphbox .was{color:var(--fg-faint);overflow-wrap:anywhere}
.bulkbox .btn.danger{color:#fff;background:var(--danger);border-color:var(--danger)}
/* About: quiet by construction — one accent word, everything else the muted
   text colour, separated from the controls above by a hairline rather than a
   heading. It is an identity card, not a call to action. */
#folders .about{margin-top:.9em;padding-top:.7em;border-top:1px solid var(--line-soft)}
#folders .about .brand{font-size:13px;margin-right:.4em}
#folders .about .ver{font-size:10.5px;color:var(--fg-faint);font-variant-numeric:tabular-nums}
#folders .about p{margin:.35em 0 0;font-size:11.5px;color:var(--fg-faint);line-height:1.45}
#folders .about a{color:var(--fg-soft);text-decoration:none;border-bottom:1px solid var(--line)}
#folders .about a:hover{color:var(--link);border-bottom-color:currentColor}
.pd .prov,.pd .prov1{font-size:10.5px;color:var(--fg-faint);overflow-wrap:break-word;margin-top:.15em}
/* The whole summary toggles, so the whole summary is the affordance: hover
   the row, not a fragment of it. Nothing in here is underlined — on the web an
   underline promises a link that goes somewhere else, and this goes nowhere. */
.pd .prov>summary{cursor:pointer;list-style:none;color:var(--fg-faint);
  border-radius:4px;padding:.05em .15em;margin-left:-.15em;transition:background .12s,color .12s}
.pd .prov>summary:hover{color:var(--fg-soft);background:var(--line-soft)}
.pd .prov>summary:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.pd .prov>summary::-webkit-details-marker{display:none}
.pd .prov>summary::before{content:"▸";color:var(--fg-soft);display:inline-block;width:1em;font-size:9px}
.pd .prov[open]>summary::before{content:"▾"}
.pd .fmt{color:var(--fg-soft);text-transform:uppercase;font-size:9px;letter-spacing:.04em}
/* companion media count ("+ 2 mdd"): part of the summary text, not a control.
   Not class "more": the search-results "more…" link's document handler would
   match it, cancel the disclosure toggle and throw looking for a details.dict
   that does not exist here. */
.pd .companions{color:var(--fg-soft)}
.pd .provbody{margin:.2em 0 0 1em;display:flex;flex-direction:column;gap:.1em}
/* "About" — what the dictionary says about ITSELF (/api/about). Same
   disclosure MECHANICS as .prov above, one size up, because this one is prose
   to be read rather than a path to be copied — but deliberately not the same
   chrome: two identical carets stacked one row apart read as a single list
   split by accident rather than as two things. The hairline puts this in the
   card's footer register, below the file
   facts, where a description belongs. The body is fetched on first open: an
   annotation can be a page long and there is one per dictionary. */
.pd .about{font-size:11px;color:var(--fg-faint);overflow-wrap:break-word;
  margin-top:.45em;padding-top:.4em;border-top:1px solid var(--line-soft)}
.pd .about>summary{cursor:pointer;list-style:none;color:var(--fg-faint);
  border-radius:4px;padding:.05em .15em;margin-left:-.15em;transition:background .12s,color .12s}
.pd .about>summary:hover{color:var(--fg-soft);background:var(--line-soft)}
.pd .about>summary:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.pd .about>summary::-webkit-details-marker{display:none}
.pd .about>summary::before{content:"▸";color:var(--fg-soft);display:inline-block;width:1em;font-size:9px}
.pd .about[open]>summary::before{content:"▾"}
.pd .aboutbody{margin:.2em 0 0 1em;line-height:1.45}
.pd .aboutbody p{margin:.25em 0}
.pd .aboutbody h4{margin:.5em 0 .1em;font-size:10px;text-transform:uppercase;
  letter-spacing:.04em;color:var(--fg-soft);font-weight:600}
.pd .aboutbody h4:first-child{margin-top:0}
.pd .aboutbody a{color:var(--fg-soft);text-decoration:none;border-bottom:1px solid var(--line)}
.pd .aboutbody a:hover{color:var(--link);border-bottom-color:currentColor}
.pd .aboutbody ul,.pd .aboutbody ol{margin:.25em 0;padding-left:1.2em}
.pd .aboutlangs{margin-top:.4em;color:var(--fg-soft)}
/* The traits the dictionary was filed under — the same values the picker's
   sections are built from, on the card that describes the dictionary. They are
   FACTS, not switches, so they deliberately do not borrow .feat's pill: a round
   accent chip on this card means "press to spend disk on an index". A caption
   above the value says which kind of fact it is without a legend, and the ones
   that are also a way in (the picker has that section) gain a border on hover;
   the rest sit quiet. */
.pd .traits{display:flex;flex-wrap:wrap;gap:.3em;margin:0 0 .5em 1em}
.pd .trait{display:inline-flex;flex-direction:column;align-items:flex-start;
  font:inherit;font-size:11px;line-height:1.3;color:var(--fg-soft);text-align:left;
  background:var(--line-soft);border:1px solid transparent;border-radius:5px;padding:.15em .5em}
.pd .trait .tk{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-faint)}
.pd button.trait{cursor:pointer;transition:color .12s,border-color .12s,background .12s}
.pd button.trait:hover{color:var(--accent);border-color:var(--accent);background:transparent}
.pd button.trait:hover .tk{color:var(--accent)}
.pd button.trait:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

/* ── responsive ────────────────────────────────────────────────────── */
@media (max-width:600px){
  /* ── one row, one pill, one escape hatch ───────────────────────────
     Nine controls as equals would cost an entire second row — 5.6em of
     permanent height on the device with the least of it. They are not
     equals: #q is the app, mode and dictionary are scope
     the user CONSULTS rather than operates, and the rest are view settings
     that the ☰ panel already houses. So the field takes the row and the
     scope rides inside it. */
  body{padding-top:calc(var(--barh) + var(--sp-2))} /* --barh is measured; see the boot script */
  .col{width:auto;padding-left:var(--sp-1);padding-right:var(--sp-1)}
  .container{padding-bottom:calc(var(--sp-4) + var(--wd-inset-bottom,0px))}
  /* Scoped to the top bar: the About wordmark inside the panel must survive
     on narrow screens — that is where the app says what it is. */
  .bar .brand{display:none}
  .bar form{flex-wrap:nowrap;gap:var(--sp-1)}
  /* Dropped rather than shrunk, because each is a big-screen affordance.
     ⇔: below 600 .col is already auto, so wide mode has nothing left to
     widen. ⊞: putting a hundred articles on screen at once is not a phone
     act. ◐ keeps working from the panel — see #panelTheme. (🔍 is not here:
     it is gone at every width, see the form markup.) */
  #wideBtn,#expandBtn,#frm .themeBtn{display:none}
  #panelTheme{display:block}
  /* ◐ joins the head row here, between the text size and ✕: it is the
     clearance that keeps a press meant for + off the close button, so the
     row gives back the margin it needs on a phone. */
  .panel-head .fs{margin-right:var(--sp-3)}

  .pill{display:flex;flex:1;min-width:0;align-items:center;gap:.25em;
    background:var(--bg-card);border:1px solid var(--line);border-radius:10px;
    padding:.1em .25em .1em .55em}
  .pill:has(#q:focus){border-color:var(--focus);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
  /* borderless inside: the pill wears the border now, and a field with its
     own would read as a box in a box. 16px is load-bearing, not decorative —
     iOS zooms the whole viewport on focus for anything smaller. */
  .pill .qbox{flex:1;min-width:0;max-width:none}
  .pill input[type=search]{width:100%;min-width:0;font-size:16px;
    border:0;background:none;border-radius:0;padding:.4em 0 .4em 1.55em}
  .pill input[type=search]:focus{box-shadow:none;border-color:transparent}
  /* flush with the pill's own left padding: inside the pill the field has no
     border of its own for the glyph to sit within */
  .pill .qled{left:0}

  /* A scope control is a chip with its real <select> laid transparently over
     it. The select keeps the native full-screen picker, the keyboard, the
     aria-label and its .value, so every call site that reads $("dict").value
     is untouched — only the rendering is replaced. */
  /* align-self:stretch and a min-width so the transparent select covers a
     whole 44px-tall target rather than just the 22px the chip's own text
     occupies — the chip is what you see, the seg is what you hit. */
  .bar .seg{display:flex;position:relative;flex:none;align-self:stretch;
    align-items:center;justify-content:center;min-width:40px}
  .bar .seg select{position:absolute;inset:0;width:100%;height:100%;margin:0;
    padding:0;border:0;max-width:none;opacity:0;-webkit-appearance:none;
    appearance:none}
  .bar .seg:has(select:focus-visible) .chip{outline:2px solid var(--focus);outline-offset:1px}
  .bar .seg:has(select:disabled){opacity:.55}
  .chip{display:flex;align-items:center;gap:.3em;max-width:11ch;
    white-space:nowrap;font-size:11.5px;line-height:1;color:var(--fg);
    background:var(--accent-soft);border-radius:7px;padding:.45em .3em .45em .45em}
  .chip::after{content:"";flex:none;width:0;height:0;margin-top:1px;
    border:3px solid transparent;border-top-color:var(--fg-faint)}
  .chip .lbl{overflow:hidden;text-overflow:ellipsis}
  .chip .bk{width:14px;height:14px;flex:none}
  /* The default carries no information, so it costs no attention: it recedes
     to the faint colour, and the dictionary drops its label outright —
     "All dictionaries" is what every session already is. Only a departure
     from the default is worth naming, which is also when the user needs
     reminding of it. (Same argument as the ~/… paths in the folders panel.) */
  .chip.dflt{background:none;color:var(--fg-faint)}
  .chip.dflt .lbl{display:none}

  /* Desktop gutters, reclaimed. Three nested insets of .618em — column, list
     and article — put 30px of a 360px screen into margins before a word of a
     definition; at .382em that is 18px. */
  dl{padding:var(--sp-1) var(--sp-1) var(--sp-2)}
  .article{padding:var(--sp-1)}
  details.dict>summary{padding-left:.4rem;padding-right:.4rem}
  .scopenote{padding-left:.4rem;padding-right:.4rem}

  /* The Custom styles sheet gives up the same gutter the column does, for the
     same reason, and its toolbar gives up the desktop gap and the desktop
     padding on top of that: at full metrics the nine controls want 352px of
     the 328px a 360px phone offers, and the 24px that do not fit are ✕.
     The shrink order above keeps the sheet closable at any width; this is
     what keeps it from ever having to use it. */
  #styler{padding-left:var(--sp-1);padding-right:var(--sp-1)}
  #styler .row{gap:.25em}
  #styler .tab{font-size:11.5px;padding:.32em .5em}
  #styler .btn{font-size:12.5px;padding:.28em .45em}
}
</style>
<!-- The user's own stylesheet for the app itself, injected by the server as a
     <link> only when the file exists. Last in <head> on purpose: it wins every
     tie against the sheet above, and being render-blocking it is already in
     force at first paint, so a reader who chose sepia never sees a white
     flash. /?style=off omits it. -->
{{USERCSS}}
</head>
<body>
<header class="bar" id="bar">
<!-- The search controls start disabled and are released by setPhase() as soon
     as one dictionary is usable. Disabling in the markup (not from script)
     closes the window between first paint and the script running, which is
     exactly when an eager "type and hit Enter" would reach the search path
     with an empty dictionary list. -->
<form id="frm" class="col" role="search" aria-busy="true">
<span class="brand">wu<small>Dict</small></span>
<!-- The search pill. Above 600px it is display:contents, so the field and the
     two selects are direct flex children of the form. Below it the pill
     becomes the row:
     one border around field AND scope, so the field reads as large because it
     IS the row. Each chip carries the rendering; the <select> behind it stays
     real and keeps the native picker, the keyboard and the accessible name. -->
<span class="pill">
<!-- The field's leading glyph is the search indicator: ⌕ at rest, spinner in
     flight, one box, crossfaded. Nothing appears and nothing moves, so a
     search causes no layout event at all — and the native ✕ at the trailing
     edge keeps its pixels, which matters because it is present for EVERY
     search (an empty query never runs one) and it is a control the user has
     a motor habit for. .qbox is a real element at both widths; .pill is
     display:contents above 600px and could not position this. -->
<span class="qbox" id="qbox">
<span class="qled" aria-hidden="true">
<svg class="mag" viewBox="0 0 16 16" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M7.1 2.4a4.7 4.7 0 1 0 0 9.4 4.7 4.7 0 0 0 0-9.4zm3.6 8.3l3 3"/></svg>
<span class="spin"></span>
</span>
<!-- enterkeyhint is declared, not inferred: type=search happens to label the
     soft key "Search" on most Android builds, but that is a browser default
     and not a contract. -->
<input type="search" id="q" placeholder="Search…" autocomplete="off" enterkeyhint="search" autofocus aria-label="Search term" disabled>
</span>
<span class="seg">
<span class="chip" id="modeChip" aria-hidden="true"></span>
<select id="mode" aria-label="Search mode" disabled>
<option value="prefix">prefix</option>
<option value="exact">exact</option>
<option value="contains">contains</option>
<option value="fts">full-text</option>
</select>

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
/* For text going into a double-quoted attribute. esc alone is not enough
   there: a path may legally contain a quote, and one unescaped `"` ends the
   attribute and turns the rest of the path into markup. */
const escAttr=s=>esc(s).replace(/"/g,"&quot;");
let dicts=[],lastQuery=null,searchSeq=0,searchAC=null;

/* Preference order (ids) + disabled set. The order speaks only for the pinned
   dictionaries; every other one, a new one included, takes its A–Z place.

   These two live on the SERVER (~/.wudict/state.json), unlike the theme, the
   wide toggle and the dropdown selection, which stay in localStorage. The line
   is "does this describe the collection, or the browser looking at it?".
   localStorage is keyed by scheme://host:port, so a different port, 127.0.0.1
   instead of localhost, or a phone on the LAN each silently reset a curated
   list of a hundred dictionaries — and the server, which owns the
   dictionaries, is also the only thing that can act on the answer (it skips
   disabled ones when warming up). */
let prefOrder=[],disabled=new Set();
/* The pinned dictionaries (D166): they lead the list in prefOrder's order, and
   every other one follows A–Z, so one order serves both what answers first
   and finding a name. The panel, the picker, "All dictionaries" and the
   groups all list orderedDicts(). Server state with the order it shapes. */
let pinned=new Set();
/* Set while the saved list is an order of the whole library from before pins
   (version 1): its labels as saved, by id. convertOrder turns it into pins
   once the complete list of dictionaries is in. */
let convertNames=null;
/* Set when /api/dicts has delivered its last row. The picker's groups are
   counted over the complete list or not shown at all. */
let dictsSettled=false;
function loadJSON(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
/* One-time adoption of a pre-server build's localStorage, so upgrading does
   not silently throw away someone's curation. Self-erasing: the keys are
   removed as they are read, and the server file is authoritative from then on. */
function adoptLocalPrefs(){
  const o=loadJSON("wudict_order",null),d=loadJSON("wudict_disabled",null);
  if(!o&&!d)return false;
  if(Array.isArray(o))prefOrder=o;
  if(Array.isArray(d))disabled=new Set(d);
  localStorage.removeItem("wudict_order");localStorage.removeItem("wudict_disabled");
  return true;
}
let prefsReady=false;
let fullOn=false; // brief or full view for the next section that opens (fullInit)
/* The search mode the reader last PICKED, which is what is saved - not what
   #mode shows. A link, Back/Forward and searchFor set #mode too, and the next
   save of any other setting would otherwise store their choice as the
   reader's. Only the select's own change event moves this. */
let modePref="prefix";
/* #mode takes only a value it has an <option> for: any other value (a
   hand-typed ?mode=fuzzy) would leave the select blank and search with an
   empty mode. Reports whether it took the value. */
function setMode(v){
  const ok=[...$("mode").options].some(o=>o.value===v);
  if(ok)$("mode").value=v;
  return ok;
}
async function loadPrefs(){
  try{
    const r=await fetch("/api/prefs");
    if(!r.ok)throw new Error("HTTP "+r.status);
    const st=await r.json(),rows=st.dicts||[];
    // Read before the exists branch below returns: on a first run there is no
    // ui record, but there is also nothing here that can go wrong.
    if(st.ui){applyFS(st.ui.fontSize,false);applyHL(!st.ui.hlOff,false);applySpeak(!st.ui.speakOff,false);applyOpen(st.ui.fastFirst?"fast":st.ui.openAll?"all":String(st.ui.openN||1),false);applyGroupsOff(st.ui.groupsOff,false);fullOn=!!st.ui.full;modePref=st.ui.mode||"prefix";setMode(modePref)}
    uiBase=uiNow();
    dictsBase=rows.map(prefRow);
    // Last, so that a page whose baselines are not both in hand never saves:
    // savePrefs diffs against them.
    prefsReady=true;
    // first run: keep whatever we had; an order from localStorage has no pins
    if(!st.exists){if(adoptLocalPrefs())convertNames=new Map();return}
    prefOrder=rows.map(d=>d.id);
    disabled=new Set(rows.filter(d=>d.off).map(d=>d.id));
    pinned=new Set(rows.filter(d=>d.pin).map(d=>d.id));
    if((st.version||0)<2)convertNames=new Map(rows.map(d=>[d.id,d.name||""]));
  }catch(e){
    // A page that cannot read its settings must still search: fall back to
    // "everything enabled, alphabetical" rather than refusing to start.
    console.warn("could not load settings:",e);
  }
}
/* The ui record as this page holds it, and as it last read or wrote it. A save
   sends only the keys that differ from uiBase, and the server changes only the
   keys it is sent (prefs.go, update): another page on the same server - a
   second tab, or the Android app beside its lookup popup - may have changed a
   setting since this one loaded, and a full record would carry this page's
   stale copy of it back over the newer choice. uiBase moves only on a save
   that succeeded, and only by what was sent, so a failed key goes again with
   the next save. */
let uiBase=null;
/* The same rule for the dictionary list, whole: it is one ordering, so it is
   sent entire or not at all. Compared over the dictionaries this page can see,
   because the server keeps the records of the ones it cannot (an unmounted
   drive) and this page cannot speak for them. */
let dictsBase=null;
function uiNow(){
  return{fontSize:articleFS,hlOff:!hlOn,speakOff:!speakOn,fastFirst:!orderFirst,openN:openN>1?openN:0,openAll,groupsOff:[...groupsOff].sort(),full:fullOn,mode:modePref==="prefix"?"":modePref};
}
/* One dictionary's record as it is sent and compared: pin only when set, as
   the server stores it. */
function prefRow(d){
  const r={id:d.id,name:d.name||"",off:!!d.off};
  if(d.pin)r.pin=true;
  return r;
}
/* Debounced, and silent when nothing actually changed — ▲ ▼ pressed in a run
   sends the order once, and startup normalisation usually yields the list we
   just read, which is then not sent at all. */
let prefsTimer=null,prefsSent=null;
function savePrefs(now){
  clearTimeout(prefsTimer);
  // Never write a baseline we could not read: if the load failed, "nothing is
  // disabled, no order" is our ignorance, not the user's setting, and saving
  // it would destroy the real one.
  if(!prefsReady){setStatus("⚠ settings are not being saved — reload the page");return}
  if(!now){prefsTimer=setTimeout(()=>savePrefs(true),400);return}
  const ui=uiNow(),patch={};
  for(const k in ui)if(JSON.stringify(ui[k])!==JSON.stringify(uiBase[k]))patch[k]=ui[k];
  const rows=orderedDicts().map(d=>prefRow({id:d.id,name:dictLabel(d),off:disabled.has(d.id),pin:pinned.has(d.id)})),
    seen=new Set(rows.map(d=>d.id)),req={};
  if(JSON.stringify(rows)!==JSON.stringify(dictsBase.filter(d=>seen.has(d.id))))req.dicts=rows;
  if(Object.keys(patch).length)req.ui=patch;
  if(!req.dicts&&!req.ui)return;
  const body=JSON.stringify(req);
  if(body===prefsSent)return;
  prefsSent=body;
  fetch("/api/prefs",{method:"PUT",headers:{"Content-Type":"application/json"},body})
