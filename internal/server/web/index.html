<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wudict</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<script src="/assets/mark.min.js?v={{MARKJS}}"></script>
<style>
/* ── design tokens ─────────────────────────────────────────────────── */
:root{
  --fi:1.618;                     /* φ */
  --sp-1:.382em; --sp-2:.618em; --sp-3:1em; --sp-4:1.618em; --sp-5:2.618em;
  /* The same φ progression in the time domain. Geometric rather than linear
     for a reason that is not decorative: perceived duration grows roughly
     logarithmically, so equal RATIOS read as equal steps while equal
     DIFFERENCES do not — which is why f-stops, musical intervals and decibels
     are all geometric too. One ladder, so a duration is chosen by picking a
     rung rather than by taste. */
  --t-1:.236s; --t-2:.382s; --t-3:.618s; --t-4:1s; --t-5:1.618s; --t-6:2.618s;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --bg:#fbfaf8; --bg-card:#ffffff; --bg-bar:rgba(251,250,248,.92);
  --fg:#2b2a28; --fg-soft:#6d6a64; --fg-faint:#a5a19a;
  --accent:#e08600; --accent-soft:#fff3e0;
  --link:#5b7a99; --link-hover:#3f5e7d;
  --line:#e8e4dd; --line-soft:#f1eee8;
  --hl:#fff0b3; --hl-fg:#5c4a00;
  --focus:#7aa7d1;
  --shadow:0 1px 3px rgba(60,50,30,.07),0 4px 14px rgba(60,50,30,.05);
  /* --barh is the real bar height, measured at runtime (this value is only the
     pre-script fallback). --stick is where a stuck section header comes to
     rest; it collapses to 0 when the bar slides away, which is why the two are
     separate: a scroll correction always ends with the bar back on screen, so
     it must aim at --barh, never at a --stick that is momentarily 0. */
  --barh:3.1em;
  --stick:var(--barh);
}
html[data-theme="dark"]{
  --bg:#191a1c; --bg-card:#212327; --bg-bar:rgba(25,26,28,.92);
  --fg:#d8d5d0; --fg-soft:#96938d; --fg-faint:#5f5c57;
  --accent:#e69a33; --accent-soft:#3a2d18;
  --link:#8fb0cc; --link-hover:#b3cde3;
  --line:#33363b; --line-soft:#2a2c30;
  --hl:#4a3f10; --hl-fg:#ffe38a;
  --focus:#5b86ad;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
@media (prefers-color-scheme: dark){
  html:not([data-theme]){
    --bg:#191a1c; --bg-card:#212327; --bg-bar:rgba(25,26,28,.92);
    --fg:#d8d5d0; --fg-soft:#96938d; --fg-faint:#5f5c57;
    --accent:#e69a33; --accent-soft:#3a2d18;
    --link:#8fb0cc; --link-hover:#b3cde3;
    --line:#33363b; --line-soft:#2a2c30;
    --hl:#4a3f10; --hl-fg:#ffe38a;
    --focus:#5b86ad;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
}

/* ── chrome ────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;padding-top:4.236em;background:var(--bg);color:var(--fg);
  font-family:var(--font);line-height:var(--fi)}
/* ── the content column ─────────────────────────────────────────────
   One geometry, worn by the toolbar and the results alike, so their edges
   cannot drift apart. They used to be described separately: both capped at
   800px, but the cards sit φ⁻¹em inside that box (their own gutter) while the
   toolbar had no gutter of its own — below the cap .bar's padding stood in for
   one, above it nothing did. So the bar was wider than the content at every
   width over 600px, and invisibly so for as long as justify-content kept the
   controls away from their own boundary. Add a button, the cluster reaches the
   boundary, and the boundary turns out to be in the wrong place. */
.col{width:92%;max-width:800px;margin:0 auto;
  padding-left:var(--sp-2);padding-right:var(--sp-2);
  transition:max-width .25s ease} /* on .col so the bar eases with the cards */
body.wide .col{max-width:min(1280px,96vw)}
.container{padding-bottom:var(--sp-5)}

.bar{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--bg-bar);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  /* no horizontal padding: the bar is full-bleed and the gutter belongs to
     .col, which the form wears. Two insets would inset the form twice. */
  border-bottom:1px solid var(--line);padding:var(--sp-1) 0;
  transition:transform .28s ease}
.bar.hidden{transform:translateY(-100%)}
/* When the bar slides away, the stuck header takes the space it vacated
   instead of leaving a hole. Same .28s as the bar, so the two read as one
   piece of chrome moving rather than two things reacting to each other. */
body.barhidden{--stick:0px}
/* geometry comes from .col; this rule only arranges what is inside it */
.bar form{display:flex;align-items:center;gap:var(--sp-1);flex-wrap:wrap;
  justify-content:center}
/* The seam between "what am I searching" and "how am I viewing it". Pushing
   the view toggles to the right edge anchors both ends of the bar to the
   content column, so slack is absorbed in the middle instead of shoving the
   ends outward — a sixth button then costs nothing. Inert at 800px, where the
   controls already fill the row; it does its work in wide mode and any time a
   control is removed. Move this class if the button order ever changes. */
.bar form .tools{margin-left:auto}
.brand{font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.02em;
  margin-right:var(--sp-1);user-select:none;white-space:nowrap}
/* Wordmark: "WuWei" carries the accent, "Dict" recedes to normal weight — one
   colour, one weight step, no second font. */
.brand small{font-size:1em;color:var(--fg-soft);font-weight:400}
/* The geometry lives on .qbox so the glyph can be positioned against the
   field; the input only fills it. */
.qbox{position:relative;display:flex;flex:1;min-width:130px;max-width:300px}
input[type=search]{width:100%;min-width:0;font-size:16px;
  color:var(--fg);background:var(--bg-card);border:1px solid var(--line);
  border-radius:8px;padding:.35em .7em .35em 2em;outline:none;appearance:none}
input[type=search]:focus{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
/* ⌕ and spinner share ONE 14px box and crossfade, so going busy is a change
   of identity in an occupied box rather than an element arriving — the least
   intrusive transition available, and the only one that costs no layout.
   At rest the ⌕ also gives the field an identity, which matters most on
   narrow screens where the wordmark is hidden. */
.qled{position:absolute;left:.62em;top:50%;margin-top:-7px;width:14px;height:14px;
  color:var(--fg-faint);pointer-events:none}
.qled>*{position:absolute;inset:0;width:14px;height:14px;margin:0;
  transition:opacity var(--t-2) ease}
/* Peripheral by construction, in all four dimensions that make a spinner shout.
   SIZE: inset 2px inside the ⌕'s box — 10px, φ⁻¹ of the glyph, with the stroke
   thinned to match. COLOUR: currentColor, i.e. the SAME --fg-faint the ⌕ is
   already drawn in, and no visible ring behind the arc — so the morph changes
   nothing but geometry, and the accent stays reserved for headwords rather
   than being spent on a non-event. SPEED: see below. */
/* Explicit box, and margin:0 restated at THIS specificity. The shared .spin
   below carries margin-right:.4em for its inline uses, and it is declared
   later with the same specificity as .qled>*, so its margin wins there. That
   was harmless while the width was explicit — over-constrained absolute
   positioning simply drops `right` — but with width:auto the solver SPENDS
   the margin: 14 − 2 − 2 − 6.4 = 3.6px, a box too small to see. Never size an
   absolutely positioned box from insets alone when a shared class may put a
   margin on it.
   The arc is --fg-soft rather than the ⌕'s --fg-faint on purpose: a 1.5px
   stroke carries far less ink than the glyph's, so matching its LUMINANCE
   would not match its presence. One step up is what makes the two read as
   equally quiet. */
.qled .spin{top:2px;left:2px;right:auto;bottom:auto;width:10px;height:10px;
  margin:0;border-width:1.5px;border-color:transparent;
  border-top-color:var(--fg-soft);animation-duration:var(--t-6);opacity:0}
.qbox.busy .mag{opacity:0}
.qbox.busy .spin{opacity:1}
/* φ² seconds per revolution is 360°/φ² = 137.5° per second — the GOLDEN ANGLE
   per second, the divergence angle phyllotaxis advances a sunflower's seeds
   by. It is also 3.7× slower than the .7s the shared .spin uses elsewhere,
   which takes it out of the few-hertz band where a repeating motion reliably
   captures attention and into the register of a clock hand: unmistakably
   moving, demanding nothing. A fast spinner makes a promise — "wait for me to
   stop"; this one only reports. */
@media (prefers-reduced-motion:reduce){.qled .spin{animation:none}}
select{font-size:13px;color:var(--fg-soft);background:var(--bg-card);
  border:1px solid var(--line);border-radius:8px;padding:.3em .4em;max-width:180px}
/* The pill is INERT above 600px: display:contents leaves the field and the two
   selects as direct flex children of the form, which is the layout the bar has
   always had, and the chips are simply not rendered. The whole mobile
   treatment lives in the one media query at the end of this stylesheet — there
   is no second layout to keep in step, only a second set of rules for the same
   markup. */
.pill,.seg{display:contents}
.chip{display:none}
.btn{font-size:15px;background:var(--bg-card);color:var(--fg-soft);
  border:1px solid var(--line);border-radius:8px;padding:.3em .55em;cursor:pointer;line-height:1.2}
.btn:hover{color:var(--fg);border-color:var(--fg-faint)}
.btn:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

/* ── results ───────────────────────────────────────────────────────── */
/* Costs nothing until it has something to say. The old rule reserved
   16.1px of padding plus an 18.2px min-height — 34.3px above the first
   result, permanently, at every viewport, for a line that is empty for
   almost the whole session. (That min-height:1.4em was also the one number
   in this stylesheet off the φ ladder, and redundant: line-height is already
   φ, so 13px × 1.618 = 21.03px sizes the open state by itself.)
   grid-template-rows 0fr→1fr animates real height with no measurement and no
   magic number — and the padding sits INSIDE .txt, within the clipped row,
   so the closed state is 0px and not 0px-plus-padding. Progress no longer
   comes through here at all: "Searching…" is the field's own glyph now, so
   this opens only for statements worth reading. */
#status{display:grid;grid-template-rows:0fr;color:var(--fg-soft);font-size:13px;
  opacity:0;transition:grid-template-rows .28s ease,opacity .3s ease}
#status>.msg{overflow:hidden;min-height:0}
#status .txt{padding:var(--sp-2) 0}
#status.show{grid-template-rows:1fr;opacity:1}
/* one spinner, two homes: inline in #status, and large in the startup
   panel below (.empty) while the dictionary list is still arriving */
.spin{display:inline-block;width:1em;height:1em;border:2px solid var(--line);
  border-top-color:var(--accent);border-radius:50%;vertical-align:-.15em;
  animation:spin .7s linear infinite;margin-right:.4em}
.spin.big{display:block;width:30px;height:30px;border-width:3px;
  margin:0 auto var(--sp-2)}
@keyframes spin{to{transform:rotate(360deg)}}
/* overflow:CLIP, not hidden. Both clip to the border-radius identically, but
   `hidden` establishes a scroll container — which would silently defeat the
   sticky summary below, since a sticky element sticks to its nearest scrollport
   and this one would never scroll. `clip` creates no scrollport, so the summary
   sticks to the viewport while staying bounded by its own section. */
details.dict{margin-top:var(--sp-2);background:var(--bg-card);border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--shadow);overflow:clip;
  /* so scrollIntoView lands the section below the bar instead of under it,
     with no arithmetic and no re-derivation when the bar rewraps */
  scroll-margin-top:var(--barh)}
/* The section header stays put while you read inside it, so "which dictionary
   am I looking at" never has to be remembered — or scrolled back for. It is
   also the collapse control, which now stays within reach of a long article.
   The horizontal padding is in rem, not em, so shrinking the type below moves
   only the header's height and never the name's left edge. */
details.dict>summary{position:sticky;top:var(--stick);z-index:2;
  background:var(--bg-card);
  cursor:pointer;padding:var(--sp-1) .62rem;font-weight:600;
  color:var(--fg-soft);list-style:none;display:flex;align-items:center;gap:var(--sp-1);
  transition:font-size .16s ease,line-height .16s ease,padding .16s ease,top .28s ease}
/* Two jobs, two sizes. CLOSED, the header is a row in a list you scan across a
   hundred dictionaries — it wants presence. OPEN, you are reading the section
   and it has become a context label you consult occasionally — it wants to get
   out of the way. `[open]` is a free CSS state, so this needs no sentinel, no
   observer and no scroll handler, and the resize happens on a click the user
   made rather than as a surprise in their peripheral vision. ~39px → ~25px. */
details.dict[open]>summary{font-size:.8125rem;line-height:1.25;
  padding-top:.25rem;padding-bottom:.25rem}
details.dict[open]>summary .count{font-size:11px}
details.dict>summary::-webkit-details-marker{display:none}
details.dict>summary::before{content:"›";color:var(--fg-faint);
  transition:transform .18s ease;font-weight:400}
details.dict[open]>summary::before{transform:rotate(90deg)}
details.dict[open]>summary{border-bottom:1px solid var(--line-soft)}
/* Expand-all can put a hundred dictionaries' articles on screen at once.
   Articles are built eagerly either way (renderSlot appends them all; the
   accordion only hides them), so the cost of opening is layout and paint —
   which this hands back by skipping both for sections nobody has scrolled to.
   The size hint keeps the scrollbar from jumping as they are rendered. */
details.dict[open]>dl{content-visibility:auto;contain-intrinsic-size:0 400px}
summary .count{margin-left:auto;font-weight:400;color:var(--fg-faint);font-size:12px}
/* a dictionary's own script threw; the article is intact but inert */
summary .jserr{margin-left:6px;font-weight:400;color:var(--accent);font-size:12px;cursor:help}
/* A deferred dictionary's hint (renderSlot, h.deferred). Link-coloured because
   it is an offer rather than a status, not underlined because the target is the
   whole summary and not these two words, and never wrapped: it sits opposite a
   dictionary name that already wraps, and a two-line hint beside a three-line
   name is the layout in the bug report this replaced. */
summary .count.hint{color:var(--link);white-space:nowrap}
summary .more{font-weight:400;font-size:12px;color:var(--link);cursor:pointer;
  text-decoration:underline;text-underline-offset:2px;margin-left:var(--sp-2)}
summary .upgrade{font-weight:400;font-size:12px;color:var(--link);cursor:pointer;
  text-decoration:underline;text-underline-offset:2px;margin-left:auto}
dl{margin:0;padding:var(--sp-1) var(--sp-2) var(--sp-2)}
dt{font-size:1.272em;font-weight:700;color:var(--accent);word-break:break-word;
  margin-top:var(--sp-2)}
dt:first-child{margin-top:var(--sp-1)}
dd{margin:var(--sp-1) 0 0 0}

/* article sandbox host: dictionary CSS lives inside the shadow root and
   cannot touch the chrome; in dark mode the whole article is inverted
   Dark-Reader style (media flipped back inside the shadow root) */
.article{display:block;border-radius:8px;background:#fff;color:#1a1a1a;
  padding:var(--sp-1) var(--sp-2);overflow-x:auto;overflow-y:hidden}
html[data-theme="dark"] .article:not(iframe),
html:not([data-theme]) .article.autodark:not(iframe){
  filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.92)}
iframe.article{width:100%;border:0;display:block;background:#fff;border-radius:8px;
  padding:0;overflow:hidden}

/* Under the results, not in the status line: the scope describes what is on
   screen, so it must live and die with it rather than fade on a timer. */
.scopenote{margin-top:var(--sp-2);padding:var(--sp-1) .62rem;font-size:12px;
  color:var(--fg-faint);text-align:center}
.scopenote .widen{color:var(--link);cursor:pointer;text-decoration:underline;
  text-underline-offset:2px}
.scopenote .widen:hover{color:var(--link-hover)}
.empty{padding-top:var(--sp-5);text-align:center;color:var(--fg-faint)}
.empty svg path{fill:var(--line)}
/* the search bar is inert until at least one dictionary is usable */
input:disabled,select:disabled{opacity:.55;cursor:not-allowed}

/* ── dictionaries panel ────────────────────────────────────────────── */
#panel{position:fixed;inset:0;z-index:200;display:none;background:color-mix(in srgb,var(--fg) 24%,transparent)}
#panel.show{display:block}
.panel-card{position:absolute;top:0;right:0;bottom:0;width:min(420px,92vw);
  background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow);
  padding:0 var(--sp-3) var(--sp-3);overflow-y:auto}
.panel-card h2{margin:0 0 var(--sp-2);font-size:16px;color:var(--fg);
  display:flex;align-items:center}
.panel-card h2 .headacts{margin-left:auto;display:flex;gap:var(--sp-1)}
/* the theme button only exists here on narrow screens, where the bar has no
   room for it; see the responsive block */
#panelTheme{display:none}
/* the title and the master switch stay put while a long list scrolls under
   them — with 55 dictionaries the close button and the "enable all" control
   must not be somewhere up the page. Nothing that spends disk or CPU belongs
   in this strip: sticky + top-right is the most-clicked real estate in the
   panel, which is exactly why bulk full-text was moved out of it (D31). */
.panel-head{position:sticky;top:0;z-index:1;background:var(--bg);
  padding:var(--sp-3) 0 0}
/* the master switch sits in the same right-hand column as the per-card ones,
   so the column reads as one control surface instead of a stray toggle
   (right padding = card padding + its 1px border) */
.allrow{display:flex;align-items:center;gap:.35em;
  padding:0 calc(var(--sp-2) + 1px) var(--sp-1) var(--sp-2);
  border-bottom:1px solid var(--line);margin-bottom:var(--sp-1)}
.allrow label{flex:1;color:var(--fg-soft);font-size:12px;cursor:pointer;user-select:none}
.en:indeterminate{background:var(--accent)}
.en:indeterminate::after{transform:translateX(7px);width:14px;border-radius:3px}
.pd{border:1px solid var(--line);border-radius:8px;background:var(--bg-card);
  padding:var(--sp-1) var(--sp-2);margin-bottom:var(--sp-1);font-size:13px}
.pd.dragging{opacity:.45}
.pd.drop-before{box-shadow:0 -2px 0 var(--accent)}
.pd.drop-after{box-shadow:0 2px 0 var(--accent)}
.pd.off{opacity:.5}
.pd .hd{display:flex;align-items:center;gap:.35em}
.pd .grip{cursor:grab;color:var(--fg-faint);user-select:none;font-size:14px;
  line-height:1;letter-spacing:-.15em;padding-right:.15em}
.pd .grip:active{cursor:grabbing}
.pd b{color:var(--fg);font-size:14px;word-break:break-word;flex:1}
.pd .ord{display:flex;gap:.1em;margin-left:auto}
.pd .ord button{background:none;border:0;color:var(--fg-faint);cursor:pointer;
  font-size:12px;line-height:1;padding:.15em .2em;border-radius:4px}
.pd .ord button:hover{color:var(--fg);background:var(--line-soft)}
.en{appearance:none;width:32px;height:18px;border-radius:9px;background:var(--line);
  position:relative;cursor:pointer;flex:none;transition:background .15s}
.en:checked{background:var(--accent)}
.en::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;
  border-radius:50%;background:#fff;transition:transform .15s}
.en:checked::after{transform:translateX(14px)}
/* partial: knob centred on a half-tinted track — readable as "some", never
   mistaken for the full-accent "all" */
.en:indeterminate{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.en:indeterminate::after{transform:translateX(7px)}
.en:disabled{opacity:.4;cursor:default}
.en:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pd .meta{color:var(--fg-faint);font-size:11.5px;margin:.15em 0 .3em}
.pd .feat{display:inline-block;border:1px solid var(--line);border-radius:99px;
  padding:.05em .55em;margin:.15em .25em .15em 0;font-size:10.5px;color:var(--fg-faint);
  cursor:pointer;user-select:none;transition:color .12s,border-color .12s,background .12s}
.pd .feat:hover{border-color:var(--accent);color:var(--accent)}
.pd .feat.on{border-color:var(--accent);color:#fff;background:var(--accent)}
.pd .feat.on:hover{opacity:.82}
.pd .feat.locked{cursor:default;opacity:.5}
.pd .feat.locked:hover{border-color:var(--line);color:var(--fg-faint)}
.pd .feat.on.locked:hover{border-color:var(--accent);color:#fff;opacity:.5}
.pd .feat.busy{border-style:dashed;cursor:default}
/* stale: still on, still working, but rebuildable — a dotted edge reads as
   "provisional" without the alarm of an error colour */
.pd .feat.on.stale{border-style:dotted;border-color:var(--fg-faint)}
.pd .tag{display:inline-block;border:1px solid var(--line);border-radius:5px;
  padding:0 .4em;font-size:10.5px;color:var(--fg-soft);margin-right:.25em}
.pd .tag.on{color:var(--accent);border-color:var(--accent)}
.act{color:var(--link);cursor:pointer;text-decoration:underline;
  text-underline-offset:2px;font-size:12px;margin-right:var(--sp-2)}
/* Removal (D63). Deliberately the quietest control on the card: plain,
   uncoloured, no icon — it is offered only where the platform gives the user
   no other way to delete these files (Android), and it must not compete with
   the switches above it, which are the actions a user actually wants. The
   danger colour appears only in the confirmation, on the button that acts. */
.pd .rm{color:var(--fg-faint);cursor:pointer;font-size:11.5px;
  text-decoration:underline;text-underline-offset:2px}
.pd .rm:hover{color:#c0564f}
.pd .rmq{font-size:11.5px;color:var(--fg-soft);display:block;line-height:1.7}
.pd .rmq b{color:var(--fg)}
.pd .rmgo{display:inline-block;border:1px solid #c0564f;border-radius:99px;
  padding:.05em .55em;margin:.15em .25em .15em 0;font-size:10.5px;
  color:#c0564f;cursor:pointer;user-select:none}
.pd .rmgo:hover{background:#c0564f;color:#fff}
.pd .rmgo.busy{border-style:dashed;cursor:default;background:none;color:var(--fg-faint)}
.pd .rmno{color:var(--fg-faint);cursor:pointer;font-size:10.5px;
  text-decoration:underline;text-underline-offset:2px;margin-left:.25em}
/* A provenance row is a PATH plus optional annotations, held as separate
   elements rather than composed into one sentence — the path carries what it
   copies in data-full, so nothing downstream has to take a display string
   apart again to find it (see D49). */
.pd .prow{font-size:10.5px;color:var(--fg-faint);overflow-wrap:break-word}
.pd .prow.sub{opacity:.8}
.pd .pfx{color:var(--fg-soft)}
.pd .path{color:var(--fg-faint);cursor:pointer}
.pd .err{color:#c0564f}
/* an article's own section, pulled in beside the link that asked for it */
.wudict-sub{margin:.4em 0;padding:.4em .6em;border-left:3px solid var(--accent);
  background:color-mix(in srgb,var(--accent) 6%,transparent);border-radius:0 6px 6px 0}
.wudict-sub-close{float:right;cursor:pointer;color:var(--fg-faint);font-size:12px;padding:0 .3em}
.wudict-sub-close:hover{color:var(--accent)}
/* Folders & configuration: a quiet disclosure under the dictionary cards.
   It answers "where is it looking?", "where did my prepared data go?" and
   "which config file is in effect?" — otherwise only visible on the terminal
   at startup, which someone who opened the app in a browser never sees. */
/* Settings live one line under the master switch, not at the foot of a
   55-card list where nobody scrolls. The cog carries the meaning (show, don't
   tell) while title/aria-label keep the name for tooltips and screen readers;
   the counts double as the panel's scope, so the line earns its place even
   when it is never clicked. An inline SVG rather than ⚙️: emoji renders as a
   colour blob on one platform and flat on another, sits on its own baseline,
   and cannot inherit currentColor. */
#folders{margin:0 var(--sp-2) var(--sp-1);padding-bottom:var(--sp-1);
  border-bottom:1px solid var(--line)}
#folders>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:.5em;
  color:var(--fg-faint);font-size:12px;padding:.15em 0;border-radius:6px}
#folders>summary::-webkit-details-marker{display:none}
#folders>summary:hover,#folders[open]>summary{color:var(--fg-soft)}
#folders>summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#folders .cog{width:14px;height:14px;flex:none;transition:transform .2s}
#folders>summary:hover .cog{transform:rotate(30deg)}
#folders[open] .cog{transform:rotate(60deg)}
#folders .fsum{color:var(--fg-faint)}
#folders .grp{margin:.5em 0 .2em;color:var(--fg-faint);font-size:11px;
  text-transform:uppercase;letter-spacing:.05em}
/* One row = a path (long, variable) beside its facts (short, fixed). The old
   layout let ONLY the path shrink, so the path always lost and broke mid-word.
   Here the path refuses to go under 24ch and the facts travel as ONE unit, so
   when the row runs out of room that unit drops to a line of its own and the
   path takes the full width. One line when it fits, two when it must — no
   media query, and no doubled height on rows that never needed it. */
#folders .frow{display:flex;flex-wrap:wrap;align-items:baseline;
  column-gap:.6em;padding:.15em 0}
#folders .frow .p{flex:1 1 auto;min-width:min(24ch,100%);overflow-wrap:break-word;
  color:var(--fg-soft);font-size:11.5px;cursor:pointer}
#folders .frow .meta{margin-left:auto;display:flex;align-items:baseline;gap:.9em;
  white-space:nowrap}
#folders .frow .n{color:var(--fg-faint);font-size:11px}
#folders .frow .n.bad{color:#c0564f}
#folders .rv{color:var(--fg-faint);font-size:11px;cursor:pointer}
#folders .rv:hover{color:var(--link);text-decoration:underline}
#folders .frow:hover .rv{color:var(--fg-soft)}
#folders .facts{display:flex;flex-wrap:wrap;gap:.4em 1.2em;align-items:baseline;margin-top:.7em}
/* Three peer actions look like peers. "Edit folders…" is an <a> and was
   inheriting link styling, which made it the loudest of the three purely
   because of its element name. */
#folders .facts .act{color:var(--fg-soft);text-decoration:none;font-size:11.5px}
#folders .facts .act:hover{color:var(--link);text-decoration:underline}
/* An action that spends disk and CPU states its price where it is triggered,
   in the same breath as the trigger — not in a tooltip, and not after the
   fact (D31). Quiet by design: this is an extra, never a repair. */
.bulkbox{margin-top:.6em;padding:.6em .7em;border:1px solid var(--line);border-radius:8px;
  background:var(--bg-card);font-size:11.5px;color:var(--fg-soft);line-height:1.5}
.bulkbox p{margin:0 0 .5em}
.bulkbox p:last-child{margin-bottom:0}
.bulkbox .cost{color:var(--fg-faint)}
.bulkbox .btn{font-size:11.5px;padding:.25em .6em;margin-right:.4em}
#folders .warn{color:#c0564f;font-size:11.5px;margin:.3em 0}
/* About: quiet by construction — one accent word, everything else the muted
   text colour, separated from the controls above by a hairline rather than a
   heading. It is an identity card, not a call to action. */
#folders .about{margin-top:.9em;padding-top:.7em;border-top:1px solid var(--line-soft)}
#folders .about .brand{font-size:13px;margin-right:.4em}
#folders .about .ver{font-size:10.5px;color:var(--fg-faint);font-variant-numeric:tabular-nums}
#folders .about p{margin:.35em 0 0;font-size:11.5px;color:var(--fg-faint);line-height:1.45}
#folders .about a{color:var(--fg-soft);text-decoration:none;border-bottom:1px solid var(--line)}
#folders .about a:hover{color:var(--link);border-bottom-color:currentColor}
.pd .prov,.pd .prov1{font-size:10.5px;color:var(--fg-faint);overflow-wrap:break-word;margin-top:.15em}
/* The whole summary toggles, so the whole summary is the affordance: hover
   the row, not a fragment of it. Nothing in here is underlined — on the web an
   underline promises a link that goes somewhere else, and this goes nowhere. */
.pd .prov>summary{cursor:pointer;list-style:none;color:var(--fg-faint);
  border-radius:4px;padding:.05em .15em;margin-left:-.15em;transition:background .12s,color .12s}
.pd .prov>summary:hover{color:var(--fg-soft);background:var(--line-soft)}
.pd .prov>summary:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.pd .prov>summary::-webkit-details-marker{display:none}
.pd .prov>summary::before{content:"▸";color:var(--fg-soft);display:inline-block;width:1em;font-size:9px}
.pd .prov[open]>summary::before{content:"▾"}
.pd .fmt{color:var(--fg-soft);text-transform:uppercase;font-size:9px;letter-spacing:.04em}
/* companion media count ("+ 2 mdd"): part of the summary text, not a control.
   It used to carry class "more", which collided with the search-results
   "more…" link — that link's document handler matched it, cancelled the
   disclosure toggle with preventDefault and then threw looking for a
   details.dict that does not exist here. */
.pd .companions{color:var(--fg-soft)}
.pd .provbody{margin:.2em 0 0 1em;display:flex;flex-direction:column;gap:.1em}

/* ── responsive ────────────────────────────────────────────────────── */
@media (max-width:600px){
  /* ── one row, one pill, one escape hatch ───────────────────────────
     The bar used to wrap nine controls as equals, which cost an entire
     second row — 5.6em of permanent height on the device with the least of
     it. They are not equals: #q is the app, mode and dictionary are scope
     the user CONSULTS rather than operates, and the rest are view settings
     that the ☰ panel already houses. So the field takes the row and the
     scope rides inside it. */
  body{padding-top:calc(var(--barh) + var(--sp-2))} /* --barh is measured; see the boot script */
  .col{width:auto;padding-left:var(--sp-1);padding-right:var(--sp-1)}
  .container{padding-bottom:var(--sp-4)}
  /* Scoped to the top bar: the About wordmark inside the panel must survive
     on narrow screens — that is where the app says what it is. */
  .bar .brand{display:none}
  .bar form{flex-wrap:nowrap;gap:var(--sp-1)}
  /* Dropped rather than shrunk, because each is a big-screen affordance.
     ⇔: below 600 .col is already auto, so wide mode has nothing left to
     widen. ⊞: putting a hundred articles on screen at once is not a phone
     act. ◐ keeps working from the panel — see #panelTheme. (🔍 is not here:
     it is gone at every width, see the form markup.) */
  #wideBtn,#expandBtn,#frm .themeBtn{display:none}
  #panelTheme{display:block}

  .pill{display:flex;flex:1;min-width:0;align-items:center;gap:.25em;
    background:var(--bg-card);border:1px solid var(--line);border-radius:10px;
    padding:.1em .25em .1em .55em}
  .pill:has(#q:focus){border-color:var(--focus);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
  /* borderless inside: the pill wears the border now, and a field with its
     own would read as a box in a box. 16px is load-bearing, not decorative —
     iOS zooms the whole viewport on focus for anything smaller. */
  .pill .qbox{flex:1;min-width:0;max-width:none}
  .pill input[type=search]{width:100%;min-width:0;font-size:16px;
    border:0;background:none;border-radius:0;padding:.4em 0 .4em 1.55em}
  .pill input[type=search]:focus{box-shadow:none;border-color:transparent}
  /* flush with the pill's own left padding: inside the pill the field has no
     border of its own for the glyph to sit within */
  .pill .qled{left:0}

  /* A scope control is a chip with its real <select> laid transparently over
     it. The select keeps the native full-screen picker, the keyboard, the
     aria-label and its .value, so every call site that reads $("dict").value
     is untouched — only the rendering is replaced. */
  /* align-self:stretch and a min-width so the transparent select covers a
     whole 44px-tall target rather than just the 22px the chip's own text
     occupies — the chip is what you see, the seg is what you hit. */
  .seg{display:flex;position:relative;flex:none;align-self:stretch;
    align-items:center;justify-content:center;min-width:40px}
  .seg select{position:absolute;inset:0;width:100%;height:100%;margin:0;
    padding:0;border:0;max-width:none;opacity:0;-webkit-appearance:none;
    appearance:none}
  .seg:has(select:focus-visible) .chip{outline:2px solid var(--focus);outline-offset:1px}
  .seg:has(select:disabled){opacity:.55}
  .chip{display:flex;align-items:center;gap:.3em;max-width:11ch;
    white-space:nowrap;font-size:11.5px;line-height:1;color:var(--fg);
    background:var(--accent-soft);border-radius:7px;padding:.45em .3em .45em .45em}
  .chip::after{content:"";flex:none;width:0;height:0;margin-top:1px;
    border:3px solid transparent;border-top-color:var(--fg-faint)}
  .chip .lbl{overflow:hidden;text-overflow:ellipsis}
  .chip .bk{width:14px;height:14px;flex:none}
  /* The default carries no information, so it costs no attention: it recedes
     to the faint colour, and the dictionary drops its label outright —
     "All dictionaries" is what every session already is. Only a departure
     from the default is worth naming, which is also when the user needs
     reminding of it. (Same argument as the ~/… paths in the folders panel.) */
  .chip.dflt{background:none;color:var(--fg-faint)}
  .chip.dflt .lbl{display:none}

  /* Desktop gutters, reclaimed. Three nested insets of .618em — column, list
     and article — put 30px of a 360px screen into margins before a word of a
     definition; at .382em that is 18px. */
  dl{padding:var(--sp-1) var(--sp-1) var(--sp-2)}
  .article{padding:var(--sp-1)}
  details.dict>summary{padding-left:.4rem;padding-right:.4rem}
  .scopenote{padding-left:.4rem;padding-right:.4rem}
}
</style>
</head>
<body>
<header class="bar" id="bar">
<!-- The search controls start disabled and are released by setPhase() as soon
     as one dictionary is usable. Disabling in the markup (not from script)
     closes the window between first paint and the script running, which is
     exactly when an eager "type and hit Enter" used to reach the search path
     with an empty dictionary list. -->
<form id="frm" class="col" role="search" aria-busy="true">
<span class="brand">WuWei<small>Dict</small></span>
<!-- The search pill. Above 600px it is display:contents, so the field and the
     two selects are direct flex children of the form exactly as they always
     were and the desktop bar is unchanged. Below it the pill becomes the row:
     one border around field AND scope, so the field reads as large because it
     IS the row. Each chip carries the rendering; the <select> behind it stays
     real and keeps the native picker, the keyboard and the accessible name. -->
<span class="pill">
<!-- The field's leading glyph is the search indicator: ⌕ at rest, spinner in
     flight, one box, crossfaded. Nothing appears and nothing moves, so a
     search causes no layout event at all — and the native ✕ at the trailing
     edge keeps its pixels, which matters because it is present for EVERY
     search (an empty query never runs one) and it is a control the user has
     a motor habit for. .qbox is a real element at both widths; .pill is
     display:contents above 600px and could not position this. -->
<span class="qbox" id="qbox">
<span class="qled" aria-hidden="true">
<svg class="mag" viewBox="0 0 16 16" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M7.1 2.4a4.7 4.7 0 1 0 0 9.4 4.7 4.7 0 0 0 0-9.4zm3.6 8.3l3 3"/></svg>
<span class="spin"></span>
</span>
<input type="search" id="q" placeholder="Search…" autocomplete="off" autofocus aria-label="Search term" disabled>
</span>
<span class="seg">
<span class="chip" id="modeChip" aria-hidden="true"></span>
<select id="mode" aria-label="Search mode" disabled>
<option value="prefix">starts with</option>
<option value="exact">exact</option>
<option value="contains">contains</option>
<option value="fts">full-text</option>
</select>
</span>
<span class="seg">
<span class="chip" id="dictChip" aria-hidden="true"><svg class="bk" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M1.5 3.1c1.9-.5 3.8-.3 5.6.7v8.4c-1.8-1-3.7-1.2-5.6-.7V3.1zm13 0c-1.9-.5-3.8-.3-5.6.7v8.4c1.8-1 3.7-1.2 5.6-.7V3.1z"/></svg><span class="lbl" id="dictLbl"></span></span>
<select id="dict" aria-label="Dictionary" disabled><option value="all">All dictionaries</option></select>
</span>
</span>
<!-- No submit button, at any width. The form has exactly one field that
     blocks implicit submission (#q; <select> does not count), so Enter
     submits under the HTML spec's no-submit-button clause and the submit
     listener below runs unchanged — and anything two characters or longer
     never waits for a keypress at all, because the input handler searches
     as you type. The button's only remaining ground was a magnifier next
     to a magnifier. -->
<button type="button" class="btn tools themeBtn" title="Theme" aria-label="Toggle theme">◐</button>
<button type="button" class="btn" id="wideBtn" title="Toggle wide layout" aria-label="Toggle wide layout">⇔</button>
<button type="button" class="btn" id="expandBtn" title="Expand all results" aria-label="Expand all results" aria-pressed="false">⊞</button>
<button type="button" class="btn" id="panelBtn" title="Dictionaries" aria-label="Manage dictionaries">☰</button>
</form>
</header>

<main class="col container">
<!-- Three levels, one job each: #status is the collapsing grid, .msg is the
     clipped row, and .txt carries the padding INSIDE the clip so the closed
     state is truly 0px rather than 0px plus padding. -->
<div id="status" role="status" aria-live="polite"><div class="msg"><div class="txt" id="statusMsg"></div></div></div>
<div id="out"></div>
</main>

<div id="panel" role="dialog" aria-label="Dictionaries">
<div class="panel-card">
<div class="panel-head"><h2>Dictionaries
<span class="headacts">
<!-- The theme control's narrow-viewport home. Not a second control: both
     elements carry .themeBtn and one handler drives the pair, the way the
     wordmark has two mount points selected by media query. -->
<button type="button" class="btn themeBtn" id="panelTheme" title="Theme" aria-label="Toggle theme">◐</button>
<button class="btn" id="closePanel" aria-label="Close">✕</button></span></h2>
<div class="allrow"><label for="enAll" id="enAllLabel">Enable all</label>
<input type="checkbox" class="en" id="enAll" aria-label="Enable all dictionaries"></div></div>
<details id="folders">
  <summary title="Folders &amp; configuration" aria-label="Folders and configuration">
    <svg class="cog" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path fill="currentColor" fill-rule="evenodd" d="M6.56 1.05L9.44 1.05L9.07 2.81L10.91 3.57L11.90 2.07L13.93 4.10L12.43 5.09L13.19 6.93L14.95 6.56L14.95 9.44L13.19 9.07L12.43 10.91L13.93 11.90L11.90 13.93L10.91 12.43L9.07 13.19L9.44 14.95L6.56 14.95L6.93 13.19L5.09 12.43L4.10 13.93L2.07 11.90L3.57 10.91L2.81 9.07L1.05 9.44L1.05 6.56L2.81 6.93L3.57 5.09L2.07 4.10L4.10 2.07L5.09 3.57L6.93 2.81ZM5.50 8.00a2.50 2.50 0 1 0 5.00 0a2.50 2.50 0 1 0 -5.00 0Z"/></svg>
    <span class="fsum" id="folderSummary"></span></summary>
  <div id="folderBody"></div>
  <div class="facts">
    <a class="act" id="editFolders" href="/setup">✏️ Edit folders…</a>
    <span class="act" id="rescanBtn" title="Re-scan every folder and re-open the dictionaries found (takes a moment)">♻️ Rescan folders</span>
    <!-- Quiet, and shaped like its two peers: verb, object, scope, ellipsis.
         The shouted version ("ENABLE … GLOBALLY!") gave the panel's least-used
         and most expensive action its loudest voice, which is the hierarchy
         upside down — and every word it was shouting is stated precisely, one
         click away, in the disclosure this opens. The "…" is the honest
         signal: this reveals a choice, it does not act.
         "full-text search" and not a friendlier paraphrase: it is the term the
         mode dropdown, the per-dictionary switch and the result summaries all
         use, and this action's whole job is to flip that switch in bulk.
         "every dictionary" and not "globally": the scope is the one thing a
         user must not misread here, and "dictionaries" is the unit this panel
         already counts in. -->
    <span class="act" id="ftsAllBtn" role="button" tabindex="0" aria-expanded="false" aria-controls="ftsAllBox"
      title="Optional. Every dictionary can already be searched by headword; full-text search also looks inside article text, and uses noticeably more disk space.">⚡️ Enable full-text search for every dictionary…</span>
  </div>
  <div id="ftsAllBox" class="bulkbox" hidden></div>
  <!-- About: last row of the only chrome panel the app has. Users already open
       this for their folder paths, so the identity/version/links live where
       they will be looked for, without spending room in the search UI. -->
  <div class="about">
    <span class="brand">wu<small>Dict</small></span> <span class="ver">{{VERSION}}</span>
    <p>Search every dictionary you own, from one browser tab.</p>
    <p><a href="https://wuweidict.github.io/wudict" target="_blank" rel="noopener">Website</a>
       · <a href="https://github.com/wuweidict/wudict" target="_blank" rel="noopener">Source</a></p>
  </div>
</details>
<div id="panelList"></div>
</div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
/* For text going into a double-quoted attribute. esc alone is not enough
   there: a path may legally contain a quote, and one unescaped `"` ends the
   attribute and turns the rest of the path into markup. */
const escAttr=s=>esc(s).replace(/"/g,"&quot;");
let dicts=[],lastQuery=null,searchSeq=0,searchAC=null;

/* Preference order (ids) + disabled set. New dictionaries not yet in the saved
   order fall in alphabetically after the ordered ones.

   These two live on the SERVER (~/.wudict/state.json), unlike the theme, the
   wide toggle and the dropdown selection, which stay in localStorage. The line
   is "does this describe the collection, or the browser looking at it?".
   localStorage is keyed by scheme://host:port, so a different port, 127.0.0.1
   instead of localhost, or a phone on the LAN each silently reset a curated
   list of a hundred dictionaries — and the server, which owns the
   dictionaries, is also the only thing that can act on the answer (it skips
   disabled ones when warming up). */
let prefOrder=[],disabled=new Set();
function loadJSON(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
/* One-time adoption of a pre-server build's localStorage, so upgrading does
   not silently throw away someone's curation. Self-erasing: the keys are
   removed as they are read, and the server file is authoritative from then on. */
function adoptLocalPrefs(){
  const o=loadJSON("wudict_order",null),d=loadJSON("wudict_disabled",null);
  if(!o&&!d)return false;
  if(Array.isArray(o))prefOrder=o;
  if(Array.isArray(d))disabled=new Set(d);
  localStorage.removeItem("wudict_order");localStorage.removeItem("wudict_disabled");
  return true;
}
let prefsReady=false;
async function loadPrefs(){
  try{
    const r=await fetch("/api/prefs");
    if(!r.ok)throw new Error("HTTP "+r.status);
    const st=await r.json(),rows=st.dicts||[];
    prefsReady=true;
    if(!st.exists){adoptLocalPrefs();return} // first run: keep whatever we had
    prefOrder=rows.map(d=>d.id);
    disabled=new Set(rows.filter(d=>d.off).map(d=>d.id));
  }catch(e){
    // A page that cannot read its settings must still search: fall back to
    // "everything enabled, alphabetical" rather than refusing to start.
    console.warn("could not load settings:",e);
  }
}
/* Debounced, and silent when nothing actually changed — dragging a card emits
   a move per hovered row, and startup normalisation re-sends a list that is
   usually identical to the one we just read. */
let prefsTimer=null,prefsSent=null;
function savePrefs(now){
  clearTimeout(prefsTimer);
  // Never write a baseline we could not read: if the load failed, "nothing is
  // disabled, no order" is our ignorance, not the user's setting, and saving
  // it would destroy the real one.
  if(!prefsReady){setStatus("⚠ settings are not being saved — reload the page");return}
  if(!now){prefsTimer=setTimeout(()=>savePrefs(true),400);return}
  const body=JSON.stringify({dicts:orderedDicts().map(d=>({id:d.id,name:dictLabel(d),off:disabled.has(d.id)}))});
  if(body===prefsSent)return;
  prefsSent=body;
  fetch("/api/prefs",{method:"PUT",headers:{"Content-Type":"application/json"},body})
    .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status)})
    .catch(e=>{prefsSent=null;setStatus("⚠ could not save dictionary settings: "+esc(e.message))});
}
/* dictionaries in preference order: saved ones first, then unseen ones A→Z */
const mb=b=>b>=1e9?(b/1e9).toFixed(1)+" GB":b>=1e6?Math.round(b/1e6)+" MB":Math.max(1,Math.round(b/1e3))+" kB";
function orderedDicts(){
  const byId=new Map(dicts.map(d=>[d.id,d]));
  const out=[];
  for(const id of prefOrder){if(byId.has(id)){out.push(byId.get(id));byId.delete(id)}}
  const rest=[...byId.values()].sort((a,b)=>dictLabel(a).localeCompare(dictLabel(b),undefined,{sensitivity:"base"}));
  return out.concat(rest);
}
function orderedIds(){return orderedDicts().map(d=>d.id)}
function enabledOrderedIds(){return orderedDicts().filter(d=>!disabled.has(d.id)).map(d=>d.id)}

/* ── theme: auto → light → dark, persisted ─────────────────────────── */
const THEMES=["auto","light","dark"];
function applyTheme(t){
  if(t==="auto")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
  // Two mount points, one state: the bar's button above 600px, the panel's
  // below it (see the responsive block). A NodeList rather than two ids keeps
  // this one code path — nothing about the pair can drift.
  for(const b of document.querySelectorAll(".themeBtn")){
    b.textContent=t==="auto"?"◐":(t==="light"?"☀":"☾");
    b.title="Theme: "+t;
  }
  syncAutoDark();
}
function themeIsDark(){
  const t=localStorage.getItem("wudict_theme")||"auto";
  if(t==="dark")return true;
  if(t==="light")return false;
  return matchMedia("(prefers-color-scheme: dark)").matches;
}
/* hosts get .autodark so the invert rule also applies in auto mode */
function syncAutoDark(){
  const dark=themeIsDark();
  document.querySelectorAll(".article").forEach(el=>{
    if(el.tagName==="IFRAME"){
      el.contentWindow&&el.contentWindow.postMessage({t:"theme",dark},"*");
      return;
    }
    el.classList.toggle("autodark",dark&&!document.documentElement.hasAttribute("data-theme"));
    if(el.shadowRoot)el.shadowRoot.host.toggleAttribute("data-dark",dark);
  });
}
/* wide layout toggle, persisted */
function applyWide(on){document.body.classList.toggle("wide",on);$("wideBtn").style.color=on?"var(--accent)":""}
$("wideBtn").onclick=()=>{
  const on=!document.body.classList.contains("wide");
  localStorage.setItem("wudict_wide",on?"1":"");applyWide(on);
};
applyWide(localStorage.getItem("wudict_wide")==="1");

/* Expand all results — a view toggle that is deliberately NOT remembered.
   It lives for the page and nothing else: no localStorage, no state.json.
   Persisting it would mean enabling it once on a wide screen and meeting an
   inexplicably different app on a laptop three weeks later, with nothing on
   screen to explain why. Reloading always returns to the default, which stays
   "open the top-preference dictionary" — that is what gets you reading with no
   scrolling, and it is right for almost every search.
   A toggle rather than a one-shot action because the two directions are
   symmetric: expanding is one click, and collapsing again by hand would be
   one click per dictionary. */
let expandAll=false;
function applyExpand(){
  const b=$("expandBtn");
  b.textContent=expandAll?"⊟":"⊞";
  b.title=expandAll?"Collapse all results":"Expand all results";
  b.setAttribute("aria-label",b.title);
  b.setAttribute("aria-pressed",expandAll?"true":"false");
  b.style.color=expandAll?"var(--accent)":"";
}
applyExpand(); // markup ships the default; this keeps JS the single authority
$("expandBtn").onclick=()=>{
  expandAll=!expandAll;
  applyExpand();
  // act on what is already on screen: re-running the search would throw away
  // the results the user is looking at to fetch the same ones again.
  // Deferred sections are excluded: opening one FETCHES it (loadDeferred), so
  // including them here would turn one click into a dozen simultaneous opens —
  // precisely the burst the fan-out cap deferred them to avoid. They stay a
  // per-dictionary decision.
  for(const d of $("out").querySelectorAll("details.dict:not([data-deferred])"))d.open=expandAll;
};

function cycleTheme(){
  const cur=localStorage.getItem("wudict_theme")||"auto";
  const next=THEMES[(THEMES.indexOf(cur)+1)%THEMES.length];
  localStorage.setItem("wudict_theme",next);applyTheme(next);
}
for(const b of document.querySelectorAll(".themeBtn"))b.onclick=cycleTheme;
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",syncAutoDark);
applyTheme(localStorage.getItem("wudict_theme")||"auto");

/* ── dictionaries ──────────────────────────────────────────────────── */
function dictLabel(d){return d.name||d.path.split("/").pop()}

/* Readiness (D30). An empty `dicts` used to mean two different things —
   "still loading" and "you disabled them all" — and the search path could not
   tell them apart, so a slow startup accused the user of disabling a list that
   was merely late. It cannot happen now: the server serves this page only when
   the registry is non-empty (handleIndex falls back to /setup otherwise), so
   here an empty list ALWAYS means "not ready yet".
     boot    — nothing usable: form inert, spinner, no warnings of any kind
     partial — ≥1 dictionary in: fully interactive, more still arriving
     ready   — the list is complete
     failed  — the stream broke: interactive anyway, with a retry
   Only partial/ready may say anything about what the user has disabled. */
let phase="boot",dictTotal=0,staleSearch=false;
function setPhase(p){
  if(phase===p)return;
  const wasBoot=phase==="boot";
  phase=p;
  const busy=p==="boot";
  for(const id of["q","mode","dict"])$(id).disabled=busy;
  $("frm").setAttribute("aria-busy",busy?"true":"false");
  if(busy){startBootScreen();return}
  stopBootScreen();
  // a disabled input cannot hold focus (autofocus no-ops), so hand it back
  // the moment it can take it — the user should be able to just type
  if(wasBoot&&document.activeElement===document.body)$("q").focus();
}

/* Waiting messages. Cook Ding (庖丁解牛) — the cook whose blade never dulls
   because he cuts with the grain — is the canonical wúwéi parable, so the
   kitchen is this app's own metaphor rather than borrowed whimsy. Fixed
   order, so repeat launches feel the same, and nothing here promises
   imminence: the honest progress signal is the "N of M ready" counter beside
   it. The spinner is deliberately indeterminate — per-dictionary cost varies
   by orders of magnitude (cold MDX ~180 ms, cold SLOB ~1 s), so a progress
   bar would be guessing while the counter cannot. */
const BOOT_MSGS=["Warming up the wok…","Stir-frying the dictionaries…",
  "Chopping headwords, with the grain…","Letting the definitions marinate…",
  "Tasting for seasoning…"];
let bootTimer=null,bootIdx=0;
function paintBoot(){
  $("out").innerHTML=`<div class="empty boot"><span class="spin big"></span><p>${BOOT_MSGS[bootIdx]}</p></div>`;
}
function startBootScreen(){
  if(bootTimer)return;
  bootIdx=0;paintBoot();
  bootTimer=setInterval(()=>{bootIdx=(bootIdx+1)%BOOT_MSGS.length;paintBoot()},3500);
}
function stopBootScreen(){
  if(bootTimer){clearInterval(bootTimer);bootTimer=null}
  if($("out").querySelector(".boot"))$("out").innerHTML="";
}
/* the honest progress line: a count, never a percentage */
function readyCount(){
  return dictTotal?`Loading dictionaries — ${dicts.length} of ${dictTotal} ready…`
                  :"Looking for dictionaries…";
}
function bootFailed(msg){
  setPhase("failed");
  clearStatus("load");
  $("out").innerHTML=`<div class="empty"><p>⚠ Could not load your dictionaries.</p>`+
    `<p>${esc(msg||"unknown error")}</p>`+
    `<p><button type="button" class="btn" id="retryBtn">Try again</button></p></div>`;
}
$("out").addEventListener("click",e=>{if(e.target.id==="retryBtn")loadDicts()});

/* Two asymmetric corrections, because opening and closing fail differently.
   Scrolling every opened section to the top would be wrong: the summary you
   clicked does not move when a section expands, so your eye's anchor is
   already perfect, and opening a SECOND dictionary is nearly always an act of
   comparison — yanking the page would take the one you were reading off screen
   and turn comparison into replacement. It would also fire once per dictionary
   under expand-all (D35).

   OPEN needs help only when the section sits so low that its content unfolds
   entirely below the fold: you asked to see something and saw nothing.
   CLOSE needs help not to vanish, and that need is new — D37's sticky header
   means a section can be collapsed from 3000px inside it, after which the
   document shrinks, the browser clamps the scroll position, and you land
   somewhere arbitrary. Returning to the row you just closed is not taking
   control away, it is honouring the place you were still standing in.

   Both corrections scroll UP, which brings the auto-hidden bar back, so they
   aim at --barh (via scroll-margin-top) rather than the momentarily-zero
   --stick. */
const lessMotion=matchMedia("(prefers-reduced-motion: reduce)");
$("out").addEventListener("click",e=>{
  const sum=e.target.closest("details.dict>summary");
  if(!sum)return;
  // these live inside the summary, run their own handlers and preventDefault
  // the toggle — but not before this listener, which is nearer the target
  if(e.target.closest(".more,.upgrade"))return;
  const det=sum.parentElement,opening=!det.open; // the toggle lands after us
  openedIdx=-1; // the user decided; no arrival may take the slot back (D73)
  requestAnimationFrame(()=>{  // measure the section at its new height
    const top=det.getBoundingClientRect().top;
    const need=opening?top>innerHeight*0.5:top<$("bar").offsetHeight;
    if(need){
      det.scrollIntoView({block:"start",behavior:lessMotion.matches?"auto":"smooth"});
    }
  });
});

/* Rebuilding the dropdown and the panel is O(all dictionaries) — renderPanel
   throws its whole list away and rebuilds it — so streamed rows coalesce into
   one repaint instead of ~100 of them. */
let refreshTimer=null;
function refreshDictUI(now){
  clearTimeout(refreshTimer);
  if(!now){refreshTimer=setTimeout(()=>refreshDictUI(true),120);return}
  dicts.sort((a,b)=>dictLabel(a).localeCompare(dictLabel(b),undefined,{sensitivity:"base"}));
  const sel=$("dict"),prev=sel.value||localStorage.getItem("wudict_dict")||"all";
  sel.innerHTML='<option value="all">All dictionaries</option>';
  for(const d of dicts){ // dropdown stays alphabetical for quick name lookup
    const o=document.createElement("option");
    o.value=d.id;o.textContent=dictLabel(d);
    sel.appendChild(o);
  }
  if([...sel.options].some(o=>o.value===prev))sel.value=prev;
  syncChips(); // the option list just changed under the chip
  renderPanel();
}

/* Consumes the /api/dicts NDJSON stream, so search unblocks on the FIRST
   dictionary rather than the last one. Never throws: a failure here must
   still leave the user with a usable page. */
async function loadDicts(rescan){
  // A rescan happens in an app that already works — it must not black the UI
  // out. Only the first load (or a retry after a failure) blocks.
  const blocking=phase==="boot"||phase==="failed";
  if(blocking){setPhase("boot");startBootScreen();dictTotal=0;setStatus(esc(readyCount()),"load")}
  else setStatus('<span class="spin"></span>Loading dictionaries…',"load");
  const rows=[];
  let published=false,sawBegin=false;
  // "begin" costs the server no opens at all, so its absence means the server
  // is not answering — never leave the form inert waiting on a hang.
  const watchdog=blocking?setTimeout(()=>{if(!sawBegin)bootFailed("the server is not responding")},20000):null;
  try{
    await fetchStream(rescan?"/api/rescan":"/api/dicts",msg=>{
      if(msg.t==="begin"){
        sawBegin=true;dictTotal=msg.total||0;
        if(blocking)setStatus(esc(readyCount()),"load");
      }else if(msg.t==="dict"&&msg.dict){
        rows.push(msg.dict);
        if(!published){
          // swap the old list out only now: a rescan keeps showing the
          // previous dictionaries until replacements start arriving
          published=true;dicts=rows;
          if(phase==="failed")$("out").innerHTML=""; // a slow stream beat the watchdog
          setPhase("partial");
        }
        if(blocking)setStatus(esc(readyCount()),"load");
        refreshDictUI();
      }
    });
  }catch(err){
    if(blocking)bootFailed(err.message);
    else setStatus("⚠ "+esc(err.message));
    return;
  }finally{
    clearTimeout(watchdog);
  }
  dicts=rows;dictTotal=rows.length;
  // normalize the saved preference order to the current dictionary set
  // (appends newly-added dicts A→Z, drops removed ones). ONLY on the complete
  // set — doing it mid-stream would drop the ids that had not arrived yet.
  prefOrder=orderedIds();savePrefs(true);
  refreshDictUI(true);
  setPhase("ready");
  clearStatus("load");
  // a search run against a half-loaded list is now answerable in full
  if(staleSearch&&lastQuery){staleSearch=false;doSearch()}
}
/* reorder helpers operate on the preference-ordered id list */
function moveDict(id,where){
  const ids=orderedIds(),i=ids.indexOf(id);
  if(i<0)return;
  ids.splice(i,1);
  if(where==="up")ids.splice(Math.max(0,i-1),0,id);
  else if(where==="down")ids.splice(Math.min(ids.length,i+1),0,id);
  else if(where==="top")ids.unshift(id);
  else ids.push(id); // bottom
  prefOrder=ids;savePrefs();renderPanel();
}
function toggleDict(id){
  disabled.has(id)?disabled.delete(id):disabled.add(id);
  savePrefs();renderPanel();
}
/* Master switch: mixed → all, all → none, none → all (the Finder/Gmail
   convention — from a mixed state the useful move is always "select all").
   It only ever changes which dictionaries "All dictionaries" searches; it
   never touches a dictionary or its files. */
function setAllEnabled(on){
  disabled.clear();
  if(!on)for(const d of dicts)disabled.add(d.id);
  savePrefs();renderPanel();
}
function syncPanelHeader(){
  const total=dicts.length,on=dicts.filter(d=>!disabled.has(d.id)).length;
  const box=$("enAll");
  box.checked=total>0&&on===total;
  box.indeterminate=on>0&&on<total;
  box.disabled=total===0;
  const label=on===total?"All dictionaries are searched":
    on===0?"No dictionaries are searched":`${on} of ${total} dictionaries are searched`;
  // an empty list before the stream finishes is "not here yet", not "none" —
  // the panel must not contradict the boot screen (D30)
  $("enAllLabel").textContent=!total?
      (phase==="boot"?"Still loading…":phase==="failed"?"Could not load":"No dictionaries"):
    on===total?"All enabled":on===0?"None enabled":`${on} of ${total} enabled`;
  box.title=label;
}
// clicking an indeterminate checkbox sets checked=true, so "mixed → all"
// needs no special case.
$("enAll").addEventListener("change",e=>setAllEnabled(e.target.checked));
/* The narrow-viewport chips. They render the two <select>s and nothing more:
   the selects stay the single source of truth, so this never has to be
   consulted before reading a value — only called after one changes.

   "starts with" shortens to "starts" and the others keep their words: those
   words are the ones the mode dropdown, the per-dictionary switch and the
   result summaries all use, and a chip that renamed "full-text" would sever
   the link to every other place it appears. */
const MODE_SHORT={prefix:"starts",exact:"exact",contains:"contains",fts:"full-text"};
function syncChips(){
  const m=$("mode"),d=$("dict");
  $("modeChip").textContent=MODE_SHORT[m.value]||m.value;
  $("modeChip").classList.toggle("dflt",m.value==="prefix");
  // No option selected is the default too, not a nameless scope: a saved id
  // is written to .value before /api/dicts has put that option in the list,
  // and assigning an id the <select> does not have yet leaves value "".
  const opt=d.selectedOptions[0],all=!opt||d.value==="all";
  $("dictLbl").textContent=all?"":opt.text;
  $("dictChip").classList.toggle("dflt",all);
}
$("dict").onchange=e=>{localStorage.setItem("wudict_dict",e.target.value);syncChips();if($("q").value.trim())doSearch()};
/* Mode had no change handler at all: it took effect on the next submit. That
   was survivable while a 🔍 button sat next to it, but the narrow bar has no
   submit button, so picking a mode would have appeared to do nothing at all.
   Made symmetric with #dict — re-run if there is something to re-run. */
$("mode").onchange=()=>{syncChips();if($("q").value.trim())doSearch()};
syncChips(); // the markup ships empty chips; JS stays the single authority

/* provenance: the collapsed line says where the dictionary came from (its
   foreign source + a media companion count); expanding reveals the library
   folder that holds the prepared databases and the full media source paths.
   A dictionary with no source left shows its library folder directly. The
   folder is what a user copies, zips or hands over — so it, not the .db file
   inside it, is the path we show first. Paths are click-to-copy (reusing the
   .path handler). */
function mediaKind(list){
  const f=list[0].toLowerCase();
  if(f.endsWith(".mdd"))return "mdd";
  if(f.endsWith(".zip"))return "zip";
  return "res";
}
function provenance(d){
  /* A row is a PATH with optional annotations around it — not a sentence.
     They used to be one string ("db: /Users/…/Name (text.db + media.db +
     info.txt)") that the click handler unpicked again with two regexes, and
     the regexes did not cover what the builders actually produced: copying
     that row put the prefix's siblings and the parenthesised file list on the
     clipboard along with the path. The row now carries the path itself in
     data-full, so copying reads a value instead of reconstructing one. */
  const label=(p,o)=>{
    o=o||{};
    return `<div class="prow${o.cls?" "+o.cls:""}">`+
      (o.pre?`<span class="pfx">${esc(o.pre)}</span> `:"")+
      `<span class="path" data-full="${escAttr(p)}" title="Click to copy">${pathHTML(p)}</span>`+
      (o.post?` <span class="pfx">${esc(o.post)}</span>`:"")+
      `</div>`;
  };
  /* A row that names no path at all. It used to be built by label(), so it
     wore "Click to copy" and the .path affordance over a sentence — clicking
     it put a fragment of that sentence on the clipboard. */
  const note=t=>`<div class="prow">${esc(t)}</div>`;
  const base=p=>String(p).split(/[\\/]/).pop()||String(p); // also handles Windows paths
  let head,rows=[],full="";
  if(d.source){
    const ms=d.mediaSrc||[],n=ms.length;
    // Collapsed, the file NAME is what identifies the dictionary; a 60-character
    // absolute path is noise repeated on every card. The full path is one click
    // away in the body (and in the tooltip), which is also the only place it is
    // copiable — the summary itself is the toggle.
    full=d.source;
    // No format prefix here: the meta line above already says "mdx", and the
    // file name that follows ends in ".mdx" — the label restated, two words
    // later, what the thing it labels already says. The prepared branch below
    // keeps its prefix because "prepared" is a state, not a format.
    head=`${esc(base(d.source))}`+
      (n?` <span class="companions">+ ${n} ${mediaKind(ms)}</span>`:"");
    rows.push(label(d.source));
    if(d.folder)rows.push(label(d.folder,{pre:"db:",post:"("+(d.mediaDB?"text.db + media.db + info.txt":"text.db + info.txt")+")"}));
    else if(d.textDB)rows.push(label(d.textDB,{pre:"db:",post:d.mediaDB?"+ media.db":""}));
    for(const m of ms)rows.push(label(m,{cls:"sub"}));
  }else{
    full=d.folder||d.textDB||d.path||"";
    head=`<span class="fmt">prepared</span>: ${esc(base(full))}`;
    if(full)rows.push(label(full)); // same rule: the full path lives in the body
    if(d.folder)rows.push(note("contains: text.db"+(d.mediaDB?" + media.db":"")+" + info.txt"));
    else if(d.mediaDB)rows.push(label(d.mediaDB,{pre:"media:"}));
  }
  if(!rows.length)return `<div class="prov1" title="${escAttr(full)}">${head}</div>`;
  return `<details class="prov"><summary title="${escAttr(full)}">${head}</summary>`+
    `<div class="provbody">${rows.join("")}</div></details>`;
}
function renderPanel(){
  syncPanelHeader();
  const el=$("panelList");el.innerHTML="";
  const ord=orderedDicts();
  for(const d of ord){
    const off=disabled.has(d.id);
    const div=document.createElement("div");div.className="pd"+(off?" off":"");div.dataset.id=d.id;
    /* Only what varies AND can be changed. exact and prefix are true for every
       dictionary and cost nothing, so showing them was decoration; contains,
       full-text and media each cost real disk, so each is a switch.
       Switching is offered only while the SOURCE is on disk — that is what
       makes it reversible, and why none of this needs a confirmation. */
    const canToggle=!!d.source;
    const feats=[
      ["contains","contains",d.caps?.Contains,0],
      ["fts","full-text",d.caps?.FTS,0],
      ["media","media",!!d.mediaDB,d.mediaSize||0],
    ];
    let caps="";
    for(const[key,label,on,bytes]of feats){
      if(key==="media"&&!on&&!d.hasMedia)continue; // nothing to pack
      const size=on&&bytes?" "+mb(bytes):"";
      /* A stale index still works — it was built with older text-folding
         rules, so it can only miss words whose folding changed. So it is
         marked, not disabled, and the click rebuilds instead of removing. */
      const stale=key==="contains"&&on&&d.containsStale;
      const tip=!canToggle?"The dictionary files are gone — this is the only copy, so it cannot be changed":
        stale?"Built with older text-folding rules — click to rebuild":
        on?"Click to remove":"Click to add";
      caps+=`<span class="feat${on?" on":""}${stale?" stale":""}${canToggle?"":" locked"}"`+
        ` data-feat="${key}" data-on="${on?1:0}"${stale?' data-stale="1"':""}`+
        ` title="${tip}">${label}${size}${stale?" ⟳":""}</span>`;
    }
    // the contains index is built automatically on first use, so the only
    // manual action offered is full-text (which also covers contains).
    // "pack media" is offered only when the dictionary actually has packable
    // media, a source to pack it from, and it isn't already packed.
    let acts="";
    if(d.error)acts=`<span class="err">${esc(d.error)}</span>`;
    /* Removal (D63) is offered only where the app cannot hand the user to a
       file manager instead — canDelete is the server's answer to that, not a
       platform test done here. On a desktop this branch never runs and the
       card is byte-for-byte what it was. */
    if(cfgInfo&&cfgInfo.canDelete)
      acts+=`<span class="rm" title="Delete this dictionary from this device">Remove…</span>`;
    div.innerHTML=`<div class="hd">
        <span class="grip" draggable="true" title="Drag to reorder">⠿</span>
        <b>${esc(dictLabel(d))}</b>
        <span class="ord">
          <button data-mv="top" title="Move to top">⏫</button>
          <button data-mv="up" title="Move up">▲</button>
          <button data-mv="down" title="Move down">▼</button>
          <button data-mv="bottom" title="Move to bottom">⏬</button>
        </span>
        <input type="checkbox" class="en" ${off?"":"checked"} title="${off?"Disabled — excluded from All dictionaries":"Enabled"}">
      </div>
      <div class="meta">${esc(d.format||"?")}${d.entries?" · "+d.entries.toLocaleString()+" entries":""}${d.dbSize?" · "+mb(d.dbSize)+" indexed":""}</div>
      <div>${caps}</div><div class="acts">${acts}</div>
      ${provenance(d)}`;
    el.appendChild(div);
  }
}

/* drag-to-reorder via the gripper (chevrons cover keyboard/precise moves) */
let dragId=null;
function clearDrop(){document.querySelectorAll(".pd.drop-before,.pd.drop-after").forEach(p=>p.classList.remove("drop-before","drop-after"))}
$("panelList").addEventListener("dragstart",e=>{
  const pd=e.target.closest(".pd");if(!pd||!e.target.classList.contains("grip"))return;
  dragId=pd.dataset.id;pd.classList.add("dragging");e.dataTransfer.effectAllowed="move";
});
$("panelList").addEventListener("dragend",()=>{
  document.querySelectorAll(".pd.dragging").forEach(p=>p.classList.remove("dragging"));clearDrop();dragId=null;
});
$("panelList").addEventListener("dragover",e=>{
  if(!dragId)return;e.preventDefault();
  const pd=e.target.closest(".pd");if(!pd||pd.dataset.id===dragId)return;
  const r=pd.getBoundingClientRect(),after=e.clientY>r.top+r.height/2;
  clearDrop();pd.classList.add(after?"drop-after":"drop-before");
});
$("panelList").addEventListener("drop",e=>{
  if(!dragId)return;e.preventDefault();
  const pd=e.target.closest(".pd");if(!pd||pd.dataset.id===dragId){clearDrop();return}
  const r=pd.getBoundingClientRect(),after=e.clientY>r.top+r.height/2;
  const ids=orderedIds(),from=ids.indexOf(dragId);ids.splice(from,1);
  let to=ids.indexOf(pd.dataset.id);if(after)to++;
  ids.splice(to,0,dragId);prefOrder=ids;savePrefs();clearDrop();dragId=null;renderPanel();
});
$("panelBtn").onclick=()=>{$("panel").classList.add("show");loadFolders()};
$("closePanel").onclick=()=>$("panel").classList.remove("show");
$("panel").onclick=e=>{if(e.target.id==="panel")$("panel").classList.remove("show")};
$("rescanBtn").onclick=()=>{loadDicts(true).then(loadFolders)};

/* Folders & configuration ------------------------------------------------ */
let cfgInfo=null;

/* Every path in this panel opened with the same /Users/<name>/ — eleven
   characters of nothing, repeated on each row, holding the pixels the eye
   lands on first while the part that tells the rows APART (mdict, aard,
   slob_Apple) was pushed right.
   The server sends {prefix,label} pairs (longest first) and this applies them
   without knowing what they mean: on a desktop that is the home directory as
   `~`, on Android the volume names the Files app uses. A label the page
   invented would be a lie on some platform — `~` on Android names a directory
   with no shell that nobody can open (D63 amendment).
   Display only: the clipboard and /api/reveal keep the absolute path. */
function shortPath(p){
  const al=cfgInfo&&cfgInfo.pathAliases;   // set before any row is built
  if(!al||!p)return p;
  for(const a of al){
    const pre=a[0],label=a[1];
    if(!pre)continue;
    if(p===pre)return label;
    const sep=pre.includes("\\")?"\\":"/";
    if(p.startsWith(pre+sep))return label+sep+p.slice(pre.length+sep.length);
  }
  return p;
}
/* Break opportunities after separators only. word-break:break-all split
   "Language" into "Languag"+"e"; a path broken after "/" keeps every segment
   whole, and word shape is what makes a path readable at a glance rather than
   letter by letter. <wbr> contributes nothing to textContent, so it can never
   leak into a copy. */
function pathHTML(p){
  return esc(shortPath(p)).replace(/([^\\/])([\\/])/g,"$1$2<wbr>");
}
/* Split out of loadFolders because the dictionary cards need the aliases too,

   only on open meant every card showed a full path until something happened to
   re-render it — the short form would appear at an arbitrary later moment,
   which is worse than never having it. Errors are swallowed: no aliases means
   full paths, which is a correct fallback, not a failure. */
async function loadConfig(){
  try{ cfgInfo=await (await fetch("/api/config")).json() }catch(e){}
  return cfgInfo;
}
async function loadFolders(){
  if(!await loadConfig())return;
  const c=cfgInfo,b=$("folderBody");
  const n=(c.roots||[]).length;
  $("folderSummary").textContent=`${n} folder${n===1?"":"s"} · ${c.total} dictionar${c.total===1?"y":"ies"}`;
  b.innerHTML="";
  const row=(path,note,bad)=>{
    const d=document.createElement("div");d.className="frow";
    const p=document.createElement("span");p.className="p path";
    p.dataset.full=path;              // what gets copied, whatever is displayed
    p.innerHTML=pathHTML(path);
    p.title="Click to copy";
    d.appendChild(p);
    // The facts travel as one unit so they wrap as one — and so a row with no
    // fact (the config file) simply has a shorter unit, instead of holding an
    // empty column open across the whole width.
    const m=document.createElement("span");m.className="meta";
    if(note){
      const s=document.createElement("span");s.className="n"+(bad?" bad":"");s.textContent=note;
      m.appendChild(s);
    }
    if(c.canReveal){
      const rv=document.createElement("span");rv.className="rv";rv.textContent=c.revealLabel;
      rv.onclick=e=>{e.stopPropagation();fetch("/api/reveal?path="+encodeURIComponent(path))
        .then(r=>r.json()).then(j=>{if(j.error)alert(j.error)})};
      m.appendChild(rv);
    }
    if(m.childNodes.length)d.appendChild(m);
    b.appendChild(d);
  };
  const grp=t=>{const g=document.createElement("div");g.className="grp";g.textContent=t;b.appendChild(g)};
  grp("dictionary folders");
  for(const r of c.roots||[]){
    let note=`${r.count} dictionar${r.count===1?"y":"ies"}`,bad=false;
    if(!r.exists){note="folder not found";bad=true}
    else if(!r.total){note="no dictionaries"}
    else if(!r.count){note=`${r.total} already listed above`}

    row(r.path,note,bad);

    const how=c.dictDirOrigin==="flag"?"the --dict-dir flag":"the DICT_DIR environment variable";
    const w=document.createElement("div");w.className="warn";
    w.textContent="⚠ set by "+how+" — it overrides the config file";

  // is restated one line down by the row's own note — the same rule that keeps
  // the format prefix off a file name ending in ".mdx" (see provenance above).
  grp("library");
  row(c.libDir,`${c.prepared} prepared`+(c.useCached?" · in use":c.prepared?" · not in use":""),false);

/* Bulk full-text (D31). This used to be "⚡ index all", a prominent button in
   the panel header — which was wrong twice over. It named our mechanism, not
   the user's outcome, and it was a lie: every dictionary is *already* indexed
   by headword on first open, so "index all" read as the button that repairs a
   half-configured app. And the top-right of a sticky header is where a user
   clicks to explore, while this is the one action that spends gigabytes of
   disk and a long single-file CPU pass. Prominence must track value, not cost.
   It now lives in the configuration drawer as quiet text, names what the user
   gets, and prices itself before it can fire. The good discovery path is
   elsewhere and already exists: a full-text search that meets a dictionary
   lacking the index offers to add just that one, in context and motivated. */
function ftsCandidates(){
  // a dictionary whose source file is gone cannot be re-indexed at all — the
  // prepared data is the only copy (same rule the per-card chips enforce, and
  // which "index all" ignored: it queued dictionaries guaranteed to fail)
  return dicts.filter(d=>!d.error&&!d.caps?.FTS&&d.source);
}
/* Size estimate calibrated on the user's OWN corpus: bytes-per-entry observed
   across the dictionaries that already have full text. Article length varies
   far too much between dictionaries for a hard-coded multiplier to be honest,
   and when there is nothing to calibrate against this says nothing rather
   than inventing a number — the exact figures below carry the warning fine. */
function ftsAddedBytes(todo){
  let bytes=0,entries=0;
  for(const d of dicts)if(d.caps?.FTS&&d.dbSize&&d.entries){bytes+=d.dbSize;entries+=d.entries}
  const want=todo.reduce((n,d)=>n+(d.entries||0),0);
  if(!entries||!want)return 0;
  const grown=want*(bytes/entries),have=todo.reduce((n,d)=>n+(d.dbSize||0),0);
  return grown>have?grown-have:0;
}
function closeFtsAll(){

}
function openFtsAll(){
  const box=$("ftsAllBox"),todo=ftsCandidates(),plural=n=>n===1?"dictionary":"dictionaries";
  if(!todo.length){
    box.innerHTML="<p>Every dictionary that can be indexed already has full-text search.</p>";
  }else{
    const entries=todo.reduce((n,d)=>n+(d.entries||0),0);
    const now=dicts.reduce((n,d)=>n+(d.dbSize||0),0),added=ftsAddedBytes(todo);
    box.innerHTML=
      "<p>Full-text search finds words <em>inside</em> article text. Every dictionary "+
      "is already searchable by headword — only enable if you have sufficient disk space.</p>"+
      `<p class="cost">Indexes <b>${todo.length}</b> ${plural(todo.length)}`+
        (entries?` (${entries.toLocaleString()} entries)`:"")+
        ", one at a time — on a large collection that takes a long while."+
        (now?` Prepared data uses ${mb(now)} today`+(added?`; expect roughly ${mb(added)} more`:"")+".":"")+
        " You can remove it from any dictionary afterwards.</p>"+
      `<p><button type="button" class="btn" id="ftsAllGo">Index ${todo.length} ${plural(todo.length)}</button>`+
