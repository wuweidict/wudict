<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gonow-dict</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<script src="/assets/mark.min.js"></script>
<style>
/* ── design tokens ─────────────────────────────────────────────────── */
:root{
  --fi:1.618;                     /* φ */
  --sp-1:.382em; --sp-2:.618em; --sp-3:1em; --sp-4:1.618em; --sp-5:2.618em;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --bg:#fbfaf8; --bg-card:#ffffff; --bg-bar:rgba(251,250,248,.92);
  --fg:#2b2a28; --fg-soft:#6d6a64; --fg-faint:#a5a19a;
  --accent:#e08600; --accent-soft:#fff3e0;
  --link:#5b7a99; --link-hover:#3f5e7d;
  --line:#e8e4dd; --line-soft:#f1eee8;
  --hl:#fff0b3; --hl-fg:#5c4a00;
  --focus:#7aa7d1;
  --shadow:0 1px 3px rgba(60,50,30,.07),0 4px 14px rgba(60,50,30,.05);
}
html[data-theme="dark"]{
  --bg:#191a1c; --bg-card:#212327; --bg-bar:rgba(25,26,28,.92);
  --fg:#d8d5d0; --fg-soft:#96938d; --fg-faint:#5f5c57;
  --accent:#e69a33; --accent-soft:#3a2d18;
  --link:#8fb0cc; --link-hover:#b3cde3;
  --line:#33363b; --line-soft:#2a2c30;
  --hl:#4a3f10; --hl-fg:#ffe38a;
  --focus:#5b86ad;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
@media (prefers-color-scheme: dark){
  html:not([data-theme]){
    --bg:#191a1c; --bg-card:#212327; --bg-bar:rgba(25,26,28,.92);
    --fg:#d8d5d0; --fg-soft:#96938d; --fg-faint:#5f5c57;
    --accent:#e69a33; --accent-soft:#3a2d18;
    --link:#8fb0cc; --link-hover:#b3cde3;
    --line:#33363b; --line-soft:#2a2c30;
    --hl:#4a3f10; --hl-fg:#ffe38a;
    --focus:#5b86ad;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
}

/* ── chrome ────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;padding-top:4.236em;background:var(--bg);color:var(--fg);
  font-family:var(--font);line-height:var(--fi)}
.container{margin:0 auto;width:92%;max-width:800px;padding:0 var(--sp-2) var(--sp-5);
  transition:max-width .25s ease}
body.wide .container{max-width:min(1280px,96vw)}

.bar{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--bg-bar);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:var(--sp-1) var(--sp-2);
  transition:transform .28s ease}
.bar.hidden{transform:translateY(-100%)}
.bar form{display:flex;align-items:center;gap:var(--sp-1);flex-wrap:wrap;
  justify-content:center;max-width:800px;margin:0 auto}
.brand{font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.02em;
  margin-right:var(--sp-1);user-select:none;white-space:nowrap}
.brand small{color:var(--fg-faint);font-weight:400}
input[type=search]{flex:1;min-width:130px;max-width:300px;font-size:16px;
  color:var(--fg);background:var(--bg-card);border:1px solid var(--line);
  border-radius:8px;padding:.35em .7em;outline:none;appearance:none}
input[type=search]:focus{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
select{font-size:13px;color:var(--fg-soft);background:var(--bg-card);
  border:1px solid var(--line);border-radius:8px;padding:.3em .4em;max-width:180px}
.btn{font-size:15px;background:var(--bg-card);color:var(--fg-soft);
  border:1px solid var(--line);border-radius:8px;padding:.3em .55em;cursor:pointer;line-height:1.2}
.btn:hover{color:var(--fg);border-color:var(--fg-faint)}
.btn:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

/* ── results ───────────────────────────────────────────────────────── */
#status{color:var(--fg-soft);font-size:13px;padding:var(--sp-2) 0;min-height:1.4em;
  opacity:0;transition:opacity .35s ease}
#status.show{opacity:1}
#status .spin{display:inline-block;width:1em;height:1em;border:2px solid var(--line);
  border-top-color:var(--accent);border-radius:50%;vertical-align:-.15em;
  animation:spin .7s linear infinite;margin-right:.4em}
@keyframes spin{to{transform:rotate(360deg)}}
details.dict{margin-top:var(--sp-2);background:var(--bg-card);border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
details.dict>summary{cursor:pointer;padding:var(--sp-1) var(--sp-2);font-weight:600;
  color:var(--fg-soft);list-style:none;display:flex;align-items:center;gap:var(--sp-1)}
details.dict>summary::-webkit-details-marker{display:none}
details.dict>summary::before{content:"›";color:var(--fg-faint);
  transition:transform .18s ease;font-weight:400}
details.dict[open]>summary::before{transform:rotate(90deg)}
details.dict[open]>summary{border-bottom:1px solid var(--line-soft)}
summary .count{margin-left:auto;font-weight:400;color:var(--fg-faint);font-size:12px}
summary .more{font-weight:400;font-size:12px;color:var(--link);cursor:pointer;
  text-decoration:underline;text-underline-offset:2px;margin-left:var(--sp-2)}
summary .upgrade{font-weight:400;font-size:12px;color:var(--link);cursor:pointer;
  text-decoration:underline;text-underline-offset:2px;margin-left:auto}
dl{margin:0;padding:var(--sp-1) var(--sp-2) var(--sp-2)}
dt{font-size:1.272em;font-weight:700;color:var(--accent);word-break:break-word;
  margin-top:var(--sp-2)}
dt:first-child{margin-top:var(--sp-1)}
dd{margin:var(--sp-1) 0 0 0}

/* article sandbox host: dictionary CSS lives inside the shadow root and
   cannot touch the chrome; in dark mode the whole article is inverted
   Dark-Reader style (media flipped back inside the shadow root) */
.article{display:block;border-radius:8px;background:#fff;color:#1a1a1a;
  padding:var(--sp-1) var(--sp-2);overflow-x:auto;overflow-y:hidden}
html[data-theme="dark"] .article:not(iframe),
html:not([data-theme]) .article.autodark:not(iframe){
  filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.92)}
iframe.article{width:100%;border:0;display:block;background:#fff;border-radius:8px;
  padding:0;overflow:hidden}

.empty{padding-top:var(--sp-5);text-align:center;color:var(--fg-faint)}
.empty svg path{fill:var(--line)}

/* ── dictionaries panel ────────────────────────────────────────────── */
#panel{position:fixed;inset:0;z-index:200;display:none;background:color-mix(in srgb,var(--fg) 24%,transparent)}
#panel.show{display:block}
.panel-card{position:absolute;top:0;right:0;bottom:0;width:min(420px,92vw);
  background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow);
  padding:var(--sp-3);overflow-y:auto}
.panel-card h2{margin:0 0 var(--sp-2);font-size:16px;color:var(--fg);
  display:flex;align-items:center}
.panel-card h2 .btn{margin-left:auto}
.pd{border:1px solid var(--line);border-radius:8px;background:var(--bg-card);
  padding:var(--sp-1) var(--sp-2);margin-bottom:var(--sp-1);font-size:13px}
.pd.dragging{opacity:.45}
.pd.drop-before{box-shadow:0 -2px 0 var(--accent)}
.pd.drop-after{box-shadow:0 2px 0 var(--accent)}
.pd.off{opacity:.5}
.pd .hd{display:flex;align-items:center;gap:.35em}
.pd .grip{cursor:grab;color:var(--fg-faint);user-select:none;font-size:14px;
  line-height:1;letter-spacing:-.15em;padding-right:.15em}
.pd .grip:active{cursor:grabbing}
.pd b{color:var(--fg);font-size:14px;word-break:break-word;flex:1}
.pd .ord{display:flex;gap:.1em;margin-left:auto}
.pd .ord button{background:none;border:0;color:var(--fg-faint);cursor:pointer;
  font-size:12px;line-height:1;padding:.15em .2em;border-radius:4px}
.pd .ord button:hover{color:var(--fg);background:var(--line-soft)}
.pd .en{appearance:none;width:32px;height:18px;border-radius:9px;background:var(--line);
  position:relative;cursor:pointer;flex:none;transition:background .15s}
.pd .en:checked{background:var(--accent)}
.pd .en::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;
  border-radius:50%;background:#fff;transition:transform .15s}
.pd .en:checked::after{transform:translateX(14px)}
.pd .meta{color:var(--fg-faint);font-size:11.5px;margin:.15em 0 .3em}
.pd .tag{display:inline-block;border:1px solid var(--line);border-radius:5px;
  padding:0 .4em;font-size:10.5px;color:var(--fg-soft);margin-right:.25em}
.pd .tag.on{color:var(--accent);border-color:var(--accent)}
.pd .act{color:var(--link);cursor:pointer;text-decoration:underline;
  text-underline-offset:2px;font-size:12px;margin-right:var(--sp-2)}
.pd .path{color:var(--fg-faint);font-size:10.5px;word-break:break-all;cursor:pointer}
.pd .err{color:#c0564f}

/* ── responsive ────────────────────────────────────────────────────── */
@media (max-width:600px){
  body{padding-top:5.6em}
  .container{width:auto;padding:0 var(--sp-2) var(--sp-4)}
  .brand{display:none}
  input[type=search]{font-size:16px;min-width:100px}
  select{max-width:130px}
}
</style>
</head>
<body>
<header class="bar" id="bar">
<form id="frm" role="search">
<span class="brand">gonow<small>·dict</small></span>
<input type="search" id="q" placeholder="Search…" autocomplete="off" autofocus aria-label="Search term">
<select id="mode" aria-label="Search mode">
<option value="prefix">prefix</option>
<option value="exact">exact</option>
<option value="fuzzy">fuzzy</option>
<option value="fts">full-text</option>
</select>
<select id="dict" aria-label="Dictionary"><option value="all">All dictionaries</option></select>
<button type="submit" class="btn" title="Search" aria-label="Search">🔍</button>
<button type="button" class="btn" id="themeBtn" title="Theme" aria-label="Toggle theme">◐</button>
<button type="button" class="btn" id="wideBtn" title="Toggle wide layout" aria-label="Toggle wide layout">⇔</button>
<button type="button" class="btn" id="panelBtn" title="Dictionaries" aria-label="Manage dictionaries">☰</button>
</form>
</header>

<main class="container">
<div id="status" role="status" aria-live="polite"></div>
<div id="out"></div>
</main>

<div id="panel" role="dialog" aria-label="Dictionaries">
<div class="panel-card">
<h2>Dictionaries <button class="btn" id="ingestAllBtn" title="Enable full-text search for every dictionary">⚡ enable all</button>
<button class="btn" id="rescanBtn" title="Rescan folder">⟳ rescan</button>
<button class="btn" id="closePanel" aria-label="Close">✕</button></h2>
<div id="panelList"></div>
</div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
let dicts=[],lastQuery=null,searchSeq=0;

/* preference order (ids) + disabled set, persisted. New dictionaries not
   yet in the saved order fall in alphabetically after the ordered ones. */
function loadJSON(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
let prefOrder=loadJSON("gonow_order",[]);
let disabled=new Set(loadJSON("gonow_disabled",[]));
function saveOrder(){localStorage.setItem("gonow_order",JSON.stringify(prefOrder))}
function saveDisabled(){localStorage.setItem("gonow_disabled",JSON.stringify([...disabled]))}
/* dictionaries in preference order: saved ones first, then unseen ones A→Z */
function orderedDicts(){
  const byId=new Map(dicts.map(d=>[d.id,d]));
  const out=[];
  for(const id of prefOrder){if(byId.has(id)){out.push(byId.get(id));byId.delete(id)}}
  const rest=[...byId.values()].sort((a,b)=>dictLabel(a).localeCompare(dictLabel(b),undefined,{sensitivity:"base"}));
  return out.concat(rest);
}
function orderedIds(){return orderedDicts().map(d=>d.id)}
function enabledOrderedIds(){return orderedDicts().filter(d=>!disabled.has(d.id)).map(d=>d.id)}

/* ── theme: auto → light → dark, persisted ─────────────────────────── */
const THEMES=["auto","light","dark"];
function applyTheme(t){
  if(t==="auto")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
  $("themeBtn").textContent=t==="auto"?"◐":(t==="light"?"☀":"☾");
  $("themeBtn").title="Theme: "+t;
  syncAutoDark();
}
function themeIsDark(){
  const t=localStorage.getItem("gonow_theme")||"auto";
  if(t==="dark")return true;
  if(t==="light")return false;
  return matchMedia("(prefers-color-scheme: dark)").matches;
}
/* hosts get .autodark so the invert rule also applies in auto mode */
function syncAutoDark(){
  const dark=themeIsDark();
  document.querySelectorAll(".article").forEach(el=>{
    if(el.tagName==="IFRAME"){
      el.contentWindow&&el.contentWindow.postMessage({t:"theme",dark},"*");
      return;
    }
    el.classList.toggle("autodark",dark&&!document.documentElement.hasAttribute("data-theme"));
    if(el.shadowRoot)el.shadowRoot.host.toggleAttribute("data-dark",dark);
  });
}
/* wide layout toggle, persisted */
function applyWide(on){document.body.classList.toggle("wide",on);$("wideBtn").style.color=on?"var(--accent)":""}
$("wideBtn").onclick=()=>{
  const on=!document.body.classList.contains("wide");
  localStorage.setItem("gonow_wide",on?"1":"");applyWide(on);
};
applyWide(localStorage.getItem("gonow_wide")==="1");

$("themeBtn").onclick=()=>{
  const cur=localStorage.getItem("gonow_theme")||"auto";
  const next=THEMES[(THEMES.indexOf(cur)+1)%THEMES.length];
  localStorage.setItem("gonow_theme",next);applyTheme(next);
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",syncAutoDark);
applyTheme(localStorage.getItem("gonow_theme")||"auto");

/* ── dictionaries ──────────────────────────────────────────────────── */
function dictLabel(d){return d.name||d.path.split("/").pop()}
async function loadDicts(rescan){
  setStatus('<span class="spin"></span>Loading dictionaries…');
  try{
    dicts=await (await fetch(rescan?"/api/rescan":"/api/dicts")).json();
  }finally{
    if(!lastQuery)setStatus("");
  }
  dicts.sort((a,b)=>dictLabel(a).localeCompare(dictLabel(b),undefined,{sensitivity:"base"}));
  // normalize the saved preference order to the current dictionary set
  // (appends newly-added dicts A→Z, drops removed ones)
  prefOrder=orderedIds();saveOrder();
  const sel=$("dict"),prev=sel.value||localStorage.getItem("gonow_dict")||"all";
  sel.innerHTML='<option value="all">All dictionaries</option>';
  for(const d of dicts){ // dropdown stays alphabetical for quick name lookup
    const o=document.createElement("option");
    o.value=d.id;o.textContent=dictLabel(d);
    sel.appendChild(o);
  }
  if([...sel.options].some(o=>o.value===prev))sel.value=prev;
  renderPanel();
}
/* reorder helpers operate on the preference-ordered id list */
function moveDict(id,where){
  const ids=orderedIds(),i=ids.indexOf(id);
  if(i<0)return;
  ids.splice(i,1);
  if(where==="up")ids.splice(Math.max(0,i-1),0,id);
  else if(where==="down")ids.splice(Math.min(ids.length,i+1),0,id);
  else if(where==="top")ids.unshift(id);
  else ids.push(id); // bottom
  prefOrder=ids;saveOrder();renderPanel();
}
function toggleDict(id){
  disabled.has(id)?disabled.delete(id):disabled.add(id);
  saveDisabled();renderPanel();
}
$("dict").onchange=e=>{localStorage.setItem("gonow_dict",e.target.value);if($("q").value.trim())doSearch()};

function renderPanel(){
  const el=$("panelList");el.innerHTML="";
  const ord=orderedDicts();
  for(const d of ord){
    const off=disabled.has(d.id);
    const div=document.createElement("div");div.className="pd"+(off?" off":"");div.dataset.id=d.id;
    let caps="";
    for(const[k,on]of[["exact",d.caps?.Exact],["prefix",d.caps?.Prefix],["fuzzy",d.caps?.Fuzzy],["full-text",d.caps?.FTS]])
      caps+=`<span class="tag${on?" on":""}">${k}</span>`;
    // fuzzy search is built automatically on first use, so the only manual
    // action offered is full-text (which also covers fuzzy).
    let acts="";
    if(d.error){acts=`<span class="err">${esc(d.error)}</span>`}
    else if(!d.caps?.FTS)acts=`<span class="act" data-act="ingest">full-text search</span>`+
      `<span class="act" data-act="ingest-full">FTS + pack media</span>`;
    else acts=`<span class="act" data-act="ingest-full">Pack media into .media.db</span>`;
    div.innerHTML=`<div class="hd">
        <span class="grip" draggable="true" title="Drag to reorder">⠿</span>
        <b>${esc(dictLabel(d))}</b>
        <span class="ord">
          <button data-mv="top" title="Move to top">⏫</button>
          <button data-mv="up" title="Move up">▲</button>
          <button data-mv="down" title="Move down">▼</button>
          <button data-mv="bottom" title="Move to bottom">⏬</button>
        </span>
        <input type="checkbox" class="en" ${off?"":"checked"} title="${off?"Disabled — excluded from All dictionaries":"Enabled"}">
      </div>
      <div class="meta">${esc(d.format||"?")} · ${d.entries?d.entries.toLocaleString()+" entries":""}</div>
      <div>${caps}</div><div class="acts">${acts}</div>
      ${d.dbPath?`<div class="path" title="Click to copy">db: ${esc(d.dbPath)}</div>`:""}`;
    el.appendChild(div);
  }
}

/* drag-to-reorder via the gripper (chevrons cover keyboard/precise moves) */
let dragId=null;
function clearDrop(){document.querySelectorAll(".pd.drop-before,.pd.drop-after").forEach(p=>p.classList.remove("drop-before","drop-after"))}
$("panelList").addEventListener("dragstart",e=>{
  const pd=e.target.closest(".pd");if(!pd||!e.target.classList.contains("grip"))return;
  dragId=pd.dataset.id;pd.classList.add("dragging");e.dataTransfer.effectAllowed="move";
});
$("panelList").addEventListener("dragend",()=>{
  document.querySelectorAll(".pd.dragging").forEach(p=>p.classList.remove("dragging"));clearDrop();dragId=null;
});
$("panelList").addEventListener("dragover",e=>{
  if(!dragId)return;e.preventDefault();
  const pd=e.target.closest(".pd");if(!pd||pd.dataset.id===dragId)return;
  const r=pd.getBoundingClientRect(),after=e.clientY>r.top+r.height/2;
  clearDrop();pd.classList.add(after?"drop-after":"drop-before");
});
$("panelList").addEventListener("drop",e=>{
  if(!dragId)return;e.preventDefault();
  const pd=e.target.closest(".pd");if(!pd||pd.dataset.id===dragId){clearDrop();return}
  const r=pd.getBoundingClientRect(),after=e.clientY>r.top+r.height/2;
  const ids=orderedIds(),from=ids.indexOf(dragId);ids.splice(from,1);
  let to=ids.indexOf(pd.dataset.id);if(after)to++;
  ids.splice(to,0,dragId);prefOrder=ids;saveOrder();clearDrop();dragId=null;renderPanel();
});
$("panelBtn").onclick=()=>$("panel").classList.add("show");
$("closePanel").onclick=()=>$("panel").classList.remove("show");
$("panel").onclick=e=>{if(e.target.id==="panel")$("panel").classList.remove("show")};
$("rescanBtn").onclick=()=>loadDicts(true);
$("ingestAllBtn").onclick=async()=>{
  const btn=$("ingestAllBtn");
  if(btn.disabled)return;
  const todo=dicts.filter(d=>!d.error&&!d.caps?.FTS);
  if(!todo.length){btn.textContent="✓ all enabled";setTimeout(()=>btn.textContent="⚡ enable all",1500);return}
  btn.disabled=true;
  let n=0;
  for(const d of todo){
    n++;btn.textContent=`⚡ ${n}/${todo.length}…`;
    const label=document.querySelector(`.pd[data-id="${d.id}"] .act`)||btn;
    await runIngest(d.id,{quiet:true,statusPrefix:`${n}/${todo.length} · `},label);
  }
  btn.disabled=false;btn.textContent="⚡ enable all";
  setStatus("✓ all dictionaries indexed");
  await loadDicts();if(lastQuery)doSearch();
};
$("panelList").addEventListener("click",e=>{
  const mv=e.target.closest("[data-mv]");
  if(mv){moveDict(mv.closest(".pd").dataset.id,mv.dataset.mv);return}
  const path=e.target.closest(".path");
  if(path){navigator.clipboard?.writeText(path.textContent.replace(/^db: /,""));path.style.color="var(--accent)";return}
  const act=e.target.closest(".act");if(!act)return;
  runIngest(act.closest(".pd").dataset.id,
    {full:act.dataset.act==="ingest-full",level:act.dataset.act==="ingest-fuzzy"?"headwords":""},act);
});
$("panelList").addEventListener("change",e=>{
  if(e.target.classList.contains("en"))toggleDict(e.target.closest(".pd").dataset.id);
});
/* the "enable fuzzy & full-text search" link inside result summaries */
document.addEventListener("click",e=>{
  const up=e.target.closest("summary .upgrade");
  if(!up)return;
  e.preventDefault(); // don't toggle the <details>
  runIngest(up.dataset.id,{},up);
});

function runIngest(id,opts,label){
  if(label.dataset.busy)return Promise.resolve(); // ignore repeat clicks
  label.dataset.busy="1";
  const name=dictLabel(dicts.find(d=>d.id===id)||{path:""});
  const show=t=>{
    label.textContent=t;
    setStatus('<span class="spin"></span>'+(opts.statusPrefix||"")+esc(name)+" — "+esc(t));
  };
  show("preparing search index…");
  label.classList.remove("act");
  label.style.textDecoration="none";label.style.cursor="default";
  const params=(opts.full?"&full=1":"")+(opts.level==="headwords"?"&level=headwords":"");
  return new Promise(resolve=>{
    const es=new EventSource("/api/ingest?dict="+id+params);
    es.addEventListener("progress",ev=>{
      const p=JSON.parse(ev.data);
      show("preparing… "+p.done.toLocaleString()+(p.total?"/"+p.total.toLocaleString():""));
    });
    es.addEventListener("done",async()=>{
      es.close();
      setStatus("✓ "+esc(name)+" — search index ready");
      if(!opts.quiet){await loadDicts();if(lastQuery)doSearch()}
      resolve(true);
    });
    es.addEventListener("error",()=>{es.close();show("failed");label.classList.add("err");resolve(false)});
  });
}

/* ── search ────────────────────────────────────────────────────────── */
const noResultsSVG=`<svg width="90" height="90" viewBox="0 0 1000 1000" aria-hidden="true"><path d="M979.7,929.8L782.3,732.4c-1.3-1.3-2.9-1.8-4.2-2.8c65-76.2,104.4-174.8,104.4-282.8c0-240.9-195.3-436.3-436.3-436.3S10,205.9,10,446.8c0,38.5,5.5,75.6,14.8,111.1C36.1,540.7,65.4,500,83,492.4c-1.9-15-3.1-30.1-3.1-45.6c0-202.4,164.1-366.5,366.5-366.5c202.4,0,366.5,164.1,366.5,366.5c0,159-101.5,294.1-243.1,344.8c-6.7,28.7-17.6,56.1-32.5,81.6c72.6-15.5,138.6-48.8,193-95.5c1,1.3,1.6,2.9,2.8,4.2l197.4,197.3c13.6,13.7,35.7,13.7,49.3,0C993.4,965.6,993.4,943.5,979.7,929.8L979.7,929.8z"/></svg>`;

/* Article HTML arrives with resource refs already rewritten to the
   root-absolute /res/{dict}/… form by the server (RewriteEntryHTML,
   unit-tested in Go), so the click handlers below use those hrefs as-is.
   resURL is only the fallback for refs the server-side attribute regex
   cannot see (e.g. unquoted attributes in malformed dictionary HTML); it
   emits the same absolute form, so it never double-prefixes. Absolute
   (not relative) because articles also render inside srcdoc iframes whose
   base URL differs — /res/ resolves to the same origin URL everywhere. */
function resURL(dictID,ref){
  ref=ref.replace(/^sound:\/\//i,"").replace(/^file:\/\//i,"").replace(/^\.?\//,"");
  return "/res/"+dictID+"/"+ref;
}

/* shadow-root base style: sane defaults inside the sandbox; media flip
   back when the host carries data-dark (Dark-Reader approach) */
const shadowBase=`<style>
:host{all:initial;display:block;font-family:${"-apple-system,Helvetica,Arial,sans-serif"};
  font-size:15px;line-height:1.618;color:#1a1a1a;word-break:break-word}
img,video,svg{max-width:100%;height:auto}
a{color:#5b7a99;cursor:pointer}
table{max-width:100%;border-collapse:collapse}
mark{background:#fff0b3;color:#5c4a00;border-radius:2px;padding:0 .1em}
:host([data-dark]) :is(img,picture,video,svg,canvas,iframe,embed,object,[data-noinvert]){
  filter:invert(1) hue-rotate(180deg)}
</style>`;

function renderArticle(dd,body,dictID){
  // Script-bearing articles (custom tooltips, MathJax, …) need a real
  // document scope: shadow roots neither execute <script> nor let
  // scripts see their content. Render those in a sandboxed iframe.
  if(/<script[\s>]/i.test(body))return renderFrame(dd,body,dictID);
  // <dd> cannot host a shadow root; use an inner <div> as the sandbox
  const host=document.createElement("div");
  host.className="article";host.dataset.dict=dictID;
  const root=host.attachShadow({mode:"open"});
  root.innerHTML=shadowBase+body;
  if(themeIsDark()){
    host.toggleAttribute("data-dark",true);
    if(!document.documentElement.hasAttribute("data-theme"))host.classList.add("autodark");
  }
  dd.appendChild(host);
  return root;
}

let frameSeq=0;
function renderFrame(dd,body,dictID){
  const fid="f"+(++frameSeq);
  const ifr=document.createElement("iframe");
  ifr.className="article frame";ifr.dataset.dict=dictID;ifr.dataset.fid=fid;
  ifr.setAttribute("sandbox","allow-scripts allow-same-origin allow-popups");
  ifr.style.height="90px";
  ifr.srcdoc=frameDoc(body,fid,themeIsDark());
  dd.appendChild(ifr);
  return null; // no shadow root: mark.js highlighting not applicable
}
function frameDoc(content,fid,dark){
  return '<!DOCTYPE html><html class="'+(dark?'dark':'')+'"><head><meta charset="utf-8">'+
    '<style>html{font-family:-apple-system,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.618;color:#1a1a1a;background:#fff;overflow-y:hidden}'+
    'body{margin:8px;word-break:break-word}img,video,svg{max-width:100%;height:auto}'+
    'html.dark{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.92)}'+
    'html.dark :is(img,picture,video,svg,canvas,iframe,embed,object,[data-noinvert]){filter:invert(1) hue-rotate(180deg)}'+
    '</style><script src="/assets/frame.js" data-fid="'+fid+'"><\/script></head><body>'+content+'</body></html>';
}
/* bridge messages from article iframes */
addEventListener("message",e=>{
  const d=e.data||{};
  if(d.t==="h"&&d.fid){
    const f=document.querySelector('iframe[data-fid="'+CSS.escape(d.fid)+'"]');
    if(f)f.style.height=Math.min(Math.max((+d.h||0)+6,48),60000)+"px";
  }else if(d.t==="lookup"&&d.w){
    lookupWord(d.w);
  }
});

/* status with fade + minimum display time: new messages replace the
   current one immediately, but clearing waits until the message has been
   readable for STATUS_MIN ms */
const STATUS_MIN=1200;
let statusTs=0,statusTimer=null,statusPending;
function setStatus(html){
  statusPending=html;
  clearTimeout(statusTimer);
  const el=$("status");
  const apply=()=>{
    if(statusPending){el.innerHTML=statusPending;el.classList.add("show");statusTs=Date.now()}
    else{el.classList.remove("show");statusTs=0}
  };
  // every displayed message stays readable for STATUS_MIN; bursts of
  // updates coalesce to the latest one
  const left=STATUS_MIN-(Date.now()-statusTs);
  if(el.classList.contains("show")&&left>0){statusTimer=setTimeout(apply,left);return}
  apply();
}

/* read a newline-delimited JSON response, invoking onMsg per record as it
   arrives — this is what lets each dictionary render the instant it is
   ready instead of waiting for the whole fan-out (progressive results). */
async function fetchStream(url,onMsg){
  const resp=await fetch(url);
  if(!resp.ok){let e;try{e=(await resp.json()).error}catch(_){}throw new Error(e||resp.statusText)}
  const reader=resp.body.getReader(),dec=new TextDecoder();let buf="";
  for(;;){
    const{value,done}=await reader.read();
    if(done)break;
    buf+=dec.decode(value,{stream:true});
    let nl;
    while((nl=buf.indexOf("\n"))>=0){
      const line=buf.slice(0,nl).trim();buf=buf.slice(nl+1);
      if(line)onMsg(JSON.parse(line));
    }
  }
  buf=buf.trim();if(buf)onMsg(JSON.parse(buf));
}
function highlight(roots,mode,q){
  if(!((mode==="fuzzy"||mode==="fts")&&window.Mark))return;
  const rx=new RegExp(q.trim().split(/\s+/).map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"),"gi");
  for(const root of roots){if(root)try{new Mark(root).markRegExp(rx)}catch(e){}}
}
/* render one dictionary's results into its ordered slot box; returns
   {shown,results}. shown = something visible (results/error/upgrade);
   results = actual entries (drives auto-open + empty-state). */
function renderSlot(box,h,mode,q,perDict){
  box.innerHTML="";
  if(h.error){
    box.innerHTML=`<details class="dict"><summary>${esc(h.name||h.dict)}<span class="count">⚠ ${esc(h.error)}</span></summary></details>`;
    return{shown:true};
  }
  if(h.skipped){
    // full-text is opt-in → offer the upgrade link; fuzzy auto-builds on
    // first search, so it is just "preparing" and will work on the next one.
    if(mode==="fts"){
      box.innerHTML=`<details class="dict"><summary>${esc(h.name)}<span class="upgrade" data-id="${h.dict}">enable full-text search</span></summary></details>`;
      return{shown:true};
    }
    if(mode==="fuzzy"){
      box.innerHTML=`<details class="dict"><summary>${esc(h.name)}<span class="count">preparing fuzzy index…</span></summary></details>`;
      return{shown:true};
    }
    return{};
  }
  if(!h.results?.length)return{};
  const det=document.createElement("details");det.className="dict";
  const more=h.results.length>=perDict?`<span class="more" data-id="${h.dict}">more…</span>`:"";
  det.innerHTML=`<summary>${esc(h.name)}<span class="count">${h.results.length}${more?"+":""} result${h.results.length===1?"":"s"}</span>${more}</summary>`;
  const dl=document.createElement("dl"),roots=[];
  for(const r of h.results){
    const dt=document.createElement("dt");dt.textContent=r.Headword;
    const dd=document.createElement("dd");dd.dataset.dict=h.dict;
    roots.push(renderArticle(dd,r.Body,h.dict));
    dl.appendChild(dt);dl.appendChild(dd);
  }
  det.appendChild(dl);box.appendChild(det);
  highlight(roots,mode,q);
  return{shown:true,results:true};
}

async function doSearch(ev){
  if(ev)ev.preventDefault();
  const q=$("q").value.trim();
  if(!q)return;
  const mode=$("mode").value,dictSel=$("dict").value,seq=++searchSeq;
  lastQuery=q;
  setStatus('<span class="spin"></span>Searching…');
  // "All" queries the enabled dictionaries in preference order (fewer
  // results each); a specific pick queries just that one (more results).
  let dictParam,perDict;
  if(dictSel==="all"){
    const ids=enabledOrderedIds();
    if(!ids.length){setStatus("⚠ All dictionaries are disabled — enable some in the ☰ panel");return}
    dictParam=ids.join(",");perDict=5;
  }else{dictParam=dictSel;perDict=25}
  const out=$("out");
  let boxes=[],openedIdx=null,anyShown=false;
  try{
    await fetchStream("/api/search?q="+encodeURIComponent(q)+"&mode="+mode+"&dict="+encodeURIComponent(dictParam)+"&n="+perDict,msg=>{
      if(seq!==searchSeq)return; // superseded by a newer search
      if(msg.t==="begin"){
        out.innerHTML="";
        boxes=(msg.slots||[]).map(()=>{const b=document.createElement("div");out.appendChild(b);return b});
        setStatus("");
      }else if(msg.t==="hit"){
        const box=boxes[msg.i];if(!box)return;
        const res=renderSlot(box,msg,mode,q,perDict);
        if(res.shown)anyShown=true;
        // auto-open the highest-preference (lowest index) dict with results,
        // even if a later-preference dict finished first
        if(res.results&&(openedIdx===null||msg.i<openedIdx)){
          const det=box.querySelector("details.dict");
          if(det){
            if(openedIdx!==null){const p=boxes[openedIdx]?.querySelector("details.dict");if(p)p.open=false}
            det.open=true;openedIdx=msg.i;
          }
        }
      }else if(msg.t==="end"&&!anyShown){
        out.innerHTML=`<div class="empty">${noResultsSVG}<p>No results for “${esc(q)}”</p></div>`;
      }
    });
  }catch(err){if(seq===searchSeq)setStatus("⚠ "+esc(err.message))}
}
$("frm").addEventListener("submit",doSearch);
/* "more…": re-query a single dictionary at a higher limit, in place */
document.addEventListener("click",e=>{
  const more=e.target.closest("summary .more");
  if(!more)return;
  e.preventDefault();
  const det=more.closest("details.dict"),box=det.parentElement,id=more.dataset.id,mode=$("mode").value;
  more.textContent="…";
  fetchStream("/api/search?q="+encodeURIComponent(lastQuery)+"&mode="+mode+"&dict="+id+"&n=100",msg=>{
    if(msg.t==="hit"){renderSlot(box,msg,mode,lastQuery,1e9);const nd=box.querySelector("details.dict");if(nd)nd.open=true}
  }).catch(()=>{more.textContent="more…"});
});

/* live search: debounce while typing */
let debounce=null;
$("q").addEventListener("input",()=>{
  clearTimeout(debounce);
  const v=$("q").value.trim();
  if(v.length<2)return;
  debounce=setTimeout(doSearch,300);
});

/* keyboard: "/" focuses search */
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==$("q")){e.preventDefault();$("q").focus();$("q").select()}
  if(e.key==="Escape")$("panel").classList.remove("show");
});

/* clicks inside shadow roots arrive via composedPath */
function lookupWord(w){
  $("q").value=w.trim().split(/[;.,:{}()\[\]\s]/)[0].replace(/\d+$/,"");
  if($("mode").value==="fts")$("mode").value="prefix";
  doSearch();
}
/* One reused <audio>, kept referenced so the browser can't garbage-collect
   it mid-load. .spx audio is transcoded server-side (speexdec), so the first
   response can lag enough that an unreferenced `new Audio(url)` would be
   collected before it plays. Playback decodes by Content-Type, not the URL
   extension, so a .spx URL served as audio/wav plays fine. */
let audioEl=null;
function playAudio(url){
  if(!url)return;
  if(!audioEl)audioEl=new Audio();
  audioEl.src=url;
  const p=audioEl.play();
  if(p&&p.catch)p.catch(err=>{console.warn("audio play failed:",url,err);setStatus("⚠ could not play audio")});
}
document.addEventListener("click",e=>{
  const path=e.composedPath();
  const a=path.find(el=>el.tagName==="A");
  if(!a)return;
  const dd=path.find(el=>el.classList?.contains("article"));
  const dictID=dd?.dataset.dict;
  const href=a.getAttribute("href")||"";
  if(/^(bword|entry):\/\//i.test(href)||/^[dx]:/i.test(href)){
    e.preventDefault();lookupWord(decodeURIComponent(href.replace(/^(bword|entry):\/\//i,"").replace(/^[dx]:/i,"")));
  }else if(/\.(mp3|ogg|wav|spx|m4a)(\?|#|$)/i.test(href)){
    e.preventDefault();playAudio(href.startsWith("/res/")||/^https?:/i.test(href)?href:resURL(dictID,href));
  }else if(a.querySelector("img")&&href.startsWith("/res/")){
    e.preventDefault();playAudio(href);
  }else if(href&&!/^([a-z][\w+.-]*:|\/|#|res\/|assets\/)/i.test(href)){
    e.preventDefault();lookupWord(decodeURIComponent(href)); // bare-word link (slob)
  }
});
document.addEventListener("dblclick",e=>{
  const path=e.composedPath();
  if(!path.some(el=>el.classList?.contains("article")))return;
  const root=path.find(el=>el instanceof ShadowRoot);
  let sel="";
  try{sel=(root&&root.getSelection?root.getSelection():document.getSelection()).toString().trim()}catch(_){ }
  if(sel)lookupWord(sel);
});

/* audio inside <object type="audio/…"> (DSL) → click to play */
document.addEventListener("click",e=>{
  const o=e.composedPath().find(el=>el.tagName==="OBJECT"&&/^audio\//.test(el.getAttribute("type")||""));
  if(o){e.preventDefault();playAudio(o.getAttribute("data"))}
});

/* auto-hide bar on scroll down */
let prevScroll=window.pageYOffset;
addEventListener("scroll",()=>{
  const cur=window.pageYOffset;
  $("bar").classList.toggle("hidden",cur>80&&cur>prevScroll);
  prevScroll=cur;
});

/* shareable links: ?q=…&mode=…&dict=… (kept in sync on search) */
function applyURL(){
  const p=new URLSearchParams(location.search);
  if(p.get("theme")){localStorage.setItem("gonow_theme",p.get("theme"));applyTheme(p.get("theme"))}
  if(p.get("mode"))$("mode").value=p.get("mode");
  if(p.get("dict"))$("dict").value=p.get("dict");
  if(p.get("q")){$("q").value=p.get("q");doSearch()}
}
const _doSearch=doSearch;
doSearch=function(ev){
  const r=_doSearch(ev);
  const q=$("q").value.trim();
  if(q){
    const p=new URLSearchParams({q,mode:$("mode").value,dict:$("dict").value});
    history.replaceState(null,"","?"+p.toString());
  }
  return r;
};
$("frm").removeEventListener("submit",_doSearch);
$("frm").addEventListener("submit",e=>doSearch(e));

loadDicts().then(applyURL);
</script>
