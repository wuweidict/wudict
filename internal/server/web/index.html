  if(!sel&&root&&window.wuWordAt)sel=wuWordAt(e,root);

/* Audio, in the CAPTURE phase and owned outright — the click never reaches the

   <object type="audio/…" data="…"> still stored by library folders prepared
   before D81.

   itself: LDOCE writes `<a onclick="new Audio(this.href).play(); return false;"
   href="…mp3">`, and an event-handler CONTENT attribute runs even in a shadow
   root, which executes no <script> at all — so "this article has no scripts" is
   not the same as "nothing here plays audio". preventDefault cannot stop a
   handler, only a default action, so both elements would play the same URL,
   each starting when its own load finished: audibly doubled on the first

    // below: `entry://…mp3` names a headword, not a file.

  e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();

  // Prefixed rather than trimmed: a name whose whole stem is non-ASCII
  // collapses to a leading "-", and trimming that would throw the extension
  // away with it, leaving "png".
  if(!/^[A-Za-z0-9]/.test(n))n="f"+n;
  if(n.length>64){
    const dot=n.lastIndexOf(".");
    let ext=dot>0?n.slice(dot):"";
    if(ext.length>16)ext="";
    n=n.slice(0,64-ext.length)+ext;
  }
  return n;
}
/* One at a time and stopping at the first refusal: these are uploads to the
   reader's own disk, and a loop that carried on past a full folder would
   report a count nobody can map back onto what is now there. */
async function stylerUpload(list){
  if(!list.length)return;
  const cap=(stylerFileLimits&&stylerFileLimits.file)||(8<<20);
  let done=0;
  for(const file of list){
    const name=stylerFileName(file.name);
    if(file.size>cap){
      stylerNote(name+" is "+mb(file.size)+" — one file may be "+mb(cap)+" at most");
      return;
    }
    let q="";
    if((stylerFileRows||[]).some(x=>x.name===name)){
      if(!confirm(name+" is already there. Replace it?"))continue;
      q="&replace=1";
    }
    stylerNote("Uploading "+name+"…");
    try{
      const r=await fetch("/api/files?name="+encodeURIComponent(name)+q,
        {method:"POST",headers:{"Content-Type":file.type||"application/octet-stream"},body:file});
      if(!r.ok){
        throw new Error(await apiError(r));
      }
      stylerFilesTake(await r.json());
      done++;
    }catch(e){
      stylerNote("Could not upload "+name+": "+e.message);
      return;
    }
  }
  if(done){stylerNote(done===1?"Added":"Added "+done+" files");setTimeout(stylerNote,1600)}
}
/* One menu for both tabs, built once. Grouped, because a reader arrives
   wanting a RESULT — sepia, a wider column — and not knowing which of our two
   files it is spelled in; that is the placement rule's job, above. */
function stylerFillPresets(){
  const sel=$("stylerPreset");
  if(sel.options.length)return;
  const head=document.createElement("option");
  head.value="";head.textContent="Examples…";sel.appendChild(head);
  const groups={};
  for(const p of STYLER_PRESETS){
    const g=groups[p.g]||(groups[p.g]=Object.assign(document.createElement("optgroup"),{label:p.g}));
    const o=document.createElement("option");o.value=p.n;o.textContent=p.n;g.appendChild(o);
  }
  for(const k in groups)sel.appendChild(groups[k]);
  sel.value="";
}
/* A preset lands in the box or boxes it was written for, and the view follows
   it so that no half arrives unseen. Re-picking one is a no-op rather than a
   second copy — the halves shared between presets are one exact string, so
   "already there" is a substring test and not a guess.
   Undo stays the textarea's own, and it belongs to the box on screen: for a
   two-part preset, Ctrl/⌘-Z takes back the half you are looking at. The other
   half is one tab away, its tab is dotted, and Clear empties it. */
function stylerApplyPreset(p){
  const put=[],had=[];
  for(const box of ["app","article"]){
    const css=p[box];
    if(!css)continue;
    if(stylerText[box].includes(css)){had.push(BOXNAME[box]);continue}
    if(stylerTab!==box)stylerShowTab(box);
    const ta=$("stylerCSS");
    stylerEdit((ta.value&&!ta.value.endsWith("\n")?"\n\n":"")+css+"\n");
    put.push(BOXNAME[box]);
  }
  stylerNote(p.n+" — "+[put.length?"inserted into "+put.join(" and "):"",
    had.length?"already in "+had.join(" and "):""].filter(Boolean).join("; "));
  setTimeout(stylerNote,2600);
}
async function stylerOpen(){
  hidePanel();
  $("styler").classList.add("show");
  stylerFillPresets();
  document.body.classList.add("styling");
  if(!stylerLoaded){
    stylerNote("Loading…");
    try{
      const r=await fetch("/api/style");
      if(!r.ok)throw new Error("HTTP "+r.status);
      const j=await r.json();
      stylerText={app:j.app||"",article:j.article||""};
      stylerSaved={...stylerText};
      stylerDir=j.writable?(j.dir||""):"";
      stylerLoaded=true;
      stylerWhy=Object.values(j.problems||{}).join(" · ");
      // Alongside, not on first click of the Files tab: the dot that says
      // "there are files" has to be right the first time the sheet opens.
      await stylerFilesLoad();
    }catch(e){
      console.warn("could not load custom styles:",e);
      stylerNote("Could not read the stylesheets.");
      return;
    }
  }
  stylerShowTab(stylerTab);
  // Hand the app layer to the live element straight away, so a later Clear or
  // a deleted rule takes effect the moment it is typed rather than on reload.
  // Reopening also restores a preview that closing put back.
  stylerPreviewAll(stylerText);
  stylerNote();
  if(stylerView==="css")$("stylerCSS").focus();
}
function stylerCloseSheet(){
  $("styler").classList.remove("show");
  document.body.classList.remove("styling");
  // Unsaved text is kept — it is still in the box when you come back — but it
  // stops being shown. Preview is preview; the page a closed editor leaves
  // behind is the page the files describe.
  if(stylerDirty("app")||stylerDirty("article"))stylerPreviewAll(stylerSaved);
}
async function stylerSave(){
  stylerCommit();
  const body={};
  if(stylerDirty("app"))body.app=stylerText.app;
  if(stylerDirty("article"))body.article=stylerText.article;
  if(!Object.keys(body).length){stylerNote("No changes");setTimeout(stylerNote,1400);return}
  stylerNote("Saving…");
  try{
    const put=q=>fetch("/api/style"+q,{method:"PUT",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    let r=await put("");
    if(!r.ok){
      const why=await apiError(r),told=why.replace(/ - replace=1 overwrites it$/,"");
      // An unreadable file there is the user's: replaced only when asked.
      if(!(r.status===409&&told!==why&&confirm(told+". Replace it?")))throw new Error(told);
      r=await put("?replace=1");
      if(!r.ok)throw new Error(await apiError(r));
    }
    const j=await r.json();
    stylerWhy=Object.values(j.problems||{}).join(" · ");
    stylerText={app:j.app||"",article:j.article||""};
    stylerSaved={...stylerText};
    $("stylerCSS").value=stylerText[stylerTab];
    stylerSync();
    stylerNote(Object.values(stylerText).some(Boolean)?"Saved":"Saved — nothing left, both files removed");
    setTimeout(stylerNote,1800);
  }catch(e){
    stylerNote("Could not save: "+e.message);
  }
}
$("stylerLink").onclick=stylerOpen;
$("stylerClose").onclick=stylerCloseSheet;
$("stylerSave").onclick=stylerSave;
$("tabApp").onclick=()=>stylerShowTab("app");
$("tabArticle").onclick=()=>stylerShowTab("article");
$("tabFiles").onclick=stylerFilesShow;
$("stylerAdd").onclick=()=>$("stylerUpload").click();
$("stylerUpload").addEventListener("change",e=>{
  // Copied out first: clearing the input empties its own FileList, and it is
  // cleared so that picking the SAME file twice still fires a change.
  const list=Array.from(e.target.files||[]);
  e.target.value="";
  stylerUpload(list);
});
$("stylerCSS").addEventListener("input",()=>{
  stylerCommit();stylerSync();
  clearTimeout(stylerTimer);
  stylerTimer=setTimeout(stylerPreview,250);
});
/* Empties the box; SAVE is still what removes the file, so a mispress costs
   nothing — and Ctrl/⌘-Z brings the text straight back either way. Selecting
   first and deleting through the editing command is what keeps that true. */
$("stylerClear").onclick=()=>{
  const ta=$("stylerCSS");
  if(!ta.value)return;
  ta.focus();ta.select();
  let ok=false;
  try{ok=document.execCommand("delete")}catch(e){ok=false}
  if(!ok)ta.value="";
  stylerCommit();stylerSync();stylerPreview();
  stylerNote("Cleared — press Save to remove the file, or ⌘Z / Ctrl-Z to undo");
};
/* Inserted at the caret, not appended: a preset is a starting point that
   belongs where you are working, and appending would silently drop it inside
   whatever block the caret happens to be in the middle of. */
$("stylerPreset").onchange=e=>{
  const name=e.target.value;
  e.target.value="";
  const p=STYLER_PRESETS.find(x=>x.n===name);
  if(p)stylerApplyPreset(p);
};
$("styler").addEventListener("keydown",e=>{
  if(e.key==="Escape"){e.stopPropagation();stylerCloseSheet();return}
  // Save from the keyboard, because the editor is a text field and reaching
  // for a button costs the caret position.
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="s"){e.preventDefault();stylerSave()}
});

// settings first: they decide the panel's order and the search set, and the
// fetch is a local file read — a millisecond, not a stall worth splitting the
// boot screen over. The config comes alongside rather than after, because the
// cards need its home prefix to render paths as ~/… on the FIRST draw; run
// concurrently it costs no extra latency, and it cannot reject.
/* The empty library is the one moment the app has the reader's whole
   attention and nothing of theirs to show. So it shows its own: the wudict
   howto, opened on its intro - a real search, answered by a real dictionary,
   which is the proof no sentence about "instant search" could be - under one
   line that says what is missing and the one place that fixes it. Only on a
   plain start: a link or a bookmark with a word in it asked for that word. */
function welcome(){
  if(new URLSearchParams(location.search).get("q"))return;
  const guide=dicts.find(d=>d.builtin);
  if(!guide||dicts.some(d=>!d.builtin))return;
  if(!$("welcome")){
    const w=document.createElement("div");
    w.id="welcome";
    w.innerHTML='No dictionaries found. <a href="/setup">Add dictionaries</a>, or read the wudict howto below.';
    $("out").before(w);
  }
  searchFor("wudict welcome",{scope:guide.id,record:"replace"});
}
/* Three ways to start, chosen by what is at hand when the settings are in.

   A kept list (bootFromCache): draw it, answer the link, and only then ask the
   server whether the list has changed - a 304 in the usual case, which costs
   the server a stat per dictionary and no opens.

   No kept list, but a link that names one dictionary (bootEarly): /api/search
   resolves a dictionary by id and needs no list, so the answer goes out now
   and the list loads under it. A word picked in Browse is exactly this.

   Neither: the list first, as it must be - "all" and a group are both defined
   by it.

   The query reaches the field before the boot phase ends, so setPhase never
   sees an empty field and focuses it (a host shell reads that focus as "raise
   the keyboard"). welcome() waits for the list the server confirms: "your
   library is empty" must not be said from a copy.

   A page load never rescans the folders (/api/rescan): files added on disk
   arrive by "Rescan folders" or the next start of the app, which is when the
   server discovers them. */
function urlQuery(){$("q").value=new URLSearchParams(location.search).get("q")||""}
function bootFromCache(c){
  dicts=c.rows;dictTotal=c.rows.length;dictsSettled=true;
  // the list is whole, and a 304 below would not reach loadDicts' own call
  if(convertOrder()){setOrder(orderedIds());savePrefs()}
  groupsTrouble(c.gp||0);
  refreshDictUI(true);
  // ready BEFORE the search, which judges "nothing enabled" by the phase;
  // the query is in the field first, so the phase change does not focus it
  urlQuery();
  setPhase("ready");
  applyURL();
  return loadDicts(false,{etag:c.etag});
}
function bootEarly(){
  urlQuery();
  setPhase("partial");
  applyURL();
  return loadDicts(false,{silent:true});
}
Promise.all([loadPrefs(),loadConfig(),loadUserCSS()]).then(()=>{
  const c=readDictCache();
  if(c)return bootFromCache(c).then(ok=>{if(ok)welcome()});
  if(linkNamesOne())return bootEarly();
  return loadDicts().then(()=>{applyURL();welcome()});
});
</script>
