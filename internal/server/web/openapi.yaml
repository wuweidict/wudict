# wudict - the HTTP contract, hand-written (see internal/server/openapi.go for
# why) and embedded into the binary, which serves it at /api/openapi.yaml.
#
# internal/server/openapi_test.go walks this file against the route table in
# routes.go in both directions: no endpoint without a document, no document
# without an endpoint.
#
# Render it:  make api-ui        Validate it:  make api-lint

openapi: 3.1.0

info:
  title: wudict
  version: "1"
  summary: A local dictionary server for MDX/MDD, StarDict, Slob, DSL and BGL files.
  description: |
    WuWeiDict serves your own dictionary files over HTTP, on your own machine.

    **Streaming.** `/api/dicts`, `/api/search` and `/api/rescan` answer with
    NDJSON: one JSON object per line, flushed the moment it is ready. Read them
    line by line; do not wait for the body to end. That is the whole point - the
    first dictionary's results arrive while the slowest one is still opening.
    Every stream opens with a `begin` line and closes with an `end` line.

    `/api/ingest` streams Server-Sent Events instead, because it reports
    progress rather than results.

    **Switches.** Every boolean query parameter reads the same spellings: off
    for `0`, `false`, `no`, `off` or an empty value, on for anything else.

    **Two surfaces.** Three read-only endpoints answer a browser extension
    cross-origin: `/api/dicts`, `/api/search` and `/res/`. Everything else is
    same-origin, is marked `internal` below, and may change between releases.

    **An access key, when the server is reachable.** On the default
    `127.0.0.1` bind there is nothing to authenticate and no key is asked for.
    On any other address - and Go's wildcard listen is dual-stack, so `0.0.0.0`
    includes every globally routable IPv6 address the machine holds - `AUTH`
    defaults to requiring one on every endpoint EXCEPT the three read-only ones
    above, which stay open to the extensions already granted them. Send it as
    `Authorization: Bearer <key>`, or open the link `wudict token` prints once
    and let the browser keep the cookie it sets. Without it: `401`, with
    `{"auth":"required"}`. `AUTH=off` serves everything to anyone who can reach
    the port.

    **Address it by address.** Every request must carry a `Host` of an IP
    literal or `localhost`; any other name is answered `421 Misdirected
    Request` unless `TRUSTED_HOSTS` lists it or it is the name in `SERVER_IP`. This is what stops a web page
    from re-pointing its own domain at your machine (DNS rebinding) and
    reading the API as same-origin, which no CORS rule can prevent.

    **And from this origin.** A browser states who started a request in
    `Sec-Fetch-Site`. Anything it marks `cross-site` is answered `403` unless
    it addresses one of the three read-only endpoints above (or their
    preflight), or is a top-level navigation to a page rather than to `/api/`.
    This closes the state-changing GET: `GET /api/rescan` and
    `GET /api/setup?save=1` are otherwise reachable from an `<img>` tag on any
    origin, carrying the cookie, and CORS never blocks a request - only the
    reading of its response. Clients that send no fetch metadata (curl, the
    Android shell, anything that is not a browser) are unaffected.
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later
  contact:
    url: https://github.com/wuweidict/wudict

servers:
  - url: http://127.0.0.1:6888
    description: The default local server. Use SERVER_IP and SERVER_PORT to configure.

security: []

tags:
  - name: search
    description: The client API. Read-only, and reachable from a browser extension.
  - name: internal
    description: >
      Same-origin endpoints that serve the web page and the platform shell.
      Documented for completeness; not a stable contract.

paths:
  /api/search:
    get:
      tags: [search]
      operationId: search
      summary: Search every dictionary, streaming
      description: |
        Queries the selected dictionaries concurrently and streams one line per
        dictionary as it finishes. Lines arrive in completion order, never in
        slot order: each `hit` carries `i`, its index in the `begin` line's
        `slots` array.

        A dictionary that fails, that cannot serve the requested mode, or that
        was declined by the memory cap reports that on its own line. None of
        those is a request failure, and the other dictionaries still answer.

        A one-word query that finds nothing in a dictionary is searched there
        again with its lemma ("knew" -> "know"), using the lemma data for that
        dictionary's language. The answer is a `morph` line, then a second
        `hit` for each such slot, which replaces its miss. Not for a phrase,
        and not for a `wildcard` pattern containing `*` or `?`.

        A search is cancelled after 30 seconds.
      parameters:
        - name: q
          in: query
          required: true
          description: The search text. Blank is a 400.
          schema: { type: string }
          example: flight
        - name: mode
          in: query
          description: |
            `exact` · `prefix` · `fts` (full text) · `wildcard` (a pattern for
            the whole headword: `?` is one character, `*` any number; write
            `?` as `%3F`). `fuzzy` is accepted as a legacy alias and now means
            `prefix`. `contains` is retired and is a 400: write `*word*` in
            `wildcard` mode.

            `fts` needs the dictionary to carry the full-text index, and
            `wildcard` needs it to be indexed; ask `/api/dicts` for `caps`
            first, and expect `skipped` if you do not.

            `exact`, `prefix` and `wildcard` ignore case and accents on an
            indexed dictionary, and rank by them: the headword spelled as
            typed first, then the headwords with the capitals and accents the
            query has, then the others. A `wildcard` pattern longer than 64
            characters is a 400. A pattern containing `*` or `?` is not
            lemmatized.

            A multi-word `fts` query is a PHRASE first. It is retried as a
            proximity and then as separate words only when the stricter reading
            returns nothing, and the hit says which reading answered (`rung`).
            Quotes and the operators `AND`, `OR`, `NOT` and `NEAR(a b, n)` are
            parsed when present, and an explicit query like
            `"faux ami" NOT linguistics` is answered exactly as written, without
            relaxation. Anything unparseable is read as plain words rather than
            rejected.
          schema:
            type: string
            enum: [exact, prefix, fts, wildcard, fuzzy]
            default: prefix
        - name: hl
          in: query
          description: |
            Mark the query's words inside each article body, wrapped in
            `<mark class="wu-hl">`. Read ONLY in `mode=fts`, where the reason a
            result matched is invisible otherwise; ignored in every other mode,
            where the match is the headword itself.

            Off unless you ask, so an article you fetch is the dictionary's own
            bytes by default. wudict's own UI sends `hl=1` from a remembered
            preference, which is why the default here is off and the default
            there is on. Marking is prefix-based and whole-token, matching what
            the full-text index matched, and is capped at 500 marks per article
            - past the cap the article is still returned complete, just no
            longer marked. `format=text` drops the marks with all other markup.
          schema:
            type: boolean
            default: false
        - name: format
          in: query
          description: |
            `raw` is the dictionary's own HTML. `clean` keeps structure,
            emphasis and media and drops scripts, styles and presentation, at
            roughly half the bytes; it also rewrites root-absolute links such
            as `/res/…` into absolute URLs, so the payload works inside a page
            served from somewhere else. `text` is markup-free, roughly 0.4.

            Ask for `clean` unless you render the article with the dictionary's
            own stylesheet.
          schema:
            type: string
            enum: [raw, clean, text]
            default: raw
        - name: dict
          in: query
          description: >
            `all`, one dictionary id, or a comma-separated list of ids in the
            order you want them back. Ids come from /api/dicts. A list where no
            id resolves is a 404; unknown ids inside a resolving list are
            skipped. Naming exactly one dictionary bypasses the memory cap,
            because a search of one is a direct demand.
          schema: { type: string, default: all }
          example: oxford,webster
        - name: 'n'
          in: query
          description: Maximum results per dictionary.
          schema: { type: integer, minimum: 1, default: 20 }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -sN 'http://127.0.0.1:6888/api/search?q=flight&mode=prefix&format=clean&n=5'

            # -N is the whole point: without it curl buffers, and the lines that
            # were sent one at a time arrive together at the end.
      responses:
        '200':
          description: The NDJSON stream. One object per line.
          content:
            application/x-ndjson:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SearchBegin'
                  - $ref: '#/components/schemas/SearchHit'
                  - $ref: '#/components/schemas/SearchMorph'
                  - $ref: '#/components/schemas/StreamEnd'
                discriminator: { propertyName: t }
              example: |
                {"t":"begin","i":0,"slots":[{"dict":"oxford","name":"oxford"},{"dict":"webster","name":"webster"}]}
                {"t":"hit","i":1,"dict":"webster","name":"Webster's Revised Unabridged","results":[{"Headword":"flight","Body":"<div>…</div>"}]}
                {"t":"hit","i":0,"dict":"oxford","name":"Oxford Advanced Learner's"}
                {"t":"end","i":0}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    options:
      tags: [search]
      operationId: searchPreflight
      summary: CORS preflight
      description: >
        Answers 204 with the extension grant. The extension's own requests are
        CORS-simple and never preflight; this exists so a future one does not
        meet a 405 that explains nothing.
      responses:
        '204': { description: Preflight accepted. }

  /api/dicts:
    get:
      tags: [search]
      operationId: listDicts
      summary: List every dictionary, streaming
      description: >
        `begin` carries the total immediately, from registry ids alone, so a
        client can show "0 of 105" before any dictionary is opened. Rows follow
        in completion order.


        `end` carries `etag` when the answer may be kept. Send it back as
        `If-None-Match` and an unchanged list is a `304` with no body, decided
        without opening any dictionary. There is no `ETag` header: whether an
        answer may be kept is known only after its last row.
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -sN 'http://127.0.0.1:6888/api/dicts'

            # just the ids, which is what /api/search wants
            curl -sN 'http://127.0.0.1:6888/api/dicts' | jq -r 'select(.t=="dict") | .dict.id'

            # has anything changed since the answer that ended with this etag?
            curl -s -o /dev/null -w '%{http_code}\n' -H 'If-None-Match: "ac4fd9fecabd8ec4cf544212"' \
              'http://127.0.0.1:6888/api/dicts'
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: The `etag` of an earlier answer's `end` line.
          schema: { type: string }
      responses:
        '200':
          description: The NDJSON stream. One object per line.
          content:
            application/x-ndjson:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DictsBegin'
                  - $ref: '#/components/schemas/DictsRow'
                  - $ref: '#/components/schemas/DictsBusy'
                  - $ref: '#/components/schemas/DictsEnd'
                discriminator: { propertyName: t }
              example: |
                {"t":"begin","total":2}
                {"t":"dict","dict":{"id":"oxford","name":"Oxford Advanced Learner's","format":"mdx","path":"/Users/me/Dicts/oald.mdx","entries":184000,"caps":{"Exact":true,"Prefix":true,"FTS":false,"Wildcard":false}}}
                {"t":"end","etag":"\"ac4fd9fecabd8ec4cf544212\""}
        '304':
          description: Nothing in the list has changed since the answer whose `etag` was sent.
        '500':
          $ref: '#/components/responses/ServerError'
    options:
      tags: [search]
      operationId: dictsPreflight
      summary: CORS preflight
      responses:
        '204': { description: Preflight accepted. }

  /res/{dict}/{path}:
    get:
      tags: [search]
      operationId: getResource
      summary: One file from inside a dictionary
      description: |
        Images, stylesheets, scripts and audio, as the article references them.

        `path` is the whole remainder of the URL and may contain slashes, which
        an OpenAPI path parameter cannot express: send it unencoded, exactly as
        the article asks for it.

        Speex audio is transcoded to WAV and answered as `audio/wav`. A `.spx`
        that cannot be transcoded, or one supplied in a `res/` override folder,
        is answered raw as `audio/ogg`. Files from a `res/` folder are served
        uncached, so an edit takes effect on reload.
      parameters:
        - name: dict
          in: path
          required: true
          description: Dictionary id, from /api/dicts.
          schema: { type: string }
        - name: path
          in: path
          required: true
          description: The resource path inside the dictionary, subfolders included.
          schema: { type: string }
          example: audio/flight__gb.mp3
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            # the path after the id is the article's own path, slashes and all
            curl -s 'http://127.0.0.1:6888/res/oxford/audio/flight__gb.mp3' -o flight.mp3
      responses:
        '200':
          description: The file, with the type the dictionary declares.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No such dictionary, or no such file inside it.
        '500':
          $ref: '#/components/responses/ServerError'
    options:
      tags: [search]
      operationId: resourcePreflight
      summary: CORS preflight
      parameters:
        - name: dict
          in: path
          required: true
          schema: { type: string }
        - name: path
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Preflight accepted. }

  /api/openapi.yaml:
    get:
      tags: [search]
      operationId: getSpec
      summary: This document
      description: The contract of the running build, served by it.
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -s 'http://127.0.0.1:6888/api/openapi.yaml' -o openapi.yaml
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }

  /api/rescan:
    get:
      tags: [internal]
      operationId: rescan
      x-internal: true
      summary: Re-scan the dictionary folders, then list
      description: >
        Reads the dictionary folders again, warms the registry, and then answers
        exactly as /api/dicts does. Use it after adding files on disk.
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            # picks up files added to the dictionary folders, then lists
            curl -sN 'http://127.0.0.1:6888/api/rescan' | head -1
      responses:
        '200':
          description: The /api/dicts stream, after the rescan.
          content:
            application/x-ndjson:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DictsBegin'
                  - $ref: '#/components/schemas/DictsRow'
                  - $ref: '#/components/schemas/DictsBusy'
                  - $ref: '#/components/schemas/DictsEnd'
                discriminator: { propertyName: t }
        '500':
          $ref: '#/components/responses/ServerError'

  /api/howto:
    post:
      tags: [internal]
      operationId: howtoCopy
      x-internal: true
      summary: Put an editable copy of the wudict howto into the import folder
      description: >
        Copies the built-in guide (`wudict-howto.wudict.md` and its
        `wudict-howto.wudict.files/`) into the folder imports go to - the first
        dictionary folder - then rescans. The copy is listed in place of the
        built-in guide. An existing copy is never overwritten.
        With `restore=1` it instead brings the built-in guide back after the
        user removed it (`DELETE /api/library?dict=wudict-howto`, which
        records the removal so it is not written back at the next start).
      parameters:
        - name: restore
          in: query
          required: false
          schema: { type: string }
          description: Bring the removed built-in guide back instead of copying it. A switch.
      responses:
        '200':
          description: Copied; `path` is the new file.
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
        '409':
          description: No dictionary folder is configured, or the folder already holds the guide.
        '500':
          $ref: '#/components/responses/ServerError'

  /api/ingest:
    get:
      tags: [internal]
      operationId: ingest
      x-internal: true
      summary: Prepare a dictionary, or add an index to it
      description: |
        Brings one dictionary to the feature state you ask for, streaming
        Server-Sent Events:

            event: progress   data: {"done":N,"total":M}
            event: done       data: {…a /api/dicts row…}
            event: error      data: {"error":"…"}

        Each switch is a state, not a verb: a parameter you leave out keeps
        whatever that feature is now, so toggling one thing cannot strip
        another, and a request naming none prepares an unprepared dictionary
        with its headword index only. Progress is emitted at most every 200 ms.

        The change runs as the dictionary's job on the server, not inside the
        request: a client that disconnects loses only the stream, and the work
        goes on. While a change to a dictionary runs, its `/api/dicts` row
        carries `job`, and a request for that dictionary follows the running
        change instead of starting another - what it asked for is not queued,
        and the `done` it receives carries what the dictionary now has.
      parameters:
        - name: dict
          in: query
          required: true
          description: Dictionary id.
          schema: { type: string }
        - name: fts
          in: query
          description: Full-text index over article text - the largest one. A switch.
          schema: { type: string }
        - name: media
          in: query
          description: Pack the dictionary's media into media.db. A switch.
          schema: { type: string }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            # add the full-text index to one dictionary and watch it build
            curl -sN 'http://127.0.0.1:6888/api/ingest?dict=oxford&fts=1'

            # leave a switch out and it keeps its current state; this only packs media
            curl -sN 'http://127.0.0.1:6888/api/ingest?dict=oxford&media=1'
      responses:
        '200':
          description: The event stream.
          content:
            text/event-stream:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/library:
    get:
      tags: [internal]
      operationId: listLibrary
      x-internal: true
      summary: List the prepared dictionaries on disk
      description: >
        Everything in the library folder, whether or not it is currently
        enrolled. Listing is not consent: reading this never adds anything to
        the registry.
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -s 'http://127.0.0.1:6888/api/library' | jq '.dir, .count'
      responses:
        '200':
          description: The library.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dir: { type: string, description: The library folder. }
                  count: { type: integer }
                  useCached:
                    type: boolean
                    description: Whether prepared dictionaries whose source file is gone are listed.
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/LibEntry' }
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [internal]
      operationId: removeLibrary
      x-internal: true
      summary: Delete one dictionary
      description: |
        Removes the prepared folder, the original files, or both. Both default
        to on, which is "remove this dictionary".

        **Irreversible.** Files are unlinked, not moved to a Trash or Recycle
        Bin, and nothing here can be undone.

        From the machine running wudict this is always allowed - it is your
        library and your disk. From a browser on another machine it follows
        `ALLOW_REMOTE_DELETE` (default off); with that off, the remote caller
        gets a 403 and `canDelete: false` in `GET /api/config`.
      parameters:
        - name: dict
          in: query
          required: true
          description: Dictionary id.
          schema: { type: string }
        - name: prepared
          in: query
          description: Delete the prepared library folder; off keeps it. A switch, on when absent.
          schema: { type: string, default: '1' }
        - name: source
          in: query
          description: Delete the original dictionary files; off keeps them. A switch, on when absent.
          schema: { type: string, default: '1' }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            # remove one dictionary: prepared folder and original files
            curl -s -X DELETE 'http://127.0.0.1:6888/api/library?dict=oxford'

            # free the indexes only, keeping the original file
            curl -s -X DELETE 'http://127.0.0.1:6888/api/library?dict=oxford&source=0'

            # There is no dry run here - `wudict rm` is the one that previews.
      responses:
        '200':
          description: What was removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Removal' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: >
            Deleting from another machine is off (ALLOW_REMOTE_DELETE = "0").
            Do it on the machine running wudict, or turn the setting on.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >
            Dropping the source while keeping the prepared folder would leave a
            dictionary that exists but is listed nowhere. Enable cached
            dictionaries first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/orphans:
    get:
      tags: [internal]
      operationId: listOrphans
      x-internal: true
      summary: List prepared dictionaries whose source file is gone
      description: >
        Every prepared folder in the library whose recorded source file is no
        longer on disk, whatever the reason (deleted, renamed, on a drive that
        is not connected), except those kept on purpose. A source that was
        only moved inside a dictionary folder is not listed: a rescan re-links
        the folder to it. The built-in guide is never listed.
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -s 'http://127.0.0.1:6888/api/orphans' | jq '.orphans[].name, .size'
      responses:
        '200':
          description: The orphans, and the bytes they use together.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orphans:
                    type: array
                    items: { $ref: '#/components/schemas/Orphan' }
                  size: { type: integer, description: Bytes used by all of them. }
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [internal]
      operationId: resolveOrphans
      x-internal: true
      summary: Delete or keep orphaned prepared dictionaries
      description: |
        Deletes the prepared folders named in `delete` and marks those in
        `keep` as standalone (`keep = standalone` in the folder's `info.txt`),
        after which they are never listed again. Folders are named by
        `Orphan.folder`, never by path, and each is checked again when it is
        acted on: one that is no longer an orphan is reported under `failed`.
        A folder named twice, or in both lists, fails too. Body is capped at
        1 MiB.

        **Deleting is irreversible.** Files are unlinked, not moved to a Trash
        or Recycle Bin. Allowed on the machine running wudict; from another
        machine only with `ALLOW_REMOTE_DELETE`, which also governs `keep`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                delete:
                  type: array
                  items: { type: string }
                  description: Folder names to delete.
                keep:
                  type: array
                  items: { type: string }
                  description: Folder names to keep for good.
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -s -X POST 'http://127.0.0.1:6888/api/orphans' \
              -H 'Content-Type: application/json' \
              -d '{"delete":["AHD5-2017"],"keep":["Oxford Advanced"]}'
      responses:
        '200':
          description: What happened to each folder.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: array
                    items: { $ref: '#/components/schemas/OrphanOutcome' }
                  kept:
                    type: array
                    items: { $ref: '#/components/schemas/OrphanOutcome' }
                  failed:
                    type: array
                    items: { $ref: '#/components/schemas/OrphanOutcome' }
                  freed: { type: integer, description: Bytes reclaimed. }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: >
            Deleting from another machine is off (ALLOW_REMOTE_DELETE = "0").
            Do it on the machine running wudict, or turn the setting on.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/lemmas:
    get:
      tags: [internal]
      operationId: listLemmas
      x-internal: true
      summary: List installable and installed lemma data
      description: >
        One row per language, merging the published catalogue (LEMMA_URL) with
        what is present in LEMMA_DIR, plus the state of any download running
        right now. Always answers 200: what is installed is the half of the
        answer that needs no network, and an unreachable catalogue is reported
        in `error` rather than by failing.
      parameters:
        - name: refresh
          in: query
          description: >
            Re-read the catalogue instead of using the cached copy. The
            catalogue is otherwise cached for ten minutes, so a page polling
            during a download does not ask its host once a second.
          schema: { type: string }
        - name: offline
          in: query
          description: >
            Answer without asking the catalogue's host: the list read last -
            this run, or kept in LEMMA_DIR from an earlier one - or else the
            copy built into wudict, which applies to the default LEMMA_URL only.
            Installed files are not read to set `mismatch`. The page asks this
            first and then without it, so it is never empty while the host
            answers.
          schema: { type: string }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -s 'http://127.0.0.1:6888/api/lemmas' |
              jq -r '.languages[] | select(.installed) | .code'
      responses:
        '200':
          description: The catalogue merged with the folder.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dir: { type: string, description: LEMMA_DIR. }
                  url: { type: string, description: The catalogue this lists. }
                  enabled:
                    type: boolean
                    description: >
                      False when MORPH_CACHE is 0, in which case nothing
                      installed here will ever be consulted by a search.
                  cacheSize:
                    type: integer
                    description: How many language packs may be resident at once.
                  attribution:
                    type: string
                    description: ATTRIBUTION.txt published beside the catalogue (ODbL).
                  error:
                    type: string
                    description: >
                      Why the catalogue could not be read, if it could not. The
                      languages listed are then the last list there is.
                  checked:
                    type: string
                    format: date-time
                    description: When the list was read from its host; absent when unknown.
                  offline:
                    type: boolean
                    description: The answer was drawn without asking the host (`offline` was set).
                  shadowed:
                    type: array
                    description: Files the lemmatizer ignores because another supplies the same language.
                    items: { type: string }
                  languages:
                    type: array
                    items: { $ref: '#/components/schemas/LemmaLanguage' }
    post:
      tags: [internal]
      operationId: installLemmas
      x-internal: true
      summary: Install one language's lemma data
      description: |
        Starts a download and returns at once; follow it with `GET /api/lemmas`.
        The download runs in the server, not in this request, so it survives the
        page being reloaded, closed, or rotated away on Android.

        The catalogue is never taken from the caller: only the configured
        LEMMA_URL is fetched. A second call for a language already downloading
        joins the running download instead of starting another.

        On success the language is searchable immediately - no restart, because
        the lemma folder is re-indexed in place.
      parameters:
        - name: code
          in: query
          required: true
          description: Language code or English name ("pl", "polish").
          schema: { type: string }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -s -X POST 'http://127.0.0.1:6888/api/lemmas?code=pl'
      responses:
        '202':
          description: The download is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  state: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          description: The catalogue could not be read, so nothing can be installed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [internal]
      operationId: removeLemmas
      x-internal: true
      summary: Delete one language's lemma data
      description: >
        Removes every file in LEMMA_DIR supplying this language, not only the
        one in use, and re-indexes the folder. Deleting English falls back to
        the pack compiled into the binary rather than losing the language.
        Unlike dictionary removal this is offered on every platform: these are
        files wudict downloaded, not files the user brought.
      parameters:
        - name: code
          in: query
          required: true
          description: Language code or English name.
          schema: { type: string }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -s -X DELETE 'http://127.0.0.1:6888/api/lemmas?code=pl'
      responses:
        '200':
          description: What was removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  builtin: { type: boolean }
                  removed:
                    type: array
                    items: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: That language is being downloaded right now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/ServerError'

  /api/intake:
    post:
      tags: [internal]
      operationId: startImport
      x-internal: true
      summary: Import dictionaries from an archive
      description: |
        Two acts on one route. Without `confirm` it ACQUIRES an archive and
        reports the dictionaries inside it, decompressing nothing: a zip is
        answered from its central directory and a 7z from its header, so
        listing a multi-gigabyte bundle costs a seek. With `confirm` it
        extracts the ones the caller chose.

        A plain dictionary file is read too - an `.mdx`, an `.ifo`, a `.dsl`,
        a `.slob`, a `.bgl` - and so are the companions lying beside it in the
        same folder, because that is the same grouping rule the library uses.
        Nothing is unpacked in that case; the files are copied into place.

        `.zip` and `.7z` are read. A 7z is decoded strictly in archive order on
        one goroutine: a 7z folder is a single stream holding several files end
        to end, so that order is the difference between reading it once and
        decompressing it again per file. A password-protected archive is
        refused rather than half-read.

        The archive arrives either as a path already on disk (`path`, used by
        the Android shell, which hands over a download without copying it) or
        as the request body. A streamed body is spooled inside the destination
        folder, never into the temporary directory: on Android that is a small
        cache partition, and on every platform it is a different filesystem,
        which would make the install a second full copy instead of a rename.

        One import runs at a time, everywhere. Extraction outlives this request
        and is followed with `GET /api/intake`, for the same reason a lemma
        download is: on Android the page dies whenever the device rotates.

        A `url` is fetched by the server instead, which is how a phone imports:
        the shell has no networking of its own, and a download that lived in the
        page would die with it. It answers 202 at once and downloads behind the
        same poll, sniffing when it lands. Any site, unless IMPORT_URL_HOSTS
        restricts it; `https` only and no address on the local network, unless
        IMPORT_INSECURE lifts both; an unfinished download is resumed by the
        next attempt.

        A `url` may also name SEVERAL dictionaries: a web folder page (every
        link on it to a dictionary, a companion or an archive), a `.txt` list
        (one file name or link per line, the first `# ` line its title), or
        several links pasted at once - and a share link
        `https://legbehindneck.com/wudict#<link>` stands for the link after
        `#` (`#/dict/x/` is short for a path on that site), or for several
        links after `#` separated by commas. A Google Drive file link
        (`drive.google.com/file/d/<id>/view`) is fetched from Drive's download
        address, and named by Drive's answer. Such a job is a `collection`: `ready` arrives with nothing
        downloaded, one candidate per dictionary sized and dated from the
        site's own headers, and each dictionary's media offered in `extras`.
        Confirming downloads and installs each chosen dictionary in turn; one
        that fails is named in `error` and the job still ends `done` with the
        rest installed.

        A dictionary the library already holds is reported as such on the
        candidate (`existing`, or `elsewhere` for one in another configured
        folder; `unchanged` when the files are the same) and, when the caller
        picks it, is REPLACED - its folder, or its files in place - rather than
        installed a second time. Not picking it is skipping it. Nothing is ever
        installed or downloaded under a numbered name.

        A downloaded plain file has its companions LOOKED FOR at the sibling
        URLs the format tables name - `oxford.mdd`, `oxford.1.mdd`, and so on,
        stopping at the first that is not there. What is found is reported in
        `extras` and downloaded only when the caller asks for it by index: a
        companion can be several hundred megabytes of somebody's phone data,
        so it is offered on the screen that asks which dictionaries to install
        and never taken on the strength of the probe.

        The source file's fate follows IMPORT_KEEP; `keep` answers it only when
        that is `ask`. A FAILED import always keeps the source, which is policy
        and not a setting - deleting somebody's only copy after an import that
        did not work cannot be undone.
      parameters:
        - name: path
          in: query
          description: >
            An archive already on this machine, read in place. Mutually
            exclusive with a request body.
          schema: { type: string }
        - name: url
          in: query
          description: >
            An https link the server downloads and then sniffs. Mutually
            exclusive with `path` and with a request body.
          schema: { type: string, format: uri }
        - name: name
          in: query
          description: >
            File name for a streamed body, used for the extension and for what
            the page displays. The extension decides which reader is used, so
            a 7z body must be named `.7z`. Defaults to `archive.zip`.
          schema: { type: string }
        - name: confirm
          in: query
          description: >
            Any value installs the sniffed job instead of starting a new one.
          schema: { type: string }
        - name: pick
          in: query
          description: >
            Comma-separated indexes into `candidates`, for a caller with no
            JSON body to send. Used only with `confirm`.
          schema: { type: string }
        - name: keep
          in: query
          description: >
            Whether the caller's own source file survives a SUCCESSFUL import.
            Ignored unless IMPORT_KEEP is `ask`. Used only with `confirm`.
          schema: { type: string, enum: ['0', '1'] }
        - name: extras
          in: query
          description: >
            Comma-separated indexes into `extras`: the companion files to
            download before installing. For a caller with no JSON body to
            send. Used only with `confirm`.
          schema: { type: string }
      requestBody:
        required: false
        description: >
          The archive itself, streamed. Absent when `path` is given, and when
          confirming - where the body is instead the selection.
        content:
          application/zip:
            schema: { type: string, format: binary }
          application/x-7z-compressed:
            schema: { type: string, format: binary }
          application/octet-stream:
            schema: { type: string, format: binary }
          application/json:
            schema:
              type: object
              description: The selection, when confirming.
              properties:
                pick:
                  type: array
                  description: Indexes into `candidates`.
                  items: { type: integer }
                keep:
                  type: boolean
                  description: >
                    Keep the source file after a successful import. Ignored
                    unless IMPORT_KEEP is `ask`.
                extras:
                  type: array
                  description: >
                    Indexes into `extras`: the companion files to download
                    first. Omitted or empty downloads none of them.
                  items: { type: integer }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -s -X POST --data-binary @bundle.zip \
              'http://127.0.0.1:6888/api/intake?name=bundle.zip' | jq .candidates
            curl -s -X POST 'http://127.0.0.1:6888/api/intake?confirm=1&pick=0'
      responses:
        '200':
          description: The archive was read; `candidates` is what it holds.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntakeJob' }
        '202':
          description: >
            The extraction, or the download, is running. Poll `GET /api/intake`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntakeJob' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: >
            An import is already running (the body then also carries
            `"busy": true`; `GET /api/intake` says which), there is nothing to
            confirm, no dictionary folder is configured, or a chosen
            dictionary is missing files it cannot work without.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: >
            The link is not `https`, it resolves to an address on the local
            network, or IMPORT_URL_HOSTS is set and its host is not on the
            list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: The streamed archive is larger than this endpoint accepts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: >
            Not an archive format this build can read - including a link that
            answered with something that is not an archive at all, which is
            refused from the response headers before the body is downloaded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >
            The archive was read and holds no dictionary, or its directory is
            larger than any bundle has cause to be.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags: [internal]
      operationId: importStatus
      x-internal: true
      summary: What the current import is doing
      description: >
        The poll. Always 200: an empty `state` means nothing is happening, which
        is an answer the page acts on and must not have to tell apart from a
        request that did not arrive. `done` and `total` are bytes.
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -s 'http://127.0.0.1:6888/api/intake' | jq -r '.state'
      responses:
        '200':
          description: The current job, or an empty one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntakeJob' }
    delete:
      tags: [internal]
      operationId: cancelImport
      x-internal: true
      summary: Cancel the current import
      description: >
        Stops an extraction and forgets a sniffed archive that was never
        confirmed. Everything staged is removed; dictionaries already renamed
        into the library stay, because they are whole. Always 200 - cancelling
        nothing is not a failure. With `id`, only that job is cancelled, and
        only while it is still the current one: a client releasing its own
        job never cancels one another client started since.

        A download that nobody has confirmed and nobody has polled for 75
        seconds is not "running" any more: a new import replaces it instead of
        being refused. A confirmed import is never replaced.
      parameters:
        - name: id
          in: query
          description: The job to cancel (`id` from the job). Omit to cancel whatever is current.
          schema: { type: string }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -s -X DELETE 'http://127.0.0.1:6888/api/intake'
      responses:
        '200':
          description: >
            Without `id`, nothing is running now. With `id`, the job that is
            current afterwards (empty when that was the one cancelled).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntakeJob' }

  /api/reindex:
    post:
      tags: [internal]
      operationId: startReindex
      x-internal: true
      summary: Rebuild every outdated dictionary
      description: >
        Rebuilds each dictionary `/api/dicts` reports as `outdated` - prepared
        by an older build, from a source edited since, with another article
        compression than COMPRESSION, or unreadable by this one - with the
        indexes it already has. A packed media.db the rebuild
        leaves unpaired is packed again. Dictionaries that are current are not
        touched, and one whose original files are gone is never outdated,
        since nothing can rebuild it.


        Never started by the server itself: on a large library this is hours
        of work, so an upgrade only marks the library outdated and waits for
        this request. It runs in the background indexing lane, one dictionary
        at a time, and outlives the request; follow it with `GET /api/reindex`.
        One job at a time: while one runs, this answers its status instead of
        starting another.
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -s -X POST 'http://127.0.0.1:6888/api/reindex'
      responses:
        '202':
          description: The job started. Poll `GET /api/reindex`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReindexStatus' }
        '200':
          description: >
            Nothing is outdated, or a job is already running - the status of
            that job (or of the last one) is returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReindexStatus' }
    get:
      tags: [internal]
      operationId: reindexStatus
      x-internal: true
      summary: What the rebuild is doing
      description: >
        The poll. Always 200; `running: false` with `total: 0` means no rebuild
        has run in this process.
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -s 'http://127.0.0.1:6888/api/reindex' | jq '{done, total, current}'
      responses:
        '200':
          description: The current or last job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReindexStatus' }
    delete:
      tags: [internal]
      operationId: cancelReindex
      x-internal: true
      summary: Stop the rebuild
      description: >
        Stops the job after the dictionary it is rebuilding now. What is
        finished stays finished; each rebuild replaces the old data only when
        it completes, so nothing is left half-built. Always 200.
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -s -X DELETE 'http://127.0.0.1:6888/api/reindex'
      responses:
        '200':
          description: The job's status; `running` stays true until the current dictionary is done.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReindexStatus' }

  /api/setup:
    get:
      tags: [internal]
      operationId: setup
      x-internal: true
      summary: Validate a dictionary folder, and optionally save it
      description: >
        Drives the first-run page. Without `save` it only reports what the
        folder holds, which is what live typing needs. With `save=1` it switches
        the registry over and writes DICT_DIR. Repeat `path` for several
        folders; `found` is then the deduplicated total across all of them,
        because overlapping folders must not be counted twice.
      parameters:
        - name: path
          in: query
          description: A dictionary folder. Repeatable. `~` is expanded.
          schema: { type: string }
        - name: save
          in: query
          description: On persists the folders to the config file. A switch.
          schema: { type: string }
        - name: useCached
          in: query
          description: >
            On enrolls the previously prepared dictionaries and persists
            USE_CACHED; off turns that off; absent leaves it alone. A switch.
          schema: { type: string, enum: ['0', '1'] }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            # what this folder holds, without changing anything
            curl -s 'http://127.0.0.1:6888/api/setup?path=~/Dictionaries'

            # adopt two folders and write them to the config file
            curl -s 'http://127.0.0.1:6888/api/setup?path=~/Dictionaries&path=/Volumes/Ext/Dicts&save=1'
      responses:
        '200':
          description: >
            The result. A folder that does not exist, holds nothing, or cannot
            be read reports that in `error` with a 200: this answers a keystroke,
            and a half-typed path is not a failed request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupResult' }
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/config:
    get:
      tags: [internal]
      operationId: getConfig
      x-internal: true
      summary: The effective settings, and where each came from
      description: >
        What the panel's folders section shows, including which layer set
        DICT_DIR - so the page can say that saving will not take effect, rather
        than silently doing nothing.
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            # where the settings came from, and which folders are scanned
            curl -s 'http://127.0.0.1:6888/api/config' | jq '.configPath, .dictDirOrigin, .roots'
      responses:
        '200':
          description: The effective configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigInfo' }

  /api/prefs:
    get:
      tags: [internal]
      operationId: getPrefs
      x-internal: true
      summary: Dictionary order, on/off switches and article text size
      description: >
        Healed against the dictionaries that exist right now. `exists` is false
        on a first run, which is the client's cue to adopt what an older build
        left in localStorage, once, instead of starting the user over.
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -s 'http://127.0.0.1:6888/api/prefs' | jq '.dicts'
      responses:
        '200':
          description: The preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Prefs' }
    put:
      tags: [internal]
      operationId: savePrefs
      x-internal: true
      summary: Replace the order and the enabled set, change UI settings
      description: >
        Array order is the order of the pinned entries (`pin`); the others are
        listed A-Z. Entries record the path as well as the id, because ids are
        derived from the path: moving a dictionary folder
        changes every id at once, and the path is what re-attaches the state
        instead of resetting it. Body is capped at 1 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dicts:
                  type: array
                  items: { $ref: '#/components/schemas/DictPref' }
                  description: >
                    The whole list, pinned entries in the user's order. Omit it (or send null)
                    to keep the stored list untouched, as when only a UI
                    setting changed.
                version:
                  type: integer
                  description: >
                    The format `dicts` is written in: 3. Without it, the list
                    is taken as one from a client older than pins, and every
                    dictionary it sends keeps the pin it has stored.
                ui:
                  allOf: [{ $ref: '#/components/schemas/UIPrefs' }]
                  description: >
                    The UI fields to change. Each field you send replaces the
                    stored one; each field you omit keeps its stored value, so
                    send `false`, `0` or `[]` to clear one. Omit `ui` (or send
                    null or `{}`) to leave the stored UI record untouched.

      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            # Replaces the whole list: array order IS the order of the pinned
            # entries, and any dictionary you leave out loses its place. Read /api/prefs first and
            # send back an edited copy.
            curl -s -X PUT 'http://127.0.0.1:6888/api/prefs' \
              -H 'content-type: application/json' \
              -d '{"version":3,"dicts":[{"id":"oxford","path":"/Users/me/Dicts/oald.mdx","pin":true},
                          {"id":"webster","path":"/Users/me/Dicts/webster.slob","off":true}]}'
      responses:
        '200':
          description: The merged preferences, as stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Prefs' }
        '400':
          description: The body is not valid JSON, or a UI field has the wrong type.
        '500':
          description: The state file could not be written.

  /api/words:
    get:
      tags: [internal]
      operationId: getWords
      x-internal: true
      summary: The reader's favourites and history
      description: >
        Both lists, most recent first: history.txt and favourites.txt beside
        wudict.toml, one headword per line. A word is a headword, not one
        dictionary's article.
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -s 'http://127.0.0.1:6888/api/words' | jq '.favourites'
      responses:
        '200':
          description: Both lists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Words' }
    post:
      tags: [internal]
      operationId: saveWord
      x-internal: true
      summary: Put a word first in a list, or take it out
      description: >
        `on` moves the word to the front (adding it if new), otherwise removes
        it. History keeps the latest 500 words; while `historyOff` is set in
        the preferences, adding to history does nothing. Line breaks and tabs
        become spaces and the ends are trimmed. Body is capped at 4 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [list, word]
              properties:
                list: { type: string, enum: [history, favourites] }
                word: { type: string, description: 'A headword, at most 256 characters.' }
                on: { type: boolean, description: 'true adds or moves to the front; false removes.' }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -s -X POST 'http://127.0.0.1:6888/api/words' \
              -H 'content-type: application/json' \
              -d '{"list":"favourites","word":"serendipity","on":true}'
      responses:
        '200':
          description: Both lists as they now stand.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Words' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413':
          description: The body is larger than 4 KiB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [internal]
      operationId: clearWords
      x-internal: true
      summary: Empty a list
      parameters:
        - name: list
          in: query
          required: true
          schema: { type: string, enum: [history, favourites] }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -s -X DELETE 'http://127.0.0.1:6888/api/words?list=history'
      responses:
        '200':
          description: Both lists as they now stand.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Words' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/style:
    get:
      tags: [internal]
      operationId: getStyle
      x-internal: true
      summary: The user's global stylesheets
      description: >
        Two CSS files the user owns, applied to everything wuDict renders.
        `app` styles the page itself - its colours, its own layout - and its
        `:root` custom properties reach articles too, because they inherit
        across the shadow boundary. `article` styles what dictionaries render,
        in both article flavours (shadow root and sandboxed iframe).


        The split is what keeps `body{}`, `p{}` and `a{}` - written with
        articles in mind - from also restyling the chrome.


        `dir` is where the two files live on disk, beside the `wudict.toml` in
        effect, so they can be edited with an ordinary text editor as well;
        `writable` is false when there is no config directory at all, and the
        editor says so instead of failing to save.
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -s 'http://127.0.0.1:6888/api/style' | jq -r .app
      responses:
        '200':
          description: Both stylesheets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Style' }
    put:
      tags: [internal]
      operationId: saveStyle
      x-internal: true
      summary: Replace either stylesheet, or both
      description: >
        Omit a field to leave that file untouched: absent and empty are
        different, and the App tab and the Article tab are one editor sending
        different bodies. An empty string REMOVES the file, so "I cleared the
        box" and "there is a file here containing nothing" do not become two
        states that behave the same but read differently.


        Each file is capped at 256 KiB. A stylesheet that hides the app can be
        stepped around with `GET /?style=off`, which omits it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                app: { type: string, description: The chrome stylesheet. }
                article: { type: string, description: The article stylesheet. }
      responses:
        '200':
          description: Both stylesheets, as stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Style' }
        '400':
          description: The body is not valid JSON.
        '409':
          description: There is no config directory, so there is nowhere to save.
        '413':
          description: A stylesheet is larger than 256 KiB.
        '500':
          description: A file could not be written.

  /api/groups:
    get:
      tags: [internal]
      operationId: getGroups
      x-internal: true
      summary: The groups the dictionary picker offers
      description: >
        `groups.ini`, beside the `wudict.toml` in effect: a `[Section]` line is
        a "Group by" heading (at most 32, names of at most 64 bytes), and
        `Name = text, text` a group under it that a dictionary joins when one
        of the texts (at least 2 characters) is anywhere in its title or file
        name, in any case. An
        item between backticks is a regular expression (Go RE2,
        case-insensitive), read verbatim and tested against the title and the
        file name separately. `;` and `#` start a comment outside backticks. A
        group line before any section belongs to `[My groups]`. While there is no file the built-in list is in effect
        (`custom` false); once saved, the file is the whole list.


        Ids are the names, trimmed and lower-cased: a dictionary row's
        `groups[].f` and `groups[].v` (`GET /api/dicts`) are exactly these.
        `problems` lists the lines and items that were skipped (an invalid
        regular expression, a line with no `=`, a one-character item, more
        than 500 regular expressions); the rest of the file still applies. At
        most 100 are listed: a last entry with `more` stands for the rest.
        `text` and `msg` are clipped to 200 bytes. `unusable` means the file exists but could not be read: the
        built-in list is in effect, and `problems` has one entry, with no line,
        saying why.
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -s 'http://127.0.0.1:6888/api/groups' | jq -r .text
      responses:
        '200':
          description: The file in effect.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Groups' }
    put:
      tags: [internal]
      operationId: saveGroups
      x-internal: true
      summary: Replace groups.ini
      description: >
        The body is the whole file, as text. Lines that do not parse are
        reported in `problems`, never refused. A body identical to the built-in
        list removes the file instead, so an unchanged copy does not stop the
        list from following the built-in one. Capped at 256 KiB. While the
        current file is `unusable`, a save is refused unless `replace=1` is
        given: the file is the user's, and the editor could not show it.
      parameters:
        - name: replace
          in: query
          required: false
          description: 1 overwrites a groups.ini that exists but cannot be read.
          schema: { type: string, enum: ['1'] }
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
      responses:
        '200':
          description: The file in effect after the save.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Groups' }
        '400':
          description: The body is not UTF-8 text, or could not be read.
        '409':
          description: >
            There is no config directory, so there is nowhere to save; or the
            current file cannot be read and `replace=1` was not given.
        '413':
          description: The body is larger than 256 KiB.
        '500':
          description: The file could not be written.
    delete:
      tags: [internal]
      operationId: resetGroups
      x-internal: true
      summary: Back to the built-in groups
      description: Removes groups.ini; the built-in list is in effect again.
      responses:
        '200':
          description: The built-in list, now in effect.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Groups' }
        '500':
          description: The file could not be removed.

  /api/files:
    get:
      tags: [internal]
      operationId: listFiles
      x-internal: true
      summary: The user's own file store
      description: >
        Files the user uploaded so that something they wrote can reference them
        by URL: an image for a `background-image` in their custom CSS, a font
        for an `@font-face`, an imported stylesheet, a script, a PDF a private
        dictionary links to. They live beside the two stylesheets, in an
        `assets` folder under the same directory `GET /api/style` reports, and
        are served from `/files/<name>`.


        No type restriction: the store is "files the page can reach by URL",
        and an extension allowlist would only mean the feature is missing for
        whoever needed the entry it lacks. `limits` is reported rather than
        assumed, so a client's message about a refused upload cannot drift from
        the rule that refused it.
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -s 'http://127.0.0.1:6888/api/files' | jq -r '.files[].name'
      responses:
        '200':
          description: The store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserFiles' }
    post:
      tags: [internal]
      operationId: uploadFile
      x-internal: true
      summary: Add or replace one file
      description: >
        The request body is the file itself, raw - there is one file per
        request and no other field, so multipart would add a parser to carry
        nothing. The name comes from `name`, and is one path segment of
        `A-Z a-z 0-9 . _ -` starting with a letter or digit, at most 64
        characters; it is an allowlist, not a cleaning pass, so nothing here
        can name a path.


        Uploading onto an existing name is refused with 409 unless `replace=1`:
        a silent overwrite is the one mistake this endpoint can make that the
        user cannot undo, because their stylesheet already points at that name.
      parameters:
        - name: name
          in: query
          required: true
          description: The file name, which is also its URL under `/files/`.
          schema: { type: string }
        - name: replace
          in: query
          description: Overwrite a file that is already there. A switch.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -s -X POST --data-binary @w1.jpg \
              'http://127.0.0.1:6888/api/files?name=w1.jpg'
      responses:
        '200':
          description: The store, as stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserFiles' }
        '400':
          description: The name is not one this store can hold, or the body is empty.
        '409':
          description: >
            There is no config directory, so there is nowhere to save; or a
            file of that name is already there and `replace` was not set.
        '413':
          description: >
            The file is over 8 MiB, or the store would be over 64 MiB or 64
            files.
        '500':
          description: The file could not be written.
    delete:
      tags: [internal]
      operationId: removeFile
      x-internal: true
      summary: Delete one file
      description: >
        Removing what is not there is a success: the caller asked for it to be
        gone and it is. Nothing checks whether a stylesheet still references
        the name - that is the caller's warning to give, before it asks.
      parameters:
        - name: name
          in: query
          required: true
          description: The file to remove.
          schema: { type: string }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -s -X DELETE 'http://127.0.0.1:6888/api/files?name=w1.jpg'
      responses:
        '200':
          description: The store, as it now stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserFiles' }
        '400':
          description: The name is not one this store can hold.
        '500':
          description: The file could not be removed.

  /api/demand:
    post:
      tags: [internal]
      operationId: demand
      x-internal: true
      summary: Prepare this dictionary now, because the user chose it
      description: >
        Selecting a dictionary is a statement that it is about to be searched,
        so its headword index is prepared at once rather than waiting for the
        first query to discover it is missing. On a large dictionary that first
        query would otherwise have to search the source format directly, which
        is what the search budget is too short for.


        The request returns as soon as the work is queued; the ingest outlives
        it. Progress is not reported here - a client learns the dictionary is
        ready from `/api/dicts`, where `dbSize` becomes non-zero.


        Idempotent: repeated selection of the same dictionary neither queues a
        second ingest nor restarts a running one, and a failed preparation is
        retried only after a cooldown. Does nothing when `AUTO_INDEX` is off,
        where preparation is the dictionary panel's job, unless `explicit=1`
        says the user asked for the index itself (browsing); the response then
        reports `indexing: false`.


        Same-origin only. It is not part of the client API a browser extension
        reaches (D69): it starts work and writes to the user's library folder.
      parameters:
        - name: dict
          in: query
          required: true
          description: Dictionary id, as returned by `/api/dicts`.
          schema: { type: string }
        - name: explicit
          in: query
          required: false
          description: >
            `1` when the user asked for something only the index can serve
            (browsing). Prepares even when `AUTO_INDEX` is off.
          schema: { type: string }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -s -X POST 'http://127.0.0.1:6888/api/demand?dict=<id>'
      responses:
        '200':
          description: >
            The demand was recorded. `indexing` reports whether a preparation
            for this dictionary is now queued or running, which is false when it
            is already prepared, when `AUTO_INDEX` is off without `explicit=1`,
            and while a failed preparation is cooling down.
          content:
            application/json:
              schema:
                type: object
                required: [indexing]
                properties:
                  indexing: { type: boolean }
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/about:
    get:
      tags: [internal]
      operationId: about
      x-internal: true
      summary: What a dictionary says about itself
      description: >
        The dictionary's own annotation: the publisher's blurb, the edition, the
        copyright. Composed from the live sidecar beside the source file where
        the format ships one (Lingvo's `<stem>.ann`) and otherwise from the
        description its header declared, then normalised server-side - plain
        text escaped, markup reduced to prose elements - so a client renders
        `html` as-is and needs no sanitiser of its own.


        Same-origin only. It is not part of the client API a browser extension
        reaches (D69): an annotation names a file on the user's disk. It is also
        deliberately absent from `/api/dicts`, which is built without opening
        any dictionary; this endpoint is fetched lazily, per dictionary.
      parameters:
        - name: dict
          in: query
          required: true
          description: Dictionary id, as returned by `/api/dicts`.
          schema: { type: string }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -s 'http://127.0.0.1:6888/api/about?dict=<id>'
      responses:
        '200':
          description: >
            The composed annotation. `html` is empty when the dictionary
            declares nothing, which is not an error - the client then shows no
            disclosure.
          content:
            application/json:
              schema:
                type: object
                required: [id, html]
                properties:
                  id: { type: string }
                  name: { type: string }
                  format: { type: string }
                  html:
                    type: string
                    description: Normalised, ready to insert. Empty when there is nothing to say.
                  source:
                    type: string
                    description: The sidecar the text came from, absent when the header supplied it.
                  indexLang:
                    type: string
                    description: ISO 639-1 code of the headword language, as the dictionary declared it.
                  contentsLang:
                    type: string
                    description: ISO 639-1 code of the article language, where the format declares one (DSL).
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/browse:
    get:
      tags: [internal]
      operationId: browse
      x-internal: true
      summary: One page of the dictionary's headword list
      description: >
        The reading view, as opposed to `/api/search`'s answering view: the
        dictionary as an ordered, addressable list of its own headwords, turned
        a page at a time. Article bodies are never included - this lists what a
        dictionary contains, it does not answer with it.


        Index-backed only. The order, the page offsets and the letter strip are
        three reads of the prepared index (`idx_entry_w`), which is what makes a
        jump to `M` in a 2.9 M-entry dictionary a seek rather than a scan; a
        dictionary that has not been prepared answers `409` instead of a slower
        browse. Browse order is that index's order - case-insensitive by
        headword - and NOT the source file's entry order, which is what
        `wudict keys` reads.


        `size` is fixed by the server and is not a parameter: the page number is
        the whole address of a browse view, so `?p=37` has to mean the same
        place tomorrow as it does today.


        Same-origin only. It is not part of the client API a browser extension
        reaches (D69): that grant is lookup, and this dumps a dictionary a page
        at a time.
      parameters:
        - name: dict
          in: query
          required: true
          description: Dictionary id, as returned by `/api/dicts`.
          schema: { type: string }
        - name: p
          in: query
          description: >
            1-based page number. Out of range is clamped to the last page rather
            than refused, so a stale bookmark still opens.
          schema: { type: integer, minimum: 1, default: 1 }
        - name: at
          in: query
          description: >
            Jump to the page holding this word, or the first one after it.
            Overrides `p`. The reader lands on a page boundary, not on the word:
            a page that started mid-letter would have no stable address.
          schema: { type: string }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -s 'http://127.0.0.1:6888/api/browse?dict=<id>&p=1'
      responses:
        '200':
          description: >
            One page, plus everything needed to draw the chrome around it, so a
            page turn is a single request.
          content:
            application/json:
              schema:
                type: object
                required: [dict, name, total, page, pages, size, words, alphabet]
                properties:
                  dict: { type: string }
                  name: { type: string }
                  total:
                    type: integer
                    description: Headwords in the whole dictionary, in browse order.
                  page:
                    type: integer
                    description: The page actually served, 1-based, after clamping.
                  pages: { type: integer, description: 0 when the dictionary is empty. }
                  size: { type: integer, description: 'Headwords per page, fixed by the server.' }
                  at:
                    type: integer
                    description: >
                      The browse offset this view was asked for, which is not
                      where the page starts: a jump snaps down to the page
                      grid, so the page holding the first K opens in the tail
                      of J. The client highlights the strip by this, and falls
                      back to the page's own start when it is a plain page
                      turn.
                  words:
                    type: array
                    description: The headwords on this page. Homographs appear once.
                    items: { type: string }
                  alphabet:
                    type: array
                    description: >
                      Every initial present, in browse order. Offsets are
                      positions in the same sequence the pages walk, so a chip
                      becomes a page by integer division and nothing has to
                      agree about page size across the wire.
                    items:
                      type: object
                      required: [l, o, n]
                      properties:
                        l: { type: string, description: 'The chip label: an uppercase initial, `0-9`, or `#`.' }
                        o: { type: integer, description: Browse offset of the first headword under it. }
                        n: { type: integer, description: How many headwords it holds. }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            This dictionary has no index yet, so there is nothing ordered to
            page through. `indexing` separates the two things a client can say
            about that: work already in flight is something to wait for,
            its absence means the index has to be switched on.
          content:
            application/json:
              schema:
                type: object
                required: [error, name, prepared, indexing]
                properties:
                  error: { type: string }
                  name: { type: string, description: "The dictionary's own title, read without opening it." }
                  prepared: { type: boolean, description: "Always false here." }
                  indexing: { type: boolean, description: "Preparation is running right now." }
        '500':
          $ref: '#/components/responses/ServerError'
  /api/reveal:
    get:
      tags: [internal]
      operationId: reveal
      x-internal: true
      summary: Show a file or folder in the desktop's file manager
      description: >
        Loopback only, and limited to the paths this app already displays: a
        remote browser must not open a window on someone else's desktop, and an
        arbitrary path must never reach the shell.
      parameters:
        - name: path
          in: query
          required: true
          description: An absolute path the app is showing.
          schema: { type: string }
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            # opens a file manager window on the machine running the server
            curl -s 'http://127.0.0.1:6888/api/reveal?path=/Users/me/.wudict/db'

            # Loopback only: the request must come from this machine.
      responses:
        '200':
          description: The file manager was asked to show it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revealed: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Not a loopback request, or not a path this app displays.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/ServerError'

  /api/power:
    post:
      tags: [internal]
      operationId: setPower
      x-internal: true
      summary: Report the platform's power state
      description: |
        How the Android shell tells the server what the platform just told it -
        onStop, onTrimMemory, thermal throttling, battery saver - which an
        exec'd server has no other way of learning.

        `active` is normal. `background` stops all indexing and closes every
        handle that can be reopened, while prepared databases stay open so
        returning is instant. `restricted` closes those too, leaving the process
        holding nothing but its listener.

        Loopback only, and POST because it changes state: a GET here would be
        followed by every link prefetcher on the network.
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
            enum: [active, background, restricted]
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            # what the Android shell sends when the app leaves the screen
            curl -s -X POST 'http://127.0.0.1:6888/api/power?state=background'
            curl -s -X POST 'http://127.0.0.1:6888/api/power?state=active'

            # Loopback only, like /api/reveal.
      responses:
        '200':
          description: The state now in effect.
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, enum: [active, background, restricted] }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Not a loopback request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  responses:
    BadRequest:
      description: A parameter is missing or unknown.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such dictionary id, or no such resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: The dictionary could not be opened, or the stream could not start.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      description: Every failing request answers with this shape.
      properties:
        error: { type: string }
      required: [error]

    ReindexStatus:
      type: object
      description: The rebuild of outdated dictionaries, running or last run.
      properties:
        running: { type: boolean }
        done: { type: integer, description: 'Dictionaries finished, failed ones included.' }
        total: { type: integer, description: 'Dictionaries in this job.' }
        current: { type: string, description: 'The dictionary being rebuilt.' }
        currentDone: { type: integer, description: 'Entries of `current` processed so far.' }
        currentTotal: { type: integer, description: 'Entries of `current` in all, when known.' }
        failed:
          type: array
          items: { type: string }
          description: One line per dictionary that could not be rebuilt, with why.
        canceled: { type: boolean, description: The job was stopped before the end. }
      required: [running, done, total]

    IntakeJob:
      type: object
      description: >
        One import, at whatever stage it has reached. An empty `state` is "no
        import"; `downloading` is fetching a URL; `ready` is sniffed and waiting
        for a choice; `installing`, `done` and `error` are the rest.
      properties:
        id: { type: string, description: Opaque handle for this job. }
        state:
          type: string
          enum: ['', downloading, ready, installing, done, error]
        source:
          type: string
          description: >
            What the bytes ARE, as the user would name them: the file. Empty
            while a download is still resolving its name - the file has no name
            until the server answers - rather than something else that would
            have to be told apart from a name later.
        host:
          type: string
          description: >
            Where a downloaded file is coming from, for the life of the job. The
            host and not the link: a URL can carry a session token, which is not
            a line to put on somebody's screen. Absent for a local import.
        dir: { type: string, description: The folder an import installs into. }
        keep:
          type: string
          enum: [ask, keep, delete]
          description: >
            IMPORT_KEEP. `ask` is the only value for which the page puts the
            question to the user; the other two have already answered it.
        candidates:
          type: array
          description: The dictionaries the archive holds, in the order to show them.
          items: { $ref: '#/components/schemas/IntakeCandidate' }
        extras:
          type: array
          description: >
            Companion files found at sibling URLs beside a downloaded file, in
            the order to show them. Reported, not fetched: the caller names the
            ones to download when it confirms.
          items: { $ref: '#/components/schemas/IntakeExtra' }
        installed:
          type: array
          description: >
            The dictionaries now in the library, by name - a folder of its
            own, or a copy replaced in place in another configured folder.
          items: { type: string }
        done: { type: integer, description: "Bytes extracted, or downloaded, so far." }
        total:
          type: integer
          description: >
            Bytes to extract, or to download. Zero while downloading from a
            server that declared no length.
        error:
          type: string
          description: >
            Why the job failed; on a `done` collection, the dictionaries that
            did not arrive and why, beside those in `installed`.
        collection:
          type: boolean
          description: >
            The candidates came from a folder, a list or several links rather
            than from one file: nothing is downloaded yet, `source` is the
            collection's title, and `extras` are each dictionary's media.

    IntakeCandidate:
      type: object
      description: >
        One dictionary found inside an archive - a main file and the companions
        that belong to it, grouped by the same rule that groups them on disk.
        Where it sits in the archive is deliberately not reported: what the user
        chooses is a dictionary, not a path - but which files it is made of is,
        because that is what the choice costs.
      properties:
        name: { type: string, description: What it would be installed as. }
        format: { type: string, description: "Main-file extension, e.g. `.mdx`." }
        files:
          type: array
          description: >
            The files this dictionary is made of, main file first, as base
            names - a directory below the dictionary's own is named once, as
            `res/`, rather than listed. Base names and not paths: where the
            files sat inside a bundle is still not reported, but WHICH files
            are about to be written is, because a title on its own does not
            distinguish a 200 MB `.mdx` from that plus a 1.2 GB `.mdd`.
          items: { type: string }
        size: { type: integer, description: "Uncompressed bytes, from the archive's directory." }
        missing:
          type: array
          description: >
            Companions this dictionary cannot work without and the archive does
            not contain. Present means it cannot be installed; the import is
            refused rather than left to fail later as a dictionary that opens
            and answers nothing.
          items: { type: string }
        existing:
          type: string
          description: >
            The library folder that already holds this dictionary, absent when
            none does. Picking it replaces that folder; its installed media
            is kept when the replacement brings none.
        unchanged:
          type: boolean
          description: >
            That folder holds the same files at the same sizes the archive
            declares, so installing would replace the dictionary with itself.
            Size and not a checksum - the same test used to decide whether a
            prepared dictionary needs re-indexing.
        date:
          type: string
          description: >
            For a collection, when the site says the main file last changed
            (YYYY-MM-DD). Absent when the site did not say.
        elsewhere:
          type: string
          description: >
            With no folder of its own in the import folder: the folder that
            holds a dictionary of the same name elsewhere in the library, any
            configured folder, any format. `unchanged` then says whether it is
            the same files at the same sizes. Picking it overwrites that copy's
            files in place; nothing else in its folder is touched.

    IntakeExtra:
      type: object
      description: >
        One companion file that exists beside a downloaded one on the same
        server. The URL it was found at is deliberately not reported: it is
        derived from the link the caller already gave, and a link may carry a
        session token no page should display.
      properties:
        name: { type: string, description: "The file's name, as it would land beside the main file." }
        size:
          type: integer
          description: >
            Bytes, when the server declared them. Zero means it did not, not
            that the file is empty.
        need:
          type: string
          enum: [needed, media, extra]
          description: >
            `needed` is a companion the dictionary does not work without, and a
            candidate missing it may be confirmed only when this is downloaded;
            `media` is images and sounds; `extra` is the rest.

    LemmaLanguage:
      type: object
      description: >
        One language, merging the catalogue entry with what is on disk and with
        any download running right now. A language missing from the catalogue
        but present in the folder still appears - it works, so it is listed as
        working.
      properties:
        code: { type: string }
        name: { type: string }
        size:
          type: integer
          description: Compressed download size from the catalogue, in bytes.
        localSize:
          type: integer
          description: Size of the installed file, in bytes. Zero when not installed.
        lemmas: { type: integer, description: Entry count from the catalogue. }
        heapMB:
          type: integer
          description: Measured resident cost once this pack is loaded.
        source: { type: string }
        license: { type: string }
        installed: { type: boolean }
        catalogued:
          type: boolean
          description: False for a file present in the folder but absent from the catalogue.
        builtin:
          type: boolean
          description: True for English, which is compiled in and cannot be removed to nothing.
        mismatch:
          type: boolean
          description: Installed, but its digest is not the catalogue's.
        state:
          type: string
          description: '"downloading" or "error" while a job exists; empty otherwise.'
        done: { type: integer }
        total: { type: integer }
        error: { type: string }
        dicts:
          type: integer
          description: >
            How many of the user's dictionaries search with this language's
            lemma data, counted over the dictionaries /api/dicts has listed.

    Caps:
      type: object
      description: >
        Which search modes this dictionary can serve now. The authority on what
        to offer: FTS stays false until the full-text index is built, and
        Wildcard until the dictionary is indexed. Field names are capitalised
        on the wire.
      properties:
        Exact: { type: boolean }
        Prefix: { type: boolean }
        FTS: { type: boolean }
        Wildcard: { type: boolean }

    Result:
      type: object
      description: One article. Field names are capitalised on the wire.
      properties:
        Headword: { type: string }
        Body:
          type: string
          description: Article HTML, in the requested format.

    StreamEnd:
      type: object
      description: The last line of any NDJSON stream.
      properties:
        t: { const: end }
        i:
          type: integer
          description: Always 0 here. The search stream carries the field on every line.
      required: [t]

    DictsBusy:
      type: object
      description: >
        The rows pending 10 seconds or more, sent every second while there are
        any, and once more, empty, after the last of them has arrived. A row
        named here may already have been sent: a client ignores it then.
      properties:
        t: { const: busy }
        busy:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string, description: The file's name without its extension; the row's own name is not known yet. }
              phase:
                type: string
                enum: [unpacking, indexing]
                description: >
                  What the open is doing; absent when it does not say.
                  `unpacking` counts bytes of text, `indexing` entries. A DSL,
                  Babylon or wudict markdown dictionary is indexed when it is
                  first opened, and again after its files change.
              done: { type: integer }
              total: { type: integer, description: 'Absent when not known. For unpacking, an estimate.' }
            required: [id, name]
      required: [t]

    DictsEnd:
      type: object
      description: The last line of the /api/dicts stream.
      properties:
        t: { const: end }
        etag:
          type: string
          description: >
            The validator of this whole answer, for If-None-Match. Absent when
            the answer must not be kept: a row carries an error or a running job,
            or what a row was derived from changed while it was derived (a
            dictionary preparing itself on its first open).
      required: [t]

    SearchBegin:
      type: object
      description: >
        The slot layout, sent before any dictionary is opened. Draw the empty
        result areas from it at once; each real name arrives with its hit.
      properties:
        t: { const: begin }
        i: { type: integer, description: Always 0 here. }
        slots:
          type: array
          items:
            type: object
            properties:
              dict: { type: string, description: Dictionary id. }
              name: { type: string, description: The id again; the display name arrives with the hit. }
      required: [t, slots]

    SearchHit:
      type: object
      description: >
        One dictionary's outcome. Fill slot `i`. `results` is absent when the
        dictionary found nothing; such a slot may receive a second hit, with
        results, after a `morph` line. A hit with results, `skipped`,
        `deferred` or `error` is final.
      properties:
        t: { const: hit }
        i: { type: integer, description: Index into the begin line's slots array. }
        dict: { type: string }
        name: { type: string, description: The dictionary's real display name. }
        results:
          type: array
          items: { $ref: '#/components/schemas/Result' }
        skipped:
          type: boolean
          description: This dictionary does not support the requested mode.
        deferred:
          type: boolean
          description: >
            Not opened, because the search reached its memory cap. Not an error:
            asking for this dictionary alone answers it. See SEARCH_MEMORY.
        bytes:
          type: integer
          description: What the declined open was estimated to cost. For logs.
        indexing:
          type: boolean
          description: >
            Only beside deferred: this dictionary is already being prepared,
            because something asked for it by name. It will stop being deferred
            once the ingest finishes.
        rung:
          type: string
          enum: [phrase, near, words, query]
          description: >
            Which reading of a full-text query this dictionary answered.
            `phrase` = the words adjacent and in order; `near` = within ten
            tokens of one another, any order; `words` = anywhere in the article;
            `query` = the operator expression as written. A multi-word `fts`
            search tries phrase, then near, then words, and stops at the first
            that returns anything - per dictionary, so two dictionaries in one
            response may answer on different rungs. Absent outside `fts`. Show
            it: a result on `near` or `words` means the phrase itself was not
            found.
        error:
          type: string
          description: This dictionary failed. The others still answered.
      required: [t, i]

    SearchMorph:
      type: object
      description: >
        Every hit after this line answers `to`, the lemma of `from`, not the
        query as typed. Sent after every first-wave hit, once per language whose
        lemma found something, in language-code order; the hits that follow
        replace the misses of their slots and always carry results.
      properties:
        t: { const: morph }
        i: { type: integer, description: Always 0 here. }
        from: { type: string, description: The query as typed. }
        to: { type: string, description: The lemma searched instead. }
        lang: { type: string, description: 'The language of the lemma data that produced it, as an ISO 639-1 code: `en`.' }
      required: [t, from, to, lang]

    DictsBegin:
      type: object
      properties:
        t: { const: begin }
        total: { type: integer, description: How many rows follow. }
        groupsProblems:
          type: integer
          description: >
            How many lines or items groups.ini skipped (`GET /api/groups` lists
            them); absent when none.
      required: [t]

    DictsRow:
      type: object
      properties:
        t: { const: dict }
        dict: { $ref: '#/components/schemas/DictInfo' }
      required: [t, dict]

    DictInfo:
      type: object
      description: One dictionary, as the list and the panel see it.
      properties:
        job:
          type: object
          description: >
            A change to this dictionary's indexes running now (`/api/ingest`
            follows it); absent when none runs.
          properties:
            done: { type: integer }
            total: { type: integer }
        id: { type: string, description: The value to pass as `dict` to /api/search. }
        name: { type: string }
        format:
          type: string
          enum: [mdx, stardict, slob, dsl, bgl, zim, wmd, wudict]
        path:
          type: string
          description: The source file, or the text.db of a prepared dictionary.
        entries: { type: integer, description: Headword count. }
        caps: { $ref: '#/components/schemas/Caps' }
        dbPath: { type: string, description: The prepared database. }
        error: { type: string, description: This dictionary could not be opened. }
        tooLarge:
          type: boolean
          description: >
            `error` is that the dictionary is too large to open on this system:
            its text unpacks past the reader's limit, or past the free disk
            space or memory to hold it.
        outdated:
          type: boolean
          description: >
            The prepared data no longer matches what this build would prepare
            from the source: an older build wrote it, the source changed, its
            article text is stored with another compression than COMPRESSION,
            or it cannot be read. Never set when the source is gone. Reported only;
            `POST /api/reindex` rebuilds every such dictionary.
        source: { type: string, description: 'The original file, if still on disk.' }
        mediaSrc:
          type: array
          items: { type: string }
          description: Companion media sources, such as .mdd files.
        textDB: { type: string }
        mediaDB: { type: string }
        folder:
          type: string
          description: The library folder holding them - the transferable unit.
        dbSize: { type: integer, description: Bytes of text.db. }
        mediaSize: { type: integer, description: Bytes of media.db. }
        hasMedia: { type: boolean, description: 'Packable media exists, so "pack media" is offered.' }
        builtin: { type: boolean, description: 'Shipped with the app (the wudict howto, id `wudict-howto`), not added by the user; it cannot be removed.' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/DictGroup' }
          description: >
            The groups this dictionary belongs to, which the picker offers as
            single choices instead of a hundred names. Derived per request from
            this row's own name, path and declared language - never stored -
            and absent when nothing could be established, which is a normal
            answer. A client selects a group by intersecting the rows itself;
            there is no server-side group query.
        articleLang:
          type: string
          description: >
            ISO 639-1 code of the language the articles are written in - the
            default voice for reading a selection aloud. Derived like groups:
            the declared contents language, else the second code of a language
            pair in the title, file name or an enclosing folder, else (no pair
            anywhere) the headword language. Absent when nothing says.
      required: [id, name, format, path, entries, caps]

    DictGroup:
      type: object
      description: One (facet, value) membership, with the labels to show for it.
      properties:
        f: { type: string, description: 'Facet id: lang | pair | kind | pub.' }
        fl: { type: string, description: 'Facet label, heading the group in the picker.' }
        fo: { type: integer, description: 'Facet rank, ascending; may be negative. The user''s own groups.ini sections rank above Language, the built-in ones after Language pair.' }
        v: { type: string, description: 'Value id, unique within the facet. For pair: two ISO 639-1 codes in code order, the same for either direction ("en-ru"), or one code for a stated monolingual pair ("es").' }
        vl: { type: string, description: 'Value label, naming the choice.' }
      required: [f, fl, fo, v, vl]

    LibEntry:
      type: object
      description: One prepared dictionary in the library folder.
      properties:
        dir: { type: string }
        textDB: { type: string }
        mediaDB: { type: string }
        name: { type: string }
        format: { type: string }
        source: { type: string }
        sourceExists:
          type: boolean
          description: >
            Whether the original file is still there. Removal is only reversible
            while it is.
        entries: { type: integer }
        fullText: { type: boolean }
        media: { type: boolean }
        size: { type: integer, description: Bytes. }
        created: { type: string }

    Removal:
      type: object
      properties:
        name: { type: string }
        folder: { type: string, description: The prepared folder that was removed. }
        sources:
          type: array
          items: { type: string }
          description: Original files that were removed.
        freed: { type: integer, description: Bytes reclaimed. }
        gone: { type: boolean, description: The dictionary is no longer listed at all. }
        note: { type: string, description: A consequence the user should know about. }

    Orphan:
      type: object
      description: A prepared dictionary whose source file is no longer on disk.
      properties:
        folder: { type: string, description: 'Its folder name in the library: the handle POST /api/orphans takes.' }
        name: { type: string }
        source: { type: string, description: Where its source file was. }
        size: { type: integer, description: Bytes its prepared folder uses. }

    OrphanOutcome:
      type: object
      properties:
        folder: { type: string }
        name: { type: string }
        freed: { type: integer, description: Bytes reclaimed (deleted only). }
        error: { type: string, description: Why it was not done (failed only). }

    Root:
      type: object
      description: One dictionary folder and what it contributed.
      properties:
        path: { type: string }
        count: { type: integer, description: Dictionaries this folder was the first to offer. }
        total: { type: integer, description: Everything it holds. Greater than count means overlap. }
        exists: { type: boolean }

    ConfigInfo:
      type: object
      properties:
        roots:
          type: array
          items: { $ref: '#/components/schemas/Root' }
        libDir: { type: string }
        prepared: { type: integer }
        useCached: { type: boolean }
        configPath: { type: string, description: The config file in effect. }
        howtoRemoved: { type: boolean, description: 'The user removed the built-in wudict howto; POST /api/howto?restore=1 brings it back.' }
        total: { type: integer, description: Dictionaries served. }
        dictDirOrigin:
          type: string
          enum: [flag, env, file, default]
          description: Which layer set DICT_DIR.
        dictDirEditable:
          type: boolean
          description: False when a flag or environment variable outranks the config file.
        configProblems:
          type: array
          items: { type: string }
          description: >
            Lines of the config file in effect that set nothing - not `KEY = value`,
            a key wudict does not know (a misspelling), a list or a string left
            open - as "line N: ...". The rest of the file applies. Absent when none.
        revealLabel:
          type: string
          description: The platform's own wording, such as "Reveal in Finder".
        canReveal: { type: boolean }
        canDelete:
          type: boolean
          description: >
            Whether THIS caller may delete a dictionary: always true from the
            machine running wudict, and from a remote browser only when
            ALLOW_REMOTE_DELETE is on.
        pathAliases:
          type: array
          description: >
            Display shortenings as [prefix, label] pairs, longest prefix first.
            Display only - the clipboard and /api/reveal keep absolute paths.
          items:
            type: array
            items: { type: string }
            minItems: 2
            maxItems: 2

    DictPref:
      type: object
      properties:
        id: { type: string }
        path: { type: string, description: Recorded so the state survives a moved folder. }
        name: { type: string }
        off: { type: boolean, description: Excluded from "All dictionaries". }
        pin:
          type: boolean
          description: >
            Pinned: listed and searched before the others, in the order of the
            pinned entries. Every entry without it is listed A-Z, whatever its
            place in the array.
        title:
          type: string
          maxLength: 200
          description: >
            The title the user gave the dictionary, shown in place of its own
            (`name` in /api/dicts). An entry sent without it keeps the stored
            one; an empty string clears it. White space is collapsed and
            control characters are dropped.

    UIPrefs:
      type: object
      description: >
        Reading settings that belong to the person rather than the browser, so
        they live here and not in localStorage - which is keyed by origin, and
        would hand the same user a different setting on their phone or after a
        port change.
      properties:
        fontSize:
          type: integer
          minimum: 11
          maximum: 32
          description: >
            Article text size in px. Absent or 0 means the default (15).
            Out-of-range values are clamped, not rejected.
        hlOff:
          type: boolean
          description: >
            Turns OFF full-text match marking in wudict's own UI. Negated so
            that absent - the state of a file nobody has written - is the
            feature working. It is remembered state for that UI and nothing
            else: the search endpoint never reads it, and marks are applied
            only when a request carries `hl=1`.
        fastFirst:
          type: boolean
          description: >
            Unfolds whichever dictionary answers first, instead of the first
            dictionary in the user's own order that has a result. Spelled as
            the opt-out, so that absent is the default strategy - the reader's
            own order. Remembered state for wudict's own UI - the search
            endpoint never reads it.
        openN:
          type: integer
          minimum: 2
          description: >
            How many sections open by themselves: the first openN dictionaries
            in the user's own order that have a result. Absent is one, the
            default; values below 2 are stored as absent. No upper limit.
            Remembered state for wudict's own UI - the search endpoint never
            reads it.
        openAll:
          type: boolean
          description: >
            Opens every section that has a result, in the user's own order.
            `fastFirst`, which opens one section, wins over it and over
            `openN`. Remembered state for wudict's own UI.
        speakOff:
          type: boolean
          description: >
            Turns OFF the read-aloud button shown over a text selection in an
            article. Negated so that absent is the feature working. The voice
            is not stored here: voices belong to the device, not the person.
        groupsOff:
          type: array
          items: { type: string }
          description: >
            Facet ids (lang, pair, or a groups.ini section lower-cased, such
            as content or publisher) whose section the dictionary picker
            hides. Absent or empty shows every section the library supports.
            Stored de-duplicated and sorted; at most 32 ids of at most 64
            bytes each.
        full:
          type: boolean
          description: >
            Opens the secondary text of an article - Lingvo DSL's [*] zone,
            usually its examples - shown rather than hidden. Absent is the
            brief view, Lingvo's own default. Remembered state for wudict's
            own UI - the search endpoint never reads it.
        mode:
          type: string
          enum: [exact, fts, wildcard]
          description: >
            The search mode the reader last picked. Absent is prefix, the
            default; prefix and unknown values are stored as absent.
            Remembered state for wudict's own UI - the search endpoint never
            reads it, and a `mode=` in the page's address wins over it.
        historyOff:
          type: boolean
          description: >
            Stops recording looked-up words in history.txt. Absent keeps
            history. The server reads it too: while it is set, adding to
            history through /api/words does nothing.

    Words:
      type: object
      required: [favourites, history]
      properties:
        favourites: { type: array, items: { type: string }, description: 'Most recent first.' }
        history: { type: array, items: { type: string }, description: 'Most recent first; at most 500.' }

    Groups:
      type: object
      description: The groups.ini in effect, what it defines, and the lines skipped.
      required: [text, custom, unusable, file, writable, problems, facets]
      properties:
        text:
          type: string
          description: The file's text; the built-in list when there is no file, empty when the file cannot be read.
        custom:
          type: boolean
          description: A groups.ini exists. False means the built-in list is in effect.
        unusable:
          type: boolean
          description: The groups.ini that exists cannot be read; the built-in list is in effect.
        file:
          type: string
          description: Where groups.ini is (or would be) kept; empty when there is no config directory.
        writable:
          type: boolean
          description: False when there is no config directory, so nothing can be saved.
        problems:
          type: array
          items:
            type: object
            properties:
              line: { type: integer, description: 1-based; 0 when the file as a whole could not be used. }
              text: { type: string, description: The line as written. }
              msg: { type: string, description: Why it was skipped. }
              more: { type: integer, description: 'On a last entry only: how many problems it stands for, not listed.' }
        facets:
          type: array
          description: The sections and their groups, in file order.
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              groups:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    label: { type: string }
                    items:
                      type: array
                      items: { type: string }
                      description: What the group matches, as parsed - plain items lower-cased, regular expressions in backticks.

    Style:
      type: object
      description: The user's two global stylesheets and where they are kept.
      properties:
        app:
          type: string
          description: CSS applied to the page itself; its :root tokens also reach articles.
        article:
          type: string
          description: CSS applied inside every article, both shadow-root and iframe.
        dir:
          type: string
          description: The folder holding the two files, or empty when there is none.
        writable:
          type: boolean
          description: Whether PUT can store anything.

    UserFiles:
      type: object
      description: The user's file store, plus where it lives and what it allows.
      properties:
        files:
          type: array
          items: { $ref: '#/components/schemas/UserFile' }
        dir:
          type: string
          description: The folder holding them, or empty when there is none.
        writable:
          type: boolean
          description: Whether anything can be stored at all.
        total:
          type: integer
          description: The sum of the sizes below, in bytes.
        limits:
          type: object
          description: The caps this server enforces, in bytes and in files.
          properties:
            file: { type: integer, description: The largest one file may be. }
            total: { type: integer, description: The largest the folder may be. }
            count: { type: integer, description: How many files it may hold. }

    UserFile:
      type: object
      properties:
        name:
          type: string
          description: The file name, which is also its address.
        size: { type: integer, description: Size in bytes. }
        mtime: { type: integer, description: "Last modified, unix seconds." }
        type:
          type: string
          description: >
            The media type served for it, resolved from the extension; empty
            when the extension is not one wudict knows, in which case it is
            served as application/octet-stream.
        url:
          type: string
          description: Where it is served, e.g. `/files/w1.jpg`.

    Prefs:
      type: object
      properties:
        exists:
          type: boolean
          description: False when no state file has been written yet.
        version:
          type: integer
          description: >
            The format of `dicts`, 3. A list saved in an older one is migrated
            when it is first read. With more than five of the user's
            dictionaries present, the first five of them in its order stay
            pinned: of its pinned dictionaries, or of its whole order if it is
            older than pins. All others are listed A-Z. With five or fewer,
            none is pinned. A dictionary that is not present when the list is
            migrated is not counted and not pinned. In the GET answer only.
        dicts:
          type: array
          description: >
            Array order is the order of the pinned entries; the others are
            listed A-Z.
          items: { $ref: '#/components/schemas/DictPref' }
        ui:
          allOf: [{ $ref: '#/components/schemas/UIPrefs' }]
          description: Null until the user has changed something.

    SetupResult:
      type: object
      properties:
        path: { type: string, description: 'The folder, expanded and made absolute.' }
        found: { type: integer, description: 'Dictionaries found, deduplicated across folders.' }
        dirs:
          type: array
          items: { $ref: '#/components/schemas/Root' }
        saved: { type: boolean }
        useCached: { type: boolean }
        error: { type: string, description: Why this folder cannot be used. }
