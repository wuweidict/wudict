# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
#
[changelog]
# Rendered once at the top of the changelog.
header = """# Changelog

All notable changes to **WuWeiDict** (`wudict`) are documented in this file.
Generated by [git-cliff](https://git-cliff.org) from the commit history;
commit conventions live in `cliff-howto.md`.

<!-- git-cliff: end of header -->
"""
# Used by `--prepend` to remove the previous header.
header_marker = "<!-- git-cliff: end of header -->"
# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/#getting-started
# NOTE: `commit.scope` / `commit.breaking` only exist for conventionally-parsed
# commits, so every access needs a `default` filter — the majority of this
# repo's history is non-conventional and would otherwise crash the render.
# For non-conventional commits `commit.message` is the FULL raw message
# (subject + body), hence `split | first` to keep one line per changelog entry.
body = """{% if version %}## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## [unreleased]{% endif %}
{%- for group, commits in commits | group_by(attribute="group") %}

### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope | default(value="") %}*({{ commit.scope }})* {% endif %}{% if commit.breaking | default(value=false) %}[**breaking**] {% endif %}{{ commit.message | split(pat="\\n") | first | trim | upper_first }}
{%- endfor %}
{%- endfor %}

"""
# Rendered at the end of the changelog.
footer = ""
# Keep the template's own leading newline: it is what separates one release
# section from the previous one's last bullet. `trim = true` ate it.
trim = false
# Render body even when there are no releases to process.
render_always = true
# An array of regex based postprocessors to modify the changelog.
postprocessors = []
# output file path (or use `git-cliff -o CHANGELOG.md`)
# output = "CHANGELOG.md"

[git]
# Parse commits according to the conventional commits specification when they
# match it. Kept ON so future `feat(scope): ...` commits get scope/breaking
# extraction for free; harmless for the legacy subjects, which simply fail to
# parse and pass through verbatim.
# See https://www.conventionalcommits.org
conventional_commits = true
# Do NOT exclude commits that are not conventional — this repo's history is
# overwhelmingly scope-first `(android) ...` style and must survive.
filter_unconventional = false
# Require all commits to be conventional.
# Takes precedence over filter_unconventional.
require_conventional = false
# Split commits on newlines, treating each line as an individual commit.
# Kept off: this repo uses long single-line descriptive subjects; splitting
# would shred them.
split_commits = false
# Only STABLE version tags open a release section. Pre-releases
# (`-alpha.N` / `-beta.N` / `-rc.N`) are deliberately NOT matched, so their
# commits roll forward into the stable tag that follows and the whole
# `vX.Y.Z` cycle renders as ONE section with each category appearing exactly
# once. Matching them instead produced a section per pre-release, i.e.
# "🚀 Features / 🐛 Bug Fixes / 🚀 Features / 🐛 Bug Fixes ..." down the file.
# (`ignore_tags` is the documented alternative, but it is keyed per commit and
# silently swallowed v3.7.2, which shares a commit with v3.7.2-alpha.1.)
# A pre-release not yet followed by a stable tag shows up under [unreleased].
# Only treat well-formed version tags as releases. Excludes the accidental
# `v2.6-4-g627d338` (git-describe output) and the bare `1.3` (duplicate of
# v1.3 pointing at a different commit); allows v0.1-style, v3.7.1 and
# prereleases like v3.7.0-rc.1 / v3.7.2-alpha.1.
tag_pattern = '^v[0-9]+\.[0-9]+(\.[0-9]+)?$'
# An array of regex based parsers to modify commit messages prior to further
# processing (runs BEFORE conventional parsing and commit_parsers).
commit_preprocessors = [
    # Bullet-style subjects: "- fix ldoce inline links" -> "fix ldoce inline links"
    # so they group like ordinary fix:/feat: commits.
    { pattern = '^- ', replace = '' },
    # Comment-style subjects: "# multiple folders for DICT_DIR" -> "multiple folders for DICT_DIR"
    { pattern = '^# ', replace = '' },
    # Turn issue references into links (#12 -> [#12](.../issues/12)).
    { pattern = '#([0-9]+)\b', replace = '[#${1}](https://github.com/wuweidict/wudict/issues/${1})' },
    # Check spelling of the commit message using https://github.com/crate-ci/typos.
    # #{ pattern = '.*', replace_command = 'typos --write-changes -' },
]
# Prevent commits that are breaking from being excluded by commit parsers.
protect_breaking_commits = true
# An array of regex based parsers for extracting data from the commit message.
# Assigns commits to groups. FIRST MATCH WINS — order is significant:
#   skip rules > security > conventional types > legacy (scope) > bare keywords > catch-all.
# The `<!-- NN -->` prefix is a sort key: `group_by` sorts alphabetically and
# `striptags` removes it at render time.
commit_parsers = [
    # --- noise: never reaches the changelog ---
    { message = '^Merge (branch|remote-tracking|pull request|tag) ', skip = true },
    { message = '^chore\(release\): prepare for', skip = true },
    { message = '^chore\(deps.*\)', skip = true },
    { message = '^chore\(pr\)', skip = true },
    { message = '^chore\(pull\)', skip = true },

    # --- security wins regardless of where the marker sits: `(format) (sec)` ---
    { message = '(?i)\(sec\)|\bsecurity\b', group = "<!-- 13 -->🛡️ Security" },

    # --- conventional commits (recommended go-forward style; parsers see the RAW subject) ---
    { message = '^feat\b', group = "<!-- 01 -->🚀 Features" },
    { message = '^fix\b', group = "<!-- 02 -->🐛 Bug Fixes" },
    { message = '^perf\b', group = "<!-- 03 -->⚡ Performance" },
    { message = '^refactor\b', group = "<!-- 04 -->🚜 Refactor" },
    { message = '^style\b', group = "<!-- 12 -->🎨 Styling" },
    { message = '^test\b', group = "<!-- 14 -->🧪 Testing" },
    { message = '^docs?\b', group = "<!-- 11 -->📚 Documentation" },
    { message = '^build\b', group = "<!-- 09 -->📦 Build, Packaging & CLI" },
    { message = '^ci\b', group = "<!-- 10 -->⚙️ CI & Automation" },
    { message = '^revert\b', group = "<!-- 15 -->◀️ Reverts" },
    { message = '^chore\b', group = "<!-- 16 -->🧹 Chores" },

    # --- milestone subjects ---
    { message = '(?i)^phase ?[0-9]', group = "<!-- 01 -->🚀 Features" },
    { message = '^AUTO_INDEX\b', group = "<!-- 01 -->🚀 Features" },

    # --- legacy scope-first subjects: (scope) ... / (scope1) (scope2) ... ---
    # first scope token decides the group; gh-android must precede the gh/ci rule.
    { message = '^\((android|apk|fastlane|gh-android)\b', group = "<!-- 07 -->🤖 Android" },
    { message = '^\((dsl|bgl|zim|format|speex|audio|lemmas|mdx|mdd|mdict|stardict|slob)\b', group = "<!-- 08 -->📖 Dictionary Formats" },
    { message = '^\((api|server|cors)\b', group = "<!-- 06 -->🔌 Server & API" },
    { message = '^\((ui|css|font|iframe|title|lic|chrome/ff)\b', group = "<!-- 05 -->🖥️ UI & Web" },
    { message = '^\((doc|docs|man|pages)\b', group = "<!-- 11 -->📚 Documentation" },
    { message = '^\((cli|make|go|inno|win|wind|notify|systray)\b', group = "<!-- 09 -->📦 Build, Packaging & CLI" },
    { message = '^\((ci|workflows|gh|wf)\b', group = "<!-- 10 -->⚙️ CI & Automation" },
    { message = '^\(perf\b', group = "<!-- 03 -->⚡ Performance" },
    { message = '^\(test\b', group = "<!-- 14 -->🧪 Testing" },

    # --- bare keyword subjects (no parenthesis, no colon) ---
    { message = '(?i)^(readme|pages|openapi link)\b', group = "<!-- 11 -->📚 Documentation" },
    { message = '(?i)^(update|add|delete|rename)\b.*\.md\b', group = "<!-- 11 -->📚 Documentation" },
    { message = '(?i)^(android|apk)\b', group = "<!-- 07 -->🤖 Android" },
    { message = '(?i)^api\b', group = "<!-- 06 -->🔌 Server & API" },
    { message = '(?i)^(gh|wf|github workflow)\b', group = "<!-- 10 -->⚙️ CI & Automation" },
    { message = '(?i)^(add|update|delete|rename|disable)\b.*(github|workflow|\.ya?ml\b)', group = "<!-- 10 -->⚙️ CI & Automation" },
    { message = '(?i)^(make|include|version tag|native cgo|systray|wudict res)\b', group = "<!-- 09 -->📦 Build, Packaging & CLI" },
    { message = '(?i)^(cleanup|naming)\b', group = "<!-- 04 -->🚜 Refactor" },
    { message = '(?i)^(full ingest|in-process speex|native-ingested|dsl and bgl|1\. gomdict|gomdict)\b', group = "<!-- 08 -->📖 Dictionary Formats" },
    { message = '(?i)^(direct-backend ram|direct-backend)\b', group = "<!-- 03 -->⚡ Performance" },
    # NOTE: double-quoted TOML string (contains single quotes) — do NOT use
    # `\b` here: TOML would turn it into a backspace escape. No trailing
    # boundary needed; these are fixed one-off phrases.
    { message = "(?i)^(dict panel|progress spinner|iframe-vsize|css,|first 'winner'|the pill)", group = "<!-- 05 -->🖥️ UI & Web" },

    # --- catch-all: nothing is ever lost ---
    { message = '.*', group = "<!-- 17 -->💼 Other" },
]
# Exclude commits that are not matched by any commit parser.
filter_commits = false
# Fail on a commit that is not matched by any commit parser.
fail_on_unmatched_commit = false
# An array of link parsers for extracting external references, and turning them into URLs, using regex.
# (issue links are handled by commit_preprocessors above)
link_parsers = []
# Include only the tags that belong to the current branch.
use_branch_tags = false
# Order releases topologically instead of chronologically.
topo_order = false
# Order commits topologically instead of chronologically.
topo_order_commits = true
# Order of commits in each group/release within the changelog.
# Allowed values: newest, oldest
sort_commits = "oldest"
# Process submodules commits
recurse_submodules = false
