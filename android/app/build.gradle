// The WuWeiDict app module (D52): a WebView shell around the wudict server
// binary. There are deliberately no dependencies - the UI is served by the
// Go server, the shell is one activity and one process launcher.
plugins {
    id 'com.android.application'
}

// Same stamp the Makefile puts into the Go binary: git describe, or "dev".
// build-android.yml overrides versionName with the release TAG; versionCode is
// computed here and nowhere else, so a local build and a CI build of the same
// commit cannot disagree about it (they used to: CI passed the commit count,
// the Makefile passed nothing and got the literal 1, and every locally built
// APK was then a DOWNGRADE of any released one - uninstall-or-nothing).
def gitVersion = {
    try {
        def p = ['git', '-C', rootDir.parent, 'describe', '--tags', '--always', '--dirty'].execute()
        // read the stream to EOF, THEN wait: exitValue() on a process that has
        // not been reaped throws IllegalThreadStateException, and the catch
        // below would silently turn a perfectly good tag into "dev".
        def out = p.text.trim()
        return p.waitFor() == 0 && !out.isEmpty() ? out : 'dev'
    } catch (Exception ignored) {
        return 'dev'
    }
}

// versionCode = commits on HEAD. Monotonic, needs no stored state, and is what
// the released APKs already carry (v3.7.3 shipped as 202). A shallow clone
// yields a wrong count, so CI checks out with fetch-depth: 0.
def gitCount = {
    try {
        def p = ['git', '-C', rootDir.parent, 'rev-list', '--count', 'HEAD'].execute()
        def out = p.text.trim()
        if (p.waitFor() != 0 || !out.isInteger()) return 1
        def n = out as int
        return n > 0 ? n : 1
    } catch (Exception ignored) {
        return 1
    }
}

android {
    namespace = 'com.legbehindneck.wudict'
    compileSdk = 36

    // The AAB name only; the APK name is set below in androidComponents.
    // Play ingests a bundle by content, not by file name, so wudict-play-
    // release.aab is fine and needs no abi or flavour token.
    base { archivesName = 'wudict' }

    signingConfigs {
        release {
            def keystore = System.getenv("KEYSTORE")
            if (keystore != null) {
                storeFile file(keystore)
                storePassword System.getenv("STORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD") ?: System.getenv("STORE_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId 'com.legbehindneck.wudict'
        // arm64-v8a only (D52): every arm64 device ships API 26+, and the
        // vector adaptive icon needs no PNG fallbacks at 26+.
        minSdk 26
        targetSdk 36
        versionCode(project.hasProperty('versionCode') ? project.property('versionCode') as int : gitCount())
        versionName(project.hasProperty('versionName') ? project.property('versionName') as String : gitVersion())
    }

    // Two distributions, one source tree (D62). `foss` is the GitHub/F-Droid
    // build and keeps All-files access; `play` ships with no storage
    // permission at all and imports through SAF into app-owned storage.
    //
    // The split is by SOURCE SET, not by a runtime flag: `Storage` exists once
    // per flavour and never in src/main, so the Play build cannot so much as
    // name MANAGE_EXTERNAL_STORAGE - which is what an automated policy scan
    // looks for. applicationId is deliberately shared: the two builds are the
    // same app, and cross-updating between them is prevented by the signing
    // key, not by the id.
    flavorDimensions 'dist'
    productFlavors {
        foss { dimension 'dist' }
        play { dimension 'dist' }
    }

    buildFeatures {
        buildConfig = true // BuildConfig.DEBUG gates WebView debugging
        // slows down build...
//        resValues true  // debug's resValue("string", "app_name", …) override
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled = false  // nothing to shrink: two classes, no libraries
            shrinkResources = false
            if (System.getenv("KEYSTORE") != null) {
                signingConfig = signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix = ".debug"
        }
    }

    packaging {
        jniLibs {
            // The server ships as jniLibs/<abi>/libwudict.so and is exec'd
            // from nativeLibraryDir, so the .so must be extracted to the
            // filesystem at install time (the manifest's extractNativeLibs
            // attribute is rejected by AGP 9 in favor of this).
            useLegacyPackaging = true
        }
    }
}

// One name for the APK, produced identically by `make apk-foss-release` and by
// build-android.yml - which is why the workflow no longer copies the file to a
// second name of its own. Two names for one artifact is the whole bug class.
//
//   wudict-android-arm64-foss.apk            signed release (the published one)
//   wudict-android-arm64-foss-unsigned.apk   release built without a keystore
//   wudict-android-arm64-foss-debug.apk      debug
//   wudict-android-arm64-play-*.apk          the same, Play flavour
//
// The flavour token is not editorial: it is `variant.flavorName` verbatim, so a
// third flavour names itself and nobody has to decide what to call it.
//
// This is AGP's supported Variant API (VariantOutput.outputFileName, present in
// 9.3.1) - no plugin, no dependency, no custom task. The earlier comment here
// claimed a custom task was required; that applies to renaming the ARTIFACT,
// not to this property. AGP appends "-unsigned" only when it names the file
// itself, so an explicit name has to carry that marker on its own - an unsigned
// APK wearing the release name is exactly the mistake worth spending a line on.
def apkAbi = 'arm64'
def apkSigned = System.getenv("KEYSTORE") != null

androidComponents {
    // selector().all() is passed explicitly: the no-selector overload is a
    // Kotlin default argument and is not callable from the Groovy DSL.
    onVariants(selector().all()) { variant ->
        def suffix = variant.buildType == 'release'
                ? (apkSigned ? '' : '-unsigned')
                : "-${variant.buildType}"
        variant.outputs.each { output ->
            output.outputFileName.set("wudict-android-${apkAbi}-${variant.flavorName}${suffix}.apk")
        }
    }
}
