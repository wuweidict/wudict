// The WuWeiDict app module (D52): a WebView shell around the wudict server
// binary. There are deliberately no dependencies - the UI is served by the
// Go server; the shell is a few activities around one process launcher.
plugins {
    id 'com.android.application'
}

// The version of the app as released: written by `make release` (tools/
// release.sh) in the commit the release tag points to, as literals in
// defaultConfig below, so F-Droid and anything else reading this file at the
// tag finds them. versionCode follows from the version, never from git history:
// major*1000000 + minor*10000 + patch*100 + 1-19 alpha.N, 21-39 beta.N, 41-59
// rc.N, 90 the release (3.7.9 -> 3070990). -PversionName / -PversionCode
// override them for a local build; the Makefile passes git describe as the
// name, so a build between releases says what it is.
// File-name form: no leading "v" (v3.7.5 -> 3.7.5, as the Windows installer
// already does) and no "/" (legal in a tag, a directory in a path). The
// Makefile's APK_VERSION applies the same two rules - change both or neither.
def apkVersion = { (project.findProperty('versionName') ?: android.defaultConfig.versionName).toString().replaceFirst(/^v/, '').replace('/', '_') }

android {
    namespace = 'com.legbehindneck.wudict'
    compileSdk = 36

    // The AAB name only; the APK name is set below in androidComponents.
    // Play ingests a bundle by content, not by file name, so wudict-play-
    // release.aab is fine and needs no abi or flavour token.
    base { archivesName = 'wudict' }

    signingConfigs {
        release {
            def keystore = System.getenv("KEYSTORE")
            if (keystore != null) {
                storeFile file(keystore)
                storePassword System.getenv("STORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD") ?: System.getenv("STORE_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId 'com.legbehindneck.wudict'
        // arm64-v8a only (D52): every arm64 device ships API 26+, and the
        // vector adaptive icon needs no PNG fallbacks at 26+.
        minSdk 26
        targetSdk 36
        versionCode 3070990
        versionName "3.7.9"
        if (project.hasProperty('versionCode')) versionCode = project.property('versionCode') as int
        if (project.hasProperty('versionName')) versionName = project.property('versionName') as String
    }

    // Two distributions, one source tree (D62). `foss` is the GitHub/F-Droid
    // build and keeps All-files access; `play` ships with no storage
    // permission at all and imports through SAF into app-owned storage.
    //
    // The split is by SOURCE SET, not by a runtime flag: `Storage` exists once
    // per flavour and never in src/main, so the Play build cannot so much as
    // name MANAGE_EXTERNAL_STORAGE - which is what an automated policy scan
    // looks for. applicationId is deliberately shared: the two builds are the
    // same app, and cross-updating between them is prevented by the signing
    // key, not by the id.
    flavorDimensions 'dist'
    productFlavors {
        foss { dimension 'dist' }
        play { dimension 'dist' }
    }

    buildFeatures {
        buildConfig = true // BuildConfig.DEBUG gates WebView debugging
        // slows down build...
//        resValues true  // debug's resValue("string", "app_name", …) override
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled = false  // nothing to shrink: no libraries, and the Java is the shell alone
            shrinkResources = false
            if (System.getenv("KEYSTORE") != null) {
                signingConfig = signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix = ".debug"
        }
    }

    packaging {
        jniLibs {
            // The server ships as jniLibs/<abi>/libwudict.so and is exec'd
            // from nativeLibraryDir, so the .so must be extracted to the
            // filesystem at install time (the manifest's extractNativeLibs
            // attribute is rejected by AGP 9 in favor of this).
            useLegacyPackaging = true
        }
    }

    // AGP otherwise writes an encrypted "Dependency metadata" block into the
    // APK signing block. F-Droid rejects it, and a reproducible-build check
    // cannot compare a blob only Google can read. The bundle keeps it: the
    // AAB goes to Play only, which is the one reader of it.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = true
    }
}

// F-Droid's scanner reads every resolvable configuration and flags io.opencensus:*
// as a Tracker. Nothing here declares it: it arrives through
// com.google.testing.platform (the Unified Test Platform), in the
// unified-test-platform-* configurations AGP registers on every Android module
// whether or not it has instrumented tests - and never on a runtime classpath,
// so the APK never contained it. The configurations cannot be removed (UTP is
// mandatory since AGP 8); excluding the group from them takes the coordinates
// out of the graph the scanner reads. AGP 8 named them _internal-unified-test-
// platform-*, AGP 9 drops the prefix, hence contains() and not startsWith().
// OpenCensus is UTP's optional gRPC tracing bridge; this app runs no
// instrumented tests, so nothing uses it. `make android-trackers` checks the
// whole graph against the scanner's own lists (SUSS, Exodus, ETIP).
configurations.matching { it.name.contains('unified-test-platform') }.configureEach {
    exclude group: 'io.opencensus'
}

// One name for the APK, produced identically by `make apk-foss-release` and by
// build-android.yml - which is why the workflow no longer copies the file to a
// second name of its own. Two names for one artifact is the whole bug class.
//
//   wudict-android-arm64-foss-3.7.5.apk            signed release (the published one)
//   wudict-android-arm64-foss-unsigned-3.7.5.apk   release built without a keystore
//   wudict-android-arm64-foss-debug-3.7.5.apk      debug
//   wudict-android-arm64-play-*-3.7.5.apk          the same, Play flavour
//
// The version is last, as in wudict-windows-x64-setup-3.7.5.exe: a downloaded
// APK says which release it is, and a working-tree build says so too
// (...-foss-3.7.5-4-gfcd6edb-dirty.apk), so it cannot pass for a release.
//
// The flavour token is not editorial: it is `variant.flavorName` verbatim, so a
// third flavour names itself and nobody has to decide what to call it.
//
// This is AGP's supported Variant API (VariantOutput.outputFileName, present in
// 9.3.1) - no plugin, no dependency, no custom task. The earlier comment here
// claimed a custom task was required; that applies to renaming the ARTIFACT,
// not to this property. AGP appends "-unsigned" only when it names the file
// itself, so an explicit name has to carry that marker on its own - an unsigned
// APK wearing the release name is exactly the mistake worth spending a line on.
def apkAbi = 'arm64'
def apkSigned = System.getenv("KEYSTORE") != null

androidComponents {
    // selector().all() is passed explicitly: the no-selector overload is a
    // Kotlin default argument and is not callable from the Groovy DSL.
    onVariants(selector().all()) { variant ->
        def suffix = variant.buildType == 'release'
                ? (apkSigned ? '' : '-unsigned')
                : "-${variant.buildType}"
        variant.outputs.each { output ->
            output.outputFileName.set("wudict-android-${apkAbi}-${variant.flavorName}${suffix}-${apkVersion()}.apk")
        }
    }
}
